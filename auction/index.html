<style>
/* ============================ tokens ============================
   An auction house after hours: deep felt table, brass lamp, gold coin light. One committed
   dark aesthetic — the felt IS the identity, so there is no light theme to negotiate with.
   Every colour lives here once; nothing downstream invents a hex. */
:root{
  --felt:#0e2a1f;        /* the table */
  --felt-deep:#081b13;   /* the room behind it */
  --felt-edge:#163d2c;
  --panel:#123526;       /* raised card on the felt */
  --panel-2:#0d2a1d;
  --rule:rgba(244,201,93,.22);
  --gold:#f4c95d;        /* coin light — headings, purses, bar A */
  --gold-deep:#c99a2e;
  --ivory:#f4efe2;       /* body ink */
  --ivory-dim:#b9b39f;   /* secondary ink */
  --p1:#f4c95d;          /* player 1 is always gold */
  --p2:#7fd4b0;          /* player 2 is mint — reads on felt, never fights the gold */
  --good:#8fe3b3;
  --warn:#f0a35e;
  --bad:#f08a7a;
  --shade:rgba(3,12,8,.72);
  --shadow:0 12px 34px rgba(0,0,0,.45);
}
*{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html,body{ margin:0; padding:0; }
body{
  /* Explicit background is mandatory — a transparent body would borrow the host's theme. */
  background:
    radial-gradient(120% 60% at 50% -10%, #1a4530 0%, transparent 60%),
    linear-gradient(180deg, var(--felt-deep) 0%, var(--felt) 42%, var(--felt-deep) 100%);
  background-attachment:fixed;
  color:var(--ivory);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  min-height:100vh;
  overflow-x:hidden;          /* guard only — nothing wide lives outside its own scroll box */
  -webkit-text-size-adjust:100%;
}
.wrap{
  max-width:560px; margin:0 auto;
  padding:max(12px, env(safe-area-inset-top)) 14px calc(28px + env(safe-area-inset-bottom));
}
button{ font-family:inherit; }
button:focus-visible, input:focus-visible, summary:focus-visible{
  outline:3px solid var(--gold); outline-offset:2px; border-radius:6px;
}

/* ============================ chrome ============================ */
header.top{ display:flex; align-items:center; justify-content:space-between; gap:10px; margin:2px 0 12px; min-height:40px; }
.wordmark{ font-size:15px; font-weight:900; letter-spacing:3px; text-transform:uppercase; color:var(--gold); }
.wordmark small{ display:block; font-size:9px; letter-spacing:2.5px; color:var(--ivory-dim); font-weight:700; }
.homebtn{
  background:var(--panel); color:var(--ivory); border:1px solid var(--rule); border-radius:12px;
  min-width:44px; min-height:44px; padding:8px 12px; font-size:15px; font-weight:700; cursor:pointer;
}
.homebtn:active{ transform:translateY(1px); }

/* ============================ shared bits ============================ */
.card{
  background:var(--panel); border:1px solid var(--rule); border-radius:18px;
  padding:18px 16px; box-shadow:var(--shadow);
}
.btn{
  display:block; width:100%; border:none; border-radius:14px; cursor:pointer;

.btn:active{ transform:translateY(2px); box-shadow:0 2px 0 rgba(0,0,0,.35); }
.btn:disabled{ opacity:.42; cursor:default; transform:none; box-shadow:0 4px 0 rgba(0,0,0,.35); }
.btn.ghost{

}

.lot .info{ flex:1; min-width:0; }
.lot .info b{ display:block; font-size:15.5px; font-weight:800; }

.bidfoot{ margin-top:14px; }

/* lock-in / abandon confirm overlay */
.scrim{
  position:fixed; inset:0; background:var(--shade); backdrop-filter:blur(3px);

}

.mirrow .side.r .mbar{ background:linear-gradient(90deg,#3f9c76,var(--p2)); }
.mirrow .mname{ width:96px; flex:none; text-align:center; font-size:10.5px; font-weight:800;

.callout{ background:var(--panel-2); border:1px solid var(--rule); border-radius:12px; padding:11px 13px;

<body>
<div class="wrap">
  <header class="top">
    <div class="wordmark">Life Auction<small>Kreeda · Together</small></div>
    <button class="homebtn" id="homeBtn" aria-label="Home / restart" hidden>⌂</button>
  </header>
  <main id="stage"></main>
</div>

<!-- analytics.js before the game script: track() below calls window.bgTrack synchronously and
     the guard only swallows the call if bgTrack is honestly absent, not merely late. -->
<script src="../analytics.js"></script>
<script>
"use strict";
function track(name,p){ try{ if(window.bgTrack) window.bgTrack(name,p); }catch(e){} }

/* ============================ content ============================ */
const LOTS = [
  { n:"Freedom",          f:"Answer to no one. Go where the day takes you." },
  { n:"Security",         f:"The bills are paid and the door locks." },
  { n:"Adventure",        f:"Unfamiliar places, unscripted days." },
  { n:"Recognition",      f:"Your name known, your work seen." },
  { n:"Deep friendships", f:"Two-in-the-morning phone-call people." },
  { n:"Wealth",           f:"More than enough, with some left over." },
  { n:"Peace of mind",    f:"A quiet head on the pillow." },
  { n:"Creative work",    f:"Making things that didn't exist before." },
  { n:"Family",           f:"The people who are yours, close by." },
  { n:"Health",           f:"A body that keeps saying yes." },
];
const TOTAL = 100, STEP = 5;

/* Alignment phrasing — bands are wide on purpose: the number is a conversation starter,
   not a grade, so neighbouring pairs should not land in different worlds over 2 points. */
function alignPhrase(a){
  if (a >= 75) return { t:"Pulling the same direction",
    s:"You walked into this auction with nearly the same shopping list." };
  if (a >= 45) return { t:"Different engines, same car",
    s:"You fund life differently — but plenty of your coins landed in the same places." };
  return { t:"Two different maps",
    s:"You are spending on genuinely different things. That's not a problem — it's material." };
}

/* ============================ storage (namespaced, never answers) ============================ */
const LS = {
  get(k){ try{ return localStorage.getItem("auction."+k); }catch(e){ return null; } },
  set(k,v){ try{ localStorage.setItem("auction."+k, v); }catch(e){} },
};
function loadNames(){
  try{
    const raw = LS.get("names"); if (!raw) return null;
    const arr = JSON.parse(raw);
    if (Array.isArray(arr) && arr.length === 2) return arr.map(s => String(s).slice(0,12));
  }catch(e){}
  return null;
}

/* ============================ session state (in memory only — bids are personal) ============ */
const S = {
  names: loadNames() || ["Player 1","Player 2"],
  bids: [null, null],       // bids[i] = player i's own allocation (array of 10)
  proxy: [null, null],      // proxy[i] = player i's guess of the OTHER player's allocation
  proxyPlayed: false,
  completedMainTracked: false,
  tiltHintShown: false,     // per-session on purpose: storage holds names + plays only
  gen: 0,                   // screen generation — stale handlers (double-tap races) check this
};

const stage = document.getElementById("stage");
const homeBtn = document.getElementById("homeBtn");

/* Every screen render bumps the generation. Handlers created for screen N capture N and bail
   if the world has moved on — this is the whole defence against double-taps racing a hand-off. */
function render(html, showHome){
  S.gen++;
  stage.innerHTML = html;               // old inputs leave the DOM before anything new paints
  homeBtn.hidden = !showHome;
  window.scrollTo(0, 0);
  return S.gen;
}
function on(id, fn){
  const gen = S.gen, el = document.getElementById(id);
  if (!el) return;
  el.addEventListener("click", () => { if (S.gen !== gen) return; fn(); });
}
function esc(s){ return String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }

/* ============================ svg motifs ============================ */
const GAVEL_SVG = `
<svg viewBox="0 0 120 96" aria-hidden="true">
  <g fill="none" stroke="#f4c95d" stroke-width="5" stroke-linecap="round">
    <rect x="30" y="14" width="40" height="22" rx="5" fill="#f4c95d" opacity=".92" transform="rotate(-30 50 25)"/>
    <line x1="58" y1="38" x2="92" y2="72"/>
  </g>
  <g>
    <ellipse cx="38" cy="82" rx="16" ry="6.5" fill="#c99a2e"/>
    <ellipse cx="38" cy="78" rx="16" ry="6.5" fill="#f4c95d"/>
    <ellipse cx="66" cy="86" rx="13" ry="5.5" fill="#c99a2e"/>
    <ellipse cx="66" cy="82" rx="13" ry="5.5" fill="#f4c95d"/>
    <ellipse cx="66" cy="82" rx="7" ry="2.6" fill="#c99a2e" opacity=".55"/>

/* ============================ hand-off ============================ */
function showHandoff(player, mode){
  const name = S.names[player];
  const task = mode === "main"
    ? "You'll spend your own 100 coins — in private."
    : `You'll spend 100 coins the way you think <b class="${player===0?'':''}">${esc(S.names[1-player])}</b> just did.`;

      ${tilt}
    </div>
  `, true);
  on("readyBtn", () => showBid(player, mode));
}

/* ============================ bidding ============================ */
function showBid(player, mode){
  const name = S.names[player];
  const alloc = new Array(LOTS.length).fill(0);
  const heading = mode === "main"
    ? `Spend <b>your</b> 100 coins`
    : `Spend them as <b>${esc(S.names[1-player])}</b> would`;
  const rows = LOTS.map((lot,i) => `
    <div class="lot" id="lot${i}">
      <div class="info"><b>${esc(lot.n)}</b><span>${esc(lot.f)}</span></div>
      <div class="stepper">
        <button type="button" id="dec${i}" aria-label="Remove 5 coins from ${esc(lot.n)}" disabled>−</button>
        <span class="val zero" id="val${i}" aria-live="off">0</span>
        <button type="button" id="inc${i}" aria-label="Add 5 coins to ${esc(lot.n)}">+</button>
      </div>
    </div>`).join("");
  render(`
    <div class="purse" id="purse">
      ${COIN_SVG}
      <div class="left"><b class="amount" id="purseAmt">${TOTAL}</b><span>coins left</span></div>
      <div class="bidder c${player+1}"><span>bidding</span><b>${esc(name)}</b></div>
    </div>
    <p class="bidfoot note" style="margin:0 0 10px;">${heading} — steps of 5, hold to pour.</p>
    ${rows}
    <div class="bidfoot">
      <p class="note" id="footNote">Empty the purse to lock in.</p>
      <button class="btn" id="lockBtn" disabled>Lock in bids</button>
    </div>
  `, true);

  const gen = S.gen;
  const purseEl = document.getElementById("purse");
  const purseAmt = document.getElementById("purseAmt");
  const lockBtn = document.getElementById("lockBtn");
  const footNote = document.getElementById("footNote");
  const spent = () => alloc.reduce((s,v)=>s+v,0);

  function paint(i){
    const v = document.getElementById("val"+i);
    v.textContent = alloc[i];
    v.classList.toggle("zero", alloc[i] === 0);
    v.classList.remove("bump"); void v.offsetWidth; v.classList.add("bump");
    document.getElementById("lot"+i).classList.toggle("funded", alloc[i] > 0);
    const left = TOTAL - spent();
    purseAmt.textContent = left;
    purseEl.classList.remove("pulse"); void purseEl.offsetWidth; purseEl.classList.add("pulse");
    for (let j = 0; j < LOTS.length; j++){
      document.getElementById("dec"+j).disabled = alloc[j] === 0;
      document.getElementById("inc"+j).disabled = left === 0;
    }
    lockBtn.disabled = left !== 0;
    footNote.textContent = left === 0 ? "Purse empty — the gavel is ready."
      : `Empty the purse to lock in — ${left} to go.`;
  }
  function step(i, dir){
    if (S.gen !== gen) return false;
    const left = TOTAL - spent();
    if (dir > 0 && left <= 0) return false;
    if (dir < 0 && alloc[i] <= 0) return false;
    alloc[i] += dir * Math.min(STEP, dir > 0 ? left : alloc[i]);
    paint(i);
    return true;
  }

  /* Chunky steppers: pointerdown steps once immediately, then repeats while held. The click
     event still fires after pointerup, so a flag swallows that one echo — but a bare click with
     no preceding pointerdown (keyboard Enter/Space) must still work. */
  function wire(btn, i, dir){
    let timer = null, delay = null, sawPointer = false;
    const stop = () => { clearTimeout(delay); clearInterval(timer); delay = timer = null; };
    btn.addEventListener("pointerdown", e => {
      if (btn.disabled) return;
      sawPointer = true;
      e.preventDefault();
      step(i, dir);
      delay = setTimeout(() => { timer = setInterval(() => { if (!step(i, dir)) stop(); }, 110); }, 420);
    });
    ["pointerup","pointerleave","pointercancel"].forEach(ev => btn.addEventListener(ev, stop));
    btn.addEventListener("click", () => {
      if (sawPointer){ sawPointer = false; return; }
      step(i, dir);
    });
  }
  for (let i = 0; i < LOTS.length; i++){
    wire(document.getElementById("inc"+i), i, +1);
    wire(document.getElementById("dec"+i), i, -1);
  }

  lockBtn.addEventListener("click", () => {
    if (S.gen !== gen || spent() !== TOTAL) return;
    confirmModal("Lock in your bids?",
      "You can't change them once the phone is passed.",
      "Lock in", () => {
        if (S.gen !== gen) return;   // a stale confirm must never commit into a moved-on session
        if (mode === "main") S.bids[player] = alloc.slice();
        else S.proxy[player] = alloc.slice();
        advanceAfterBid(player, mode);
      });
  });
}

function advanceAfterBid(player, mode){
  if (player === 0){ showHandoff(1, mode); return; }
  // both committed — the reveal is joint, so gather the pair instead of hiding the screen
  const [a,b] = S.names;
  render(`
    <div class="handoff">
      ${GAVEL_SVG}
      <p class="passline">Both purses are empty</p>
      <p class="who" style="font-size:28px;">${esc(a)} <span class="dim" style="font-weight:400;">&amp;</span> ${esc(b)}</p>
      <p class="task">Put your heads together — the gavel comes down lot by lot.</p>
      <button class="btn" id="gavelBtn" style="max-width:340px;margin:0 auto;">Start the reveal</button>
    </div>
  `, true);
  on("gavelBtn", () => mode === "main" ? showReveal() : showProxyReveal());
}

/* ============================ main reveal ============================ */
function revealOrder(){
  // combined-spend descending: the room's priorities come down first
  return LOTS.map((_,i)=>i).sort((x,y) =>
    (S.bids[0][y]+S.bids[1][y]) - (S.bids[0][x]+S.bids[1][x]) || x - y);
}
function lotVerdict(a,b){
  if (a === 0 && b === 0) return { cls:"pass", label:"Both passed" };
  const gap = Math.abs(a-b);
  if (gap <= 10) return { cls:"match", label:"Aligned" };
  if (gap >= 20) return { cls:"split", label:"Split" };
  return { cls:"near", label:"Close" };
}
function showReveal(){
  if (!S.bids[0] || !S.bids[1]) { showTitle(); return; }   // dead-end guard: never reveal a half-session
  const order = revealOrder();
  let idx = 0;
  render(`
    <div class="stageheading"><h2>The gavel comes down</h2>
      <p>Lots in order of combined spend — tap to reveal each.</p></div>
    <div id="lots" aria-live="polite"></div>
    <button class="btn" id="nextBtn">Reveal the first lot</button>
  `, true);
  const gen = S.gen;
  const lotsEl = document.getElementById("lots");
  const nextBtn = document.getElementById("nextBtn");
  nextBtn.addEventListener("click", () => {
    if (S.gen !== gen) return;
    if (idx >= order.length){ showResults(); return; }
    // a fast double-tap must not swallow the last lot's reveal on its way to the verdict
    nextBtn.disabled = true;
    setTimeout(() => { if (S.gen === gen) nextBtn.disabled = false; }, 350);
    const i = order[idx];
    const a = S.bids[0][i], b = S.bids[1][i];
    const v = lotVerdict(a,b);
    let sub = "";
    if (v.cls === "split"){
      const hi = a > b ? 0 : 1;
      sub = `<div class="subline"><b style="color:${hi===0?'var(--p1)':'var(--p2)'}">${esc(S.names[hi])}</b> wants this one more — worth asking why.</div>`;
    } else if (v.cls === "pass"){
      sub = `<div class="subline">Neither of you spent a coin here. Interesting in its own way.</div>`;
    }
    const div = document.createElement("div");
    div.className = "rlot";
    div.innerHTML = `
      <div class="rhead"><b>${esc(LOTS[i].n)}</b><span class="verdict ${v.cls}">${v.label}</span></div>
      <div class="bidrow"><span class="pname c1">${esc(S.names[0])}</span>
        <span class="track"><span class="bar b1" data-w="${a}"></span></span><span class="amt">${a}</span></div>
      <div class="bidrow"><span class="pname c2">${esc(S.names[1])}</span>
        <span class="track"><span class="bar b2" data-w="${b}"></span></span><span class="amt">${b}</span></div>
      ${sub}`;
    lotsEl.prepend(div);
    // bars start at 0 and grow after a frame so the transition actually runs
    requestAnimationFrame(() => requestAnimationFrame(() =>
      div.querySelectorAll(".bar").forEach(bar => { bar.style.width = bar.dataset.w + "%"; })));
    idx++;
    nextBtn.textContent = idx >= order.length ? "See the verdict" : `Next lot (${idx} of ${order.length})`;
  });
}

/* ============================ analysis ============================ */
function analysis(){
  const A = S.bids[0], B = S.bids[1];
  const sumDiff = A.reduce((s,v,i) => s + Math.abs(v - B[i]), 0);
  const alignment = Math.round(100 - sumDiff / 2);
  let topShared = -1, bestMin = -1, bestComb = -1;
  let topGapIdx = 0, topGap = -1;
  for (let i = 0; i < LOTS.length; i++){
    const mn = Math.min(A[i],B[i]), comb = A[i]+B[i], gap = Math.abs(A[i]-B[i]);
    if (mn > bestMin || (mn === bestMin && comb > bestComb)){ bestMin = mn; bestComb = comb; topShared = i; }
    if (gap > topGap){ topGap = gap; topGapIdx = i; }
  }
  return { alignment, topShared: bestMin > 0 ? topShared : -1, topGapIdx, topGap };
}

function showResults(){
  if (!S.bids[0] || !S.bids[1]) { showTitle(); return; }
  const [nA,nB] = S.names;
  const R = analysis();
  const ph = alignPhrase(R.alignment);
  const mir = LOTS.map((lot,i) => `
    <div class="mirrow">
      <div class="side l"><span class="mbar" style="width:${S.bids[0][i]}%"></span></div>

        ${S.bids[0][R.topGapIdx]}, ${esc(nB)} put it at ${S.bids[1][R.topGapIdx]}. Ask about that.</div>`
    : `<div class="callout">No dramatic splits — your biggest gap was only ${R.topGap} coins, on ${esc(LOTS[R.topGapIdx].n)}.</div>`;
  const proxyBlock = S.proxyPlayed ? proxyResultsHtml() : "";
  render(`
    <div class="stageheading"><h2>${esc(nA)} &amp; ${esc(nB)}</h2><p>what the coins said</p></div>
    <div class="card" aria-live="polite">
      <div class="meterblock">

        <div class="meter"><div class="fill" id="alignFill"></div></div>
      </div>
      <p class="phrase">${ph.t}</p>
      <p class="phrase-sub">${ph.s}</p>
      ${sharedLine}
      ${splitLine}
      <div class="mirror">
        <div class="mirlegend"><span class="n1">${esc(nA)}</span><span class="n2">${esc(nB)}</span></div>
        ${mir}
      </div>
      ${proxyBlock}
      <p class="resultdate">Life Auction · ${new Date().toLocaleDateString(undefined,{day:"numeric",month:"short",year:"numeric"})}</p>
    </div>
    ${S.proxyPlayed ? "" : `
    <div class="card" style="margin-top:12px;">
      <p class="small" style="margin:0 0 10px;"><b>Round two — Proxy mode.</b> Same lots, but this time you each
        spend 100 coins the way you think the <i>other</i> one just did. Then we score your read.</p>
      <button class="btn" id="proxyBtn">Play Proxy mode</button>
    </div>`}
    <div style="margin-top:12px;">
      <a class="btn wa" id="waBtn" href="#" target="_blank" rel="noopener">${WA_ICON}Share on WhatsApp</a>
      <button class="btn ghost" id="copyBtn">Copy result</button>
      <button class="btn ghost" id="againBtn">Play again</button>
      <button class="btn ghost" id="playersBtn">Change players</button>
    </div>
    <div id="copyOut"></div>
  `, true);

  // meter animates in after paint; the number counts alongside it
  const gen = S.gen;
  requestAnimationFrame(() => requestAnimationFrame(() => {
    if (S.gen !== gen) return;
    document.getElementById("alignFill").style.width = R.alignment + "%";
    const numEl = document.getElementById("alignNum");
    const t0 = performance.now();
    (function tick(t){
      if (S.gen !== gen) return;
      const k = Math.min(1, (t - t0) / 1100);
      numEl.textContent = Math.round(R.alignment * (1 - Math.pow(1 - k, 3)));
      if (k < 1) requestAnimationFrame(tick);
    })(t0);
  }));

  if (!S.completedMainTracked){
    S.completedMainTracked = true;
    try{ LS.set("plays", String((parseInt(LS.get("plays"),10) || 0) + 1)); }catch(e){}
    track("game_complete", { alignment:R.alignment, top_gap:R.topGap, proxy_played:S.proxyPlayed ? 1 : 0 });
  }

  on("proxyBtn", () => {
    track("game_start", { mode:"proxy" });
    showHandoff(0, "proxy");

  on("againBtn", () => confirmModal("Fresh auction?", "Same players, empty purses.", "Play again", () => {
    S.bids = [null,null]; S.proxy = [null,null]; S.proxyPlayed = false; S.completedMainTracked = false;
    track("game_start", { mode:"main" });
    showHandoff(0, "main");
  }));
  on("playersBtn", showTitle);
  on("copyBtn", copyResult(R));
  const wa = document.getElementById("waBtn");
  if (wa) wa.addEventListener("click", e => {
    e.currentTarget.href = waLink(resultText(R));   // set on the way out so it always carries this game
    track("share", { via:"whatsapp" });
  });
}

/* ============================ proxy scoring & reveal ============================ */
/* Read accuracy uses the same geometry as alignment: 100 − Σ|guess−actual|/2, so a perfect
   read is 100 and "spent the coins on entirely different lots" bottoms out at 0. */
function readScore(guess, actual){
  return Math.round(100 - guess.reduce((s,v,i) => s + Math.abs(v - actual[i]), 0) / 2);
}
function guessTag(gap){
  if (gap <= 5)  return { cls:"hit",   label:"Nailed it" };
  if (gap <= 15) return { cls:"close", label:"Close" };
  return { cls:"miss", label:"Missed" };
}
function showProxyReveal(){
  if (!S.bids[0] || !S.bids[1] || !S.proxy[0] || !S.proxy[1]) { showTitle(); return; }
  const [nA,nB] = S.names;
  const order = revealOrder();
  let idx = 0;
  render(`
    <div class="stageheading"><h2>How well do you read each other?</h2>
      <p>Each guess against the real bid — tap through the lots.</p></div>
    <div id="lots" aria-live="polite"></div>
    <button class="btn" id="nextBtn">Reveal the first lot</button>
  `, true);
  const gen = S.gen;
  const lotsEl = document.getElementById("lots");
  const nextBtn = document.getElementById("nextBtn");
  nextBtn.addEventListener("click", () => {
    if (S.gen !== gen) return;
    if (idx >= order.length){ S.proxyPlayed = true; finishProxy(); return; }
    nextBtn.disabled = true;
    setTimeout(() => { if (S.gen === gen) nextBtn.disabled = false; }, 350);
    const i = order[idx];
    // proxy[0] is A's guess about B; it scores against B's real bid — and vice versa
    const gAonB = S.proxy[0][i], realB = S.bids[1][i];
    const gBonA = S.proxy[1][i], realA = S.bids[0][i];
    const tA = guessTag(Math.abs(gAonB - realB));
    const tB = guessTag(Math.abs(gBonA - realA));
    const div = document.createElement("div");
    div.className = "rlot";
    div.innerHTML = `
      <div class="rhead"><b>${esc(LOTS[i].n)}</b></div>
      <div class="guessline"><span class="pname c1" style="width:auto;font-weight:800;">${esc(nA)}</span>
        guessed <b>${gAonB}</b> · ${esc(nB)} bid <b>${realB}</b>
        <span class="tag ${tA.cls}">${tA.label}</span></div>
      <div class="guessline"><span class="pname c2" style="width:auto;font-weight:800;">${esc(nB)}</span>
        guessed <b>${gBonA}</b> · ${esc(nA)} bid <b>${realA}</b>
        <span class="tag ${tB.cls}">${tB.label}</span></div>`;
    lotsEl.prepend(div);
    idx++;
    nextBtn.textContent = idx >= order.length ? "See both scores" : `Next lot (${idx} of ${order.length})`;
  });
}
function finishProxy(){
  const R = analysis();
  // the session's game_complete already fired with proxy_played:0; the proxy round is a second
  // full auction by the same pair, so it earns its own completion event with the flag set
  track("game_complete", { alignment:R.alignment, top_gap:R.topGap, proxy_played:1 });
  showResults();
}
function proxyResultsHtml(){
  const [nA,nB] = S.names;
  const readA = readScore(S.proxy[0], S.bids[1]);
  const readB = readScore(S.proxy[1], S.bids[0]);
  let line;
  if (Math.abs(readA - readB) <= 5) line = "You read each other about equally well.";
  else if (readA > readB) line = `${esc(nA)} reads ${esc(nB)} better than ${esc(nB)} reads ${esc(nA)} — for now.`;
  else line = `${esc(nB)} reads ${esc(nA)} better than ${esc(nA)} reads ${esc(nB)} — for now.`;
  return `
    <div class="readmeters">
      <div class="meterblock">
        <div class="mlabel"><span>${esc(nA)}'s read of ${esc(nB)}</span><b>${readA}</b></div>
        <div class="meter"><div class="fill" style="width:${readA}%"></div></div>
      </div>
      <div class="meterblock m2">
        <div class="mlabel"><span>${esc(nB)}'s read of ${esc(nA)}</span><b>${readB}</b></div>
        <div class="meter"><div class="fill" style="width:${readB}%"></div></div>
      </div>
      <p class="phrase-sub" style="margin-top:2px;">${line}</p>
    </div>`;
}

/* ============================ copy / share result ============================ */
const WA_ICON = '<svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2zm0 18.2a8.2 8.2 0 0 1-4.2-1.2l-.3-.2-3 .8.8-2.9-.2-.3A8.2 8.2 0 1 1 12 20.2zm4.5-6.1c-.2-.1-1.5-.7-1.7-.8s-.4-.1-.6.1-.6.8-.8 1c-.1.2-.3.2-.5.1a6.7 6.7 0 0 1-3.3-2.9c-.3-.4.3-.4.8-1.4.1-.2 0-.3 0-.4l-.8-1.8c-.2-.5-.4-.4-.6-.4h-.5a1 1 0 0 0-.7.3 3 3 0 0 0-.9 2.2 5.2 5.2 0 0 0 1.1 2.7 11.8 11.8 0 0 0 4.5 4c1.7.7 2.3.8 3.1.6a2.7 2.7 0 0 0 1.8-1.2 2.2 2.2 0 0 0 .1-1.2c0-.2-.2-.2-.5-.4z"/></svg>';
function waLink(text){ return "https://wa.me/?text=" + encodeURIComponent(text); }
function resultText(R){
  const [nA,nB] = S.names;
  const ph = alignPhrase(R.alignment);
  // one glyph per lot in fixed lot order, so two cards from different pairs line up
  const glyphs = LOTS.map((_,i) => {
    const a = S.bids[0][i], b = S.bids[1][i];
    if (a === 0 && b === 0) return "⚫";
    const gap = Math.abs(a-b);
    return gap <= 10 ? "🟢" : gap >= 20 ? "🔴" : "🟠";
  }).join("");
  const lines = [
    `Life Auction — ${nA} & ${nB}`,
    `Alignment ${R.alignment} · ${ph.t}`,
    glyphs,
    R.topShared >= 0 ? `Top shared: ${LOTS[R.topShared].n}` : `No shared top pick`,
    `Biggest split: ${LOTS[R.topGapIdx].n} (${S.bids[0][R.topGapIdx]} vs ${S.bids[1][R.topGapIdx]})`,
  ];
  if (S.proxyPlayed){
    lines.push(`Reads: ${nA} ${readScore(S.proxy[0], S.bids[1])} · ${nB} ${readScore(S.proxy[1], S.bids[0])}`);
  }
  lines.push("kreeda.games/auction/");
  return lines.join("\n");
}
function copyResult(R){
  return () => {
    const text = resultText(R);
    const out = document.getElementById("copyOut");
    let ok = false;
    try{
      if (navigator.clipboard && navigator.clipboard.writeText){
        navigator.clipboard.writeText(text).then(() => toast("Copied"), () => showFallback());
        ok = true;
      }
    }catch(e){}
    if (!ok) showFallback();
    function showFallback(){
      if (!out || out.querySelector("textarea")) return;
      out.innerHTML = `<div class="copyfallback card" style="margin-top:10px;">
        <p class="small dim" style="margin:0 0 8px;">Clipboard isn't available here — copy it yourself:</p>
        <textarea readonly aria-label="Result text to copy"></textarea></div>`;
      const ta = out.querySelector("textarea");
      ta.value = text;
      ta.focus(); ta.select();
    }
  };
}
function toast(msg){
  const t = document.createElement("div");
  t.className = "toast"; t.textContent = msg; t.setAttribute("role","status");
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 1600);
}

/* ============================ confirm modal (lock-in, abandon, replay) ============================ */
function confirmModal(title, body, yesLabel, yes){
  const scrim = document.createElement("div");
  scrim.className = "scrim";
  scrim.innerHTML = `<div class="modal" role="dialog" aria-modal="true" aria-label="${esc(title)}">
    <h2>${esc(title)}</h2><p>${esc(body)}</p>
    <button class="btn" id="cmYes">${esc(yesLabel)}</button>
    <button class="btn ghost" id="cmNo">Go back</button></div>`;
  document.body.appendChild(scrim);
  let done = false;   // both buttons and the scrim can race a fast double-tap; first one wins
  const close = () => { if (!done){ done = true; scrim.remove(); } };
  scrim.querySelector("#cmYes").addEventListener("click", () => { if (done) return; close(); yes(); });
  scrim.querySelector("#cmNo").addEventListener("click", close);
  scrim.addEventListener("click", e => { if (e.target === scrim) close(); });
  scrim.querySelector("#cmYes").focus();
}

homeBtn.addEventListener("click", () => {
  confirmModal("Leave this auction?", "Bids from this session will be discarded.", "Leave", showTitle);
});

showTitle();
</script>
