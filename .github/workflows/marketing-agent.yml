name: Autonomous Marketing Agent

on:
  # Run daily at 09:00 AM UTC
  schedule:
    - cron: '0 9 * * *'

  # Allow manual trigger from GitHub Actions tab
  workflow_dispatch:
    inputs:
      mode:
        description: 'Publishing Mode'
        required: true
        default: 'draft'
        type: choice
        options:
          - draft
          - live
      action:
        description: 'Marketing Action to Execute'
        required: true
        default: 'full_cycle'
        type: choice
        options:
          - full_cycle
          - plan
          - scout
          - process_due

permissions:
  contents: write

jobs:
  marketing-agent:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Load All-in-One .env Secret (if configured)
        if: "${{ secrets.MARKETING_ENV != '' }}"
        env:
          ENV_CONTENT: ${{ secrets.MARKETING_ENV }}
        run: |
          echo "$ENV_CONTENT" > marketing/.env
          echo "Loaded marketing/.env from MARKETING_ENV secret."

      - name: Execute Marketing Agent
        env:
          # AI Engine
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ secrets.GEMINI_MODEL || 'gemini-3.7-flash' }}

          # Mode & Configuration
          MARKETING_MODE: ${{ github.event.inputs.mode || secrets.MARKETING_MODE || 'draft' }}
          BASE_URL: ${{ secrets.BASE_URL || 'https://kreeda.games' }}
          REPO_URL: 'https://github.com/sudhir-patavardhan/browser-games'

          # Twitter / X Secrets
          TWITTER_API_KEY: ${{ secrets.TWITTER_API_KEY }}
          TWITTER_API_SECRET: ${{ secrets.TWITTER_API_SECRET }}
          TWITTER_ACCESS_TOKEN: ${{ secrets.TWITTER_ACCESS_TOKEN }}
          TWITTER_ACCESS_TOKEN_SECRET: ${{ secrets.TWITTER_ACCESS_TOKEN_SECRET }}
          TWITTER_BEARER_TOKEN: ${{ secrets.TWITTER_BEARER_TOKEN }}

          # Reddit Secrets
          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
          REDDIT_USERNAME: ${{ secrets.REDDIT_USERNAME }}
          REDDIT_PASSWORD: ${{ secrets.REDDIT_PASSWORD }}
          REDDIT_USER_AGENT: ${{ secrets.REDDIT_USER_AGENT || 'KreedaGrowthAgent/1.0' }}

          # Discord Webhook
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}

          # Dev.to API Key
          DEVTO_API_KEY: ${{ secrets.DEVTO_API_KEY }}

          # Universal Webhook / Buffer
          GENERIC_WEBHOOK_URL: ${{ secrets.GENERIC_WEBHOOK_URL }}
          BUFFER_ACCESS_TOKEN: ${{ secrets.BUFFER_ACCESS_TOKEN }}
          BUFFER_PROFILE_IDS: ${{ secrets.BUFFER_PROFILE_IDS }}
        run: |
          ACTION="${{ github.event.inputs.action || 'full_cycle' }}"
          echo "🤖 Running Marketing Action: $ACTION in mode: $MARKETING_MODE"

          if [ "$ACTION" = "plan" ]; then
            node marketing/cli.js plan
          elif [ "$ACTION" = "scout" ]; then
            node marketing/cli.js scout
          elif [ "$ACTION" = "process_due" ]; then
            if [ "$MARKETING_MODE" = "live" ]; then
              node marketing/cli.js process-due --live
            else
              node marketing/cli.js process-due
            fi
          else
            if [ "$MARKETING_MODE" = "live" ]; then
              node marketing/cli.js run-autonomous --live
            else
              node marketing/cli.js run-autonomous
            fi
          fi

      - name: Commit Updated Artifacts and Queue
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add marketing/artifacts/ marketing/data/
          if git diff --staged --quiet; then
            echo "No marketing state changes to commit."
          else
            git commit -m "chore(marketing): autonomous cycle update [skip ci]"
            git push
          fi
