/* ============================ tokens ============================
   Night meadow: this is the after-dinner warm-up game, lights low, everyone loud. The ground is
   the green-black of a pasture at night, the ink is moonlit-wool cream, gold is the lantern the
   majority gathers under and mint is the score growing. One committed dark look — a theme flip
   mid-hand-off would read as a glitch. Eight fixed player hues, chosen to stay apart on the dark
   green; a player keeps their hue everywhere — name rows, inputs, cluster dots, bars. */

  --ground:#0e1712;  --ground-2:#152219;
  --panel:#1a2a20;   --panel-2:#233529;  --rule:rgba(200,235,210,.15);

  --wool:#f2efe4;    --no:#ff8c7a;
  --shade:rgba(6,12,8,.74);
  --p0:#ffd166; --p1:#6ecbff; --p2:#ff8fa3; --p3:#7de3b2;
  --p4:#c9a0ff; --p5:#ffab73; --p6:#a8e05f; --p7:#ff9de2;
}

  min-height:100vh;
  overflow-x:hidden;

<!-- analytics.js before the game script: track() below fires synchronously and would otherwise
     race the tag load and vanish. -->
<script src="../analytics.js"></script>
<script>
'use strict';
/* ============================================================================================
   HERD MIND — the zero-vulnerability warm-up. 3–8 friends, one phone. Every round the whole
   room secretly answers the same prompt, each trying to match the majority. Then the answers go
   up as chips, obvious synonyms get merged by hand in the open, and everyone in the biggest
   cluster scores. Stand alone and you are the round's black sheep — a badge, not a wound.

   Privacy is a design constraint, not a feature flag: answers live in one in-memory session
   object (S) and NOTHING else. localStorage holds only names, a sound preference and a play
   counter. Analytics gets counts, never content. A page refresh mid-game loses the round by
   design — that is cheaper than answers ever touching disk.
   ============================================================================================ */

function track(name,p){ try{ if(window.bgTrack) window.bgTrack(name,p); }catch(e){} }
const LS={ get:k=>{ try{ return localStorage.getItem(k)||''; }catch(e){ return ''; } },
           set:(k,v)=>{ try{ localStorage.setItem(k,v); }catch(e){} } };

/* Seeded PRNG so a session's draw is deterministic given its seed — the deck is dealt once at
   Start and can never disagree with itself mid-session — while each new session reshuffles. */
function mulberry32(a){ return function(){ a=(a+0x6D2B79F5)|0; let t=Math.imul(a^(a>>>15),1|a);
  t=(t+Math.imul(t^(t>>>7),61|t))^t; return ((t^(t>>>14))>>>0)/4294967296; }; }

function esc(s){ return String(s).replace(/[&<>"']/g,
  c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

/* ============================ state ============================
   S is the whole game and it lives only in memory. Every screen renders through show(), which
   wipes the DOM wholesale, so a previous player's typed answer cannot survive into a hand-off
   even for one frame. */
let S=null;
let roundsPick=7;                       // session-only, deliberately not persisted
let names=['','',''];                   // title-screen values; resolved names saved on Start
try{ const n=JSON.parse(LS.get('herd.names')||'[]');
  if(Array.isArray(n)&&n.length>=MINP&&n.length<=MAXP)
    names=n.map(x=>String(x).slice(0,12)); }catch(e){}

function newSession(){
  const rnd=mulberry32((Date.now() ^ (Math.random()*0xffffffff))>>>0);
  const deck=PROMPTS.slice();
  for(let i=deck.length-1;i>0;i--){ const j=Math.floor(rnd()*(i+1)); const t=deck[i]; deck[i]=deck[j]; deck[j]=t; }
  S={ names:names.slice(), R:roundsPick, deck:deck.slice(0,roundsPick), r:0,
      answers:[],                            // current round: raw text per player index
      rounds:[],                             // finished round records
      pts:names.map(()=>0), sheep:names.map(()=>0),
      pattern:names.map(()=>[]),             // per player, per round: 'w' | 'o' | 'l'
      merges:0 };
}
const pc=i=>'var(--p'+(i%8)+')';           // the player's fixed hue

/* ============================ rendering core ============================
   One container, innerHTML replaced wholesale per screen. GEN is a render generation counter:
   every handler captures the generation it was bound in and no-ops if a render has happened
   since — this is the double-tap guard. A fast second tap on any advancing button finds either
   a disabled button or a stale generation; it can never advance the state machine twice. */
const app=document.getElementById('app');
let GEN=0;
function show(html){
  GEN++; app.innerHTML=html;
  try{ window.scrollTo({top:0,left:0,behavior:'instant'}); }catch(e){ window.scrollTo(0,0); }
}
function on(id,fn){
  const g=GEN, el=document.getElementById(id);
  if(!el) return;
  el.addEventListener('click',function(e){
    if(g!==GEN || el.disabled) return;
    el.disabled=true;
    try{ fn(e); }finally{ if(g===GEN) el.disabled=false; }
  });
}

/* ============================ sound ============================
   Two synthesized cues, no audio files: a soft tick on taps and a swish when a round turns
   over. The context is created on the first tap (a user gesture, which iOS requires), and the
   on/off preference is the only thing besides names and a play count that touches storage. */
const SND={ ctx:null, noise:null, on:LS.get('herd.sound')!=='0' };
function audio(){
  if(!SND.on) return null;
  if(!SND.ctx){ try{ SND.ctx=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ return null; } }
  if(SND.ctx.state==='suspended'){ try{ SND.ctx.resume(); }catch(e){} }
  return SND.ctx;
}
function tick(){
  const ac=audio(); if(!ac) return;
  try{
    const t=ac.currentTime, o=ac.createOscillator(), g=ac.createGain();
    o.type='sine'; o.frequency.setValueAtTime(880,t); o.frequency.exponentialRampToValueAtTime(1320,t+0.03);
    g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(0.09,t+0.008);
    g.gain.exponentialRampToValueAtTime(0.0001,t+0.07);
    o.connect(g).connect(ac.destination); o.start(t); o.stop(t+0.08);
  }catch(e){}
}
function swish(){
  const ac=audio(); if(!ac) return;
  try{
    const dur=0.3, t=ac.currentTime;
    if(!SND.noise){ const n=Math.floor(ac.sampleRate*0.5), b=ac.createBuffer(1,n,ac.sampleRate), d=b.getChannelData(0);
      for(let i=0;i<n;i++) d[i]=Math.random()*2-1; SND.noise=b; }
    const src=ac.createBufferSource(); src.buffer=SND.noise;
    const f=ac.createBiquadFilter(); f.type='bandpass'; f.Q.value=1.4;      // filtered noise, swept up then down
    f.frequency.setValueAtTime(500,t); f.frequency.exponentialRampToValueAtTime(3400,t+dur*0.45);
    f.frequency.exponentialRampToValueAtTime(700,t+dur);
    const g=ac.createGain(); g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(0.32,t+0.06);
    g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    src.connect(f).connect(g).connect(ac.destination); src.start(t); src.stop(t+dur+0.02);
  }catch(e){}
}
function setSound(on){
  SND.on=on; LS.set('herd.sound',on?'1':'0');
  const b=document.getElementById('bSound');
  if(b){ b.textContent=on?'🔊':'🔇'; b.setAttribute('aria-pressed',String(on)); }
  if(on) tick();
}

  const cb=confirmCb; confirmCb=null; if(cb) cb(); });

  clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove('show'),2200);
}

/* ============================ hand-off ============================

   the last button is rarely the next to answer. It renders through show(), which has already
   destroyed the previous screen, so there is nothing underneath to peek at, however fast the

function handoff(p){

   '<div class="handoff">'
   +'<div class="pass">Round '+(S.r+1)+' of '+S.R+' · pass the phone to</div>'

      ?'A fresh prompt for the whole room.<br>Same question, secret answers.'

   +'<button class="btn primary" type="button" id="bReady">I’m '+esc(nm)+' — show me</button>'
   +'<p class="peek">👀 tilt the phone away while you type</p>'
   +'</div>'
  );

}

/* ============================ answering ============================ */
function answer(p){
  const n=S.names.length, last=p===n-1;
  show(
   header(true)
   +'<div class="turn"><span class="eye">👀</span><span><b style="color:'+pc(p)+'">'+esc(S.names[p])
   +'’s turn.</b> Everyone can know the prompt — nobody peeks at the typing.</span></div>'

   +'<i style="width:'+(p/n*100)+'%"></i></div></div>'
   +'<div class="card">'
   +'<p class="rlabel">Round '+(S.r+1)+' of '+S.R+'</p>'
   +'<h2 class="prompt">'+esc(S.deck[S.r])+'</h2>'
   +'<p class="dim tiny">Match the herd, not your heart — you score by landing in the biggest group.</p>'
   +'<div class="field ansfield"><label for="ans">Your answer</label>'
   +'<input id="ans" type="text" maxlength="'+MAXANS+'" autocomplete="off" '
   +'style="border-left:4px solid '+pc(p)+'" placeholder="One short answer…"></div>'
   +'<button class="btn primary" type="button" id="bLock">'
   +(last?'Lock it in — reveal the herd':'Lock it in — pass to '+esc(S.names[p+1]))+'</button>'
   +'</div>'
  );
  bindHome();
  const inp=document.getElementById('ans');
  const g=GEN;
  inp.addEventListener('keydown',e=>{
    if(g!==GEN) return;

  });
  try{ inp.focus(); }catch(e){}

    const v=inp.value.trim().replace(/\s+/g,' ').slice(0,MAXANS);
    if(!v){ toast('Type a short answer first'); return; }
    S.answers[p]=v;
    tick();
    if(last) cluster(); else handoff(p+1);
  });
}

/* ============================ clustering — the open step ============================
   Auto-grouping first: case-insensitive, trimmed, spaces collapsed, a leading "the/a/an" and
   trailing punctuation stripped. Then the 5-second human step, in the open: the current
   phone-holder taps two chips to merge obvious synonyms, taps a combined chip to split it back.
   Nothing here is secret — the reveal has already happened; this is the room agreeing on what
   counts as the same answer. */
function normKey(s){
  let t=String(s).toLowerCase().trim().replace(/\s+/g,' ');
  t=t.replace(/^(the|a|an)\s+/,'').replace(/[.!?]+$/,'').trim();
  return t||String(s).toLowerCase().trim();
}
function buildAutos(){
  const autos=[], byKey={};
  S.answers.forEach((raw,pi)=>{
    const k=normKey(raw);
    if(byKey[k]===undefined){ byKey[k]=autos.length; autos.push({key:k,label:raw,members:[]}); }
    autos[byKey[k]].members.push(pi);
  });
  return autos;
}
function cluster(){
  const autos=buildAutos();
  let groups=autos.map((a,i)=>[i]);       // each entry: a list of auto-cluster indexes
  let sel=-1;
  show(
   header(true)
   +'<div class="turn"><span class="eye">📣</span><span><b>Everyone look!</b> The answers are in. '
   +'Merge chips that mean the same thing, then score it.</span></div>'
   +'<div class="card">'
   +'<p class="rlabel">Round '+(S.r+1)+' of '+S.R+'</p>'
   +'<h2 class="prompt">'+esc(S.deck[S.r])+'</h2>'
   +'<div class="chipbox" id="chipBox"></div>'
   +'<p class="mergehint">Tap one chip, then another, to <b>merge</b> synonyms. Tap a dashed combined chip to <b>split</b> it back.</p>'
   +'<button class="btn primary" type="button" id="bScore">Looks right — score it</button>'
   +'</div>'
  );
  bindHome();
  const g=GEN, box=document.getElementById('chipBox');
  const glabel=grp=>grp.map(ai=>autos[ai].label).join(' + ');
  const gcount=grp=>grp.reduce((s,ai)=>s+autos[ai].members.length,0);
  const gmembers=grp=>grp.reduce((s,ai)=>s.concat(autos[ai].members),[]);
  const render=()=>{
    box.innerHTML=groups.map((grp,i)=>{
      const multi=grp.length>1, count=gcount(grp);
      return '<button type="button" class="clus'+(multi?' multi':'')+(i===sel?' sel':'')+'" data-i="'+i+'" '
       +'aria-pressed="'+(i===sel)+'" aria-label="'+esc(glabel(grp))+', '+count
       +(count===1?' answer':' answers')+(multi?', combined — tap to split':'')+'">'
       +'<span class="l1"><b>'+esc(glabel(grp))+'</b><span class="cnt">×'+count+'</span></span>'
       +'<span class="dots" aria-hidden="true">'
       +gmembers(grp).map(m=>'<i style="background:'+pc(m)+'"></i>').join('')+'</span>'
       +(multi?'<span class="split">tap to split</span>':'')
       +'</button>';
    }).join('');
  };
  render();
  box.addEventListener('click',e=>{
    if(g!==GEN) return;
    const c=e.target.closest('button.clus'); if(!c) return;
    const i=+c.getAttribute('data-i');
    if(sel===-1){
      if(groups[i].length>1){                    // tap a combined chip → split it back
        const parts=groups[i].map(ai=>[ai]);
        groups.splice.apply(groups,[i,1].concat(parts));
        tick();
      }else sel=i;
    }else if(sel===i){
      sel=-1;                                    // tap the selected chip again → deselect
    }else{                                       // second chip → merge
      const merged=groups[sel].concat(groups[i]);
      const lo=Math.min(sel,i), hi=Math.max(sel,i);
      groups.splice(hi,1); groups.splice(lo,1,merged);
      sel=-1; S.merges++;
      tick();
      render();
      const el=box.querySelector('[data-i="'+lo+'"]');
      if(el){ el.classList.remove('pop'); void el.offsetWidth; el.classList.add('pop'); }
      return;
    }
    render();
  });
  on('bScore',()=>{ scoreRound(autos,groups); });
}

/* ============================ scoring ============================
   A cluster needs at least 2 people to be a majority: if every answer stands alone, nobody
   scores and everyone is a black sheep — the herd scattered. Ties: all tied clusters score.
   "Decisive" marks a round won by exactly one voice (unique winner, margin of one) — that is
   the Kingmaker's raw material. */
function scoreRound(autos,groups){
  const n=S.names.length;
  const clus=groups.map(grp=>({
    label:grp.map(ai=>autos[ai].label).join(' + '),
    count:grp.reduce((s,ai)=>s+autos[ai].members.length,0),
    members:grp.reduce((s,ai)=>s.concat(autos[ai].members),[])
  })).sort((a,b)=>b.count-a.count);
  const winSize=clus[0].count;
  const scattered=winSize<2;
  const winners=scattered?[]:clus.filter(c=>c.count===winSize);
  const winset=[]; winners.forEach(c=>c.members.forEach(m=>winset.push(m)));
  const runner=(clus.find(c=>c.count<winSize)||{count:0}).count;
  const decisive=winners.length===1 && !scattered && (winSize-runner)===1;
  const rec={ prompt:S.deck[S.r], clus:clus, winSize:winSize, scattered:scattered,
              winLabels:winners.map(c=>c.label), winset:winset,
              decisive:decisive, fraction:winSize/n };
  for(let i=0;i<n;i++){
    const mine=clus.find(c=>c.members.indexOf(i)>=0);
    let st='o';
    if(winset.indexOf(i)>=0){ st='w'; S.pts[i]++; }
    else if(mine.count===1){ st='l'; S.sheep[i]++; }
    S.pattern[i].push(st);
  }
  S.rounds.push(rec);
  swish();
  roundReveal(rec);
}

/* ============================ round reveal ============================ */
function roundReveal(rec){
  const n=S.names.length, last=S.r===S.R-1;
  show(
   header(true)
   +'<div class="card">'
   +'<p class="rlabel">Round '+(S.r+1)+' of '+S.R+' · the herd has spoken</p>'
   +'<h2 class="prompt">'+esc(rec.prompt)+'</h2>'
   +(rec.scattered
     ?'<p class="scatline">🐑 <b>Everybody scattered.</b> No majority, no points — sheep all round, worn with pride.</p>'
     :'')
   +rec.clus.map((c,ci)=>{
      const win=!rec.scattered&&c.count===rec.winSize;
      return '<div class="crow'+(win?' win':'')+'">'
       +'<div class="chead"><span class="clab">'+esc(c.label)+'</span>'
       +(win?'<span class="plus">+1</span>':'')
       +(c.count===1?'<span class="lone" aria-label="lone answer">🐑</span>':'')
       +'<span class="cn">×'+c.count+'</span></div>'
       +'<div class="cbar"><i data-w="'+(c.count/n*100)+'"></i></div>'
       +'<div class="mnames">'+c.members.map(m=>'<span class="mname" style="color:'+pc(m)
         +';box-shadow:inset 0 0 0 1px '+pc(m)+'">'+esc(S.names[m])+'</span>').join('')+'</div>'
       +'</div>';
    }).join('')
   +'</div>'
   +'<div class="card" style="margin-top:12px">'
   +'<h3 class="cardh">Scores so far</h3>'
   +'<div class="scstrip">'+S.names.map((nm,i)=>'<span class="pchip" style="color:'+pc(i)
     +';box-shadow:inset 0 0 0 1px '+pc(i)+'">'+esc(nm)+' '+S.pts[i]
     +(S.sheep[i]?' <small>🐑×'+S.sheep[i]+'</small>':'')+'</span>').join('')+'</div>'
   +'</div>'
   +'<button class="btn primary" type="button" id="bNext">'
   +(last?'See the final verdict':'Round '+(S.r+2)+' — pass to '+esc(S.names[0]))+'</button>'
  );
  bindHome();
  const g=GEN;
  requestAnimationFrame(()=>requestAnimationFrame(()=>{
    if(g!==GEN) return;
    document.querySelectorAll('.cbar i[data-w]').forEach(el=>{ el.style.width=el.getAttribute('data-w')+'%'; });
  }));
  on('bNext',()=>{
    if(last){ finale(); return; }
    S.r++; S.answers=[];
    handoff(0);
  });
}

/* ============================ verdicts ============================ */
function verdictFor(h){
  if(h>=78) return ['One brain, many bodies','You could finish each other’s grocery lists.'];
  if(h>=62) return ['Proper herd','Most rounds, most of you moved as one.'];
  if(h>=48) return ['Herd-ish','A real majority most rounds — with a healthy fringe.'];
  if(h>=34) return ['Herding cats','Clusters formed, barely. The fringe kept winning.'];
  return ['Beautiful chaos','Same prompts, wildly different heads. Magnificent.'];
}
function joinNames(idx){
  const ns=idx.map(i=>S.names[i]);
  if(ns.length<=1) return ns[0]||'';
  if(ns.length<=3) return ns.slice(0,-1).join(', ')+' & '+ns[ns.length-1];
  return ns[0]+', '+ns[1]+' & '+(ns.length-2)+' more';
}
function argmaxAll(arr){
  const m=Math.max.apply(null,arr), out=[];
  arr.forEach((v,i)=>{ if(v===m) out.push(i); });
  return {max:m, idx:out};
}
/* the four superlative lines — computed once, used by both the page and the share text */
function superlatives(){
  const R=S.R;
  const king=S.names.map(()=>0);
  S.rounds.forEach(rec=>{ if(rec.decisive) rec.winset.forEach(i=>king[i]++); });
  const flips=S.pattern.map(pat=>{
    let f=0; for(let r=1;r<pat.length;r++){ if((pat[r]==='w')!==(pat[r-1]==='w')) f++; } return f;
  });
  const top=argmaxAll(S.pts), sh=argmaxAll(S.sheep), kg=argmaxAll(king), wc=argmaxAll(flips);
  return [
    { cls:'', gi:'🧠', lb:'Hive Mind',
      txt: top.max>0
        ? joinNames(top.idx)+' — in the majority '+top.max+' of '+R+' rounds.'
        : 'no one — the herd never once agreed.' },
    { cls:'sheepy', gi:'🐑', lb:'Black Sheep',
      txt: sh.max>0
        ? joinNames(sh.idx)+' — '+sh.max+' lone answer'+(sh.max>1?'s':'')+'. The free thinker of the flock.'
        : 'nobody — the herd never left anyone alone.' },
    { cls:'king', gi:'🎯', lb:'Kingmaker',
      txt: kg.max>0
        ? joinNames(kg.idx)+' — their voice tipped the majority in '+kg.max+' round'+(kg.max>1?'s':'')+'.'
        : 'no one — no round hung on a single voice.' },
    { cls:'wild', gi:'🃏', lb:'Wildcard',
      txt: wc.max>0
        ? joinNames(wc.idx)+' — swung between herd and fringe '+wc.max+' time'+(wc.max>1?'s':'')+'.'
        : 'nobody swung — everyone held their lane all game.' }
  ];
}

/* ============================ results — one page ============================ */
function ring(pct,cls,label,big){
  const r=big?70:40, s=2*r+12, c=s/2, C=2*Math.PI*r, v=Math.round(pct);
  return '<div class="ring '+cls+(big?' big':'')+'"><svg viewBox="0 0 '+s+' '+s+'" aria-hidden="true">'
   +'<circle class="tr" cx="'+c+'" cy="'+c+'" r="'+r+'"/>'
   +'<circle class="fl" cx="'+c+'" cy="'+c+'" r="'+r+'" style="stroke-dasharray:'+C.toFixed(1)+';stroke-dashoffset:'+C.toFixed(1)+'" '
   +'data-off="'+(C*(1-v/100)).toFixed(1)+'"/></svg>'
   +'<div class="rv" aria-hidden="true"><b data-n="'+v+'">0</b><i>%</i></div>'
   +'<div class="rl" aria-hidden="true">'+label+'</div>'
   +'<span class="sr">'+label+': '+v+'%</span></div>';
}

let completeSent=false;
function finale(){
  if(!S){ title(); return; }
  if(S.rounds.length!==S.R){ handoff(0); return; }   // a state bug fails loudly to the hand-off
  const n=S.names.length, R=S.R;
  const hive=Math.round(S.rounds.reduce((s,rec)=>s+rec.fraction,0)/R*100);
  const v=verdictFor(hive);
  const sup=superlatives();
  const today=new Date().toLocaleDateString(undefined,{year:'numeric',month:'short',day:'numeric'});
  const order=S.names.map((_,i)=>i).sort((a,b)=>S.pts[b]-S.pts[a]);
  const maxPts=Math.max(1,Math.max.apply(null,S.pts));
  const sheepIcons=k=>k===0?'':(k<=3?'🐑'.repeat(k):'🐑×'+k);
  const dl=n2=>'style="animation-delay:'+n2+'ms"';

  if(!completeSent){
    completeSent=true;
    track('game_complete',{player_count:n, rounds:R, hive_pct:hive, merges:S.merges,
      top_pts:Math.max.apply(null,S.pts), sheep_total:S.sheep.reduce((a,b)=>a+b,0)});
    const plays=(+LS.get('herd.plays')||0)+1; LS.set('herd.plays',String(plays));
  }

  show(
   header(false)
   +'<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>'
   +'<linearGradient id="ringGrad" x1="0" y1="0" x2="1" y2="1">'
   +'<stop offset="0" stop-color="#7de3b2"/><stop offset="1" stop-color="#ffd166"/></linearGradient>'
   +'</defs></svg>'
   +'<div class="results">'
   +'<h2>The verdict</h2>'
   +'<p class="meta">'+n+' players · '+R+' rounds</p>'
   +'<div class="card info">'
   +ring(hive,'rh','Hive mind',true)
   +'<div class="verdict" '+dl(500)+'><b>'+v[0]+'</b><span>'+v[1]+'</span></div>'
   +'</div>'
   +'<div class="card rcard" '+dl(650)+'>'
   +'<h3 class="cardh">The flock</h3>'
   +order.map((i,k)=>'<div class="lrow">'
     +'<span class="lname" style="color:'+pc(i)+'">'+esc(S.names[i])+'</span>'
     +'<div class="lbar"><i data-w="'+(S.pts[i]/maxPts*100)+'" style="background:'+pc(i)+'"></i></div>'
     +'<span class="lpts">'+S.pts[i]+'</span>'
     +'<span class="lsheep" aria-label="'+S.sheep[i]+' lone answers">'+sheepIcons(S.sheep[i])+'</span>'
     +'</div>').join('')
   +'</div>'
   +'<div class="card rcard glance" '+dl(800)+'>'
   +sup.map(s2=>'<div class="gl '+s2.cls+'"><span class="gi">'+s2.gi+'</span>'
     +'<span><span class="lb">'+s2.lb+'</span>'+esc(s2.txt)+'</span></div>').join('')
   +'</div>'
   +'<div class="card rcard" '+dl(950)+'>'
   +'<h3 class="cardh">Round by round</h3>'
   +S.rounds.map((rec,i)=>'<div class="rrow"><span class="rn">'+(i+1)+'</span>'
     +'<span class="rq">'+esc(rec.prompt)+'</span>'
     +(rec.scattered
       ?'<span class="wchip scat">🐑 scattered</span>'
       :rec.winLabels.slice(0,2).map(l=>'<span class="wchip">'+esc(l)+' ×'+rec.winSize+'</span>').join(''))
     +'</div>').join('')
   +'</div>'
   +'<p class="datefoot">'+esc(today)+' · kreeda.games/herd</p>'
   +'<button class="btn primary" type="button" id="bAgain">Play again</button>'
   +'<a class="btn wa" id="bWa" href="#" target="_blank" rel="noopener">'+WA_ICON+'Share on WhatsApp</a>'
   +'<p class="sharehint">Send it to the group chat — everyone keeps a copy.</p>'
   +'<div class="btnrow"><button class="btn" type="button" id="bCopy">Copy result</button>'
   +(navigator.share?'<button class="btn" type="button" id="bShare">Share…</button>':'')+'</div>'
   +'<button class="btn ghost" type="button" id="bChange">Change players</button>'
   +'<div id="shareSlot"></div>'
   +'</div>'
   +'<footer class="foot">Black sheep aren’t wrong — they’re the interesting ones.<br>'
   +'<a href="../">Kreeda</a></footer>'
  );
  const g=GEN;
  /* the ring fills and its number counts up after first paint; bars grow alongside. Reduced
     motion gets the final state at once. Clocked off performance.now(), not the frame timestamp,
     so it lands on the final figure even if the tab was hidden when the page rendered. */
  const reduced=!!(window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches);
  requestAnimationFrame(()=>requestAnimationFrame(()=>{
    if(g!==GEN) return;
    document.querySelectorAll('.ring .fl').forEach(el=>{ el.style.strokeDashoffset=el.getAttribute('data-off'); });
    document.querySelectorAll('.lbar i[data-w]').forEach(el=>{ el.style.width=el.getAttribute('data-w')+'%'; });
    const nums=Array.prototype.slice.call(document.querySelectorAll('.ring .rv b'));
    if(reduced){ nums.forEach(b=>{ b.textContent=b.getAttribute('data-n'); }); return; }
    const t0=performance.now(), D=1100;
    (function step(){
      if(g!==GEN) return;
      const k=Math.min(1,(performance.now()-t0)/D), e=1-Math.pow(1-k,3);
      nums.forEach(b=>{ b.textContent=Math.round(+b.getAttribute('data-n')*e); });
      if(k<1) requestAnimationFrame(step);
    })();
  }));
  on('bAgain',()=>{ completeSent=false; newSession();
    track('game_start',{player_count:S.names.length, rounds:S.R}); handoff(0); });
  on('bChange',()=>{ completeSent=false; S=null; title(); });
  const text=shareText(hive,v,sup,today);
  const wa=document.getElementById('bWa');
  wa.href=waLink(text);
  wa.addEventListener('click',()=>track('share',{via:'whatsapp'}));
  on('bShare',()=>{ track('share',{via:'system'});
    try{ navigator.share({title:'Herd Mind — '+S.names.length+' players', text:text}).catch(()=>{}); }catch(e){} });
  on('bCopy',()=>{
    let done=false;
    try{
      if(navigator.clipboard&&navigator.clipboard.writeText){
        navigator.clipboard.writeText(text).then(()=>toast('Copied!'),()=>showShareBox(text));
        done=true;
      }
    }catch(e){}
    if(!done) showShareBox(text);   // clipboard is unavailable on file:// — show it to copy by hand
  });
}

/* ============================ share ============================
   The verdict, the hive figure, one emoji row per player across the rounds (🟩 in the majority,
   ⬛ out of it, 🐑 lone), and the four superlatives. Sharing is the players' own explicit act,
   so unlike analytics it may carry names and figures. */
const WA_ICON='<svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2zm0 18.2a8.2 8.2 0 0 1-4.2-1.2l-.3-.2-3 .8.8-2.9-.2-.3A8.2 8.2 0 1 1 12 20.2zm4.5-6.1c-.2-.1-1.5-.7-1.7-.8s-.4-.1-.6.1-.6.8-.8 1c-.1.2-.3.2-.5.1a6.7 6.7 0 0 1-3.3-2.9c-.3-.4.3-.4.8-1.4.1-.2 0-.3 0-.4l-.8-1.8c-.2-.5-.4-.4-.6-.4h-.5a1 1 0 0 0-.7.3 3 3 0 0 0-.9 2.2 5.2 5.2 0 0 0 1.1 2.7 11.8 11.8 0 0 0 4.5 4c1.7.7 2.3.8 3.1.6a2.7 2.7 0 0 0 1.8-1.2 2.2 2.2 0 0 0 .1-1.2c0-.2-.2-.2-.5-.4z"/></svg>';
function waLink(text){ return 'https://wa.me/?text='+encodeURIComponent(text); }
function shareText(hive,v,sup,today){
  const cell={w:'🟩', o:'⬛', l:'🐑'};
  const lines=[
    '*Herd Mind* · '+S.names.length+' players · '+S.R+' rounds',
    '_'+v[0]+'_ — '+v[1],
    '',
    '🧠 Hive mind: *'+hive+'%*',
    ''
  ];
  S.names.forEach((nm,i)=>{
    lines.push(S.pattern[i].map(c=>cell[c]||'⬛').join('')+' '+nm+' — '+S.pts[i]+' pt'+(S.pts[i]===1?'':'s')
      +(S.sheep[i]?' · 🐑×'+S.sheep[i]:''));
  });
  lines.push('');
  sup.forEach(s2=>{ lines.push(s2.gi+' '+s2.lb+': '+s2.txt); });
  lines.push('', today+' · kreeda.games/herd');
  return lines.join('\n');
}
function showShareBox(text){
  const slot=document.getElementById('shareSlot');
  if(!slot) return;
  slot.innerHTML='<textarea class="sharebox" rows="6" readonly aria-label="Result text to copy manually"></textarea>';
  const ta=slot.querySelector('textarea'); ta.value=text;
  ta.focus(); try{ ta.select(); }catch(e){}
  toast('Copy it from the box below');
}

/* ============================ boot self-test ============================
   Cheap invariants that would otherwise only fail in a player's hands. Runs once, logs only. */
(function audit(){
  try{
    if(PROMPTS.length<55) console.warn('herd: prompt bank has only '+PROMPTS.length+' prompts');
    if(new Set(PROMPTS.map(p=>p.toLowerCase())).size!==PROMPTS.length)
      console.warn('herd: duplicate prompts in the bank');
    PROMPTS.forEach((p,i)=>{
      if(typeof p!=='string'||!p.trim()||p.length>64) console.warn('herd: prompt '+i+' has a bad shape');
    });
    if(Math.max.apply(null,ROUND_OPTS)>PROMPTS.length)
      console.warn('herd: a rounds option exceeds the prompt bank');
    if(normKey('  The   Beach! ')!=='beach') console.warn('herd: normKey failed the article test');
    if(normKey('A  coffee')!=='coffee') console.warn('herd: normKey failed the collapse test');
    if(ROUND_OPTS.indexOf(roundsPick)<0) console.warn('herd: default rounds not an option');
  }catch(e){}
})();

title();
</script>
