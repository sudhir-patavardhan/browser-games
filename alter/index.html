/* ============================ tokens ============================
   Backstage velvet: the dark of a small theatre just before the lights come up. This game is a
   round of amateur dramatics — everyone plays somebody — so the ground is a curtain-dark plum,
   the accent is spotlight gold, and each player keeps one fixed hue from an 8-colour cast list
   (set in JS as PC/PINK, threaded inline) so ownership never needs a label twice. One committed
   dark look: the hand-off ritual reads as "private", and a theme flip mid-show would be a
   dropped prop. */

  --ground:#181119;  --ground-2:#241729;
  --panel:#251b28;   --panel-2:#2f2233;  --rule:rgba(240,220,250,.15);

<script>
'use strict';
/* ============================================================================================
   IMPRESSIONS — answer as your friend, and let them grade the impression. 3–8 players, one
   phone. The casting is a rotation: player i plays player i+1, so everyone impersonates exactly
   once and is impersonated exactly once. Each pair gets three questions: the impersonator taps
   answers AS the target, then the target answers the same three truthfully, and the pair's
   mini-reveal puts impression and reality side by side. After the full circle: one reveal page
   led by the casting-circle graphic — every arrow labelled with how close it got.

   Privacy is a design constraint, not a feature flag: all answers live in one in-memory session
   object (S) and NOTHING else. localStorage holds only names, a sound preference and a play
   counter (all "alter."-prefixed). Analytics gets counts, never content. A refresh mid-game
   loses the round by design — cheaper than answers ever touching disk.
   ============================================================================================ */

function track(name,p){ try{ if(window.bgTrack) window.bgTrack(name,p); }catch(e){} }
const LS={ get:k=>{ try{ return localStorage.getItem(k)||''; }catch(e){ return ''; } },
           set:(k,v)=>{ try{ localStorage.setItem(k,v); }catch(e){} } };

/* Seeded PRNG so a session's draw is deterministic given its seed while each new session still
   gets a fresh one. */
function mulberry32(a){ return function(){ a=(a+0x6D2B79F5)|0; let t=Math.imul(a^(a>>>15),1|a);
  t=(t+Math.imul(t^(t>>>7),61|t))^t; return ((t^(t>>>14))>>>0)/4294967296; }; }

function esc(s){ return String(s).replace(/[&<>"']/g,
  c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

/* ============================ state ============================
   S is the whole show and lives only in memory. imp/tru are option indexes, -1 = unanswered.
   Pair k = (impersonator k, target (k+1)%N). Every transition goes through show(), which wipes
   the DOM — a previous player's taps cannot survive into a hand-off even for one frame. */
let S=null;
function newSession(){
  const N=names.length;
  const rnd=mulberry32((Date.now() ^ (Math.random()*0xffffffff))>>>0);
  const deck=BANK.slice();
  for(let i=deck.length-1;i>0;i--){ const j=Math.floor(rnd()*(i+1)); const t=deck[i]; deck[i]=deck[j]; deck[j]=t; }
  S={ names:names.slice(), N:N,
      qs:[], imp:[], tru:[] };
  for(let k=0;k<N;k++){
    S.qs.push(deck.slice(k*QPP,(k+1)*QPP));
    S.imp.push([-1,-1,-1]); S.tru.push([-1,-1,-1]);
  }
}
const tgt=k=>(k+1)%S.N;
function pairScore(k){ let n=0; for(let i=0;i<QPP;i++) if(S.imp[k][i]===S.tru[k][i]) n++; return n; }
function allScores(){ const a=[]; for(let k=0;k<S.N;k++) a.push(pairScore(k)); return a; }

let names=['','',''];
try{ const n=JSON.parse(LS.get('alter.names')||'[]');
  if(Array.isArray(n)&&n.length>=3&&n.length<=8) names=n.map(x=>String(x).slice(0,12)); }catch(e){}

/* ============================ rendering core ============================
   One container, innerHTML replaced wholesale per screen. GEN is a render generation counter:
   every handler captures the generation it was bound in and no-ops if a render has happened
   since — the double-tap guard. A fast second tap on any advancing button finds either a
   disabled button or a stale generation; it can never advance the state machine twice. */
const app=document.getElementById('app');
let GEN=0;
function show(html){
  GEN++; app.innerHTML=html;
  try{ window.scrollTo({top:0,left:0,behavior:'instant'}); }catch(e){ window.scrollTo(0,0); }
}
function on(id,fn){
  const g=GEN, el=document.getElementById(id);
  if(!el) return;
  el.addEventListener('click',function(e){
    if(g!==GEN || el.disabled) return;
    el.disabled=true;
    try{ fn(e); }finally{ if(g===GEN) el.disabled=false; }
  });
}

/* ============================ sound ============================
   Two synthesized cues, no audio files: a soft tick on every pick and a swish when a pass
   leaves the page. Context created on first tap (a user gesture, which iOS requires). */
const SND={ ctx:null, noise:null, on:LS.get('alter.sound')!=='0' };
function audio(){
  if(!SND.on) return null;
  if(!SND.ctx){ try{ SND.ctx=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ return null; } }
  if(SND.ctx.state==='suspended'){ try{ SND.ctx.resume(); }catch(e){} }
  return SND.ctx;
}
function tick(){
  const ac=audio(); if(!ac) return;
  try{
    const t=ac.currentTime, o=ac.createOscillator(), g=ac.createGain();
    o.type='sine'; o.frequency.setValueAtTime(880,t); o.frequency.exponentialRampToValueAtTime(1320,t+0.03);
    g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(0.09,t+0.008);
    g.gain.exponentialRampToValueAtTime(0.0001,t+0.07);
    o.connect(g).connect(ac.destination); o.start(t); o.stop(t+0.08);
  }catch(e){}
}
function swish(){
  const ac=audio(); if(!ac) return;
  try{
    const dur=0.3, t=ac.currentTime;
    if(!SND.noise){ const n=Math.floor(ac.sampleRate*0.5), b=ac.createBuffer(1,n,ac.sampleRate), d=b.getChannelData(0);
      for(let i=0;i<n;i++) d[i]=Math.random()*2-1; SND.noise=b; }
    const src=ac.createBufferSource(); src.buffer=SND.noise;
    const f=ac.createBiquadFilter(); f.type='bandpass'; f.Q.value=1.4;
    f.frequency.setValueAtTime(500,t); f.frequency.exponentialRampToValueAtTime(3400,t+dur*0.45);
    f.frequency.exponentialRampToValueAtTime(700,t+dur);
    const g=ac.createGain(); g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(0.32,t+0.06);
    g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    src.connect(f).connect(g).connect(ac.destination); src.start(t); src.stop(t+dur+0.02);
  }catch(e){}
}
function setSound(on){
  SND.on=on; LS.set('alter.sound',on?'1':'0');
  const b=document.getElementById('bSound');
  if(b){ b.textContent=on?'🔊':'🔇'; b.setAttribute('aria-pressed',String(on)); }
  if(on) tick();
}

/* ============================ the casting circle SVG ============================
   The one graphic drawn twice: plain on the pre-screen (who plays whom), scored on the finale
   (every arrow coloured and labelled by its accuracy). Dots sit on a ring; arrow i curves from
   dot i to dot i+1 with its control point pulled toward the centre, so adjacent arrows never
   cross and the middle stays clear. Sized to stay legible at 360px for N up to 8. */
function castSVG(scores){
  const N=S.N, CX=180, CY=170, R=108, TAU=Math.PI*2;
  const ang=i=>-Math.PI/2 + (i%N)*TAU/N;
  const px=(a,r)=>CX+r*Math.cos(a), py=(a,r)=>CY+r*Math.sin(a);
  let defs='', body='';
  /* arrowheads: one marker per accuracy colour (plus a dim one for the pre-screen) */
  const cols=scores?SCOL.slice():['rgba(171,156,174,.7)'];
  cols.forEach((c,i)=>{ defs+='<marker id="ah'+i+'" viewBox="0 0 10 10" refX="8" refY="5" '
    +'markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">'
    +'<path d="M0 0 L10 5 L0 10 z" fill="'+c+'"/></marker>'; });
  /* arrows first, under the dots */
  for(let k=0;k<N;k++){
    const a1=ang(k), a2=ang(k)+TAU/N, gap=27/R;
    const s1=a1+gap, s2=a2-gap, mid=(a1+a2)/2;
    const rc=R*Math.cos(Math.PI/N)*0.88;
    const x0=px(s1,R), y0=py(s1,R), x1=px(s2,R), y1=py(s2,R);
    const cx=px(mid,rc), cy=py(mid,rc);
    const col=scores?SCOL[scores[k]]:cols[0];
    const mk=scores?('ah'+scores[k]):'ah0';
    body+='<path class="arr" style="animation-delay:'+(300+k*140)+'ms" d="M'+x0.toFixed(1)+' '+y0.toFixed(1)
      +' Q'+cx.toFixed(1)+' '+cy.toFixed(1)+' '+x1.toFixed(1)+' '+y1.toFixed(1)
      +'" fill="none" stroke="'+col+'" stroke-width="'+(scores?3.5:2.5)+'" stroke-linecap="round" marker-end="url(#'+mk+')"/>';
    if(scores){
      /* label at the quadratic's midpoint: 0.25·P0 + 0.5·C + 0.25·P1 */
      const lx=0.25*x0+0.5*cx+0.25*x1, ly=0.25*y0+0.5*cy+0.25*y1;
      const pct=Math.round(scores[k]*100/QPP);
      body+='<text class="pctl" style="animation-delay:'+(420+k*140)+'ms;paint-order:stroke" x="'+lx.toFixed(1)+'" y="'+(ly+4.5).toFixed(1)
        +'" text-anchor="middle" font-size="13" font-weight="900" fill="'+SCOL[scores[k]]
        +'" stroke="#181119" stroke-width="4" stroke-linejoin="round">'+pct+'%</text>';
    }
  }
  /* dots + short name labels; anchors follow the angle so labels always point outward */
  for(let i=0;i<N;i++){
    const a=ang(i), x=px(a,R), y=py(a,R);
    const c=Math.cos(a), s=Math.sin(a);
    const nm=S.names[i], nmS=nm.length>8?nm.slice(0,7)+'…':nm;
    const lx=px(a,R+26), lyB=py(a,R+26)+(s>0.5?12:(s<-0.5?-6:4));
    const anchor=c>0.35?'start':(c<-0.35?'end':'middle');
    body+='<circle cx="'+x.toFixed(1)+'" cy="'+y.toFixed(1)+'" r="16" fill="'+PC[i]+'" stroke="#181119" stroke-width="2.5"/>'
      +'<text x="'+x.toFixed(1)+'" y="'+(y+5).toFixed(1)+'" text-anchor="middle" font-size="15" font-weight="900" fill="#1c1320">'
      +esc(nm.charAt(0).toUpperCase())+'</text>'
      +'<text x="'+lx.toFixed(1)+'" y="'+lyB.toFixed(1)+'" text-anchor="'+anchor+'" font-size="11.5" font-weight="800" fill="'+PINK[i]+'">'
      +esc(nmS)+'</text>';
  }
  return '<svg class="castsvg" viewBox="0 0 360 340" role="img" aria-label="The casting circle: '
    +'each arrow points from an actor to the player they impersonate'
    +(scores?', labelled with the impression’s accuracy':'')+'"><defs>'+defs+'</defs>'+body+'</svg>';
}

/* ============================ hand-off gates ============================
   Rendered through show(), which has already destroyed the previous screen — by the time a gate
   paints there is nothing underneath to peek at, however fast the tap. After a pair's reveal the
   target is holding the phone, and the next pair's impersonator IS that target — so gates for
   k>0 say "stay put, new role" instead of asking them to pass the phone to themselves. */
function impGate(k){
  const p=k, nm=S.names[p], first=k===0;
  show(
   '<div class="handoff">'
   +'<div class="pass">'+(first?'Pass the phone to':'The phone stays with')+'</div>'
   +'<h2 style="color:'+PINK[p]+'">'+esc(nm)+'</h2>'
   +'<p class="sub">'+(first?'First up in tonight’s casting.':'New role for you.')
   +'<br>Three questions, answered as <b style="color:'+PINK[tgt(k)]+'">'+esc(S.names[tgt(k)])+'</b>.</p>'
   +'<button class="btn primary" type="button" id="bReady">I’m '+esc(nm)+' — show me</button>'
   +'<p class="peek">👀 tilt the phone away while you answer</p>'
   +'</div>'
  );
  on('bReady',()=>impSheet(k));
}
function tgtGate(k){
  const p=tgt(k), nm=S.names[p];
  show(
   '<div class="handoff">'
   +'<div class="pass">Pass the phone to</div>'
   +'<h2 style="color:'+PINK[p]+'">'+esc(nm)+'</h2>'
   +'<p class="sub">'+esc(S.names[k])+' has locked in an impression of you.<br>Now the truth — same three questions.</p>'
   +'<button class="btn primary" type="button" id="bReady">I’m '+esc(nm)+' — show me</button>'
   +'<p class="peek">👀 the impression stays hidden until you’ve answered</p>'
   +'</div>'
  );
  on('bReady',()=>tgtSheet(k));
}

/* ============================ the two passes ============================ */
function qBlock(k,qi,ans){
  const q=S.qs[k][qi];
  return '<div class="qcard'+(ans[qi]>=0?' done':'')+'" id="blk'+qi+'">'
   +'<div class="qhead"><span class="qn">'+(qi+1)+'</span><p class="qtext">'+esc(q.q)+'</p></div>'
   +q.o.map((opt,i)=>'<button class="opt" type="button" data-qi="'+qi+'" data-i="'+i+'" '
     +'aria-pressed="'+(ans[qi]===i)+'">'+esc(opt)+'</button>').join('')
   +'</div>';
}
function sheet(k,mode){
  const isImp=mode==='imp', p=isImp?k:tgt(k), t=tgt(k);
  const ans=isImp?S.imp[k]:S.tru[k];
  const vars='--pc:'+PC[t]+';--pc-soft:'+soft(t,0.16)+';--pc-ink:'+PINK[t];
  show(
   header(true)
   +'<div style="'+vars+'">'
   +(isImp
     ? '<div class="turn"><span class="eye">👀</span><span><b style="color:'+PINK[t]+'">'+esc(S.names[t])
       +'</b>, no peeking at the taps — and no coaching. The truth is still yours to tell.</span></div>'
       +'<div class="role"><span class="tag">You are now</span><h2>'+esc(S.names[t])+' 🎭</h2>'
       +'<p>Answer as '+esc(S.names[t])+' would — instincts, habits, tells.</p>'
       +'<p class="nudge">Feel free to answer out loud in their voice first. The room deserves it.</p></div>'
     : '<div class="turn"><span class="eye">🤫</span><span>The impression is locked and hidden. '
       +'<b style="color:'+PINK[t]+'">'+esc(S.names[t])+'</b>, answer as yourself.</span></div>'
       +'<div class="role"><span class="tag">The truth pass</span><h2>'+esc(S.names[t])+' 🙋</h2>'
       +'<p>Same three questions. Set the record straight — honestly.</p></div>')
   +'<div id="sheet">'
   +[0,1,2].map(qi=>qBlock(k,qi,ans)).join('')
   +'</div>'
   +'<div class="lockbar"><button class="btn" type="button" id="bLock"></button></div>'
   +'</div>'
  );
  bindHome();
  const g=GEN, lockBtn=document.getElementById('bLock');
  const refresh=()=>{
    const n=ans.filter(a=>a>=0).length, all=n===QPP;
    lockBtn.className='btn'+(all?' primary':'');
    lockBtn.textContent=all
      ? (isImp?'Lock the impression · pass to '+S.names[t]:'Lock in · reveal this pair')
      : (QPP-n)+' of 3 still to answer';
  };
  refresh();
  document.getElementById('sheet').addEventListener('click',e=>{
    if(g!==GEN) return;
    const b=e.target.closest('.opt[data-qi]');
    if(!b) return;
    const qi=+b.getAttribute('data-qi'), i=+b.getAttribute('data-i');
    ans[qi]=i;
    const blk=document.getElementById('blk'+qi);
    blk.querySelectorAll('.opt').forEach(o=>o.setAttribute('aria-pressed',
      String(+o.getAttribute('data-i')===i)));
    blk.classList.add('done');
    tick(); refresh();
  });
  on('bLock',()=>{
    const first=ans.indexOf(-1);
    if(first>=0){
      const blk=document.getElementById('blk'+first);
      blk.scrollIntoView({behavior:'smooth',block:'start'});
      blk.classList.remove('flash'); void blk.offsetWidth; blk.classList.add('flash');
      toast((QPP-ans.filter(a=>a>=0).length)+' still unanswered');
      return;
    }
    swish();
    if(isImp) tgtGate(k); else pairReveal(k);
  });
}
const impSheet=k=>sheet(k,'imp');
const tgtSheet=k=>sheet(k,'tru');

/* ============================ ring helper ============================ */
function ring(pct,color,label,big){
  const r=big?70:44, s=2*r+12, c=s/2, C=2*Math.PI*r, v=Math.round(pct);
  const stroke=big?'url(#ringGrad)':color;
  return '<div class="ring'+(big?' big':'')+'"><svg viewBox="0 0 '+s+' '+s+'" aria-hidden="true">'
   +'<circle class="tr" cx="'+c+'" cy="'+c+'" r="'+r+'"/>'
   +'<circle class="fl" cx="'+c+'" cy="'+c+'" r="'+r+'" style="stroke:'+stroke
   +';stroke-dasharray:'+C.toFixed(1)+';stroke-dashoffset:'+C.toFixed(1)+'" '
   +'data-off="'+(C*(1-v/100)).toFixed(1)+'"/></svg>'
   +'<div class="rv" aria-hidden="true" style="color:'+(big?'var(--spot)':color)+'"><b data-n="'+v+'">0</b><i>%</i></div>'
   +'<div class="rl" aria-hidden="true">'+label+'</div>'
   +'<span class="sr">'+label+': '+v+'%</span></div>';
}
/* rings fill and numbers count up after first paint; reduced motion lands the final state at
   once. Clocked off performance.now() so a hidden tab still lands on the final figure. */
function runRings(){
  const g=GEN;
  const reduced=!!(window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches);
  requestAnimationFrame(()=>requestAnimationFrame(()=>{
    if(g!==GEN) return;
    document.querySelectorAll('.ring .fl').forEach(el=>{ el.style.strokeDashoffset=el.getAttribute('data-off'); });
    const nums=Array.prototype.slice.call(document.querySelectorAll('.ring .rv b'));
    if(reduced){ nums.forEach(b=>{ b.textContent=b.getAttribute('data-n'); }); return; }
    const t0=performance.now(), D=1100;
    (function step(){
      if(g!==GEN) return;
      const kk=Math.min(1,(performance.now()-t0)/D), e=1-Math.pow(1-kk,3);
      nums.forEach(b=>{ b.textContent=Math.round(+b.getAttribute('data-n')*e); });
      if(kk<1) requestAnimationFrame(step);
    })();
  }));
}

/* impression-vs-reality rows, shared by the pair reveal and the finale recap */
function vsRows(k,delayBase){
  const it=k, tt=tgt(k);
  return [0,1,2].map(qi=>{
    const q=S.qs[k][qi], hit=S.imp[k][qi]===S.tru[k][qi];
    return '<div class="vrow rise" style="animation-delay:'+(delayBase+qi*140)+'ms">'
     +'<p class="vq">'+esc(q.q)+'</p>'
     +'<div class="vs">'
     +'<div class="vc" style="background:'+soft(it,0.13)+'"><div class="who" style="color:'+PINK[it]+'">🎭 '
       +esc(S.names[it])+'’s impression</div><div class="said">'+esc(q.o[S.imp[k][qi]])+'</div></div>'
     +'<span class="m '+(hit?'hit':'miss')+'" aria-label="'+(hit?'match':'different')+'">'+(hit?'✓':'✗')+'</span>'
     +'<div class="vc" style="background:'+soft(tt,0.13)+'"><div class="who" style="color:'+PINK[tt]+'">🙋 '
       +esc(S.names[tt])+' really</div><div class="said">'+esc(q.o[S.tru[k][qi]])+'</div></div>'
     +'</div></div>';
  }).join('');
}

/* ============================ pair mini-reveal ============================
   Held by the target, meant for the room. Guarded: unreachable unless both passes are done. */
const PAIR_LINES=[
  'A bold work of fiction. The original stands alone.',
  'Caught a glimpse — invented the rest.',
  'A strong impression. One tell gave it away.',
  'Uncanny. Are you two the same person?'
];
function pairReveal(k){
  if(S.imp[k].indexOf(-1)>=0||S.tru[k].indexOf(-1)>=0){ impGate(k); return; }
  const sc=pairScore(k), pct=sc*100/QPP, tt=tgt(k), last=k===S.N-1;
  show(
   header(true)
   +'<div class="results">'
   +'<h2>Impression vs reality</h2>'
   +'<p class="roomline">📣 '+esc(S.names[tt])+' holds the phone — but this one’s for the room.</p>'
   +'<div class="card info">'
   +ring(pct,PC[tt],esc(S.names[k])+' as '+esc(S.names[tt]))
   +'<div class="verdict rise" style="animation-delay:500ms"><b>'+sc+' of 3</b><span>'+PAIR_LINES[sc]+'</span></div>'
   +'</div>'
   +'<div class="card" style="margin-top:12px; padding:14px 14px 8px">'+vsRows(k,250)+'</div>'
   +'<button class="btn primary" type="button" id="bNext">'
   +(last?'The final reveal 🎭':'Next pair → '+esc(S.names[k+1])+' plays '+esc(S.names[tgt(k+1)]))
   +'</button>'
   +'</div>'
  );
  bindHome();
  runRings();
  on('bNext',()=>{ swish(); if(last) finale(); else impGate(k+1); });
}

/* ============================ finale ============================ */
function verdictFor(pct){
  if(pct>=85) return ['Mind readers, the lot of you','This circle could finish each other’s sentences.'];
  if(pct>=65) return ['The circle sees itself clearly','Most impressions landed. You’ve all been paying attention.'];
  if(pct>=45) return ['Half mirror, half mystery','Some uncanny hits, some beautiful fiction.'];
  if(pct>=25) return ['A cast of originals','Hard to imitate, every one of you. Take the compliment.'];
  return ['Gloriously unknowable','Nobody landed anybody — which is an hour of conversation, minimum.'];
}
/* superlatives: three awards spread across the room where ties allow */
function superlatives(sc){
  let mx=-1, mn=4;
  sc.forEach(s=>{ if(s>mx)mx=s; if(s<mn)mn=s; });
  const b1=sc.indexOf(mx);                                        // best impression: the actor
  let k2=b1;                                                      // most imitable: a max pair's target
  for(let k=0;k<sc.length;k++) if(sc[k]===mx&&k!==b1){ k2=k; break; }
  let k3=-1;                                                      // most unpredictable: a min pair's target
  for(let k=0;k<sc.length;k++) if(sc[k]===mn&&k!==k2){ k3=k; break; }
  if(k3<0) k3=sc.indexOf(mn);
  return {mx:mx,mn:mn,best:b1,imitable:k2,unpred:k3};
}
let completeSent=false;
function finale(){
  if(!S){ title(); return; }
  for(let k=0;k<S.N;k++) if(S.imp[k].indexOf(-1)>=0||S.tru[k].indexOf(-1)>=0){ impGate(k); return; }
  const sc=allScores(), total=sc.reduce((a,b)=>a+b,0), pct=Math.round(total*100/(QPP*S.N));
  const v=verdictFor(pct), sup=superlatives(sc);
  const today=new Date().toLocaleDateString(undefined,{year:'numeric',month:'short',day:'numeric'});

  if(!completeSent){
    completeSent=true;
    track('game_complete',{player_count:S.N, accuracy:pct, best:sup.mx, worst:sup.mn});
    const plays=(+LS.get('alter.plays')||0)+1; LS.set('alter.plays',String(plays));
  }

  const nameB=i=>'<b style="color:'+PINK[i]+'">'+esc(S.names[i])+'</b>';
  const dl=n=>'style="animation-delay:'+n+'ms"';
  show(
   header(false)
   +'<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>'
   +'<linearGradient id="ringGrad" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffd166"/><stop offset="1" stop-color="#ff6b9d"/></linearGradient>'
   +'</defs></svg>'
   +'<div class="results">'
   +'<h2>The final reveal</h2>'
   +'<p class="roomline">'+S.N+' friends · '+S.N+' impressions · one phone</p>'
   +'<div class="card info">'
   +ring(pct,'',"the circle’s impression accuracy",true)
   +'<div class="verdict rise" '+dl(600)+'><b>'+v[0]+'</b><span>'+v[1]+'</span></div>'
   +'</div>'
   +'<div class="card circlecard rise" style="margin-top:12px;animation-delay:200ms">'
   +'<h3>The casting circle</h3>'
   +'<p class="sub">actor → role · the number is how close they got</p>'
   +castSVG(sc)
   +'</div>'
   +'<div class="card glance rise" '+dl(700)+'>'
   +'<div class="gl"><span class="gi">🎭</span><span><span class="lb">Best impression</span>'
     +nameB(sup.best)+' as '+nameB(tgt(sup.best))+' — '+sc[sup.best]+'/3. Take a bow.</span></div>'
   +'<div class="gl"><span class="gi">🪞</span><span><span class="lb">Most imitable</span>'
     +nameB(tgt(sup.imitable))+' — the circle knows them by heart.</span></div>'
   +'<div class="gl"><span class="gi">🃏</span><span><span class="lb">Most unpredictable</span>'
     +nameB(tgt(sup.unpred))+' — impossible to imitate. An original.</span></div>'
   +'</div>'
   +'<div class="card scorecard rise" '+dl(800)+'>'
   +sc.map((s,k)=>'<div class="srow"><span class="sl">'
     +'<span style="color:'+PINK[k]+'">'+esc(S.names[k])+'</span><span class="ar">→</span>'
     +'<span style="color:'+PINK[tgt(k)]+'">'+esc(S.names[tgt(k)])+'</span></span>'
     +'<span class="sq" aria-label="'+s+' of 3 matched">'
     +[0,1,2].map(qi=>'<i class="'+(S.imp[k][qi]===S.tru[k][qi]?'on':'')
       +'" style="animation-delay:'+(900+k*90+qi*60)+'ms"></i>').join('')
     +'</span><span class="sn" style="color:'+SCOL[s]+'">'+s+'/3</span></div>').join('')
   +'</div>'
   +'<div class="sect"><h3>Every question</h3><span>impression vs reality, pair by pair</span></div>'
   +sc.map((s,k)=>'<div class="paircard rise" style="animation-delay:'+(1000+k*90)+'ms">'
     +'<div class="ph"><span class="t">🎭 '+nameB(k)+' as '+nameB(tgt(k))+'</span>'
     +'<span class="s" style="color:'+SCOL[s]+'">'+s+'/3</span></div>'
     +vsRows(k,1000+k*90)
     +'</div>').join('')
   +'<p class="datefoot">'+esc(today)+' · kreeda.games/alter</p>'
   +'<button class="btn primary" type="button" id="bAgain">Play again</button>'
   +'<a class="btn wa" id="bWa" href="#" target="_blank" rel="noopener">'+WA_ICON+'Share on WhatsApp</a>'
   +'<p class="sharehint">Send it to the group chat — everyone keeps the night’s scorecard.</p>'
   +'<div class="btnrow"><button class="btn" type="button" id="bCopy">Copy result</button>'
   +(navigator.share?'<button class="btn" type="button" id="bShare">Share…</button>':'')+'</div>'
   +'<button class="btn ghost" type="button" id="bChange">Change players</button>'
   +'<div id="shareSlot"></div>'
   +'</div>'
   +'<footer class="foot">Impressions aren’t exams — the misses are the stories.<br>'
   +'<a href="../">Kreeda</a></footer>'
  );
  runRings();
  on('bAgain',()=>{ completeSent=false; newSession();
    track('game_start',{player_count:S.N}); casting(); });
  on('bChange',()=>{ completeSent=false; S=null; title(); });
  const text=shareText(sc,pct,v,sup,today);
  const wa=document.getElementById('bWa');
  wa.href=waLink(text);
  wa.addEventListener('click',()=>track('share',{via:'whatsapp'}));
  on('bShare',()=>{ track('share',{via:'system'});
    try{ navigator.share({title:'Impressions — cast of '+S.N, text:text}).catch(()=>{}); }catch(e){} });
  on('bCopy',()=>{
    let done=false;
    try{
      if(navigator.clipboard&&navigator.clipboard.writeText){
        navigator.clipboard.writeText(text).then(()=>toast('Copied!'),()=>showShareBox(text));
        done=true;
      }
    }catch(e){}
    if(!done) showShareBox(text);   // clipboard is unavailable on file:// — show it to copy by hand
  });
}

/* ============================ share ============================
   The night in words, for WhatsApp (its *bold* and _italic_ marks) and the clipboard. Sharing
   is the players' own explicit act, so unlike analytics it may carry names and scores. */
const WA_ICON='<svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2zm0 18.2a8.2 8.2 0 0 1-4.2-1.2l-.3-.2-3 .8.8-2.9-.2-.3A8.2 8.2 0 1 1 12 20.2zm4.5-6.1c-.2-.1-1.5-.7-1.7-.8s-.4-.1-.6.1-.6.8-.8 1c-.1.2-.3.2-.5.1a6.7 6.7 0 0 1-3.3-2.9c-.3-.4.3-.4.8-1.4.1-.2 0-.3 0-.4l-.8-1.8c-.2-.5-.4-.4-.6-.4h-.5a1 1 0 0 0-.7.3 3 3 0 0 0-.9 2.2 5.2 5.2 0 0 0 1.1 2.7 11.8 11.8 0 0 0 4.5 4c1.7.7 2.3.8 3.1.6a2.7 2.7 0 0 0 1.8-1.2 2.2 2.2 0 0 0 .1-1.2c0-.2-.2-.2-.5-.4z"/></svg>';
function waLink(text){ return 'https://wa.me/?text='+encodeURIComponent(text); }
function shareText(sc,pct,v,sup,today){
  const strip=s=>'🟩'.repeat(s)+'⬛'.repeat(QPP-s);
  const lines=[
    '*Impressions* · cast of '+S.N+' · one phone',
    '_'+v[0]+'_ — '+v[1],
    '',
    '🎯 The circle’s impression accuracy: *'+pct+'%*',
    ''
  ];
  sc.forEach((s,k)=>lines.push('🎭 '+S.names[k]+' → '+S.names[tgt(k)]+': '+s+'/3 '+strip(s)));
  lines.push('',
    '🎭 Best impression: '+S.names[sup.best]+' as '+S.names[tgt(sup.best)]+' ('+sc[sup.best]+'/3)',
    '🪞 Most imitable: '+S.names[tgt(sup.imitable)],
    '🃏 Most unpredictable: '+S.names[tgt(sup.unpred)]+' — an original');
  lines.push('', today+' · kreeda.games/alter');
  return lines.join('\n');
}
function showShareBox(text){
  const slot=document.getElementById('shareSlot');
  if(!slot) return;
  slot.innerHTML='<textarea class="sharebox" rows="6" readonly aria-label="Result text to copy manually"></textarea>';
  const ta=slot.querySelector('textarea'); ta.value=text;
  ta.focus(); try{ ta.select(); }catch(e){}
  toast('Copy it from the box below');
}

/* ============================ boot self-test ============================
   Cheap invariants that would otherwise only fail in a player's hands. Runs once, warns only. */
(function audit(){
  try{
    if(BANK.length<8*QPP) console.warn('alter: bank has only '+BANK.length+' questions; 8 players need '+(8*QPP));
    BANK.forEach((x,i)=>{
      if(!(x.o.length>=2&&x.o.length<=4)) console.warn('alter: question '+i+' has '+x.o.length+' options');
      x.o.forEach(o=>{ if(o.length>32) console.warn('alter: question '+i+' option too long: '+o); });
      if(!x.q) console.warn('alter: question '+i+' has no text');
    });
    if(PC.length!==8||PINK.length!==8) console.warn('alter: palette must have 8 hues');
    if(SCOL.length!==QPP+1) console.warn('alter: SCOL must have '+(QPP+1)+' entries');
  }catch(e){}
})();

title();
</script>
