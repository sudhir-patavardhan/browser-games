   A spectrum on a dark bench: indigo night, a cyan emission line, a sodium-amber one. Every colour
   lives here once. Light is the base; the two dark blocks below only REDEFINE these same names, so
   no rule downstream ever needs to know which theme it is painting in. */
:root{
  --deep:#e9ecf7;   --deep-2:#dfe4f4;   --wash:#f6f8fe;
  --line-hi:#1d4ed8; --line-lo:#0e7490;
  --ink:#111634;    --ink-dim:#4a5170;  --rule:rgba(30,40,90,.32);
  --panel:#ffffff;  --panel-2:#eef1fa;  --shade:rgba(12,16,40,.55);

  --spark:#0b4fd6;  --glow:#7a3ecf;
  --ok:#166534;     --no:#a32015;
}
/* The default "system" theme stamps nothing on <html>, so prefers-color-scheme is the only signal.
   Guarded with :not([data-theme="light"]) so an explicit light choice still wins over the media query. */

  :root:not([data-theme="light"]){
    --deep:#161b3d;  --deep-2:#0c0f26;  --wash:#0a0d20;
    --line-hi:#5fd8ff; --line-lo:#ffc46b;
    --ink:#e8ecff;   --ink-dim:#a3abd4; --rule:rgba(190,200,240,.30);
    --panel:#1a2049; --panel-2:#232a5c; --shade:rgba(0,0,0,.68);
    --hdbg:#0c0f26;  --hdink:#e8ecff;   --cellbg:#232a5c;
    --spark:#7fdcff; --glow:#c39bff;
    --ok:#7ee0a0;    --no:#ff9b86;
  }
}
:root[data-theme="dark"]{

  --line-hi:#5fd8ff; --line-lo:#ffc46b;
  --ink:#e8ecff;   --ink-dim:#a3abd4; --rule:rgba(190,200,240,.30);
  --panel:#1a2049; --panel-2:#232a5c; --shade:rgba(0,0,0,.68);
  --hdbg:#0c0f26;  --hdink:#e8ecff;   --cellbg:#232a5c;

<!-- analytics.js first, not last: the game script below calls track('grid_start', ...) synchronously
     during boot. Loaded after that point this tag would still be fetching when the call happens, and
     the event vanishes silently — window.bgTrack undefined, which track() swallows by design. This
     was measured, not guessed: grid_start never once reached the log until the tag moved up. -->
<script src="../analytics.js"></script>
<script>
'use strict';
/* ============================================================================================
   QUANTA — a daily physics grid.  One file, no build, no network, no images.  Opens off a disk.

   The whole game rests on one idea, borrowed from CRICKET_GRID.md §3.1 and worth restating here so
   the next person to edit the data cannot miss it:

     EVERY CRITERION IS A STABLE FACT — a definition, an SI classification, a dimensional formula.
     Never a ranking, never "most" or "largest" or "most important".

   Physics is unusually kind to this rule: whether momentum is a vector, whether the pascal honours
   a person, and what the dimensional formula of magnetic flux is are not going to change. What CAN
   go wrong is a tag that is simply WRONG, and that failure is worse than a missing one: a missing
   tag only rejects a correct answer and says so, while a wrong tag also ACCEPTS an incorrect one and
   the player cannot tell which failure they are looking at. Where a fact could not be confirmed the
   tag was left OFF. See the reveal panel's data note.
   ============================================================================================ */

/* ---- Kreeda daily contract — see /DAILY.md. Copied, not imported: the game stays one file. ---- */
const SLUG='quanta';
function dayKey(d){ d=d||new Date(); const p=n=>String(n).padStart(2,'0');
  return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate()); }
function prevDayKey(k){ const a=k.split('-'), t=new Date(+a[0],+a[1]-1,+a[2]);
  t.setDate(t.getDate()-1); return dayKey(t); }
function daySeed(k){ let h=5381; for(let i=0;i<k.length;i++) h=(h*33 ^ k.charCodeAt(i))|0; return h>>>0; }
function mulberry32(a){ return function(){ a=(a+0x6D2B79F5)|0; let t=Math.imul(a^(a>>>15),1|a);
  t=(t+Math.imul(t^(t>>>7),61|t))^t; return ((t^(t>>>14))>>>0)/4294967296; }; }

const LS={ get:k=>{ try{ return localStorage.getItem(k)||''; }catch(e){ return ''; } },
           set:(k,v)=>{ try{ localStorage.setItem(k,v); }catch(e){} } };

/* a day-stamped value: returns 0 unless the stamp is today */
function loadToday(key){ const s=LS.get(key), i=s.indexOf('|');
  return (i<0 || s.slice(0,i)!==dayKey()) ? 0 : (+s.slice(i+1)||0); }
function saveToday(key,v){ LS.set(key, dayKey()+'|'+Math.round(v)); }

/* consecutive-days counter against one key. Same day = no change; yesterday = +1; older = reset to 1. */
function bumpStreak(key){
  const s=LS.get(key), i=s.indexOf('|'), last=i<0?'':s.slice(0,i), n=i<0?0:(+s.slice(i+1)||0);
  const today=dayKey(), count = last===today ? (n||1) : (last===prevDayKey(today) ? n+1 : 1);
  LS.set(key, today+'|'+count); return count;
}

/* call once when a DAILY run is completed — not on every game over, not in practice mode */
function dailyDone(){
  const today=dayKey(), k='kreeda.daily.'+today;
  const had=LS.get(k).split(',').filter(Boolean);
  if(!had.includes(SLUG)) LS.set(k, had.concat(SLUG).join(','));
  bumpStreak(SLUG+'.streak');
  return bumpStreak('kreeda.streak');            // site-wide, and the number worth showing
}

/* ============================ name normalisation ============================
   RAMAYANA_GRID.md §3.1's architecture decision, unchanged: the runtime normaliser is deliberately
   small and conservative, and ambiguity is absorbed by a hand-curated `alt` list on each quantity.
   Every blanket transformation fires on EVERY name in the roster, so each one is a collision risk;
   every alias fires on exactly one quantity, so it is free. When in doubt, write an alias.

   The Indic folds are kept verbatim from the other Kreeda grids so the pipeline stays one shared,
   audited thing across the repo; on English physics vocabulary they are simply consistent noise
   (work -> vork, charge -> carge) applied identically to input and to canonical names. The
   honorific step is the one omission: no physical quantity is called "Shri Torque". */
const DEV_CONS={ 'क':'k','ख':'k','ग':'g','घ':'g','ङ':'n','च':'c','छ':'c','ज':'j','झ':'j','ञ':'n',
  'ट':'t','ठ':'t','ड':'d','ढ':'d','ण':'n','त':'t','थ':'t','द':'d','ध':'d','न':'n',
  'प':'p','फ':'p','ब':'b','भ':'b','म':'m','य':'y','र':'r','ल':'l','व':'v','ळ':'l',
  'श':'s','ष':'s','स':'s','ह':'h','क़':'k','ख़':'k','ग़':'g','ज़':'j','ड़':'d','ढ़':'d','फ़':'f' };
const DEV_MATRA={ 'ा':'a','ि':'i','ी':'i','ु':'u','ू':'u','ृ':'ri','ॄ':'ri','े':'e','ै':'ai','ो':'o','ौ':'au' };
const DEV_VOWEL={ 'अ':'a','आ':'a','इ':'i','ई':'i','उ':'u','ऊ':'u','ऋ':'ri','ए':'e','ऐ':'ai','ओ':'o','औ':'au' };
function devToAscii(s){
  let out='', pend='';
  const flush=()=>{ out+=pend; pend=''; };
  for(const ch of s){
    if(DEV_CONS[ch]!==undefined){ flush(); out+=DEV_CONS[ch]; pend='a'; }
    else if(DEV_MATRA[ch]!==undefined){ pend=DEV_MATRA[ch]; }
    else if(ch==='्'){ pend=''; }                       // virāma cancels the inherent vowel
    else if(DEV_VOWEL[ch]!==undefined){ flush(); out+=DEV_VOWEL[ch]; }
    else if(ch==='ं'||ch==='ँ'){ flush(); out+='m'; }   // anusvāra / candrabindu
    else if(ch==='ः'){ flush(); out+='h'; }             // visarga
    else { flush(); }                                   // avagraha, daṇḍa, ZWJ, digits, spaces
  }
  flush(); return out;
}
function norm(s){
  if(!s) return '';
  // 1. Devanāgarī → plain ASCII, only if any Devanāgarī is present
  if(/[ऀ-ॿ]/.test(s)) s = devToAscii(s);
  // 2. decompose, then drop every combining mark. One line folds the whole diacritic problem —
  //    Ångström, Ampère and Poincaré all fall out as plain ASCII with no table to maintain.
  s = s.normalize('NFD').replace(/[̀-ͯ]/g, '');
  // 3. case
  s = s.toLowerCase();
  // 4. letters only — drops spaces, hyphens, periods, apostrophes, digits. `p.d.` → `pd`.
  s = s.replace(/[^a-z]/g, '');
  // 5. Anglo long vowels  (speed / spead, ohmmeter / ohmeter handled below)
  s = s.replace(/ee/g, 'i').replace(/oo/g, 'u');
  // 6. w → v
  s = s.replace(/w/g, 'v');
  // 7. x → ks   (flux → fluks)
  s = s.replace(/x/g, 'ks');
  // 8. aspirates and sibilants collapse. Order matters: ksh before sh.
  s = s.replace(/ksh/g, 'ks')
       .replace(/chh?/g, 'c')
       .replace(/sh/g, 's')
       .replace(/kh/g, 'k').replace(/gh/g, 'g').replace(/jh/g, 'j')
       .replace(/th/g, 't').replace(/dh/g, 'd')
       .replace(/ph/g, 'p').replace(/bh/g, 'b');
  // 9. collapse any run of the same letter (mass / mas, permittivity / permitivity)
  s = s.replace(/(.)\1+/g, '$1');
  // 10. drop a single trailing 'a' — inertia / inerti, alpha / alp. Applied to both sides, so it is
  //     a fold and not a loss.
  s = s.replace(/a$/, '');
  return s;
}

/* A LIGHTER fold, for the typeahead only. norm() is built for resolution and is deliberately lossy:
   it drops a trailing 'a' and collapses doubled letters, so a two-character prefix can disappear.
   Prefix matching needs the letters as typed, minus case and diacritics — and nothing here ever
   touches validation, so its looseness cannot let a wrong answer through. */
function soft(s){ return (s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().replace(/[^a-z]/g,''); }

/* The RAW symbol key: letters only, lower-cased, and NONE of norm()'s folds. It exists because
   norm() maps `w` → `v`, which would turn the symbol for work into the symbol for velocity. Symbols
   are matched on this, never on norm(). */
function rawKey(s){ return (s||'').toLowerCase().replace(/[^a-z]/g,''); }

/* Damerau–Levenshtein, bounded. At ~700 keys a full scan is a fraction of a millisecond and an
   index would be more code and one more thing to get wrong. */
function dl(a,b,cap){
  const n=a.length, m=b.length;
  if(Math.abs(n-m)>cap) return cap+1;
  let prev2=null, prev=new Array(m+1), cur=new Array(m+1);
  for(let j=0;j<=m;j++) prev[j]=j;
  for(let i=1;i<=n;i++){
    cur[0]=i; let best=cur[0];
    for(let j=1;j<=m;j++){
      const c = a.charCodeAt(i-1)===b.charCodeAt(j-1) ? 0 : 1;
      let v = Math.min(prev[j]+1, cur[j-1]+1, prev[j-1]+c);
      if(i>1 && j>1 && a.charCodeAt(i-1)===b.charCodeAt(j-2) && a.charCodeAt(i-2)===b.charCodeAt(j-1))
        v = Math.min(v, prev2[j-2]+1);
      cur[j]=v; if(v<best) best=v;
    }
    if(best>cap) return cap+1;
    prev2=prev; prev=cur; cur=new Array(m+1);
  }
  return prev[m];
}
function fuzzCap(k){ return k.length<=4 ? 0 : (k.length<=7 ? 1 : 2); }

/* ============================================================================================
   THE CRITERION CATALOGUE
   ============================================================================================
   Every criterion is a predicate over a quantity, and every predicate is a TAG LOOKUP or an
   exponent test — never a judgement call at runtime. `test` runs exactly once per criterion at boot
   to build the bitsets, and is never called again during play.

   `single` marks a family whose underlying tag is single-valued: a quantity is a vector or a scalar
   and cannot be both, and it is a base quantity or a derived one and cannot be both. Two such
   criteria facing each other across the grid guarantee an empty cell, so the generator rejects that
   SHAPE before it counts a single candidate. They may sit together on the same axis — rows never
   intersect rows.

   `branch` looks single-valued and is not, deliberately. Energy belongs to mechanics AND thermal
   physics AND electromagnetism, and a grid that rejects "energy" in a thermal cell has told a
   student something false. Most branch pairs still intersect thinly and the popcount check throws
   those out for free; there is no special rule and there must not be one.

   THE ONE RULE FOR ADDING A CRITERION: it must be a stable classification — a definition, an SI
   fact, a dimensional formula. Never "the most important quantity in", never "the largest", never
   anything that could be re-ranked. A criterion that can flip turns the whole game into a liar.

   Two axes named in the brief are deliberately ABSENT from this catalogue, and the reason is the
   same for both: they are true, they are interesting, and there are not enough members to build a
   grid from. "Is conserved" has five honest members (energy, linear momentum, angular momentum,
   charge, mass); a criterion that small can essentially never produce three cells of three answers
   each. It is shown in the reveal instead, on the entries that carry it. The same goes for any
   single named law: "appears in Newton's second law" is four quantities. The generic
   "appears in a named law" below is the usable form, and the specific law is printed in the reveal.
   ============================================================================================ */
function hasTag(list,v){ return list.indexOf(v)>=0; }
function sameDim(a,b){ for(let i=0;i<7;i++) if(a[i]!==b[i]) return false; return true; }
const DIM_ENERGY=[1,2,-2,0,0,0,0];
const CRITERIA=[
 /* --- kind: vector or scalar. SINGLE-valued. --- */
 {id:'k-vec',family:'kind',single:true,tier:'core',label:'A vector quantity',short:'Vector',
  test:q=>q.vec===1},
 {id:'k-sca',family:'kind',single:true,tier:'core',label:'A scalar quantity',short:'Scalar',
  test:q=>q.vec===0},

 /* --- SI standing: base or derived. SINGLE-valued, and there are only seven base quantities, so
        `s-base` is a deep-tier criterion that will rarely survive the three-answer floor. That is
        the honest consequence of the SI having seven of them, not a bug. --- */
 {id:'s-base',family:'si',single:true,tier:'deep',label:'One of the seven SI base quantities',short:'SI base quantity',
  test:q=>q.base===1},
 {id:'s-der',family:'si',single:true,tier:'core',label:'A derived quantity, not one of the seven SI base quantities',short:'Derived quantity',
  test:q=>q.base===0},

 /* --- branch. MULTI-valued: energy lives everywhere and pretending otherwise rejects a correct
        answer. --- */
 {id:'b-mech',family:'branch',single:false,tier:'core',label:'Belongs to mechanics',short:'Mechanics',
  test:q=>hasTag(q.br,'mech')},
 {id:'b-therm',family:'branch',single:false,tier:'core',label:'Belongs to thermal physics',short:'Thermal physics',
  test:q=>hasTag(q.br,'therm')},

        negative: length appears in resistivity (L³) and in wave number (L⁻¹) alike. --- */

  test:q=>q.d[0]!==0},

 /* --- the unit. `u-epon` is deliberately strict: the quantity's coherent SI unit must itself be a
        SPECIAL NAMED unit that honours a scientist. Torque is measured in N·m and impulse in N·s;

        never writes torque in joules, and it is the point of the criterion rather than a gap. The

 {id:'u-epon',family:'unitname',single:false,tier:'core',
  label:'Its SI unit is a special named unit honouring a scientist (newton, joule, volt, ohm…)',short:'Eponymous unit',
  test:q=>q.epon===1},

  test:q=>!!q.law},

/* Weekday ramp (RAMAYANA_GRID.md §4.5). Monday should feel like an invitation; Sunday should feel
   like the reason you sat through the dimensional-analysis chapter. Keyed off the local weekday of
   the dayKey, which is the same everywhere for a given dayKey, so it stays a pure function of the
   date. */
function tierPool(key){
  const a=key.split('-'), wd=new Date(+a[0],+a[1]-1,+a[2]).getDay();   // 0=Sun
  if(wd===1||wd===2) return {tiers:['core'],maxDeep:0};
  if(wd===3||wd===4) return {tiers:['core','wide'],maxDeep:0};
  if(wd===0)         return {tiers:['core','wide','deep'],maxDeep:6};
  return {tiers:['core','wide','deep'],maxDeep:1};                      // Fri, Sat
}

/* ============================================================================================
   BITSETS, LOOKUP AND THE BOOT SELF-TESTS
   ============================================================================================ */
const N=QUANTS.length, W=Math.ceil(N/32);
QUANTS.forEach((q,i)=>{ q.index=i; });

/* One Uint32Array per criterion. A cell's candidate count is then W ANDs and a popcount, which is
   why the generator can afford to reject grids aggressively — solvability checking is essentially
   free, and that is the whole reason a 3x3 daily fits in a static file with no server. */
const BITS=CRITERIA.map(c=>{
  const b=new Uint32Array(W);
  for(let i=0;i<N;i++) if(c.test(QUANTS[i])) b[i>>5]|=(1<<(i&31));
  return b;
});
function popcount(x){ x=x-((x>>>1)&0x55555555); x=(x&0x33333333)+((x>>>2)&0x33333333);
  x=(x+(x>>>4))&0x0f0f0f0f; return (x*0x01010101)>>>24; }
function andBits(a,b){ const o=new Uint32Array(W); for(let w=0;w<W;w++) o[w]=a[w]&b[w]; return o; }
function countBits(b){ let n=0; for(let w=0;w<W;w++) n+=popcount(b[w]); return n; }
function bitMembers(b){ const o=[]; for(let w=0;w<W;w++){ let x=b[w]; while(x){ const t=x&-x;
  o.push((w<<5)+popcount(t-1)); x^=t; } } return o; }   // ascending index order — stable, not a Set
function testBit(b,i){ return (b[i>>5]>>>(i&31))&1; }

/* KEYS: every canonical name and every alias, through norm(). Lookup is O(1). */
const KEYS=new Map();
const COLLISIONS=[];
function addKey(k,i){
  if(!k||k.length<2) return;
  if(KEYS.has(k) && KEYS.get(k)!==i) COLLISIONS.push(k+' → '+QUANTS[KEYS.get(k)].name+' / '+QUANTS[i].name);
  else KEYS.set(k,i);
}
(function buildKeys(){
  for(let i=0;i<N;i++){
    const q=QUANTS[i];
    addKey(norm(q.name),i);
    for(const a of (q.alt||[])) addKey(norm(a),i);
  }
})();
/* The collision assertion. A collision means norm() has folded two distinct quantities together,
   which silently makes one of them unanswerable — the exact class of failure the normaliser's
   conservatism exists to prevent. Costs nothing, catches everything. */
if(COLLISIONS.length) console.error('[quanta] alias collisions:', COLLISIONS);
(function selfTest(){
  const bad=[];
  for(let i=0;i<N;i++) if(KEYS.get(norm(QUANTS[i].name))!==i) bad.push(QUANTS[i].name);
  if(bad.length) console.error('[quanta] canonical names that do not round-trip:', bad);
  const ids=new Set(); QUANTS.forEach(q=>{ if(ids.has(q.id)) console.error('[quanta] duplicate id',q.id); ids.add(q.id); });
})();
const KEYLIST=[...KEYS.keys()];   // fixed order, built once; never iterated during daily setup

/* ============================================================================================
   THE TWO KINDS OF AMBIGUITY, AND WHY NEITHER MAY RESOLVE SILENTLY
   ============================================================================================
   RAMAYANA_GRID.md §3.4: two candidates within the fuzzy threshold must NEVER resolve silently.
   Physics has this problem worse than any other subject in this repo, in two distinct flavours.

   (1) BARE SYMBOLS. F is force, frequency or focal length. E is energy, electric field, emf or the
       elementary charge. p is pressure, power or momentum. V is volume, potential difference or
       potential. Resolving one of those silently would spend a guess on a quantity the player never
       named. So symbols are NEVER accepted as answers: every one of them opens a free
       disambiguation row instead, which also happens to be a decent little lesson.

       Matched on rawKey(), not norm(): norm folds w→v, which would turn the symbol for work into
       the symbol for velocity.

   (2) BARE HEAD-WORDS. "Potential" could be electric, gravitational, potential energy or potential
       difference. "Field", "flux", "moment", "modulus", "capacity", "conductivity" and "intensity"
       are the same. These are checked BEFORE the exact-name lookup, which is why "power" prompts
       even though Power is itself a canonical name — an optics cell wants the power of a lens, and
       charging a guess for the wrong Power would be indefensible.

   Neither prompt costs a guess, and neither list is filtered by what is valid for the open cell.
   ============================================================================================ */
const SYMS=[

 ['c',['speed-of-light','capacitance','specific-heat-capacity','critical-angle']],
 ['r',['resistance','gas-constant','rydberg-constant']],
 ['k',['spring-constant','kinetic-energy','thermal-conductivity','boltzmann-constant']],
 ['g',['gravitational-constant','g-acceleration','gravitational-field','shear-modulus','conductance']],

 ['d',['distance','absorbed-dose','displacement']],

 ['u',['internal-energy','potential-energy','energy-density']],

 ['mu',['permeability','mobility','coefficient-of-friction']],
 ['epsilon',['strain','permittivity','emf']],
 ['lambda',['wavelength','decay-constant','de-broglie-wavelength']],
 ['phi',['magnetic-flux','work-function','luminous-flux']],
 ['omega',['angular-velocity','angular-frequency','solid-angle']],
 ['alpha',['angular-acceleration','linear-expansivity']],
 /* eta and tau own exactly one quantity each in this roster, so they are plain aliases on
    those two entries rather than prompts — a symbol is only accepted where it is genuinely
    unambiguous. */
 ['theta',['plane-angle','temperature']],
 ['nu',['poissons-ratio','frequency']]
];
/* Head-words that own more than one quantity. Keys are stored through norm(), like everything else
   in KEYS, so the same folds apply on both sides. */
const AMBIG=[
 ['potential',['electric-potential','potential-difference','potential-energy','gravitational-potential']],
 ['power',['power','lens-power']],
 ['flux',['magnetic-flux','electric-flux','luminous-flux']],
 ['field',['electric-field','magnetic-flux-density','gravitational-field','magnetising-field']],
 ['field strength',['electric-field','magnetic-flux-density','gravitational-field','magnetising-field']],
 ['magnetic field strength',['magnetic-flux-density','magnetising-field']],
 ['moment',['torque','moment-of-inertia','magnetic-moment','dipole-moment']],
 ['modulus',['youngs-modulus','bulk-modulus','shear-modulus']],
 ['capacity',['capacitance','heat-capacity','specific-heat-capacity']],
 ['conductivity',['conductivity','thermal-conductivity']],
 ['intensity',['intensity','luminous-intensity','electric-field','magnetising-field']],
 ['constant',['spring-constant','decay-constant','gravitational-constant','planck-constant','boltzmann-constant','gas-constant']],
 ['coefficient',['viscosity','coefficient-of-friction','linear-expansivity']]
];
function idIndex(id){ for(let i=0;i<N;i++) if(QUANTS[i].id===id) return i; return -1; }
const SYMMAP=new Map(), AMBIGMAP=new Map();
(function buildAmbig(){
  for(const row of SYMS){ const list=row[1].map(idIndex).filter(i=>i>=0); if(list.length>1) SYMMAP.set(row[0],list); }
  for(const row of AMBIG){ const list=row[1].map(idIndex).filter(i=>i>=0);
    if(list.length>1) AMBIGMAP.set(norm(row[0]),list); }
  /* a symbol row that has collapsed to one owner would resolve silently — that is precisely what
     this table exists to prevent, so say so loudly rather than quietly accepting it. */
  for(const row of SYMS){ const list=row[1].map(idIndex);
    if(list.some(i=>i<0)) console.error('[quanta] SYMS row names an unknown id:', row[0], row[1]); }
  for(const row of AMBIG){ const list=row[1].map(idIndex);
    if(list.some(i=>i<0)) console.error('[quanta] AMBIG row names an unknown id:', row[0], row[1]); }
})();

/* ============================================================================================
   SOLVABILITY — two separate requirements, and the second is the one implementations get wrong
   ============================================================================================
   (a) every cell has at least THREE valid answers. A one-answer cell is a trivia question wearing a
       puzzle's clothes, and it is also the cell most likely to be wrong — one data error away from
       unanswerable, with no redundancy to absorb the mistake.
   (b) a system of distinct representatives must EXIST. Because each quantity may be used once,
       per-cell non-emptiness does not imply the grid is solvable: three cells whose only candidates
       are the same three quantities, plus a fourth needing one of them, is an unsolvable grid in
       which every cell individually looks fine. So: a perfect bipartite matching of size 9, by
       Kuhn's augmenting paths. Do not skip it and do not assume min(n) >= 3 implies it. It does not. */
function perfectMatching(cands){
  const matchQ=new Int32Array(N).fill(-1);           // quantity -> cell
  const seen=new Uint8Array(N);
  function tryCell(c){
    for(const p of cands[c]){
      if(seen[p]) continue;
      seen[p]=1;
      if(matchQ[p]<0 || tryCell(matchQ[p])){ matchQ[p]=c; return true; }
    }
    return false;
  }
  for(let c=0;c<9;c++){ seen.fill(0); if(!tryCell(c)) return false; }
  return true;
}

/* Maximum-weight perfect matching over 9 cells and a bounded candidate pool, by the standard
   O(n^2 m) Hungarian with potentials. Restricting each cell to its twelve rarest candidates can only
   UNDERSTATE the optimum, never overstate it, so the "heaviest possible" figure shown to the player
   is always actually achievable. */
function heaviestMatching(cands){
  const idx=new Map(), cols=[];
  for(let c=0;c<9;c++){
    const sorted=cands[c].slice().sort((a,b)=>{
      const d=QUANTS[a].fame-QUANTS[b].fame; return d!==0?d:a-b;   // total comparator: tie-break on index
    }).slice(0,12);
    for(const p of sorted) if(!idx.has(p)){ idx.set(p,cols.length); cols.push(p); }
  }
  const m=cols.length; if(m<9) return 0;
  const INF=1e9, cost=[];
  for(let c=0;c<9;c++){
    const row=new Array(m).fill(INF);
    for(const p of cands[c]){ const j=idx.get(p); if(j!==undefined) row[j]=-(6-QUANTS[p].fame); }
    cost.push(row);
  }
  const u=new Array(10).fill(0), v=new Array(m+1).fill(0), pcol=new Array(m+1).fill(0), way=new Array(m+1).fill(0);
  for(let i=1;i<=9;i++){
    pcol[0]=i; let j0=0;
    const minv=new Array(m+1).fill(INF), used=new Array(m+1).fill(false);
    do{
      used[j0]=true; const i0=pcol[j0]; let delta=INF, j1=0;
      for(let j=1;j<=m;j++) if(!used[j]){
        const cur=cost[i0-1][j-1]-u[i0]-v[j];
        if(cur<minv[j]){ minv[j]=cur; way[j]=j0; }
        if(minv[j]<delta){ delta=minv[j]; j1=j; }
      }
      if(delta>=INF/2) return 0;
      for(let j=0;j<=m;j++){ if(used[j]){ u[pcol[j]]+=delta; v[j]-=delta; } else minv[j]-=delta; }
      j0=j1;
    } while(pcol[j0]!==0);
    do{ const j1=way[j0]; pcol[j0]=pcol[j1]; j0=j1; } while(j0);
  }
  let total=0;
  for(let j=1;j<=m;j++) if(pcol[j]) total += -cost[pcol[j]-1][j-1];
  return total;
}

/* ============================================================================================
   GENERATING THE DAY'S GRID
   ============================================================================================
   EVERYTHING below draws from ONE mulberry32(daySeed(dayKey())) stream, in a fixed order. A stray
   Math.random() here desynchronises players worldwide and there is no way to detect it from inside
   the game. The criterion catalogue and the quantity table are ARRAYS with a fixed order; nothing in
   daily setup ever iterates a Set, a Map or Object.keys(). */
const FALLBACK=[
  {rows:['k-sca','k-vec','b-mech'],cols:['d-m','d-t','b-elec']},
  {rows:['b-mech','b-therm','b-elec'],cols:['k-sca','d-l','f-law']},
  {rows:['s-der','d-l','d-t'],cols:['b-elec','d-i','u-epon']},
  {rows:['k-sca','b-elec','u-epon'],cols:['d-l','d-i','f-instr']},
  {rows:['b-therm','b-wave','u-epon'],cols:['k-sca','b-mech','d-t']},
  {rows:['b-mod','d-i','u-epon'],cols:['d-l','d-t','f-law']}
];
function critIndex(id){ for(let i=0;i<CRITERIA.length;i++) if(CRITERIA[i].id===id) return i; return -1; }

function axisRuleOK(rows,cols){
  // Two criteria drawn from the same SINGLE-VALUED family must never sit on opposite axes: one cell
  // would be empty by construction. Same axis is fine — rows never intersect rows.
  for(const r of rows) for(const c of cols){
    const R=CRITERIA[r], C=CRITERIA[c];
    if(R.single && C.single && R.family===C.family) return false;
  }
  return true;
}
function buildCells(rows,cols){
  const cells=[];
  for(let i=0;i<3;i++) for(let j=0;j<3;j++) cells.push(andBits(BITS[rows[i]],BITS[cols[j]]));
  return cells;
}
function gradeGrid(rows,cols){
  if(!axisRuleOK(rows,cols)) return null;
  const cells=buildCells(rows,cols), counts=cells.map(countBits);
  if(Math.min.apply(null,counts)<3) return null;
  const sum=counts.reduce((a,b)=>a+b,0);
  if(sum<40||sum>260) return null;                       // breadth band: neither collapsed nor a blur
  const cands=cells.map(bitMembers);
  // Every cell must contain at least one answer with fame >= 3. No cell is ever solvable only by
  // somebody who read the appendix, and this does more for perceived fairness than anything else.
  for(const list of cands) if(!list.some(i=>QUANTS[i].fame>=3)) return null;
  if(!perfectMatching(cands)) return null;
  return {rows,cols,cells,counts,cands,sum};
}
function makeGrid(key){
  const rng=mulberry32(daySeed(key));
  const ramp=tierPool(key);
  const pool=[];
  for(let i=0;i<CRITERIA.length;i++) if(ramp.tiers.indexOf(CRITERIA[i].tier)>=0) pool.push(i);
  const draw=(exclude)=>{
    // rejection sampling against the pool, in fixed index order. Never shuffles a Set.
    for(let guard=0;guard<400;guard++){
      const c=pool[Math.floor(rng()*pool.length)];
      if(exclude.indexOf(c)<0) return c;
    }
    return -1;
  };
  for(let attempt=0;attempt<200;attempt++){
    const picked=[];
    let ok=true;
    for(let k=0;k<6;k++){ const c=draw(picked); if(c<0){ ok=false; break; } picked.push(c); }
    if(!ok) continue;
    const rows=picked.slice(0,3), cols=picked.slice(3,6);
    let deep=0; for(const c of picked) if(CRITERIA[c].tier==='deep') deep++;
    if(deep>ramp.maxDeep) continue;
    const g=gradeGrid(rows,cols);
    if(g){ g.fallback=false; g.attempt=attempt; return g; }
  }
  /* The fallbacks exist so a data edit that accidentally narrows the roster can never produce a day
     with no puzzle. If the audit ever reports one being used, that is a bug to fix in the data —
     not a shrug. */
  const fb=FALLBACK[daySeed(key)%FALLBACK.length];
  const g=gradeGrid(fb.rows.map(critIndex),fb.cols.map(critIndex));
  if(g){ g.fallback=true; return g; }
  const g2={rows:fb.rows.map(critIndex),cols:fb.cols.map(critIndex)};
  g2.cells=buildCells(g2.rows,g2.cols); g2.counts=g2.cells.map(countBits);
  g2.cands=g2.cells.map(bitMembers); g2.sum=g2.counts.reduce((a,b)=>a+b,0); g2.fallback=true;
  return g2;
}

/* ============================================================================================
   STATE AND STORAGE
   ============================================================================================
   Flat pipe-delimited strings per /DAILY.md, every read and write in try/catch — localStorage throws
   outright in Safari private mode and on some file:// origins, and a game that cannot save must
   still play. Corrupt values fall back to defaults; nothing here is allowed to break boot. */
const params=new URLSearchParams(location.search);
const ARCHIVE=/^\d{4}-\d{2}-\d{2}$/.test(params.get('date')||'') ? params.get('date') : '';
const KEY=ARCHIVE||dayKey();
const LIVE=!ARCHIVE;                                    // archive days write nothing and share no streak

const S={ cells:new Array(9).fill(-1), guesses:0, done:false, dirty:new Array(9).fill(0), open:-1 };
let GRID=null, settings={snd:1,type:1,theme:'auto'};

function loadSettings(){
  try{
    const raw=LS.get(SLUG+'.settings');
    raw.split(';').forEach(kv=>{ const i=kv.indexOf('='); if(i<0) return;
      const k=kv.slice(0,i), v=kv.slice(i+1);
      if(k==='snd') settings.snd = v==='1'?1:0;
      else if(k==='type') settings.type = v==='1'?1:0;
      else if(k==='theme'&&['auto','light','dark'].indexOf(v)>=0) settings.theme=v; });
  }catch(e){}                                            // any garbage at all: keep the defaults
}
function saveSettings(){ LS.set(SLUG+'.settings','snd='+settings.snd+';type='+settings.type+';theme='+settings.theme); }
function loadState(){
  if(!LIVE) return;
  try{
    const raw=LS.get(SLUG+'.state'); if(!raw) return;
    const a=raw.split('|');
    if(a[0]!==KEY) return;                               // a day-stamped value from another day is worth zero
    const ids=(a[1]||'').split(',');
    for(let i=0;i<9;i++){
      const id=ids[i]; if(!id) continue;
      const j=idIndex(id);
      if(j>=0 && GRID && testBit(GRID.cells[i],j)) S.cells[i]=j;   // ignore anything the grid disagrees with
    }
    S.guesses=Math.max(0,Math.min(9,+a[2]||0));
    S.done=a[3]==='1';
    const d=a[4]||''; for(let i=0;i<9;i++) S.dirty[i] = d.charAt(i)==='1'?1:0;
  }catch(e){ S.cells=new Array(9).fill(-1); S.guesses=0; S.done=false; S.dirty=new Array(9).fill(0); }
}
function saveState(){
  if(!LIVE) return;
  const ids=S.cells.map(i=>i<0?'':QUANTS[i].id).join(',');
  LS.set(SLUG+'.state', KEY+'|'+ids+'|'+S.guesses+'|'+(S.done?1:0)+'|'+S.dirty.join(''));
}
function filled(){ let n=0; for(const c of S.cells) if(c>=0) n++; return n; }
function weight(){ let w=0; for(const c of S.cells) if(c>=0) w+=6-QUANTS[c].fame; return w; }

/* ============================================================================================
   DIMENSIONAL FORMULAE, RENDERED
   ============================================================================================ */
const DIM_SYM=['M','L','T','I','Θ','N','J'];
const SUP={'-4':'⁻⁴','-3':'⁻³','-2':'⁻²','-1':'⁻¹','1':'','2':'²','3':'³','4':'⁴'};
function dimStr(d){
  let out=[];
  for(let i=0;i<7;i++) if(d[i]!==0) out.push(DIM_SYM[i]+(SUP[String(d[i])]!==undefined?SUP[String(d[i])]:'^'+d[i]));
  return out.length ? '['+out.join(' ')+']' : 'dimensionless';
}
/* "a ammeter" reads as carelessness, and carelessness is the one thing a reference panel cannot
   afford. Instrument names in this roster are ordinary English words, so the vowel test is enough. */
function anA(w){ return (/^[aeiou]/i.test(w)?'an ':'a ')+w; }

/* ============================================================================================
   AUDIO — WebAudio oscillators only, no files, because the game must work off a disk
   ============================================================================================ */
let AC=null;
function ac(){ try{ if(!AC) AC=new (window.AudioContext||window.webkitAudioContext)();
  if(AC.state==='suspended') AC.resume(); return AC; }catch(e){ return null; } }
function ping(){                                         // right answer: a clean quantised chime
  if(!settings.snd) return; const c=ac(); if(!c) return;
  const t=c.currentTime;
  [880,1320].forEach((f,k)=>{
    const o=c.createOscillator(), g=c.createGain();
    o.type='sine'; o.frequency.value=f;
    g.gain.setValueAtTime(0.0001,t+k*0.05);
    g.gain.exponentialRampToValueAtTime(0.16,t+k*0.05+0.012);
    g.gain.exponentialRampToValueAtTime(0.0001,t+k*0.05+0.30);
    o.connect(g).connect(c.destination); o.start(t+k*0.05); o.stop(t+k*0.05+0.32);
  });
}
function flat(){                                         // wrong: one damped tone. No buzzer.
  if(!settings.snd) return; const c=ac(); if(!c) return;
  const t=c.currentTime, o=c.createOscillator(), g=c.createGain();
  o.type='triangle'; o.frequency.setValueAtTime(196,t); o.frequency.linearRampToValueAtTime(146,t+0.18);
  g.gain.setValueAtTime(0.13,t); g.gain.exponentialRampToValueAtTime(0.001,t+0.2);
  o.connect(g).connect(c.destination); o.start(t); o.stop(t+0.21);
}
function chord(){                                        // 9/9: a rising spectrum, ~1.2s. No samples.
  if(!settings.snd) return; const c=ac(); if(!c) return;
  const t=c.currentTime;
  [261.6,329.6,392.0,523.3].forEach((f,k)=>{
    const o=c.createOscillator(), g=c.createGain();
    o.type='sine'; o.frequency.value=f;
    const s=t+k*0.13;
    g.gain.setValueAtTime(0.0001,s); g.gain.exponentialRampToValueAtTime(0.12,s+0.03);
    g.gain.exponentialRampToValueAtTime(0.0001,s+0.9);
    o.connect(g).connect(c.destination); o.start(s); o.stop(s+0.95);
  });
}

/* ============================================================================================
   RENDER
   ============================================================================================ */
const $=id=>document.getElementById(id);
function critOf(i,isRow){ return CRITERIA[isRow?GRID.rows[i]:GRID.cols[i]]; }
function cellLabel(k){
  const r=critOf(Math.floor(k/3),true), c=critOf(k%3,false);
  const who=S.cells[k]>=0 ? 'Filled with '+QUANTS[S.cells[k]].name+'.' : 'Empty.';
  return 'Row: '+r.label+'. Column: '+c.label+'. '+who;
}
function buildGrid(){
  const g=$('grid'); g.innerHTML='';
  const corner=document.createElement('div'); corner.className='corner'; corner.setAttribute('role','presentation');
  /* The one piece of ornament in the game: a wave meeting a quantised energy ladder. It depicts no
     logo and no person, which is exactly why it is drawn rather than shipped as a file. */
  corner.innerHTML='<svg viewBox="0 0 60 60" aria-hidden="true">'+
    '<path d="M4 34 C10 18, 16 18, 22 34 S34 50, 40 34" fill="none" stroke="var(--line-hi)" '+
    'stroke-width="2.6" stroke-linecap="round"/>'+
    '<line x1="44" y1="16" x2="56" y2="16" stroke="var(--line-lo)" stroke-width="2.4" stroke-linecap="round"/>'+
    '<line x1="44" y1="26" x2="56" y2="26" stroke="var(--line-lo)" stroke-width="2.4" stroke-linecap="round"/>'+
    '<line x1="44" y1="40" x2="56" y2="40" stroke="var(--line-lo)" stroke-width="2.4" stroke-linecap="round"/>'+
    '<circle cx="50" cy="49" r="3" fill="var(--line-hi)"/></svg>';
  g.appendChild(corner);
  for(let j=0;j<3;j++){
    const h=document.createElement('div'); h.className='hd'; h.textContent=critOf(j,false).short;
    h.tabIndex=0; h.setAttribute('role','columnheader'); h.title=critOf(j,false).label;
    h.addEventListener('click',()=>say(critOf(j,false).label));
    h.addEventListener('keydown',e=>{ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); say(critOf(j,false).label); } });
    g.appendChild(h);
  }
  for(let i=0;i<3;i++){
    const h=document.createElement('div'); h.className='hd'; h.textContent=critOf(i,true).short;
    h.tabIndex=0; h.setAttribute('role','rowheader'); h.title=critOf(i,true).label;
    h.addEventListener('click',()=>say(critOf(i,true).label));
    h.addEventListener('keydown',e=>{ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); say(critOf(i,true).label); } });
    g.appendChild(h);
    for(let j=0;j<3;j++){
      const k=i*3+j;
      const cell=document.createElement('div');
      cell.className='cell'; cell.id='cell'+k; cell.tabIndex=0;
      cell.setAttribute('role','gridcell');
      cell.setAttribute('aria-rowindex',String(i+1)); cell.setAttribute('aria-colindex',String(j+1));
      cell.addEventListener('click',e=>{ if(e.target.classList.contains('hint')) return; openCell(k); });
      cell.addEventListener('keydown',e=>onCellKey(e,k));
      g.appendChild(cell);
    }
  }
  paint();
}
function onCellKey(e,k){
  const i=Math.floor(k/3), j=k%3;
  let t=-1;
  if(e.key==='ArrowRight') t=i*3+((j+1)%3);
  else if(e.key==='ArrowLeft') t=i*3+((j+2)%3);
  else if(e.key==='ArrowDown') t=((i+1)%3)*3+j;
  else if(e.key==='ArrowUp') t=((i+2)%3)*3+j;
  else if(e.key==='Enter'||e.key===' '){ e.preventDefault(); openCell(k); return; }
  if(t>=0){ e.preventDefault(); const el=$('cell'+t); if(el) el.focus(); }
}
function paint(){
  for(let k=0;k<9;k++){
    const el=$('cell'+k); if(!el) continue;
    const q=S.cells[k]>=0?QUANTS[S.cells[k]]:null;
    el.classList.toggle('on',!!q);
    el.setAttribute('aria-label',cellLabel(k));
    el.innerHTML='';
    if(q){
      const nm=document.createElement('span'); nm.className='nm'; nm.textContent=q.name;
      const un=document.createElement('span'); un.className='un'; un.textContent=q.unit;
      const wt=document.createElement('span'); wt.className='wt'; wt.textContent=String(6-q.fame);
      el.appendChild(nm); el.appendChild(un); el.appendChild(wt);
    } else {
      const p=document.createElement('span'); p.className='plus'; p.textContent='+';
      const b=document.createElement('button'); b.className='hint'; b.type='button';
      b.setAttribute('aria-label','How many quantities fit this cell'); b.innerHTML='&#9432;';
      b.addEventListener('click',e=>{ e.stopPropagation();
        say(GRID.counts[k]+' quantit'+(GRID.counts[k]===1?'y':'ies')+' in the roster fit that cell.'); });
      el.appendChild(p); el.appendChild(b);
    }
  }
  $('sCells').textContent=filled()+'/9';
  $('sGuess').textContent=String(9-S.guesses);
  $('sWeight').textContent=String(weight());
  $('bReveal').hidden=!S.done;
}
function say(t,cls){ const m=$('msg'); m.innerHTML=''; const s=document.createElement('span');
  if(cls) s.className=cls; s.textContent=t; m.appendChild(s); }

/* ============================================================================================
   THE SHEET, THE TYPEAHEAD AND RESOLUTION
   ============================================================================================ */
function openCell(k){
  if(S.done || S.cells[k]>=0) return;
  S.open=k;
  $('critRow').textContent=critOf(Math.floor(k/3),true).label;
  $('critCol').textContent=critOf(k%3,false).label;
  $('sheetMeta').textContent=(9-S.guesses)+' guess'+(9-S.guesses===1?'':'es')+' left · '+
    GRID.counts[k]+' quantities fit this cell';
  $('guess').value=''; $('sheetMsg').textContent=''; $('disamb').hidden=true; $('ta').innerHTML='';
  $('sheet').hidden=false; $('scrim').classList.add('show');
  requestAnimationFrame(()=>{ $('sheet').classList.add('show'); $('guess').focus(); });
}
function closeSheet(){
  S.open=-1;
  $('sheet').classList.remove('show'); $('scrim').classList.remove('show');
  setTimeout(()=>{ if(S.open<0) $('sheet').hidden=true; },220);
}

/* THE TRAP IN THE TYPEAHEAD, stated where an editor will see it:
   the suggestion list is drawn from the ENTIRE roster and is NEVER filtered by what is valid for the
   open cell. Filtering it would hand over the answer. It looks like a kindness and it is a spoiler.
   If anybody ever writes QUANTS.filter(validForCell) in here, the game is broken. */
function typeahead(){
  const box=$('ta'); box.innerHTML='';
  if(!settings.type) return;
  const q=soft($('guess').value);
  if(q.length<2) return;
  const pre=[], sub=[], seen=new Set();
  for(let i=0;i<N;i++){
    const e=QUANTS[i], k=soft(e.name);
    if(k.indexOf(q)===0) pre.push(i);
    else if((e.alt||[]).some(a=>soft(a).indexOf(q)===0)) pre.push(i);
    else if(k.indexOf(q)>=0 || (e.alt||[]).some(a=>soft(a).indexOf(q)>=0)) sub.push(i);
  }
  const out=pre.concat(sub).filter(i=>{ if(seen.has(i)) return false; seen.add(i); return true; }).slice(0,6);
  for(const i of out){
    const e=QUANTS[i];
    const li=document.createElement('li'), b=document.createElement('button');
    b.type='button';
    b.appendChild(document.createTextNode(e.name));
    if(e.cls==='c'){ const ch=document.createElement('span'); ch.className='chip const'; ch.textContent='constant';
      b.appendChild(ch); }
    const sm=document.createElement('small');
    sm.textContent=(e.unit==='—'?'no unit':e.unit)+' · '+dimStr(e.d)+' · '+(e.vec?'vector':'scalar');
    b.appendChild(sm);
    b.addEventListener('click',()=>{ $('guess').value=e.name; box.innerHTML=''; commit(i); });
    li.appendChild(b); box.appendChild(li);
  }
}

/* Resolution. Returns {kind:'hit'|'none'|'ambiguous', index?, options?, why?}.
   Order matters and is argued for above the SYMS table: head-words first (so "power" prompts even
   though it is also a canonical name), then the exact lookup, then symbols on the RAW key, then the
   bounded fuzzy fallback. Two candidates within the fuzzy threshold never resolve silently. */
function resolve(text){
  const k=norm(text), rk=rawKey(text);
  if(AMBIGMAP.has(k)) return {kind:'ambiguous',options:AMBIGMAP.get(k),why:'word'};
  if(KEYS.has(k)) return {kind:'hit',index:KEYS.get(k)};
  if(SYMMAP.has(rk)) return {kind:'ambiguous',options:SYMMAP.get(rk),why:'symbol',sym:text.trim()};
  if(k.length<2) return {kind:'none',tooShort:true};
  const cap=fuzzCap(k), hits=[];
  for(const key of KEYLIST){
    if(Math.abs(key.length-k.length)>cap) continue;
    if(dl(k,key,cap)<=cap){ const i=KEYS.get(key); if(hits.indexOf(i)<0) hits.push(i); }
  }
  if(hits.length===1) return {kind:'hit',index:hits[0]};
  if(hits.length>1) return {kind:'ambiguous',options:hits.slice(0,6),why:'fuzzy'};
  return {kind:'none'};
}

/* Five outcomes, and ONLY ONE of them costs a guess. A typo, an unknown name, a bare symbol and a
   repeat are the four things a sincere player does most often; charging for any of them turns a
   puzzle into a punishment, and it is the single most common way this genre gets ruined. */
function submit(){
  if(S.open<0) return;
  const raw=$('guess').value.trim();
  const r=resolve(raw);
  $('disamb').hidden=true;
  if(r.kind==='none'){
    if(r.tooShort) return;                              // mid-typo: ignore silently, cost nothing
    sheetMsg('Quanta doesn’t know that name. The roster is '+N+' physical quantities and named '+
             'constants from school and A-level physics. No guess spent.');
    return;
  }
  if(r.kind==='ambiguous'){ showDisamb(r.options,r.why,r.sym); return; }
  commit(r.index);
}
function showDisamb(options,why,sym){
  const d=$('disamb'); d.innerHTML='';
  const p=document.createElement('p'); p.style.margin='0';
  p.textContent = why==='symbol'
    ? 'Symbols are ambiguous in physics — “'+(sym||'that')+'” is several different quantities. Which one? (This costs no guess.)'
    : (why==='word'
        ? 'That word names more than one quantity. Which one? (This costs no guess.)'
        : 'Which one? (This costs no guess.)');
  d.appendChild(p);
  const row=document.createElement('div'); row.className='row';
  for(const i of options){
    const b=document.createElement('button'); b.type='button'; b.textContent=QUANTS[i].name;
    b.addEventListener('click',()=>{ d.hidden=true; commit(i); });
    row.appendChild(b);
  }
  d.appendChild(row); d.hidden=false;
  sheetMsg('');
}
function sheetMsg(t,cls){ const m=$('sheetMsg'); m.innerHTML='';
  const s=document.createElement('span'); if(cls) s.className=cls; s.textContent=t; m.appendChild(s); }

function commit(i){
  const k=S.open; if(k<0) return;
  const q=QUANTS[i];
  const already=S.cells.indexOf(i);
  if(already>=0){
    sheetMsg(q.name+' is already placed — row '+(Math.floor(already/3)+1)+', column '+(already%3+1)+
             '. Each quantity can only be used once. No guess spent.');
    return;
  }
  const r=critOf(Math.floor(k/3),true), c=critOf(k%3,false);
  const rOK=r.test(q), cOK=c.test(q);
  if(rOK&&cOK){
    S.cells[k]=i; $('guess').value='';
    ping();
    closeSheet(); paint();
    const el=$('cell'+k); if(el){ el.classList.add('lay'); setTimeout(()=>el.classList.remove('lay'),380); }
    say(q.name+' — '+r.label+' ✓ · '+c.label+' ✓','yes');
    saveState();
    if(filled()===9) endGrid(true);
    return;
  }
  /* Outcome (d) says WHICH HALF failed. It teaches, it makes a wrong guess feel like it bought
     something, and it cannot reveal an answer: it tells the player facts about the quantity THEY
     named, not about any quantity they didn't. */
  S.guesses++; S.dirty[k]=1; flat();
  const line=q.name+' — '+r.label+' '+(rOK?'✓':'✗')+' · '+c.label+' '+(cOK?'✓':'✗');
  sheetMsg(line,'nope'); say(line,'nope');
  paint(); saveState();
  if(S.guesses>=9){ closeSheet(); endGrid(false); }
}

/* ============================================================================================
   THE END OF A GRID, THE REVEAL PANEL AND SHARING
   ============================================================================================ */
let siteStreak=0, heaviest=0;
function endGrid(perfect){
  if(S.done) return;
  S.done=true; saveState(); paint();
  if(perfect) chord();
  if(LIVE){
    /* dailyDone() is called when the grid ENDS, either way — 9/9 or out of guesses. A streak that
       required a perfect grid would break for everybody in the first week and then mean nothing.
       Showing up is the feat the streak pays for. */
    const w=weight();
    if(w>loadToday(SLUG+'.dbest')) saveToday(SLUG+'.dbest',w);
    siteStreak=dailyDone();
    $('sStreak').textContent=String(siteStreak);
  }
  track('grid_end',{filled:filled(),guesses:S.guesses,weight:weight(),heaviest:heaviest,
                    mode:LIVE?'daily':'archive',typeahead:settings.type});
  say(perfect ? 'Nine of nine. The spectrum is complete.'
             : filled()+' of nine filled. Every answer is below.');
  setTimeout(showReveal, perfect?900:400);
}
function esc(t){ const d=document.createElement('div'); d.textContent=t; return d.innerHTML; }
function showReveal(){
  const R=$('revInner');
  const parts=[];
  parts.push('<h2 id="revTitle">'+filled()+' of nine</h2>');
  parts.push('<p><b>Weight '+weight()+'</b> of a possible '+heaviest+' · '+S.guesses+
             ' of nine guesses spent'+(settings.type?'':' · recall')+'.</p>');
  parts.push('<textarea class="sharebox" id="shareTxt" rows="7" readonly aria-label="Your result, ready to copy"></textarea>');
  parts.push('<div class="tools"><button class="btn primary" type="button" id="bCopy">Copy result</button>'+
             '<button class="btn" type="button" id="bClose">Back to the grid</button></div>');
  parts.push('<p class="note">Every quantity in the roster that fits each cell, with its SI unit, its '+
             'dimensional formula, whether it is a vector or a scalar, and the named law or instrument '+
             'it belongs to. Yours is highlighted. This part is the point of the game.</p>');
  for(let k=0;k<9;k++){
    const r=critOf(Math.floor(k/3),true), c=critOf(k%3,false);
    parts.push('<h3>'+esc(r.label)+' &nbsp;×&nbsp; '+esc(c.label)+
               ' <span style="font-weight:600;opacity:.75">('+GRID.counts[k]+')</span></h3>');
    const list=GRID.cands[k].slice().sort((a,b)=>{
      const d=QUANTS[b].fame-QUANTS[a].fame; return d!==0?d:a-b;   // total comparator, tie-break on index
    });
    parts.push('<ul class="ans">');
    for(const i of list){
      const q=QUANTS[i], mine=S.cells[k]===i;
      const extra=[];
      if(q.law) extra.push('In '+esc(q.law)+'.');
      if(q.instr) extra.push('Measured with '+anA(esc(q.instr))+'.');
      if(q.base) extra.push('An SI base quantity.');
      parts.push('<li'+(mine?' class="mine"':'')+'><b>'+esc(q.name)+'</b>'+
        (q.cls==='c'?' <span class="chip const">constant</span>':'')+
        ' <span class="u">'+esc(q.unit==='—'?'no unit':q.unit)+'</span>'+
        (q.unit==='—'?'':' <span style="opacity:.75">('+esc(q.uname)+')</span>')+
        ' · '+esc(dimStr(q.d))+' · '+(q.vec?'vector':'scalar')+
        ' · <span class="w">weight '+(6-q.fame)+'</span>'+
        '<span class="g">'+esc(q.gloss)+'</span>'+
        (extra.length?'<span class="g">'+extra.join(' ')+'</span>':'')+'</li>');
    }
    parts.push('</ul>');
  }
  parts.push('<h3>About this dataset</h3>');
  parts.push('<p class="note"><b>Every criterion in Quanta is a stable fact</b> — a definition, an SI '+
    'classification, a dimensional formula. Never a ranking, never "most" or "largest", because those '+
    'flip and a criterion that flips turns the game into a liar. Three things are worth spelling out, '+
    'because they are the traps: whether a quantity is a <i>vector</i> is about how it adds, not '+
    'whether it has a direction — which is why electric current is a scalar; <i>eponymous unit</i> '+
    'means the coherent SI unit is itself a special named unit honouring a scientist, so the newton, '+
    'joule and volt count while the N·m of torque and the N·s of impulse do not; and a dimension '+
    '<i>appears</i> whenever its exponent is non-zero, negative exponents included.</p>');
  parts.push('<p class="note">Where a fact could not be confirmed against a public reference, the tag '+
    'was left <b>off</b> rather than guessed. That makes the dataset incomplete rather than wrong, '+
    'and the difference matters: a missing tag only ever rejects a correct answer and apologises for '+
    'it, while a wrong tag would also accept an incorrect one and you could not tell which failure '+
    'you were looking at. Two axes were left out of the grid entirely for a different reason — being '+
    '<i>conserved</i>, and appearing in one <i>specific</i> named law, each have too few members to '+
    'build a fair cell from. They are printed above instead, on the entries that carry them.</p>');
  parts.push('<p class="note"><b>Weight is not rarity scoring.</b> Immaculate Grid’s rarity is a '+
    '<i>social</i> measurement — it tells you how few of the other players thought of your answer, and '+
    'knowing that requires a server counting everybody. Quanta has no server and never phones home. '+
    'Its Weight is an <i>editorial</i> measurement: a number assigned to each quantity when the '+
    'dataset was written, reflecting roughly how early in a physics course you meet it. It is the same '+
    'on day one as on day one thousand, and it works on a plane. It can never surprise you by '+
    'revealing that everybody else also thought of impulse.</p>');
  parts.push('<p class="note">Definitions, SI units and dimensional formulae are facts and facts are '+
    'not copyrightable. Quanta ships <b>zero image files</b> and makes no network request of any kind. '+
    'Compiled by hand from multiple public references, never copied from any single table.</p>');
  parts.push('<p class="note">Something wrong here? Corrections are welcome — this is a hand-built '+
    'table and it will have gaps. <a href="../">kreeda.games</a></p>');
  R.innerHTML=parts.join('');
  $('shareTxt').value=shareText();
  $('bCopy').addEventListener('click',doCopy);
  $('bClose').addEventListener('click',()=>{ $('reveal').classList.remove('show'); $('reveal').hidden=true; });
  $('reveal').hidden=false; $('reveal').classList.add('show'); $('reveal').scrollTop=0;
  $('revTitle').setAttribute('tabindex','-1'); $('revTitle').focus();
}

/* The share grid encodes, per cell, exactly two bits: solved or not, and cleanly or not. It encodes
   nothing about WHICH quantity was named. The criteria are not secret — every player worldwide sees
   the identical six the moment they open the page — so revealing which cells somebody found tells a
   reader nothing they could not already see.
   THEREFORE: Weight is never encoded per cell. A per-cell weight glyph would leak — telling a reader
   that your answer to a three-answer cell was a weight-5 name narrows their search to one quantity.
   Weight appears only as a single total on the score line, where it is not attributable to any cell.
   This is the one way this format could be broken and it is exactly the kind of thing that looks
   like a nice idea in review. It isn't. */
function shareText(){
  const MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  const a=KEY.split('-'), head='Kreeda · Quanta · '+(+a[2])+' '+MON[+a[1]-1];
  let rows='';
  for(let i=0;i<3;i++){
    for(let j=0;j<3;j++){
      const k=i*3+j;
      rows += S.cells[k]<0 ? '⬜' : (S.dirty[k] ? '🟨' : '🟪');
    }
    rows+='\n';
  }
  let score=filled()+'/9 · weight '+weight();
  if(!settings.type) score+=' · recall';
  if(LIVE && siteStreak>=2) score+=' · streak '+siteStreak+' 🔥';
  if(!LIVE) score+=' · archive';
  return head+'\n'+rows+score+'\nkreeda.games/quanta/';
}
function doCopy(){
  const t=shareText(), b=$('bCopy');
  const ok=()=>{ b.textContent='Copied'; setTimeout(()=>b.textContent='Copy result',1400); };
  try{
    if(navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(t).then(ok,fallback); }
    else fallback();
  }catch(e){ fallback(); }
  function fallback(){
    const ta=$('shareTxt'); ta.focus(); ta.select();
    try{ document.execCommand('copy'); ok(); }catch(e){ b.textContent='Select and copy'; }
  }
}

/* The one call into analytics.js, and deliberately the dumbest possible wrapper: if that file was
   blocked, never loaded, or is doing nothing because we are on file://, this is a no-op and the game
   cannot tell. Nothing in here is load-bearing. */
function track(name,p){ try{ if(window.bgTrack) window.bgTrack(name,p); }catch(e){} }

/* ============================================================================================
   BOOT
   ============================================================================================ */
function applyTheme(){
  const el=document.documentElement;
  if(settings.theme==='auto') el.removeAttribute('data-theme'); else el.setAttribute('data-theme',settings.theme);
  $('bTheme').textContent='Theme: '+settings.theme;
}
function gapsNotice(){
  try{
    if(LS.get(SLUG+'.gapsx')==='1') return;
    $('staleTxt').textContent=N+' quantities in the roster, not all of physics, and an unconfirmed '+
      'fact was left untagged rather than guessed. So a correct answer can be rejected as a gap — '+
      'never as a verdict. Every answer is listed at the end.';
    $('stale').classList.add('show');
  }catch(e){}
}
function boot(){
  loadSettings(); applyTheme();
  GRID=makeGrid(KEY);
  heaviest=heaviestMatching(GRID.cands);
  loadState();
  buildGrid();
  const MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  const a=KEY.split('-');
  $('datechip').textContent=(ARCHIVE?'Archive · ':'')+(+a[2])+' '+MON[+a[1]-1]+' '+a[0];
  if(ARCHIVE) $('datechip').classList.add('arch');
  $('asof').textContent=N+' physical quantities and named constants in the roster, at school and '+
    'A-level. SI units and dimensional formulae throughout.';
  siteStreak=LIVE ? (LS.get('kreeda.streak').split('|')[0]===dayKey() ? (+LS.get('kreeda.streak').split('|')[1]||0) : 0) : 0;
  $('sStreak').textContent=String(siteStreak);
  $('bSound').setAttribute('aria-pressed',settings.snd?'true':'false');
  $('bSound').textContent='Sound '+(settings.snd?'on':'off');
  $('bType').setAttribute('aria-pressed',settings.type?'true':'false');
  $('bType').textContent='Typeahead '+(settings.type?'on':'off');
  gapsNotice();
  if(S.done){ say(filled()+' of nine filled today. Tap “See every answer”.'); }
  else if(filled()>0) say('Picking up where you left off.');
  else say('Tap a square. Name a physical quantity that fits both its row and its column.');
  paint();

  $('guess').addEventListener('input',typeahead);
  $('guess').addEventListener('keydown',e=>{ if(e.key==='Enter'){ e.preventDefault(); submit(); } });
  $('bSubmit').addEventListener('click',submit);
  $('bCancel').addEventListener('click',closeSheet);
  $('scrim').addEventListener('click',closeSheet);
  document.addEventListener('keydown',e=>{ if(e.key==='Escape'){ if(!$('reveal').hidden){
      $('reveal').classList.remove('show'); $('reveal').hidden=true; } else closeSheet(); } });
  $('bReveal').addEventListener('click',showReveal);
  $('staleX').addEventListener('click',()=>{ $('stale').classList.remove('show'); LS.set(SLUG+'.gapsx','1'); });
  $('bSound').addEventListener('click',()=>{ settings.snd=settings.snd?0:1; saveSettings();
    $('bSound').setAttribute('aria-pressed',settings.snd?'true':'false');
    $('bSound').textContent='Sound '+(settings.snd?'on':'off'); if(settings.snd) ping(); });
  $('bType').addEventListener('click',()=>{ settings.type=settings.type?0:1; saveSettings();
    $('bType').setAttribute('aria-pressed',settings.type?'true':'false');
    $('bType').textContent='Typeahead '+(settings.type?'on':'off'); typeahead(); });
  $('bTheme').addEventListener('click',()=>{ settings.theme = settings.theme==='auto'?'light':
    (settings.theme==='light'?'dark':'auto'); saveSettings(); applyTheme(); });
  $('bHow').addEventListener('click',()=>say('Nine cells, nine guesses. Each quantity can be used '+
    'only once. Unknown names, bare symbols, ambiguous words and repeats are all free — only a real '+
    'quantity that does not fit costs a guess. Weight rewards the less obvious answer.'));
  /* Keep the sheet above the on-screen keyboard. visualViewport is the only honest source for this;
     100vh lies on iOS the moment the keyboard opens. */
  if(window.visualViewport){
    const fit=()=>{ const vv=window.visualViewport;
      const lift=Math.max(0, window.innerHeight-(vv.height+vv.offsetTop));
      $('sheet').style.setProperty('bottom', (window.innerWidth<560? lift+'px' : ''));
    };
    window.visualViewport.addEventListener('resize',fit);
    window.visualViewport.addEventListener('scroll',fit);
  }
  track('grid_start',{mode:LIVE?'daily':'archive',fallback:GRID.fallback?1:0,heaviest:heaviest});
}

/* ============================================================================================
   AUDIT — dev only, not linked from anywhere. ?audit=N generates the next N days and reports.
   Run it before any data change ships: it is the only way to actually KNOW the grid is solvable
   every day, as opposed to intending that it be.
   ============================================================================================ */
function audit(n){
  const out={days:n,fallbacks:[],minCell:1e9,maxCell:0,sumMin:1e9,sumMax:0,noMatch:[],lowCell:[],
             critUse:{},worst:null};
  let k=dayKey(), totalMin=0;
  for(let d=0;d<n;d++){
    const g=makeGrid(k);
    if(g.fallback) out.fallbacks.push(k);
    const mn=Math.min.apply(null,g.counts), mx=Math.max.apply(null,g.counts);
    if(mn<out.minCell){ out.minCell=mn; out.worst=k; }
    if(mx>out.maxCell) out.maxCell=mx;
    out.sumMin=Math.min(out.sumMin,g.sum); out.sumMax=Math.max(out.sumMax,g.sum);
    totalMin+=mn;
    if(mn<3) out.lowCell.push(k+':'+mn);
    if(!perfectMatching(g.cands)) out.noMatch.push(k);
    for(const c of g.rows.concat(g.cols)){ const id=CRITERIA[c].id; out.critUse[id]=(out.critUse[id]||0)+1; }
    const a=k.split('-'), t=new Date(+a[0],+a[1]-1,+a[2]); t.setDate(t.getDate()+1); k=dayKey(t);
  }
  out.meanMin=+(totalMin/n).toFixed(2);
  out.ok = out.fallbacks.length===0 && out.lowCell.length===0 && out.noMatch.length===0;
  console.log('[quanta audit]', JSON.stringify(out));
  window.__audit=out;
  return out;
}
try{ boot(); }catch(e){ console.error('[quanta] boot failed',e); }
if(params.get('audit')) audit(Math.max(1,Math.min(2000,+params.get('audit')||365)));
</script>
</body>
