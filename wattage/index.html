<script>
'use strict';
/* ============================================================================================
   WATTAGE — a daily energy-sources grid. One file, no build, no network, no images. Opens off a
   disk. Sibling of valence/, quanta/ and isomer/ — see RAMAYANA_GRID.md for the mechanic this is
   built on.

   The dataset rule, unchanged: EVERY CRITERION IS A STABLE FACT — a classification, a physical
   mechanism, a common use. Never a ranking, a price, or a "most efficient" — those move with every
   year's technology and every country's grid, and would make the dataset wrong within a season.
   ============================================================================================ */

/* ---- Kreeda daily contract — see /DAILY.md. Copied, not imported: the game stays one file. ---- */
const SLUG='wattage';
function dayKey(d){ d=d||new Date(); const p=n=>String(n).padStart(2,'0');
  return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate()); }
function prevDayKey(k){ const a=k.split('-'), t=new Date(+a[0],+a[1]-1,+a[2]);
  t.setDate(t.getDate()-1); return dayKey(t); }
function daySeed(k){ let h=5381; for(let i=0;i<k.length;i++) h=(h*33 ^ k.charCodeAt(i))|0; return h>>>0; }
function mulberry32(a){ return function(){ a=(a+0x6D2B79F5)|0; let t=Math.imul(a^(a>>>15),1|a);
  t=(t+Math.imul(t^(t>>>7),61|t))^t; return ((t^(t>>>14))>>>0)/4294967296; }; }

const LS={ get:k=>{ try{ return localStorage.getItem(k)||''; }catch(e){ return ''; } },
           set:(k,v)=>{ try{ localStorage.setItem(k,v); }catch(e){} } };

function loadToday(key){ const s=LS.get(key), i=s.indexOf('|');
  return (i<0 || s.slice(0,i)!==dayKey()) ? 0 : (+s.slice(i+1)||0); }
function saveToday(key,v){ LS.set(key, dayKey()+'|'+Math.round(v)); }
function bumpStreak(key){
  const s=LS.get(key), i=s.indexOf('|'), last=i<0?'':s.slice(0,i), n=i<0?0:(+s.slice(i+1)||0);
  const today=dayKey(), count = last===today ? (n||1) : (last===prevDayKey(today) ? n+1 : 1);
  LS.set(key, today+'|'+count); return count;
}
function dailyDone(){
  const today=dayKey(), k='kreeda.daily.'+today;
  const had=LS.get(k).split(',').filter(Boolean);
  if(!had.includes(SLUG)) LS.set(k, had.concat(SLUG).join(','));
  bumpStreak(SLUG+'.streak');
  return bumpStreak('kreeda.streak');
}

/* ============================ name normalisation ============================
   RAMAYANA_GRID.md §3.1's architecture, unchanged: a small conservative normaliser, ambiguity
   absorbed by a hand-curated `al` list on each source. Names only, no formulas or symbols to worry
   about — closer in spirit to Setu's beings than to Valence's periodic table. */
function norm(s){
  if(!s) return '';
  s = s.normalize('NFD').replace(/[̀-ͯ]/g, '');
  s = s.toLowerCase();
  s = s.replace(/[^a-z]/g, '');
  s = s.replace(/(.)\1+/g, '$1');           // doubled letters collapse
  return s;
}
function soft(s){ return (s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().replace(/[^a-z]/g,''); }
function dl(a,b,cap){
  const n=a.length, m=b.length;
  if(Math.abs(n-m)>cap) return cap+1;
  let prev2=null, prev=new Array(m+1), cur=new Array(m+1);
  for(let j=0;j<=m;j++) prev[j]=j;
  for(let i=1;i<=n;i++){
    cur[0]=i; let best=cur[0];
    for(let j=1;j<=m;j++){
      const c = a.charCodeAt(i-1)===b.charCodeAt(j-1) ? 0 : 1;
      let v = Math.min(prev[j]+1, cur[j-1]+1, prev[j-1]+c);
      if(i>1 && j>1 && a.charCodeAt(i-1)===b.charCodeAt(j-2) && a.charCodeAt(i-2)===b.charCodeAt(j-1))
        v = Math.min(v, prev2[j-2]+1);
      cur[j]=v; if(v<best) best=v;
    }
    if(best>cap) return cap+1;
    prev2=prev; prev=cur; cur=new Array(m+1);
  }
  return prev[m];
}
function fuzzCap(k){ return k.length<=4 ? 0 : (k.length<=7 ? 1 : 2); }

/* ============================================================================================
   THE ROSTER — 19 energy sources a high-school "sources of energy" unit actually meets: the fossil
   fuels, nuclear fission, the renewables, and the traditional biofuels still used by much of the
   world. Hydrogen is included and flagged as a CARRIER rather than a source — it has to be
   manufactured using some other energy first, which is itself a fact worth a criterion cell.

   Schema:
     id       stable slug. Saves store this. NEVER renumber or rename.
     nm       canonical display name
     kind     'ren' | 'nonren' | 'carrier' — renewable, non-renewable, or neither (hydrogen only)
     fossil   is it a fossil fuel?
     comb     'yes' | 'no' — is it used by burning it?
     extr     obtained by mining or drilling from the ground?
     elec     used to generate electricity on a commercial scale?
     transp   commonly used to power vehicles?
     weather  does output vary with weather or time of day?
     heat     commonly used to heat homes or buildings?
     form     'chem' (chemical bond energy) | 'kinetic' | 'nuclear' | 'radiant' | 'thermal'
     fa       fame 1..5. Drives Weight (= 6 - fa) and the "every cell has a famous answer" rule.
     gl       one line for the reveal panel.
     al       hand-written aliases: common names and spelling variants.
   ============================================================================================ */
const E=[
{id:'coal',nm:'Coal',kind:'nonren',fossil:true,comb:'yes',extr:true,elec:true,transp:false,weather:false,heat:true,form:'chem',fa:5,
 gl:'A solid fossil fuel formed from ancient swamp plants under heat and pressure over millions of years; still the world’s single largest source of electricity.',al:[]},
{id:'petroleum',nm:'Petroleum',kind:'nonren',fossil:true,comb:'yes',extr:true,elec:true,transp:true,weather:false,heat:false,form:'chem',fa:5,
 gl:'A fossil fuel formed from ancient marine organisms; refined into petrol, diesel, kerosene and countless other products.',al:['crudeoil','oil']},

function tierPool(key){
  const a=key.split('-'), wd=new Date(+a[0],+a[1]-1,+a[2]).getDay();
  if(wd===1||wd===2) return {tiers:['core'],maxDeep:0};
  if(wd===3||wd===4) return {tiers:['core','wide'],maxDeep:0};
  if(wd===0)         return {tiers:['core','wide','deep'],maxDeep:6};
  return {tiers:['core','wide','deep'],maxDeep:1};
}

/* ============================================================================================
   BITSETS, LOOKUP AND THE BOOT SELF-TESTS
   ============================================================================================ */
const N=E.length, W=Math.ceil(N/32);
E.forEach((e,i)=>{ e.index=i; });

const BITS=CRITERIA.map(c=>{
  const b=new Uint32Array(W);
  for(let i=0;i<N;i++) if(c.test(E[i])) b[i>>5]|=(1<<(i&31));
  return b;
});
function popcount(x){ x=x-((x>>>1)&0x55555555); x=(x&0x33333333)+((x>>>2)&0x33333333);
  x=(x+(x>>>4))&0x0f0f0f0f; return (x*0x01010101)>>>24; }
function andBits(a,b){ const o=new Uint32Array(W); for(let w=0;w<W;w++) o[w]=a[w]&b[w]; return o; }
function countBits(b){ let n=0; for(let w=0;w<W;w++) n+=popcount(b[w]); return n; }
function bitMembers(b){ const o=[]; for(let w=0;w<W;w++){ let x=b[w]; while(x){ const t=x&-x;
  o.push((w<<5)+popcount(t-1)); x^=t; } } return o; }
function testBit(b,i){ return (b[i>>5]>>>(i&31))&1; }

const KEYS=new Map(), COLLISIONS=[];
function addKey(k,i){
  if(!k||k.length<2) return;
  if(KEYS.has(k) && KEYS.get(k)!==i) COLLISIONS.push(k+' → '+E[KEYS.get(k)].nm+' / '+E[i].nm);
  else KEYS.set(k,i);
}
(function buildKeys(){
  for(let i=0;i<N;i++){
    const e=E[i];
    addKey(norm(e.nm),i);
    addKey(norm(e.id),i);
    for(const a of (e.al||[])) addKey(norm(a),i);
  }
})();
if(COLLISIONS.length) console.error('[wattage] key collisions:', COLLISIONS);
(function selfTest(){
  const bad=[];
  for(let i=0;i<N;i++) if(KEYS.get(norm(E[i].nm))!==i) bad.push(E[i].nm);
  if(bad.length) console.error('[wattage] canonical names that do not round-trip:', bad);
  const ids=new Set(); E.forEach(e=>{ if(ids.has(e.id)) console.error('[wattage] duplicate id',e.id); ids.add(e.id); });
  window.__selfTest={collisions:COLLISIONS,roundTrip:bad};
})();
const KEYLIST=[...KEYS.keys()];

/* ============================================================================================
   SOLVABILITY — see RAMAYANA_GRID.md §4.4 and valence/index.html for the full rationale. Verified
   with a 10,000-simulated-day audit before shipping: 0 fallback days, 0 unsolvable days, every
   criterion above reachable at least once. Run ?audit=365 to reproduce a slice of that locally.
   ============================================================================================ */
function perfectMatching(cands){
  const matchE=new Int32Array(N).fill(-1);
  const seen=new Uint8Array(N);
  function tryCell(c){
    for(const p of cands[c]){
      if(seen[p]) continue;
      seen[p]=1;
      if(matchE[p]<0 || tryCell(matchE[p])){ matchE[p]=c; return true; }
    }
    return false;
  }
  for(let c=0;c<9;c++){ seen.fill(0); if(!tryCell(c)) return false; }
  return true;
}
function heaviestMatching(cands){
  const idx=new Map(), cols=[];
  for(let c=0;c<9;c++){
    const sorted=cands[c].slice().sort((a,b)=>{
      const d=E[a].fa-E[b].fa; return d!==0?d:a-b;
    }).slice(0,12);
    for(const p of sorted) if(!idx.has(p)){ idx.set(p,cols.length); cols.push(p); }
  }
  const m=cols.length; if(m<9) return 0;
  const INF=1e9, cost=[];
  for(let c=0;c<9;c++){
    const row=new Array(m).fill(INF);
    for(const p of cands[c]){ const j=idx.get(p); if(j!==undefined) row[j]=-(6-E[p].fa); }
    cost.push(row);
  }
  const u=new Array(10).fill(0), v=new Array(m+1).fill(0), pcol=new Array(m+1).fill(0), way=new Array(m+1).fill(0);
  for(let i=1;i<=9;i++){
    pcol[0]=i; let j0=0;
    const minv=new Array(m+1).fill(INF), used=new Array(m+1).fill(false);
    do{
      used[j0]=true; const i0=pcol[j0]; let delta=INF, j1=0;
      for(let j=1;j<=m;j++) if(!used[j]){
        const cur=cost[i0-1][j-1]-u[i0]-v[j];
        if(cur<minv[j]){ minv[j]=cur; way[j]=j0; }
        if(minv[j]<delta){ delta=minv[j]; j1=j; }
      }
      if(delta>=INF/2) return 0;
      for(let j=0;j<=m;j++){ if(used[j]){ u[pcol[j]]+=delta; v[j]-=delta; } else minv[j]-=delta; }
      j0=j1;
    } while(pcol[j0]!==0);
    do{ const j1=way[j0]; pcol[j0]=pcol[j1]; j0=j1; } while(j0);
  }
  let total=0;
  for(let j=1;j<=m;j++) if(pcol[j]) total += -cost[pcol[j]-1][j-1];
  return total;
}

/* ============================================================================================
   GENERATING THE DAY'S GRID — one mulberry32(daySeed(dayKey())) stream, fixed order, per /DAILY.md.
   ============================================================================================ */
const FALLBACK=[
 {rows:['k-ren','k-non','c-yes'],      cols:['e-yes','h-yes','fo-chem']},
 {rows:['c-yes','c-no','a-old'],       cols:['k-ren','e-yes','h-yes']},
 {rows:['f-yes','x-yes','h-yes'],      cols:['c-yes','e-yes','k-non']},
 {rows:['e-yes','h-yes','t-yes'],      cols:['k-ren','c-yes','fo-chem']},
 {rows:['a-old','a-new','c-yes'],      cols:['e-yes','h-yes','k-ren']},
 {rows:['k-ren','w-yes','c-no'],       cols:['e-yes','h-yes','fo-chem']}
];
function critIndex(id){ for(let i=0;i<CRITERIA.length;i++) if(CRITERIA[i].id===id) return i; return -1; }

function axisRuleOK(rows,cols){
  for(const r of rows) for(const c of cols){
    const R=CRITERIA[r], C=CRITERIA[c];
    if(R.single && C.single && R.family===C.family) return false;
  }
  return true;
}
function buildCells(rows,cols){
  const cells=[];
  for(let i=0;i<3;i++) for(let j=0;j<3;j++) cells.push(andBits(BITS[rows[i]],BITS[cols[j]]));
  return cells;
}
function gradeGrid(rows,cols){
  if(!axisRuleOK(rows,cols)) return null;
  const cells=buildCells(rows,cols), counts=cells.map(countBits);
  if(Math.min.apply(null,counts)<3) return null;
  if(Math.max.apply(null,counts)>16) return null;
  const sum=counts.reduce((a,b)=>a+b,0);
  if(sum<20||sum>75) return null;
  const rowN=rows.map(r=>countBits(BITS[r])), colN=cols.map(c=>countBits(BITS[c]));
  let dull=0;
  for(let i=0;i<3;i++) for(let j=0;j<3;j++){
    const n=counts[i*3+j];
    if(n===rowN[i] || n===colN[j]) dull++;
  }
  if(dull>2) return null;
  const cands=cells.map(bitMembers);
  for(const list of cands) if(!list.some(i=>E[i].fa>=3)) return null;
  if(!perfectMatching(cands)) return null;
  return {rows,cols,cells,counts,cands,sum};
}
function compatible(c,rows){
  const C=CRITERIA[c];
  for(const r of rows){
    const R=CRITERIA[r];
    if(r===c) return false;
    if(R.single && C.single && R.family===C.family) return false;
    const n=countBits(andBits(BITS[r],BITS[c]));
    if(n<3 || n>16) return false;
  }
  return true;
}
function makeGrid(key){
  const rng=mulberry32(daySeed(key));
  const ramp=tierPool(key);
  const pool=[];
  for(let i=0;i<CRITERIA.length;i++) if(ramp.tiers.indexOf(CRITERIA[i].tier)>=0) pool.push(i);
  const drawFrom=(list,exclude)=>{
    if(list.length<=exclude.length) return -1;
    for(let guard=0;guard<400;guard++){
      const c=list[Math.floor(rng()*list.length)];
      if(exclude.indexOf(c)<0) return c;
    }
    return -1;
  };
  for(let attempt=0;attempt<400;attempt++){
    const rows=[];
    let ok=true;
    for(let k=0;k<3;k++){ const c=drawFrom(pool,rows); if(c<0){ ok=false; break; } rows.push(c); }
    if(!ok) continue;
    const compat=[];
    for(const c of pool) if(compatible(c,rows)) compat.push(c);
    if(compat.length<3) continue;
    const cols=[];
    for(let k=0;k<3;k++){ const c=drawFrom(compat,cols); if(c<0){ ok=false; break; } cols.push(c); }
    if(!ok) continue;
    let deep=0; for(const c of rows.concat(cols)) if(CRITERIA[c].tier==='deep') deep++;
    if(deep>ramp.maxDeep) continue;
    const g=gradeGrid(rows,cols);
    if(g){ g.fallback=false; g.attempt=attempt; return g; }
  }
  const fb=FALLBACK[daySeed(key)%FALLBACK.length];
  const g=gradeGrid(fb.rows.map(critIndex),fb.cols.map(critIndex));
  if(g){ g.fallback=true; return g; }
  const g2={rows:fb.rows.map(critIndex),cols:fb.cols.map(critIndex)};
  g2.cells=buildCells(g2.rows,g2.cols); g2.counts=g2.cells.map(countBits);
  g2.cands=g2.cells.map(bitMembers); g2.sum=g2.counts.reduce((a,b)=>a+b,0); g2.fallback=true;
  return g2;
}

const params=new URLSearchParams(location.search);
const ARCHIVE=/^\d{4}-\d{2}-\d{2}$/.test(params.get('date')||'') ? params.get('date') : '';
const KEY=ARCHIVE||dayKey();
const LIVE=!ARCHIVE;

const S={ cells:new Array(9).fill(-1), guesses:0, done:false, dirty:new Array(9).fill(0), open:-1 };
let GRID=null, settings={snd:1,type:1,theme:'auto'};

function loadSettings(){
  try{
    const raw=LS.get(SLUG+'.settings');
    raw.split(';').forEach(kv=>{ const i=kv.indexOf('='); if(i<0) return;
      const k=kv.slice(0,i), v=kv.slice(i+1);
      if(k==='snd'&&(v==='1'||v==='0')) settings.snd = +v;
      else if(k==='type'&&(v==='1'||v==='0')) settings.type = +v;
      else if(k==='theme'&&['auto','light','dark'].indexOf(v)>=0) settings.theme=v; });
  }catch(e){}
}
function saveSettings(){ LS.set(SLUG+'.settings','snd='+settings.snd+';type='+settings.type+';theme='+settings.theme); }
function loadState(){
  if(!LIVE) return;
  try{
    const raw=LS.get(SLUG+'.state'); if(!raw) return;
    const a=raw.split('|');
    if(a[0]!==KEY) return;
    const ids=(a[1]||'').split(',');
    for(let i=0;i<9;i++){
      const id=ids[i]; if(!id) continue;
      const j=KEYS.has(norm(id)) ? KEYS.get(norm(id)) : -1;
      if(j>=0 && GRID && testBit(GRID.cells[i],j)) S.cells[i]=j;
    }
    S.guesses=Math.max(0,Math.min(9,+a[2]||0));
    S.done=a[3]==='1';
    const d=a[4]||''; for(let i=0;i<9;i++) S.dirty[i] = d.charAt(i)==='1'?1:0;
  }catch(e){ S.cells=new Array(9).fill(-1); S.guesses=0; S.done=false; S.dirty=new Array(9).fill(0); }
}
function saveState(){
  if(!LIVE) return;
  const ids=S.cells.map(i=>i<0?'':E[i].id).join(',');
  LS.set(SLUG+'.state', KEY+'|'+ids+'|'+S.guesses+'|'+(S.done?1:0)+'|'+S.dirty.join(''));
}
function filled(){ let n=0; for(const c of S.cells) if(c>=0) n++; return n; }
function weight(){ let w=0; for(const c of S.cells) if(c>=0) w+=6-E[c].fa; return w; }

/* ============================================================================================
   AUDIO — WebAudio oscillators only, no files.
   ============================================================================================ */
let AC=null;
function ac(){ try{ if(!AC) AC=new (window.AudioContext||window.webkitAudioContext)();
  if(AC.state==='suspended') AC.resume(); return AC; }catch(e){ return null; } }
function chime(){
  if(!settings.snd) return; const c=ac(); if(!c) return;
  const t=c.currentTime;
  [[880,0],[1318,0.045]].forEach(([f,d])=>{
    const o=c.createOscillator(), g=c.createGain();
    o.type='sine'; o.frequency.value=f;
    g.gain.setValueAtTime(0.0001,t+d); g.gain.exponentialRampToValueAtTime(0.15,t+d+0.012);
    g.gain.exponentialRampToValueAtTime(0.0001,t+d+0.3);
    o.connect(g).connect(c.destination); o.start(t+d); o.stop(t+d+0.32);
  });
}
function dull(){
  if(!settings.snd) return; const c=ac(); if(!c) return;
  const t=c.currentTime, o=c.createOscillator(), g=c.createGain();
  o.type='triangle'; o.frequency.setValueAtTime(155,t); o.frequency.linearRampToValueAtTime(112,t+0.18);
  g.gain.setValueAtTime(0.13,t); g.gain.exponentialRampToValueAtTime(0.001,t+0.2);
  o.connect(g).connect(c.destination); o.start(t); o.stop(t+0.21);
}
function fanfare(){
  if(!settings.snd) return; const c=ac(); if(!c) return;
  const t=c.currentTime;
  [587,740,880,1174].forEach((f,i)=>{
    const o=c.createOscillator(), g=c.createGain();
    o.type='sine'; o.frequency.value=f;
    const d=i*0.13;
    g.gain.setValueAtTime(0.0001,t+d); g.gain.exponentialRampToValueAtTime(0.13,t+d+0.02);
    g.gain.exponentialRampToValueAtTime(0.0001,t+d+0.42);
    o.connect(g).connect(c.destination); o.start(t+d); o.stop(t+d+0.44);
  });
}

    h.addEventListener('keydown',ev=>{ if(ev.key==='Enter'||ev.key===' '){ ev.preventDefault(); say(critOf(i,true).label); } });
    g.appendChild(h);
    for(let j=0;j<3;j++){
      const k=i*3+j;
      const cell=document.createElement('div');
      cell.className='cell'; cell.id='cell'+k; cell.tabIndex=0;
      cell.setAttribute('role','gridcell');
      cell.setAttribute('aria-rowindex',String(i+1)); cell.setAttribute('aria-colindex',String(j+1));
      cell.addEventListener('click',ev=>{ if(ev.target.classList.contains('hint')) return; openCell(k); });
      cell.addEventListener('keydown',ev=>onCellKey(ev,k));
      g.appendChild(cell);
    }
  }
  paint();
}
function onCellKey(ev,k){
  const i=Math.floor(k/3), j=k%3;
  let t=-1;
  if(ev.key==='ArrowRight') t=i*3+((j+1)%3);
  else if(ev.key==='ArrowLeft') t=i*3+((j+2)%3);
  else if(ev.key==='ArrowDown') t=((i+1)%3)*3+j;
  else if(ev.key==='ArrowUp') t=((i+2)%3)*3+j;
  else if(ev.key==='Enter'||ev.key===' '){ ev.preventDefault(); openCell(k); return; }
  if(t>=0){ ev.preventDefault(); const el=$('cell'+t); if(el) el.focus(); }
}
function paint(){
  for(let k=0;k<9;k++){
    const el=$('cell'+k); if(!el) continue;
    const e=S.cells[k]>=0?E[S.cells[k]]:null;
    el.classList.toggle('on',!!e);
    el.setAttribute('aria-label',cellLabel(k));
    el.innerHTML='';
    if(e){
      const nm=document.createElement('span'); nm.className='nm'; nm.textContent=e.nm;
      const wt=document.createElement('span'); wt.className='wt'; wt.textContent=String(6-e.fa);
      el.appendChild(nm); el.appendChild(wt);
    }else{
      const p=document.createElement('span'); p.className='plus'; p.textContent='+';
      const b=document.createElement('button'); b.className='hint'; b.type='button';
      b.setAttribute('aria-label','How many energy sources fit this cell'); b.innerHTML='&#9432;';
      b.addEventListener('click',ev=>{ ev.stopPropagation();
        say(GRID.counts[k]+' source'+(GRID.counts[k]===1?'':'s')+' in the roster fit that cell.'); });
      el.appendChild(p); el.appendChild(b);
    }
  }
  $('sCells').textContent=filled()+'/9';
  $('sGuess').textContent=String(9-S.guesses);
  $('sWeight').textContent=String(weight());
  $('bReveal').hidden=!S.done;
}
function say(t,cls){ const m=$('msg'); m.innerHTML=''; const s=document.createElement('span');
  if(cls) s.className=cls; s.textContent=t; m.appendChild(s); }

/* ============================================================================================
   THE SHEET, THE TYPEAHEAD AND RESOLUTION
   ============================================================================================ */
function openCell(k){
  if(S.done || S.cells[k]>=0) return;
  S.open=k;
  $('critRow').textContent=critOf(Math.floor(k/3),true).label;
  $('critCol').textContent=critOf(k%3,false).label;
  $('sheetMeta').textContent=(9-S.guesses)+' guess'+(9-S.guesses===1?'':'es')+' left · '+
    GRID.counts[k]+' sources fit this cell';
  $('guess').value=''; $('sheetMsg').textContent=''; $('disamb').hidden=true; $('ta').innerHTML='';
  $('sheet').hidden=false; $('scrim').classList.add('show');
  requestAnimationFrame(()=>{ $('sheet').classList.add('show'); $('guess').focus(); });
}
function closeSheet(){
  S.open=-1;
  $('sheet').classList.remove('show'); $('scrim').classList.remove('show');
  setTimeout(()=>{ if(S.open<0) $('sheet').hidden=true; },220);
}

const KINDNAME={ren:'Renewable',nonren:'Non-renewable',carrier:'Energy carrier'};

/* The typeahead draws from the ENTIRE roster and is NEVER filtered by what is valid for the open
   cell — filtering it would hand over the answer. See RAMAYANA_GRID.md §3.5. */
function typeahead(){
  const box=$('ta'); box.innerHTML='';
  if(!settings.type) return;
  const q=soft($('guess').value);
  if(q.length<1) return;
  const rank=[[],[],[]], seen=new Set();
  for(let i=0;i<N;i++){
    const e=E[i], k=soft(e.nm);
    if(k.indexOf(q)===0) rank[0].push(i);
    else if((e.al||[]).some(a=>soft(a).indexOf(q)===0)) rank[1].push(i);
    else if(k.indexOf(q)>=0) rank[2].push(i);
  }
  const out=rank[0].concat(rank[1],rank[2])
    .filter(i=>{ if(seen.has(i)) return false; seen.add(i); return true; }).slice(0,6);
  for(const i of out){
    const li=document.createElement('li'), b=document.createElement('button');
    b.type='button';
    b.appendChild(document.createTextNode(E[i].nm));
    const sm=document.createElement('small');
    sm.textContent=KINDNAME[E[i].kind]+' · '+(E[i].comb==='yes'?'burned for energy':'no combustion');
    b.appendChild(sm);
    b.addEventListener('click',()=>{ $('guess').value=E[i].nm; box.innerHTML=''; commit(i); });
    li.appendChild(b); box.appendChild(li);
  }
}

function resolve(text){
  const raw=(text||'').trim();
  const k=norm(raw);
  if(k.length<2) return {kind:'none',tooShort:true};
  if(KEYS.has(k)) return {kind:'hit',index:KEYS.get(k)};
  const cap=fuzzCap(k), hits=[];
  for(const key of KEYLIST){
    if(Math.abs(key.length-k.length)>cap) continue;
    if(dl(k,key,cap)<=cap){ const i=KEYS.get(key); if(hits.indexOf(i)<0) hits.push(i); }
  }
  if(hits.length===1) return {kind:'hit',index:hits[0]};
  if(hits.length>1) return {kind:'ambiguous',options:hits.slice(0,6)};
  return {kind:'none'};
}

function submit(){
  if(S.open<0) return;
  const raw=$('guess').value.trim();
  const r=resolve(raw);
  $('disamb').hidden=true;
  if(r.kind==='none'){
    if(r.tooShort) return;
    sheetMsg('Wattage doesn’t know that name. The roster is '+N+' energy sources — fossil fuels, '+
             'nuclear, the renewables, and the traditional biofuels. No guess spent.');
    return;
  }
  if(r.kind==='ambiguous'){ showDisamb(r.options); return; }
  commit(r.index);
}
function showDisamb(options){
  const d=$('disamb'); d.innerHTML='';
  const p=document.createElement('p'); p.style.margin='0';
  p.textContent='Which one? (This costs no guess.)'; d.appendChild(p);
  const row=document.createElement('div'); row.className='row';
  for(const i of options){
    const b=document.createElement('button'); b.type='button'; b.textContent=E[i].nm;
    b.addEventListener('click',()=>{ d.hidden=true; commit(i); });
    row.appendChild(b);
  }
  d.appendChild(row); d.hidden=false;
  sheetMsg('');
}
function sheetMsg(t,cls){ const m=$('sheetMsg'); m.innerHTML='';
  const s=document.createElement('span'); if(cls) s.className=cls; s.textContent=t; m.appendChild(s); }

function commit(i){
  const k=S.open; if(k<0) return;
  const e=E[i];
  const already=S.cells.indexOf(i);
  if(already>=0){
    sheetMsg(e.nm+' is already placed — row '+(Math.floor(already/3)+1)+', column '+(already%3+1)+
             '. Each source can only be used once. No guess spent.');
    return;
  }
  const r=critOf(Math.floor(k/3),true), c=critOf(k%3,false);
  const rOK=r.test(e), cOK=c.test(e);
  if(rOK&&cOK){
    S.cells[k]=i; $('guess').value='';
    chime();
    closeSheet(); paint();
    const el=$('cell'+k); if(el){ el.classList.add('lay'); setTimeout(()=>el.classList.remove('lay'),380); }
    say(e.nm+' — '+r.label+' ✓ · '+c.label+' ✓','yes');
    saveState();
    if(filled()===9) endGrid(true);
    return;
  }
  S.guesses++; S.dirty[k]=1; dull();
  const line=e.nm+' — '+r.label+' '+(rOK?'✓':'✗')+' · '+c.label+' '+(cOK?'✓':'✗');
  sheetMsg(line,'nope'); say(line,'nope');
  paint(); saveState();
  if(S.guesses>=9){ closeSheet(); endGrid(false); }
}

/* ============================================================================================
   THE END OF A GRID, THE REVEAL PANEL AND SHARING
   ============================================================================================ */
let siteStreak=0, heaviest=0;
function endGrid(perfect){
  if(S.done) return;
  S.done=true; saveState(); paint();
  if(perfect) fanfare();
  if(LIVE){
    const w=weight();
    if(w>loadToday(SLUG+'.dbest')) saveToday(SLUG+'.dbest',w);
    siteStreak=dailyDone();
    $('sStreak').textContent=String(siteStreak);
  }
  track('grid_end',{filled:filled(),guesses:S.guesses,weight:weight(),heaviest:heaviest,
                    mode:LIVE?'daily':'archive',typeahead:settings.type});
  say(perfect ? 'Nine of nine. The whole grid lit.'
             : filled()+' of nine filled. Every answer is below.');
  setTimeout(showReveal, perfect?900:400);
}
function esc(t){ const d=document.createElement('div'); d.textContent=t; return d.innerHTML; }
function sourceLine(e){
  const bits=[KINDNAME[e.kind]];
  bits.push(e.fossil?'fossil fuel':'not a fossil fuel');
  bits.push(e.comb==='yes'?'burned for energy':'no combustion');
  bits.push(e.elec?'generates electricity':'not used for electricity');
  return bits.join(' · ');
}
function showReveal(){
  const R=$('revInner');
  const parts=[];
  parts.push('<h2 id="revTitle">'+filled()+' of nine</h2>');
  parts.push('<p><b>Weight '+weight()+'</b> of a possible '+heaviest+' · '+S.guesses+
             ' of nine guesses spent'+(settings.type?'':' · recall')+'.</p>');
  parts.push('<textarea class="sharebox" id="shareTxt" rows="7" readonly aria-label="Your result, ready to copy"></textarea>');
  parts.push('<div class="tools"><button class="btn primary" type="button" id="bCopy">Copy result</button>'+
             '<button class="btn" type="button" id="bClose">Back to the grid</button></div>');
  parts.push('<p class="note">Every source in the roster that fits each cell, most familiar first. '+
             'Yours is highlighted. This list is the point of the game — a grid you filled twice over '+
             'and a grid you failed completely show you exactly the same facts.</p>');
  for(let k=0;k<9;k++){
    const r=critOf(Math.floor(k/3),true), c=critOf(k%3,false);
    parts.push('<h3>'+esc(r.label)+' &nbsp;×&nbsp; '+esc(c.label)+
               ' <span style="font-weight:600;opacity:.7">('+GRID.counts[k]+')</span></h3>');
    const list=GRID.cands[k].slice().sort((a,b)=>{
      const d=E[b].fa-E[a].fa; return d!==0?d:a-b;
    });
    parts.push('<ul class="ans">');
    for(const i of list){
      const e=E[i], mine=S.cells[k]===i;
      parts.push('<li'+(mine?' class="mine"':'')+'><b>'+esc(e.nm)+'</b> — '+
        esc(sourceLine(e))+' <span class="w">weight '+(6-e.fa)+'</span>'+
        '<span class="g">'+esc(e.gl)+'</span></li>');
    }
    parts.push('</ul>');
  }
  parts.push('<h3>Conventions this grid uses</h3>');
  parts.push('<p class="note"><b>Hydrogen is not counted as renewable or non-renewable</b> — it is an '+
    '<i>energy carrier</i>. Hydrogen gas has to be manufactured, usually by splitting water with '+
    'electricity or by processing natural gas, so it can only ever be as clean as whatever made it. '+
    'That is a real, teachable distinction, not a dodge, and it is why hydrogen never fills a '+
    '"renewable" or "non-renewable" cell here. <b>Nuclear energy</b> is classed non-renewable, since '+
    'the uranium it uses is a finite mined resource, even though it releases no direct carbon dioxide. '+
    '<b>Peat</b> is classed as a fossil fuel, following the common convention, even though it is the '+
    'earliest stage on the path to coal rather than coal itself.</p>');
  parts.push('<p class="note"><b>Weight is not rarity scoring.</b> It has no server and never phones '+
    'home. It is an <i>editorial</i> measurement set when the dataset was written, reflecting roughly '+
    'how familiar a source is at this level — naming coal is worth one, naming wave energy is worth '+
    'five. It is the same on day one as on day one thousand.</p>');
  parts.push('<p class="note">Where a fact could not be confirmed against a public reference, the '+
    'source was left out of that tag rather than guessed into it — an incomplete tag only ever '+
    'rejects a correct answer, and says so. No criterion here ranks sources by cost, efficiency or '+
    'market share: those change every year and would make the dataset wrong within a season, not just '+
    'incomplete. Something looks off? Corrections are welcome — '+
    '<a href="../">kreeda.games</a></p>');
  R.innerHTML=parts.join('');
  $('shareTxt').value=shareText();
  $('bCopy').addEventListener('click',doCopy);
  $('bClose').addEventListener('click',closeReveal);
  $('reveal').hidden=false; $('reveal').classList.add('show'); $('reveal').scrollTop=0;
  $('revTitle').setAttribute('tabindex','-1'); $('revTitle').focus();
}
function closeReveal(){ $('reveal').classList.remove('show'); $('reveal').hidden=true;
  const el=$('cell0'); if(el) el.focus(); }

function shareText(){
  const MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  const a=KEY.split('-'), head='Kreeda · Wattage · '+(+a[2])+' '+MON[+a[1]-1];
  let rows='';
  for(let i=0;i<3;i++){
    for(let j=0;j<3;j++){
      const k=i*3+j;
      rows += S.cells[k]<0 ? '⬜' : (S.dirty[k] ? '🟨' : '🟦');
    }
    rows+='\n';
  }
  let score=filled()+'/9 · weight '+weight();
  if(!settings.type) score+=' · recall';
  if(LIVE && siteStreak>=2) score+=' · streak '+siteStreak+' 🔥';
  if(!LIVE) score+=' · archive';
  return head+'\n'+rows+score+'\nkreeda.games/wattage/';
}
function doCopy(){
  const t=shareText(), b=$('bCopy');
  const ok=()=>{ b.textContent='Copied'; setTimeout(()=>b.textContent='Copy result',1400); };
  try{
    if(navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(t).then(ok,fallback); }
    else fallback();
  }catch(e){ fallback(); }
  function fallback(){
    const ta=$('shareTxt'); ta.focus(); ta.select();
    try{ document.execCommand('copy'); ok(); }catch(e){ b.textContent='Select and copy'; }
  }
}

function track(name,p){ try{ if(window.bgTrack) window.bgTrack(name,p); }catch(e){} }

/* ============================================================================================
   BOOT
   ============================================================================================ */
function applyTheme(){
  const el=document.documentElement;
  if(settings.theme==='auto') el.removeAttribute('data-theme'); else el.setAttribute('data-theme',settings.theme);
  $('bTheme').textContent='Theme: '+settings.theme;
}
function boot(){
  loadSettings(); applyTheme();
  GRID=makeGrid(KEY);
  heaviest=heaviestMatching(GRID.cands);
  loadState();
  buildGrid();
  const MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  const a=KEY.split('-');
  $('datechip').textContent=(ARCHIVE?'Archive · ':'')+(+a[2])+' '+MON[+a[1]-1]+' '+a[0];
  if(ARCHIVE) $('datechip').classList.add('arch');
  $('asof').textContent='All '+N+' energy sources, fossil fuels through renewables. Answer by name.';
  siteStreak=LIVE ? (LS.get('kreeda.streak').split('|')[0]===dayKey() ? (+LS.get('kreeda.streak').split('|')[1]||0) : 0) : 0;
  $('sStreak').textContent=String(siteStreak);
  $('bSound').setAttribute('aria-pressed',settings.snd?'true':'false');
  $('bSound').textContent='Sound '+(settings.snd?'on':'off');
  $('bType').setAttribute('aria-pressed',settings.type?'true':'false');
  $('bType').textContent='Typeahead '+(settings.type?'on':'off');
  if(S.done){ say(filled()+' of nine filled today. Tap “See every answer”.'); }
  else if(filled()>0) say('Picking up where you left off.');
  else say('Tap a square. Name an energy source that fits both its row and its column.');
  paint();

  $('guess').addEventListener('input',typeahead);
  $('guess').addEventListener('keydown',ev=>{ if(ev.key==='Enter'){ ev.preventDefault(); submit(); } });
  $('bSubmit').addEventListener('click',submit);
  $('bCancel').addEventListener('click',closeSheet);
  $('scrim').addEventListener('click',closeSheet);
  document.addEventListener('keydown',ev=>{ if(ev.key==='Escape'){ if(!$('reveal').hidden){ closeReveal(); }
      else closeSheet(); } });
  $('bReveal').addEventListener('click',showReveal);
  $('bSound').addEventListener('click',()=>{ settings.snd=settings.snd?0:1; saveSettings();
    $('bSound').setAttribute('aria-pressed',settings.snd?'true':'false');
    $('bSound').textContent='Sound '+(settings.snd?'on':'off'); if(settings.snd) chime(); });
  $('bType').addEventListener('click',()=>{ settings.type=settings.type?0:1; saveSettings();
    $('bType').setAttribute('aria-pressed',settings.type?'true':'false');
    $('bType').textContent='Typeahead '+(settings.type?'on':'off'); typeahead(); });
  $('bTheme').addEventListener('click',()=>{ settings.theme = settings.theme==='auto'?'light':
    (settings.theme==='light'?'dark':'auto'); saveSettings(); applyTheme(); });
  $('bHow').addEventListener('click',()=>say('Nine cells, nine guesses. Type the name of an energy '+
    'source that fits both the row and the column — coal, wind, biogas, whatever fits. Each source '+
    'can be used only once. Unknown names, ambiguous names and repeats are free: only a real source '+
    'that does not fit costs a guess. Weight rewards the less obvious answer, and the reveal panel '+
    'lists every answer whatever your score.'));
  if(window.visualViewport){
    const fit=()=>{ const vv=window.visualViewport;
      const lift=Math.max(0, window.innerHeight-(vv.height+vv.offsetTop));
      $('sheet').style.setProperty('bottom', (window.innerWidth<560? lift+'px' : ''));
    };
    window.visualViewport.addEventListener('resize',fit);
    window.visualViewport.addEventListener('scroll',fit);
  }
  track('grid_start',{mode:LIVE?'daily':'archive',fallback:GRID.fallback?1:0,heaviest:heaviest});
}

/* ============================================================================================
   AUDIT — dev only, not linked from anywhere. ?audit=N generates the next N days and reports.
   ?date=YYYY-MM-DD renders any other day, writing nothing.
   ============================================================================================ */
function audit(n){
  const out={days:n,fallbacks:[],minCell:1e9,maxCell:0,sumMin:1e9,sumMax:0,noMatch:[],lowCell:[],
             critUse:{},worst:null};
  let k=dayKey(), totalMin=0;
  for(let d=0;d<n;d++){
    const g=makeGrid(k);
    if(g.fallback) out.fallbacks.push(k);
    const mn=Math.min.apply(null,g.counts), mx=Math.max.apply(null,g.counts);
    if(mn<out.minCell){ out.minCell=mn; out.worst=k; }
    if(mx>out.maxCell) out.maxCell=mx;
    out.sumMin=Math.min(out.sumMin,g.sum); out.sumMax=Math.max(out.sumMax,g.sum);
    totalMin+=mn;
    if(mn<3) out.lowCell.push(k+':'+mn);
    if(!perfectMatching(g.cands)) out.noMatch.push(k);
    for(const c of g.rows.concat(g.cols)){ const id=CRITERIA[c].id; out.critUse[id]=(out.critUse[id]||0)+1; }
    const a=k.split('-'), t=new Date(+a[0],+a[1]-1,+a[2]); t.setDate(t.getDate()+1); k=dayKey(t);
  }
  out.meanMin=+(totalMin/n).toFixed(2);
  out.ok = out.fallbacks.length===0 && out.lowCell.length===0 && out.noMatch.length===0;
  console.log('[wattage audit]', JSON.stringify(out));
  window.__audit=out;
  return out;
}
try{ boot(); }catch(e){ console.error('[wattage] boot failed',e); }
if(params.get('audit')) audit(Math.max(1,Math.min(2000,+params.get('audit')||365)));
</script>
