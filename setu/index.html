<style>
  /* ------------------------------------------------------------------------
     Daśānana's palette is a dawn over a battlefield. Setu is the same family
     turned toward the sea: the strait at dawn, nine stones lying on the water.
     Every colour is defined once on bare :root so that a viewer whose OS is set
     to "no preference" still gets a complete palette; the dark blocks only ever
     REDEFINE tokens, never introduce them.
     ------------------------------------------------------------------------ */
  :root{
    --sea-deep:#0b3a4a; --sea:#12586c; --foam:rgba(255,255,255,.14);
    --sky-hi:#6ec6ff;   --sky-lo:#ffd27a;
    --stone:#f6efdd;    --stone-set:#ffe2a8;  --stone-rule:rgba(178,122,32,.5);
    --ink:#2a1a0a;      --ink-dim:#6a5232;
    --amber:#ff8a1e;    --gold:#ffb62e;
    --panel:rgba(255,250,238,.94);
    --panel-rule:rgba(178,122,32,.55);
    /* Two inks for the two grounds the page has: the pale dawn sky at the top and
       the deep water at the foot. One near-white for both washed the masthead out
       to about 1.6:1 against #6ec6ff, which is unreadable. */
    --sky-ink:#0e2f3d;   --deep-ink:#eaf3f6;
    --shadow:rgba(12,40,52,.22);
    --radius:16px;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --sea-deep:#04202a; --sea:#0a3948; --foam:rgba(255,255,255,.08);
      --sky-hi:#1d5f86;   --sky-lo:#7a5a28;
      --stone:#2a2418;    --stone-set:#4a3c20;  --stone-rule:rgba(214,168,80,.45);
      --ink:#f6ecd6;      --ink-dim:#c3ac82;
      --panel:rgba(24,32,36,.95);
      --panel-rule:rgba(214,168,80,.35);
      --sky-ink:#eadfc6;   --deep-ink:#e2eef2;
      --shadow:rgba(0,0,0,.45);
    }
  }
  :root[data-theme="dark"]{
    --sea-deep:#04202a; --sea:#0a3948; --foam:rgba(255,255,255,.08);
    --sky-hi:#1d5f86;   --sky-lo:#7a5a28;
    --stone:#2a2418;    --stone-set:#4a3c20;  --stone-rule:rgba(214,168,80,.45);
    --ink:#f6ecd6;      --ink-dim:#c3ac82;
    --panel:rgba(24,32,36,.95);
    --panel-rule:rgba(214,168,80,.35);
    --sky-ink:#eadfc6;   --deep-ink:#e2eef2;
    --shadow:rgba(0,0,0,.45);
  }

  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ margin:0; padding:0; }
  body{
    min-height:100%;
    /* the strait: sky above, water below. A fixed attachment would judder on iOS
       when the address bar collapses, so the gradient is on the body box itself. */
    background:
      linear-gradient(180deg, var(--sky-hi) 0, var(--sky-lo) 120px, var(--sea) 210px, var(--sea-deep) 420px)
      var(--sea-deep) no-repeat;
    color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    font-size:16px; line-height:1.5;
    padding: max(10px, env(safe-area-inset-top)) max(10px, env(safe-area-inset-right))
             max(18px, env(safe-area-inset-bottom)) max(10px, env(safe-area-inset-left));
    -webkit-text-size-adjust:100%;
  }

  /* Devanāgarī gets an explicit stack because the site ships no webfont and games
     must work offline. If none of these resolve, boot sets data-dev="off" (see
     detectDevanagari) and every .dev goes away — a player must never see tofu. */
  .dev{ font-family:"Noto Sans Devanagari","Nirmala UI","Kohinoor Devanagari",
        "Devanagari Sangam MN","Mangal","Samanata","Lohit Devanagari",sans-serif; }
  html[data-dev="off"] .dev{ display:none !important; }

  .wrap{ max-width:560px; margin:0 auto; }

  /* ---- masthead ---------------------------------------------------------- */
  .top{ display:flex; align-items:flex-start; gap:10px; margin-bottom:10px; }
  .top .id{ flex:1 1 auto; min-width:0; }
  h1{ margin:0; font-size:clamp(26px,7.5vw,38px); font-weight:900; letter-spacing:1px;
      color:var(--sky-ink); line-height:1; }
  h1 .sanskrit{ font-size:.52em; font-weight:700; opacity:.85; margin-left:8px; letter-spacing:0; }
  .tagline{ margin:5px 0 0; font-size:12.5px; color:var(--sky-ink); opacity:.9; }
  .topbtns{ display:flex; gap:6px; flex:0 0 auto; }
  .iconBtn{
    width:38px; height:38px; min-width:38px; border-radius:11px; cursor:pointer;
    background:var(--panel); border:1.5px solid var(--panel-rule); color:var(--ink);
    font-size:15px; display:flex; align-items:center; justify-content:center; padding:0;
  }
  .iconBtn:active{ transform:scale(.94); }
  .iconBtn:focus-visible, .btn:focus-visible, .stone:focus-visible, .hdr:focus-visible{
    outline:3px solid var(--gold); outline-offset:2px; }

  .status{ display:flex; flex-wrap:wrap; gap:6px; align-items:center; margin:0 0 10px; }
  .chip{
    font-size:12px; font-weight:700; letter-spacing:.2px;
    background:var(--panel); border:1.5px solid var(--panel-rule); color:var(--ink);
    border-radius:999px; padding:5px 11px;
  }
  .chip b{ font-variant-numeric:tabular-nums; }
  .chip.warn{ border-color:var(--amber); }

  /* ---- the grid ---------------------------------------------------------- */
  /* 4×4: corner, three column headers, three row headers, nine stones. A fixed
     min-height on the header cells keeps the grid from reflowing when the day
     changes and a label wraps to a different number of lines. */
  .board{
    width:min(94vw,460px); margin:0 auto;
    display:grid; grid-template-columns:74px repeat(3,1fr); gap:6px;
  }
  @media (min-width:560px){ .board{ width:520px; grid-template-columns:96px repeat(3,1fr); } }
  /* display:contents lets the ARIA row wrappers exist for screen readers without
     becoming grid items themselves, so the 4×4 track layout is unaffected. */
  .board > [role="row"]{ display:contents; }

  .corner svg{ width:100%; max-width:88px; height:auto; opacity:.95; }
  .hdr{
    background:var(--panel); border:1.5px solid var(--panel-rule); border-radius:12px;
    color:var(--ink); font:inherit; font-size:11px; font-weight:800; line-height:1.22;
    padding:6px 4px; text-align:center; cursor:pointer;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px;
    min-height:56px; overflow:hidden;
  }
  .hdr .d{ font-size:10px; font-weight:600; opacity:.72; }
  .hdr.row{ min-height:0; }
  .tierdot{ display:inline-block; width:5px; height:5px; border-radius:50%; background:var(--amber); margin-left:3px; vertical-align:middle; }

  .stone{
    position:relative; aspect-ratio:1; min-height:78px;
    background:var(--stone); border:1.5px solid var(--stone-rule); border-radius:14px;
    color:var(--ink); font:inherit; cursor:pointer; padding:6px 4px 4px;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:1px;
    box-shadow:0 2px 6px var(--shadow); overflow:hidden;
  }
  .stone:disabled{ cursor:default; }
  .stone .nm{ font-size:13px; font-weight:800; line-height:1.15; word-break:break-word; }
  .stone .nd{ font-size:11px; opacity:.75; line-height:1.2; }
  .stone .wt{ font-size:10px; font-weight:700; color:var(--ink-dim); margin-top:2px; }
  .stone.set{ background:var(--stone-set); }
  /* correct is never conveyed by colour alone: a laid stone carries a filled
     corner notch as well as the name it was laid with. */
  .stone.set::after{
    content:''; position:absolute; top:0; right:0; width:0; height:0;
    border-top:16px solid var(--amber); border-left:16px solid transparent;
  }
  .stone .info{
    position:absolute; left:2px; bottom:2px; width:26px; height:26px; border-radius:50%;
    border:none; background:transparent; color:var(--ink-dim); font-size:13px; cursor:pointer;
    display:flex; align-items:center; justify-content:center; padding:0;
  }
  .stone .info:focus-visible{ outline:2px solid var(--gold); outline-offset:0; }
  .stone .hint{ font-size:10px; font-weight:700; color:var(--ink-dim); }

  /* ---- bridge strip ------------------------------------------------------ */
  #bridge{ display:block; width:min(94vw,460px); height:52px; margin:10px auto 0; border-radius:12px; }
  @media (min-width:560px){ #bridge{ width:520px; } }

  /* ---- buttons ----------------------------------------------------------- */
  .btn{
    background:linear-gradient(90deg,var(--gold),var(--amber)); border:none; color:#3a2208;
    font:inherit; font-weight:800; letter-spacing:.5px; padding:12px 22px; border-radius:24px;
    font-size:15px; cursor:pointer; box-shadow:0 3px 10px rgba(160,90,10,.35); min-height:44px;
  }
  .btn:active{ transform:scale(.97); }
  .btn.sec{ background:var(--panel); color:var(--ink); border:1.5px solid var(--panel-rule); box-shadow:none; }
  .btnrow{ display:flex; flex-wrap:wrap; gap:8px; justify-content:center; margin-top:14px; }

  /* ---- live region / message -------------------------------------------- */
  #say{ position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; }

  /* ---- sheet ------------------------------------------------------------- */
  .scrim{ position:fixed; inset:0; background:rgba(4,20,28,.55); z-index:40; display:none; }
  .scrim.on{ display:block; }
  .sheet{
    position:fixed; left:0; right:0; bottom:0; z-index:41;
    background:var(--panel); border-top:1.5px solid var(--panel-rule);
    border-radius:var(--radius) var(--radius) 0 0; color:var(--ink);
    padding:14px 14px calc(14px + env(safe-area-inset-bottom));
    max-height:88vh; overflow-y:auto; display:none;
    box-shadow:0 -6px 24px var(--shadow);
  }
  .sheet.on{ display:block; }
  @media (min-width:560px){
    .sheet{ left:50%; right:auto; bottom:auto; top:50%; transform:translate(-50%,-50%);
            width:480px; border-radius:var(--radius); border:1.5px solid var(--panel-rule); }
  }
  .sheet h2{ margin:0 0 8px; font-size:15px; font-weight:900; }
  .crit{ font-size:13.5px; line-height:1.45; margin:0 0 2px; }
  .crit .lab{ font-weight:800; color:var(--ink-dim); font-size:11px; text-transform:uppercase; letter-spacing:.6px; margin-right:5px; }
  .sheet .meta{ font-size:12px; color:var(--ink-dim); margin:8px 0 6px; }
  #guessInput{
    width:100%; font:inherit; font-size:17px; padding:12px 12px; border-radius:12px;
    border:1.5px solid var(--panel-rule); background:var(--stone); color:var(--ink); min-height:48px;
  }
  #guessInput:focus{ outline:3px solid var(--gold); outline-offset:1px; }
  #typeahead{ list-style:none; margin:8px 0 0; padding:0; display:flex; flex-wrap:wrap; gap:6px; }

  }
  .msg{ margin:10px 0 0; font-size:13.5px; line-height:1.5; min-height:1.5em; }

  .msg .no{ color:#b8360a; font-weight:700; }
  html[data-theme="dark"] .msg .no{ color:#ff9a6a; }
  @media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .msg .no{ color:#ff9a6a; } }
  .disamb{ display:flex; flex-wrap:wrap; gap:6px; margin-top:8px; }

  /* ---- reveal ------------------------------------------------------------ */
  .panel{
    background:var(--panel); border:1.5px solid var(--panel-rule); border-radius:var(--radius);
    padding:14px; margin-top:14px; color:var(--ink);

  .panel h2{ margin:0 0 4px; font-size:19px; font-weight:900; }
  .panel h3{ margin:16px 0 6px; font-size:13px; font-weight:900; line-height:1.35; }
  .panel p{ margin:6px 0; font-size:13.5px; line-height:1.55; }
  .panel .small{ font-size:12px; color:var(--ink-dim); }
  .ans{ margin:0; padding:0; list-style:none; }
  .ans li{ padding:7px 0; border-top:1px solid var(--stone-rule); font-size:13px; line-height:1.5; }
  .ans li:first-child{ border-top:none; }
  .ans .nm{ font-weight:800; }
  .ans .yours{ display:inline-block; font-size:10px; font-weight:900; letter-spacing:.6px;

  .ans .cite{ color:var(--ink-dim); font-size:11.5px; }
  .scoreline{ font-size:15px; font-weight:800; margin:8px 0 0; }
  .shareblk{ font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:15px; line-height:1.25; white-space:pre; }
  details.note{ margin-top:12px; }
  details.note summary{ cursor:pointer; font-size:13px; font-weight:800; }
  a{ color:#a85a06; }
  html[data-theme="dark"] a{ color:var(--gold); }
  @media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) a{ color:var(--gold); } }

  /* ---- settings ---------------------------------------------------------- */
  .setrow{ display:flex; align-items:center; justify-content:space-between; gap:10px; padding:9px 0;

  .seg button{ font:inherit; font-size:12px; font-weight:700; padding:7px 11px; min-height:38px; border-radius:9px;

  .seg button[aria-pressed="true"]{ background:var(--amber); color:#3a2208; border-color:var(--amber); }

  .foot{ text-align:center; margin:18px 0 0; font-size:12.5px; color:var(--deep-ink); opacity:.85; }

  @media (prefers-reduced-motion: reduce){
    *{ animation-duration:.001ms !important; animation-iteration-count:1 !important; transition-duration:.001ms !important; }
  }
</style>

   The spine is the Vālmīki Rāmāyaṇa. Sarga numbers follow the widely-circulated

   reveal panel says so out loud. Where the Baroda critical edition disagrees the
   difference is one of numbering, not of the facts asserted here.

   THE kandas THRESHOLD, applied uniformly: an entity carries a kāṇḍa when it is
   NAMED AS A PARTICIPANT IN THE NARRATIVE of that kāṇḍa. Being mentioned in a
   genealogy, a simile or a list of the dead does not count; speaking, acting or
   being acted upon does. This is the most-used axis in the game and the easiest
   to get subtly wrong, so the threshold is written down rather than felt.

/* ---- Kreeda daily contract — see /DAILY.md. Copied, not imported: the game stays one file. ----
   Setu's daily is the GRID ITSELF: six criteria drawn from one seeded stream, so every player in
   the world opens the same nine questions with no server involved. Practice mode draws from
   Math.random and writes only setu.best, because a grid you can re-roll must never touch the daily. */
const SLUG='setu';
function dayKey(d){ d=d||new Date(); const p=n=>String(n).padStart(2,'0');
  return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate()); }
function prevDayKey(k){ const a=k.split('-'), t=new Date(+a[0],+a[1]-1,+a[2]);
  t.setDate(t.getDate()-1); return dayKey(t); }
function daySeed(k){ let h=5381; for(let i=0;i<k.length;i++) h=(h*33 ^ k.charCodeAt(i))|0; return h>>>0; }
function mulberry32(a){ return function(){ a=(a+0x6D2B79F5)|0; let t=Math.imul(a^(a>>>15),1|a);
  t=(t+Math.imul(t^(t>>>7),61|t))^t; return ((t^(t>>>14))>>>0)/4294967296; }; }

/* localStorage throws outright in Safari private mode and on some file:// origins. A game that
   cannot save must still play, so every read returns '' and every write is a no-op. */
const LS={ get:k=>{ try{ return localStorage.getItem(k)||''; }catch(e){ return ''; } },
           set:(k,v)=>{ try{ localStorage.setItem(k,v); }catch(e){} },
           del:k=>{ try{ localStorage.removeItem(k); }catch(e){} } };

function loadToday(key){ const s=LS.get(key), i=s.indexOf('|');
  return (i<0 || s.slice(0,i)!==dayKey()) ? 0 : (+s.slice(i+1)||0); }
function saveToday(key,v){ LS.set(key, dayKey()+'|'+Math.round(v)); }
function loadBest(){ return +LS.get(SLUG+'.best')||0; }
function saveBest(v){ LS.set(SLUG+'.best', String(Math.round(v))); }

function bumpStreak(key){
  const s=LS.get(key), i=s.indexOf('|'), last=i<0?'':s.slice(0,i), n=i<0?0:(+s.slice(i+1)||0);
  const today=dayKey(), count = last===today ? (n||1) : (last===prevDayKey(today) ? n+1 : 1);
  LS.set(key, today+'|'+count); return count;
}
function siteStreak(){ const s=LS.get('kreeda.streak'), i=s.indexOf('|');
  return (i<0 || s.slice(0,i)!==dayKey()) ? 0 : (+s.slice(i+1)||0); }

/* Called once when the grid ENDS, either way — 9/9 or out of guesses. A streak that demanded a
   perfect grid would break for everybody in the first week and then mean nothing; showing up is
   the feat the streak pays for. */
function dailyDone(){
  const today=dayKey(), k='kreeda.daily.'+today;
  const had=LS.get(k).split(',').filter(Boolean);
  if(!had.includes(SLUG)) LS.set(k, had.concat(SLUG).join(','));
  bumpStreak(SLUG+'.streak');
  return bumpStreak('kreeda.streak');
}
const MONTHS=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function shareDate(key){ const a=key.split('-'); return (+a[2])+' '+MONTHS[(+a[1])-1]; }

/* ================================================================================
   §3  VALIDATION
   The runtime normaliser is deliberately small and conservative; ambiguity is
   absorbed by the hand-written `alt` list on each entity. Every blanket rule here
   fires on EVERY name in the roster, so each one is a collision risk; every alias
   fires on exactly one entity, so it is free. When in doubt, write an alias.
   ================================================================================ */

/* Devanāgarī → plain ASCII. The whole trick is that step 2 of norm() strips every
   diacritic anyway, so this only ever has to emit unmarked Latin: ष श स all give
   's', ण न give 'n', ट त give 't', ड द give 'd'. That turns correct ISO 15919
   transliteration (hard) into a table lookup (easy). */
const DEV_CONS={ 'क':'k','ख':'k','ग':'g','घ':'g','ङ':'n','च':'c','छ':'c','ज':'j','झ':'j','ञ':'n',
 'ट':'t','ठ':'t','ड':'d','ढ':'d','ण':'n','त':'t','थ':'t','द':'d','ध':'d','न':'n',
 'प':'p','फ':'p','ब':'b','भ':'b','म':'m','य':'y','र':'r','ल':'l','व':'v','श':'s','ष':'s','स':'s',
 'ह':'h','ळ':'l','क़':'k','ख़':'k','ग़':'g','ज़':'j','ड़':'d','ढ़':'d','फ़':'p','य़':'y' };
const DEV_MATRA={ 'ा':'a','ि':'i','ी':'i','ु':'u','ू':'u','ृ':'ri','ॄ':'ri','ॢ':'li','े':'e','ै':'ai',
 'ो':'o','ौ':'au','ॉ':'o','ॅ':'e' };
const DEV_VOWEL={ 'अ':'a','आ':'a','इ':'i','ई':'i','उ':'u','ऊ':'u','ऋ':'ri','ॠ':'ri','ऌ':'li',
 'ए':'e','ऐ':'ai','ओ':'o','औ':'au','ऑ':'o' };
function devToAscii(s){
  let out='', pend='';
  for(let i=0;i<s.length;i++){
    const ch=s[i];
    if(DEV_CONS[ch]!==undefined){ out+=pend; out+=DEV_CONS[ch]; pend='a'; }
    else if(DEV_MATRA[ch]!==undefined){ pend=DEV_MATRA[ch]; }
    else if(ch==='्'){ pend=''; }                      // virāma cancels the inherent vowel
    else if(DEV_VOWEL[ch]!==undefined){ out+=pend; pend=''; out+=DEV_VOWEL[ch]; }
    else if(ch==='ं'||ch==='ँ'){ out+=pend; pend=''; out+='m'; }   // anusvāra / candrabindu
    else if(ch==='ः'){ out+=pend; pend=''; out+='h'; }                  // visarga
    else { /* avagraha, daṇḍa, ZWJ/ZWNJ, digits, anything else: skip */ }
  }
  return out+pend;
}

/* keepFinalA exists for ONE caller: the typeahead. Step 11 turns a two-letter query
   like "sa" into "s", which is below the two-character floor, so a player typing the
   first two letters of Sampāti would see nothing at all. Prefix search compares
   query and candidate with the schwa left on, so "ram" still prefixes "rama"; the
   KEYS map and every resolution still use the full eleven steps. */
function norm(s, keepFinalA){
  if(!s) return '';
  if(/[\u0900-\u097F]/.test(s)) s = devToAscii(s);
  /* Decompose, then drop every combining mark. This ONE LINE folds the whole of IAST:
     ā→a+U+0304, ś→s+U+0301, ṇ→n+U+0323, ṛ→r+U+0323, ṁ→m+U+0307, ñ→n+U+0303 and the
     rest all have canonical NFD decompositions, so stripping U+0300–U+036F leaves the
     base letters. There is no table to maintain and no character to forget. */
  s = s.normalize('NFD').replace(/[\u0300-\u036F]/g, '');
  s = s.toLowerCase();
  s = s.replace(/[^a-z]/g, '');
  s = s.replace(/ee/g, 'i').replace(/oo/g, 'u');
  s = s.replace(/w/g, 'v');
  s = s.replace(/x/g, 'ks');
  s = s.replace(/ksh/g, 'ks')
       .replace(/chh?/g, 'c')
       .replace(/sh/g, 's')
       .replace(/kh/g, 'k').replace(/gh/g, 'g').replace(/jh/g, 'j')
       .replace(/th/g, 't').replace(/dh/g, 'd')
       .replace(/ph/g, 'p').replace(/bh/g, 'b');
  var prev; do { prev = s;
    s = s.replace(/^(sri|jai|jay|lord|svami|bagvan|bagavan|maaraj)/, '')
         .replace(/(ji)$/, '');
  } while (s !== prev && s.length > 2);
  s = s.replace(/(.)\1+/g, '$1');
  if(!keepFinalA) s = s.replace(/a$/, '');
  return s;
}

/* Damerau–Levenshtein, bounded. At ~1,400 keys a full scan is a fraction of a
   millisecond, so there is no index and no need for one. */
function dlev(a,b,max){
  const la=a.length, lb=b.length;
  if(Math.abs(la-lb)>max) return max+1;
  let prev2=null, prev=new Array(lb+1), cur=new Array(lb+1);
  for(let j=0;j<=lb;j++) prev[j]=j;
  for(let i=1;i<=la;i++){
    cur[0]=i; let best=i;
    for(let j=1;j<=lb;j++){
      const cost = a.charCodeAt(i-1)===b.charCodeAt(j-1) ? 0 : 1;
      let v = Math.min(prev[j]+1, cur[j-1]+1, prev[j-1]+cost);
      if(i>1 && j>1 && a[i-1]===b[j-2] && a[i-2]===b[j-1]) v = Math.min(v, prev2[j-2]+1);
      cur[j]=v; if(v<best) best=v;
    }
    if(best>max) return max+1;
    prev2=prev; prev=cur; cur=new Array(lb+1);
  }
  return prev[lb];
}
function fuzzThreshold(k){ return k.length<=4 ? 0 : (k.length<=7 ? 1 : 2); }

/* ================================================================================
   BOOT INDEX — keys, bitsets, and the self-tests that catch a bad data edit
   ================================================================================ */
const N = BEINGS.length;
const WORDS = Math.ceil(N/32);
BEINGS.forEach((e,i)=>{ e.index=i; e.weight = 6-e.fame; });

/* KEYS: normalised string → entity index. Built from every canonical name and every
   alias. A COLLISION here means the normaliser has folded two distinct beings into
   one, which silently makes one of them unanswerable — so it is a hard error, not a
   warning, and it is checked on every boot rather than only in a test file. */
const KEYS = new Map();
const SELFTEST = { collisions:[], roundtrip:[], thin:[] };
BEINGS.forEach((e,i)=>{
  const names=[e.iast].concat(e.alt||[]);
  for(let n=0;n<names.length;n++){
    const k=norm(names[n]);
    if(k.length<2) continue;
    if(KEYS.has(k) && KEYS.get(k)!==i) SELFTEST.collisions.push(k+' : '+BEINGS[KEYS.get(k)].id+' / '+e.id);
    else KEYS.set(k,i);
  }
});
BEINGS.forEach((e,i)=>{ if(KEYS.get(norm(e.iast))!==i) SELFTEST.roundtrip.push(e.id); });
if(SELFTEST.collisions.length) SELFTEST.collisions.forEach(m=>console.error('SETU KEY COLLISION: '+m));
if(SELFTEST.roundtrip.length) console.error('SETU CANONICAL DOES NOT ROUND-TRIP: '+SELFTEST.roundtrip.join(', '));

/* One bitset per criterion. Cell candidacy is then one AND and a popcount, which is
   why the generator can afford to reject grids as hard as §4 tells it to. */
function newBits(){ return new Uint32Array(WORDS); }
CRITERIA.forEach(c=>{
  const b=newBits();
  for(let i=0;i<N;i++) if(c.test(BEINGS[i])) b[i>>5] |= (1<<(i&31));
  c.bits=b;
  let n=0; for(let w=0;w<WORDS;w++) n+=popcount32(b[w]);
  c.size=n;
  if(n<3) SELFTEST.thin.push(c.id+'='+n);
});
if(SELFTEST.thin.length) console.error('SETU CRITERION WITH FEWER THAN 3 MEMBERS: '+SELFTEST.thin.join(', '));

function popcount32(v){ v=v-((v>>>1)&0x55555555); v=(v&0x33333333)+((v>>>2)&0x33333333);
  return (((v+(v>>>4))&0x0F0F0F0F)*0x01010101)>>>24; }
function andBits(a,b){ const o=newBits(); for(let w=0;w<WORDS;w++) o[w]=a[w]&b[w]; return o; }
function countBits(b){ let n=0; for(let w=0;w<WORDS;w++) n+=popcount32(b[w]); return n; }
function bitsToList(b){ const o=[]; for(let i=0;i<N;i++) if(b[i>>5]&(1<<(i&31))) o.push(i); return o; }
function hasBit(b,i){ return (b[i>>5]&(1<<(i&31)))!==0; }
const CRIT_BY_ID = {}; CRITERIA.forEach(c=>{ CRIT_BY_ID[c.id]=c; });

/* ================================================================================
   §4  GENERATING THE DAY'S GRID
   Every value that shapes the grid comes from ONE mulberry32(daySeed(dayKey()))
   stream, drawn in a fixed order. A stray Math.random() here would silently
   desynchronise players worldwide and is undetectable from inside the game — so
   `rng` is threaded explicitly through every draw below and nothing else is used.
   Nothing in this section iterates a Set, a Map or Object.keys().
   ================================================================================ */

/* (b) of §4.4 — the requirement implementations get wrong. Because each being may
   be used once, per-cell non-emptiness does NOT imply the grid is solvable: three
   cells whose only candidates are the same three beings, plus a fourth that also
   needs one of them, is unsolvable while every cell individually looks fine. So we
   run Kuhn's augmenting-path matching and demand a perfect matching of size 9. */
function perfectMatching(cands){
  const matchOf = new Int32Array(N).fill(-1);
  const seen = new Uint8Array(N);
  function tryCell(c){
    const list=cands[c];
    for(let x=0;x<list.length;x++){
      const e=list[x];
      if(seen[e]) continue;
      seen[e]=1;
      if(matchOf[e]===-1 || tryCell(matchOf[e])){ matchOf[e]=c; return true; }
    }
    return false;
  }
  let m=0;
  for(let c=0;c<9;c++){ seen.fill(0); if(tryCell(c)) m++; }
  return m===9;
}

/* Today's heaviest possible bridge: the maximum total weight over all perfect
   matchings. The Hungarian algorithm on a 9 × (union of candidates) matrix is
   microseconds at this size, so unlike §7.2's suggested twelve-rarest shortlist
   this computes the exact optimum — which can only make the displayed target more
   honest, never less achievable. */
function heaviestMatching(cands){
  const colOf={}, cols=[];
  for(let c=0;c<9;c++) for(let x=0;x<cands[c].length;x++){
    const e=cands[c][x]; if(colOf[e]===undefined){ colOf[e]=cols.length; cols.push(e); } }
  const n=9, m=cols.length, BIG=1e6;
  if(m<n) return 0;
  const a=[]; for(let i=0;i<=n;i++){ a.push(new Float64Array(m+1).fill(BIG)); }
  for(let c=0;c<9;c++) for(let x=0;x<cands[c].length;x++)
    a[c+1][colOf[cands[c][x]]+1] = -BEINGS[cands[c][x]].weight;
  const u=new Float64Array(n+1), v=new Float64Array(m+1);
  const p=new Int32Array(m+1), way=new Int32Array(m+1);
  for(let i=1;i<=n;i++){
    p[0]=i; let j0=0;
    const minv=new Float64Array(m+1).fill(Infinity), used=new Uint8Array(m+1);
    do{
      used[j0]=1; const i0=p[j0]; let delta=Infinity, j1=0;
      for(let j=1;j<=m;j++) if(!used[j]){
        const cur=a[i0][j]-u[i0]-v[j];
        if(cur<minv[j]){ minv[j]=cur; way[j]=j0; }
        if(minv[j]<delta){ delta=minv[j]; j1=j; }
      }
      for(let j=0;j<=m;j++){ if(used[j]){ u[p[j]]+=delta; v[j]-=delta; } else minv[j]-=delta; }
      j0=j1;
    } while(p[j0]!==0);
    do{ const j1=way[j0]; p[j0]=p[j1]; j0=j1; } while(j0);
  }
  let total=0;
  for(let j=1;j<=m;j++) if(p[j]){ const w=a[p[j]][j]; if(w>=BIG) return 0; total += -w; }
  return total;
}

/* §2.2 exclusivity: two criteria from the same SINGLE-VALUED family must never sit
   on opposite axes — nothing is both a vānara and a rākṣasa, so such a cell is
   empty by construction and the shape must be rejected before we even count. */
function axisRuleOK(rows,cols){
  for(let i=0;i<3;i++) for(let j=0;j<3;j++){
    if(rows[i].single && cols[j].single && rows[i].family===cols[j].family) return false;
  }
  return true;
}

function tierPool(weekday){
  /* Mon should feel like an invitation, Sun like the reason you learned the names.
     weekday is derived from dayKey, which is the same string everywhere for a given
     day, so this stays a pure function of the date. */
  if(weekday===1||weekday===2) return {tiers:['core'], maxDeep:0};
  if(weekday===3||weekday===4) return {tiers:['core','wide'], maxDeep:0};
  if(weekday===5||weekday===6) return {tiers:['core','wide','deep'], maxDeep:1};
  return {tiers:['core','wide','deep'], maxDeep:9};
}
function weekdayOf(key){ const a=key.split('-'); return new Date(+a[0],+a[1]-1,+a[2]).getDay(); }

function drawDistinct(rng, pool, k, taken){
  const out=[];
  let guard=0;
  while(out.length<k && guard++ < 500){
    const c = pool[Math.floor(rng()*pool.length)];
    if(out.indexOf(c)>=0) continue;
    if(taken && taken.indexOf(c)>=0) continue;
    out.push(c);
  }
  return out.length===k ? out : null;
}

function buildGrid(rows, cols){
  const cellBits=[], cands=[], counts=[];
  for(let i=0;i<3;i++) for(let j=0;j<3;j++){
    const b=andBits(rows[i].bits, cols[j].bits);
    cellBits.push(b); const l=bitsToList(b); cands.push(l); counts.push(l.length);
  }
  return {rows:rows, cols:cols, cellBits:cellBits, cands:cands, counts:counts};
}

/* The hot path of the generator: an attempt is rejected on cell counts far more
   often than it survives (about 1.5% of core shapes and 0.3% of full-pool shapes
   pass every filter), so counting must not allocate. These two do the AND and the
   popcount inline and hand back a number. */
function countAnd(a,b){ let n=0; for(let w=0;w<WORDS;w++) n+=popcount32(a[w]&b[w]); return n; }
function countAnd3(a,b,c){ let n=0; for(let w=0;w<WORDS;w++) n+=popcount32(a[w]&b[w]&c[w]); return n; }

/* Every cell must contain at least one answer a reader of the epic would actually
   produce. No cell is ever solvable only by a specialist, and this check does more
   for perceived fairness than anything else in §4.5. */
const FAMOUS_BITS=(function(){ const b=newBits();
  for(let i=0;i<N;i++) if(BEINGS[i].fame>=3) b[i>>5]|=(1<<(i&31)); return b; })();

function everyCellHasAFamousAnswer(cands){
  for(let c=0;c<9;c++){
    let ok=false;
    for(let x=0;x<cands[c].length;x++) if(BEINGS[cands[c][x]].fame>=3){ ok=true; break; }
    if(!ok) return false;
  }
  return true;
}

/* Thirty shipped grids, each a pair of criterion-id triples. They exist so that a
   data edit which accidentally narrows the roster can never produce a day with no
   puzzle at all. Every one of them is checked against the live data by the audit
   (?audit=365), which fails loudly if any has stopped being solvable. */
const FALLBACK = [
 [['c-manusa','c-rsi','d-mithila'],['s-rama','s-none','d-ascetic']],  /* 95 cells, min 3, heaviest 40 */
 [['c-raksasa','d-counsel','d-astra'],['s-lanka','d-ocean','d-war']],  /* 87 cells, min 3, heaviest 34 */
 [['k-ara','k-kis','l-pulastya'],['k-sun','k-yud','d-ruled']],  /* 56 cells, min 3, heaviest 32 */
 [['k-bala','c-manusa','d-mithila'],['k-ayo','l-iksvaku','l-videha']],  /* 84 cells, min 5, heaviest 37 */
 [['c-vanara','d-ocean','d-search'],['p-deva','d-war','d-counsel']],  /* 86 cells, min 3, heaviest 38 */
 [['k-ara','c-raksasa','l-pulastya'],['k-sun','k-yud','d-form']],  /* 70 cells, min 3, heaviest 35 */

/* §4.3 asks for 200 attempts. Measured against this roster that is far too few:
   exhaustive enumeration (see setuDiag) says only 1.45% of Monday's core shapes and
   0.33% of Wednesday's pass every filter, so 200 draws would fall back on roughly
   half of all Wednesdays — and the fallback is meant to be the thing that never
   happens. ATTEMPTS is therefore 8,000 — four times the worst draw observed over a 400-day
   run, which puts a fallback out of reach while costing well under a millisecond,
   because a rejected attempt now allocates nothing. */
const ATTEMPTS=8000;

function generate(seedKey, rngOverride){
  const rng = rngOverride || mulberry32(daySeed(seedKey));
  const ramp = tierPool(weekdayOf(seedKey));
  const pool = CRITERIA.filter(c=>ramp.tiers.indexOf(c.tier)>=0);
  for(let attempt=0; attempt<ATTEMPTS; attempt++){
    const rows = drawDistinct(rng, pool, 3, null);          if(!rows) continue;
    const cols = drawDistinct(rng, pool, 3, rows);           if(!cols) continue;
    let deep=0; for(let i=0;i<3;i++){ if(rows[i].tier==='deep') deep++; if(cols[i].tier==='deep') deep++; }
    if(deep>ramp.maxDeep) continue;
    if(!axisRuleOK(rows,cols)) continue;                      // §2.2 — reject the SHAPE before counting
    let min=99, sum=0, famousOK=true;
    for(let i=0;i<3 && famousOK;i++) for(let j=0;j<3;j++){
      const n=countAnd(rows[i].bits, cols[j].bits);
      if(n<min) min=n; sum+=n;
      if(n<3){ famousOK=false; break; }                       // §4.4(a) — three is the floor
      if(countAnd3(rows[i].bits, cols[j].bits, FAMOUS_BITS)===0){ famousOK=false; break; }
    }
    if(!famousOK || min<3) continue;
    if(sum<40 || sum>110) continue;                           // breadth band
    const g = buildGrid(rows,cols);
    if(!perfectMatching(g.cands)) continue;                   // §4.4(b) — the one that gets skipped
    g.attempt=attempt; g.fallback=false;
    g.heaviest=heaviestMatching(g.cands);
    return g;
  }
  const f = FALLBACK[ daySeed(seedKey) % FALLBACK.length ];
  const g = buildGrid(f[0].map(id=>CRIT_BY_ID[id]), f[1].map(id=>CRIT_BY_ID[id]));
  g.attempt=200; g.fallback=true;
  g.heaviest=heaviestMatching(g.cands);
  return g;
}

/* Some machines have no Devanāgarī font at all, and a row of tofu boxes where a name
   should be is worse than no name. Measure क in the stack and in a guaranteed
   fallback; if the widths agree the stack is not resolving, so hide every .dev. IAST
   alone is complete and correct — the Devanāgarī is enrichment. */
function applyDev(){
  const r=document.documentElement;
  if(!SET.dev){ r.setAttribute('data-dev','off'); return; }
  let ok=true;
  try{
    const cv=document.createElement('canvas'), cx=cv.getContext('2d');
    cx.font='40px "Noto Sans Devanagari","Nirmala UI","Kohinoor Devanagari","Devanagari Sangam MN","Mangal","Samanata","Lohit Devanagari",monospace';
    const a=cx.measureText('क').width;
    cx.font='40px monospace';
    const b=cx.measureText('क').width;
    if(Math.abs(a-b)<0.5) ok=false;
  }catch(e){ ok=true; }                     // if we cannot measure, show it and let the font stack try
  r.setAttribute('data-dev', ok?'on':'off');
}

/* ================================================================================
   AUDIO — WebAudio oscillators only, no files, because the game must work opened
   straight off the disk. Shapes borrowed from Daśānana's AudioEngine.
   ================================================================================ */
const AudioEngine={
  ctx:null, master:null, drone:null,
  init(){
    if(this.ctx){ if(this.ctx.state==='suspended') this.ctx.resume(); return; }
    const AC=window.AudioContext||window.webkitAudioContext; if(!AC) return;
    try{ this.ctx=new AC(); }catch(e){ return; }
    this.master=this.ctx.createGain(); this.master.gain.value=SET.snd?1:0;
    this.master.connect(this.ctx.destination);
  },
  setMuted(m){ if(this.master) this.master.gain.value=m?0:1; },
  tone(freq,dur,type,peak,delay){
    if(!this.ctx) return;
    const t0=this.ctx.currentTime+(delay||0);
    const o=this.ctx.createOscillator(), g=this.ctx.createGain();
    o.type=type||'sine'; o.frequency.setValueAtTime(freq,t0);
    g.gain.setValueAtTime(0.0001,t0); g.gain.linearRampToValueAtTime(peak===undefined?0.14:peak,t0+0.015);
    g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
    o.connect(g).connect(this.master); o.start(t0); o.stop(t0+dur+0.05);
  },
  noise(dur,peak,freq,q,delay){
    if(!this.ctx) return;
    const t0=this.ctx.currentTime+(delay||0);
    const n=Math.floor(this.ctx.sampleRate*dur);
    const buf=this.ctx.createBuffer(1,n,this.ctx.sampleRate), d=buf.getChannelData(0);
    for(let i=0;i<n;i++) d[i]=(Math.random()*2-1)*(1-i/n);
    const src=this.ctx.createBufferSource(); src.buffer=buf;
    const f=this.ctx.createBiquadFilter(); f.type='bandpass'; f.frequency.value=freq||1200; f.Q.value=q||0.8;
    const g=this.ctx.createGain(); g.gain.setValueAtTime(peak,t0); g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
    src.connect(f).connect(g).connect(this.master); src.start(t0); src.stop(t0+dur+0.02);
  },
  /* a struck stone: two short sine bursts a fifth apart over a low thud */
  stone(){ this.tone(392,0.09,'sine',0.16); this.tone(587,0.07,'sine',0.10,0.03); this.tone(98,0.16,'sine',0.18); this.noise(0.06,0.05,320,1); },
  /* one damped low tone. No buzzer, no cartoon descent. */
  wrong(){ this.tone(146,0.18,'triangle',0.16); },
  conch(){
    if(!this.ctx) return;
    const t0=this.ctx.currentTime;
    const o=this.ctx.createOscillator(), g=this.ctx.createGain();
    o.type='sine'; o.frequency.setValueAtTime(174,t0); o.frequency.linearRampToValueAtTime(186,t0+1.4);
    g.gain.setValueAtTime(0.0001,t0); g.gain.linearRampToValueAtTime(0.20,t0+0.5);
    g.gain.linearRampToValueAtTime(0.14,t0+1.2); g.gain.exponentialRampToValueAtTime(0.0001,t0+2.4);
    o.connect(g).connect(this.master); o.start(t0); o.stop(t0+2.5);
    this.tone(348,2.0,'sine',0.045,0.1); this.noise(1.8,0.035,900,0.6,0.15);
  },
  startDrone(){
    if(!this.ctx || this.drone) return;
    const g=this.ctx.createGain(); g.gain.value=0.0001;
    const f=this.ctx.createBiquadFilter(); f.type='lowpass'; f.frequency.value=520;
    const oscs=[];
    [[55,'sawtooth',1],[55.3,'sawtooth',0.7],[82.5,'triangle',0.5],[110,'sine',0.35]].forEach(function(spec){
      const o=AudioEngine.ctx.createOscillator(), og=AudioEngine.ctx.createGain();
      o.type=spec[1]; o.frequency.value=spec[0]; og.gain.value=spec[2]*0.012;
      o.connect(og).connect(f); o.start(); oscs.push(o);
    });
    f.connect(g).connect(this.master);
    g.gain.linearRampToValueAtTime(0.5,this.ctx.currentTime+1.5);
    this.drone={oscs:oscs,g:g,f:f};
  },
  stopDrone(){
    if(!this.drone) return;
    const t=this.ctx.currentTime;
    this.drone.g.gain.linearRampToValueAtTime(0.0001,t+0.5);
    this.drone.oscs.forEach(function(o){ o.stop(t+0.6); });
    this.drone=null;
  },
  /* the last guess: the bed drops a semitone */
  lastGuess(){ if(this.drone) this.drone.oscs.forEach(function(o){ o.frequency.value=o.frequency.value*0.9439; }); }
};

let G=null, sheetCell=-1, pendingDisamb=null;

function newGame(){
  if(MODE==='practice'){
    /* Practice is the one place a Math.random() stream is correct: the grid is not
       shared with anybody, writes only setu.best, and never touches the daily. */
    const seed = Math.floor(Math.random()*4294967296);
    G = generate(dayKey(), mulberry32(seed));
  } else {
    G = generate(VIEW_KEY);
  }
  G.placed = [-1,-1,-1,-1,-1,-1,-1,-1,-1];
  G.wrong  = [0,0,0,0,0,0,0,0,0];
  G.guesses = 0;
  G.done = false;
  G.key = VIEW_KEY;
  if(MODE==='daily') restoreState();
}

/* setu.state stores only the stones already laid — which the player already knows —
   plus the guess count, the done flag and the per-cell wrong counts the share grid's
   🟨 needs. Five pipe fields; a row with four is read as an older save with no wrong
   counts, and a row from another day is dropped whole. */
function saveState(){
  if(MODE!=='daily') return;
  const ids = G.placed.map(i=> i<0 ? '' : BEINGS[i].id).join(',');
  LS.set(SLUG+'.state', G.key+'|'+ids+'|'+G.guesses+'|'+(G.done?1:0)+'|'+G.wrong.map(w=>Math.min(w,9)).join(''));
}
function restoreState(){
  try{
    const raw=LS.get(SLUG+'.state'); if(!raw) return;
    const f=raw.split('|');
    if(f.length<4 || f[0]!==G.key){ return; }
    const ids=f[1].split(',');
    for(let c=0;c<9 && c<ids.length;c++){
      if(!ids[c]) continue;
      let idx=-1; for(let i=0;i<N;i++) if(BEINGS[i].id===ids[c]){ idx=i; break; }
      /* only accept a saved stone that is still valid for that cell — a data edit
         between sessions must not resurrect an answer that is no longer true. */
      if(idx>=0 && hasBit(G.cellBits[c],idx) && G.placed.indexOf(idx)<0) G.placed[c]=idx;
    }
    const g=parseInt(f[2],10); G.guesses = (isFinite(g) && g>=0 && g<=9) ? g : 0;
    G.done = f[3]==='1';
    if(f.length>4) for(let c=0;c<9 && c<f[4].length;c++){ const w=parseInt(f[4][c],10); G.wrong[c]=isFinite(w)?w:0; }
  }catch(e){ /* corrupt row: fall through with a fresh grid rather than fail to boot */ }
}

function laidCount(){ let n=0; for(let c=0;c<9;c++) if(G.placed[c]>=0) n++; return n; }
function weightTotal(){ let w=0; for(let c=0;c<9;c++) if(G.placed[c]>=0) w+=BEINGS[G.placed[c]].weight; return w; }
function guessesLeft(){ return 9-G.guesses; }

/* ================================================================================
   §3.4  RESOLVING A SUBMISSION
   Five outcomes and only ONE of them costs a guess. A typo, an unknown name and a
   repeat are the three things a sincere player does most often; charging a guess
   for any of them turns a puzzle into a punishment.
   ================================================================================ */
/* Bengali, Gurmukhi, Gujarati, Odia, Tamil, Telugu, Kannada, Malayalam. Checked on
   the RAW input, because norm() would quietly strip them to an empty string and the
   player would get "too short" instead of an answer they can act on. */
const OTHER_INDIC=/[\u0980-\u09FF\u0A00-\u0A7F\u0A80-\u0AFF\u0B00-\u0B7F\u0B80-\u0BFF\u0C00-\u0C7F\u0C80-\u0CFF\u0D00-\u0D7F]/;

function resolveName(raw){
  if(OTHER_INDIC.test(raw)) return {kind:'script'};
  const k=norm(raw);
  if(k.length<2) return {kind:'short'};
  if(KEYS.has(k)) return {kind:'hit', e:KEYS.get(k)};
  const max=fuzzThreshold(k);
  if(max===0) return {kind:'miss'};
  /* Two or more candidates within threshold: DO NOT GUESS. kaikeyi and kaikasi are
     two edits apart and are two different women, and silently picking one would be
     worse than any other failure mode in this game. */
  const found=[];
  KEYS.forEach(function(idx,key){            // play-time only; nothing here feeds daily setup
    if(found.indexOf(idx)>=0) return;
    if(dlev(k,key,max)<=max) found.push(idx);
  });
  if(found.length===1) return {kind:'hit', e:found[0]};
  if(found.length>1){ found.sort(function(a,b){ return a-b; }); return {kind:'ambiguous', list:found.slice(0,4)}; }
  return {kind:'miss'};
}

/* Typeahead. THE SUGGESTION LIST IS DRAWN FROM THE ENTIRE ROSTER AND IS NEVER
   FILTERED BY WHAT IS VALID FOR THE OPEN CELL. Filtering it would hand over the
   answer; it looks like a kindness and it is a spoiler. If anybody ever writes
   roster.filter(validForCell) in here, the game is broken. */
const TYPE_KEYS=BEINGS.map(function(e){
  const a=[norm(e.iast,true)];
  (e.alt||[]).forEach(function(x){ const k=norm(x,true); if(k.length>1 && a.indexOf(k)<0) a.push(k); });
  return a;
});
function suggest(raw){
  const k=norm(raw,true);
  if(k.length<2) return [];
  const pre=[], sub=[], fuz=[];
  for(let i=0;i<N;i++){
    const keys=TYPE_KEYS[i], key=keys[0];
    let best=2;                                   // 0 = prefix, 1 = substring, 2 = neither
    for(let x=0;x<keys.length && best>0;x++){
      const at=keys[x].indexOf(k);
      if(at===0) best=0; else if(at>0) best=Math.min(best,1);
    }
    if(best===0) pre.push(i);
    else if(best===1) sub.push(i);
    else if(dlev(k,key,1)<=1) fuz.push(i);
  }
  const byFame=function(a,b){ return BEINGS[b].fame-BEINGS[a].fame || a-b; };
  pre.sort(byFame); sub.sort(byFame); fuz.sort(byFame);
  return pre.concat(sub, fuz).slice(0,6);
}

function renderAll(){ renderBoard(); renderStatus(); renderActions(); drawBridge(); }

/* ---- keyboard ---------------------------------------------------------------- */
function onGridKey(ev){
  const c=+ev.currentTarget.dataset.cell;
  let t=-1;
  if(ev.key==='ArrowRight') t = (c%3===2)? c : c+1;
  else if(ev.key==='ArrowLeft') t = (c%3===0)? c : c-1;
  else if(ev.key==='ArrowDown') t = (c>=6)? c : c+3;
  else if(ev.key==='ArrowUp') t = (c<3)? c : c-3;
  else if(ev.key==='Home') t = c-(c%3);
  else if(ev.key==='End') t = c-(c%3)+2;
  else return;
  ev.preventDefault();
  focusCell=t; renderBoard();
  const el=board.querySelector('[data-cell="'+t+'"]'); if(el) el.focus();
}

/* ================================================================================
   THE SHEET
   A text field inside a 100 px cell loses a fight with the mobile keyboard every
   time, so a tap opens a bottom sheet instead: both criteria in full, the guesses
   remaining, one input, the typeahead, Cancel.
   ================================================================================ */
const sheet=$('sheet'), scrim=$('scrim'), input=$('guessInput'),
      taList=$('typeahead'), disambEl=$('disamb'), msgEl=$('sheetMsg');
let lastFocused=null;

function openSheet(c){
  if(G.done && G.placed[c]<0){
    /* The grid has ended, so this stone is no longer a question — it is a pointer at
       the answers it wanted. Jump to its section of the reveal rather than scolding. */
    const sec=document.getElementById('rev'+c);
    if(sec) sec.scrollIntoView({behavior:'smooth', block:'start'});
    return;
  }
  if(G.placed[c]>=0){ showBeing(BEINGS[G.placed[c]]); return; }
  sheetCell=c; lastFocused=document.activeElement;
  const r=G.rows[Math.floor(c/3)], k=G.cols[c%3];
  $('sheetTitle').textContent='Lay a stone — row '+(Math.floor(c/3)+1)+', column '+(c%3+1);
  $('critRow').innerHTML='<span class="lab">Row</span>'+esc(r.label);
  $('critCol').innerHTML='<span class="lab">Col</span>'+esc(k.label);
  $('sheetMeta').textContent=guessesLeft()+' guess'+(guessesLeft()===1?'':'es')+' left · '+G.counts[c]+' beings fit this cell';
  msgEl.innerHTML=''; disambEl.innerHTML=''; taList.innerHTML=''; input.value=''; pendingDisamb=null;
  scrim.classList.add('on'); sheet.classList.add('on');
  AudioEngine.init();
  setTimeout(function(){ input.focus(); },40);
  anchorSheet();
}
function closeSheet(){
  sheet.classList.remove('on'); scrim.classList.remove('on'); sheetCell=-1;
  if(lastFocused && lastFocused.focus) lastFocused.focus();
}
/* Anchor the sheet above the software keyboard. visualViewport is the only thing
   that actually knows where the keyboard is; without it iOS scrolls the input under
   its own keyboard and the player types blind. */
function anchorSheet(){
  if(!window.visualViewport || window.innerWidth>=560){ sheet.style.bottom=''; return; }
  const vv=window.visualViewport;
  const gap=Math.max(0, window.innerHeight - vv.height - vv.offsetTop);
  sheet.style.bottom = gap+'px';
}
if(window.visualViewport){ window.visualViewport.addEventListener('resize',anchorSheet);
                           window.visualViewport.addEventListener('scroll',anchorSheet); }

scrim.addEventListener('click',function(){ closeSheet(); closeModal(); });
$('cancelBtn').addEventListener('click',closeSheet);

input.addEventListener('keydown',function(ev){ if(ev.key==='Enter'){ ev.preventDefault(); submit(input.value); } });
input.addEventListener('input',function(){
  disambEl.innerHTML=''; pendingDisamb=null;
  if(!SET.type){ taList.innerHTML=''; return; }
  const list=suggest(input.value);
  taList.innerHTML=list.map(function(i){
    return '<li><button type="button" data-e="'+i+'"><span lang="sa-Latn">'+esc(BEINGS[i].iast)+'</span></button></li>';
  }).join('');
  taList.querySelectorAll('button').forEach(function(b){
    b.addEventListener('click',function(){ submitEntity(+b.dataset.e); });
  });
});
document.addEventListener('keydown',function(ev){
  if(ev.key!=='Escape') return;
  if(sheet.classList.contains('on')) closeSheet();
  else if($('modal').classList.contains('on')) closeModal();
});

function submit(raw){
  const r=resolveName(raw);
  if(r.kind==='short'){ msgEl.innerHTML='<span class="no">A name, please.</span>'; return; }
  if(r.kind==='script'){
    msgEl.innerHTML='<span class="no">Setu reads Latin letters and Devanāgarī. <span class="dev" lang="sa">हनुमान्</span> works; other Indic scripts aren’t in yet — sorry. Try <b>Hanuman</b>.</span>';
    say('Script not supported yet. No guess spent.'); return;
  }
  if(r.kind==='miss'){
    msgEl.innerHTML='<span class="no">Setu doesn’t know that name.</span> The roster is '+N+' named beings of the Vālmīki Rāmāyaṇa. No guess spent.';
    say('Not in the roster. No guess spent.'); return;
  }
  if(r.kind==='ambiguous'){
    pendingDisamb=r.list;
    msgEl.innerHTML='Did you mean —';
    disambEl.innerHTML=r.list.map(function(i){
      return '<button type="button" data-e="'+i+'"><span lang="sa-Latn">'+esc(BEINGS[i].iast)+'</span></button>';
    }).join('');
    disambEl.querySelectorAll('button').forEach(function(b){
      b.addEventListener('click',function(){ submitEntity(+b.dataset.e); });
    });
    say('Two names are that close. Choose one. No guess spent.');
    return;
  }
  submitEntity(r.e);
}

function submitEntity(idx){
  const c=sheetCell; if(c<0) return;
  const e=BEINGS[idx];
  const at=G.placed.indexOf(idx);
  if(at>=0){
    msgEl.innerHTML='<span lang="sa-Latn"><b>'+esc(e.iast)+'</b></span> is already laid — row '+(Math.floor(at/3)+1)+', column '+(at%3+1)+'. Each being may be used once. No guess spent.';
    say(e.iast+' is already laid. No guess spent.');
    return;
  }
  const r=G.rows[Math.floor(c/3)], k=G.cols[c%3];
  const okR=hasBit(r.bits,idx), okC=hasBit(k.bits,idx);
  if(okR && okC){
    G.placed[c]=idx; AudioEngine.stone();
    saveState(); closeSheet(); focusCell=c; renderAll();
    /* renderAll replaced the button closeSheet had just focused, so put focus back on
       the stone that was laid rather than letting it fall to <body>. */
    const el=board.querySelector('[data-cell="'+c+'"]'); if(el) el.focus();
    say(e.iast+' laid, weight '+e.weight+'. '+laidCount()+' of 9.');
    if(laidCount()===9) endGrid(true);
    return;
  }
  /* Outcome (d): say WHICH HALF failed. It teaches, it makes the wrong guess feel
     like it bought something, and it cannot reveal an answer — it states facts about
     the being THEY named, never about one they didn't. */
  G.guesses++; G.wrong[c]++; AudioEngine.wrong();
  if(guessesLeft()===1) AudioEngine.lastGuess();
  const mark=function(ok,lab){ return '<br>'+(ok?'✓':'✗')+' '+esc(lab); };
  msgEl.innerHTML='<span class="no">Not this cell.</span> <span lang="sa-Latn"><b>'+esc(e.iast)+'</b></span>'
    + mark(okR,r.label) + mark(okC,k.label);
  say(e.iast+': '+(okR?'yes':'no')+' to '+r.label+'; '+(okC?'yes':'no')+' to '+k.label
      +'. '+guessesLeft()+' guess'+(guessesLeft()===1?'':'es')+' left.');
  saveState(); renderStatus();
  input.value=''; taList.innerHTML=''; input.focus();
  if(guessesLeft()<=0){ closeSheet(); endGrid(false); }
}

/* ================================================================================
   THE END OF A GRID
   ================================================================================ */
function endGrid(perfect){
  if(G.done) return;
  G.done=true; saveState(); renderAll();
  let streak=0;
  if(MODE==='daily'){
    /* dailyDone() fires when the grid ENDS, either way — 9/9 or out of guesses. */
    streak=dailyDone();
    const w=weightTotal();
    if(w>loadToday(SLUG+'.dbest')) saveToday(SLUG+'.dbest',w);
  } else if(MODE==='practice'){
    const w=weightTotal(); if(w>loadBest()) saveBest(w);
  }
  if(perfect){ AudioEngine.conch(); animateBridge(); }
  renderReveal(streak);
  /* On 9/9 the nine stones settle into a causeway over about 1.1s. Scrolling to the
     reveal before that finishes would mean nobody ever sees the bridge they built. */
  setTimeout(function(){ const h=$('revealHost'); if(h.firstChild) h.firstChild.scrollIntoView({behavior:'smooth',block:'start'}); },
             perfect?1800:150);
}

  h+='<p class="scoreline">'+laid+'/9 · guesses spent '+G.guesses+' · your bridge weighed <b>'+w+'</b>';
  h+='<br><span class="small">Today’s heaviest possible bridge weighed '+G.heaviest+'.'
   +(laid===9 && w===G.heaviest ? ' You laid every stone at the heaviest weight available — a perfect bridge.' : '')+'</span></p>';
  if(MODE==='daily' && streak>=2) h+='<p class="small">Site streak '+streak+' 🔥</p>';
  h+='<p class="small">Every valid answer for every cell is below, with a gloss and a citation. The puzzle is the excuse.</p>';

  for(let c=0;c<9;c++){
    const r=G.rows[Math.floor(c/3)], k=G.cols[c%3];
    h+='<h3 id="rev'+c+'" tabindex="-1">'+esc(r.label)+' <span style="opacity:.6">×</span> '+esc(k.label)+'</h3>';
    const list=G.cands[c].slice().sort(function(a,b){ return BEINGS[b].fame-BEINGS[a].fame || a-b; });
    h+='<ul class="ans">';
    for(let x=0;x<list.length;x++){
      const e=BEINGS[list[x]];
      h+='<li><span class="nm" lang="sa-Latn">'+esc(e.iast)+'</span>'
        + (e.dev?' <span class="dev" lang="sa">'+esc(e.dev)+'</span>':'')
        + (G.placed[c]===list[x] ? '<span class="yours">YOURS · WEIGHT '+e.weight+'</span>' : '')
        + '<br>'+esc(e.gloss)
        + '<br><span class="cite">'+esc(e.ref)+(e.src==='V-utt'?' · Uttara Kāṇḍa only':'')+'</span></li>';
    }
    h+='</ul>';
  }

  h+='<details class="note" open><summary>What Weight is, and what it is not</summary>'
   +'<p class="small">This is not rarity scoring. Immaculate Grid’s rarity is a <i>social</i> measurement: it tells you how few of the other two hundred thousand players thought of your answer, and knowing that requires a server counting everybody. Setu has no server and never phones home. Its Weight is an <i>editorial</i> measurement — a number assigned to each being when the dataset was written, reflecting roughly how well known that being is in the tradition. It is a stable judgement about the text, not a live measurement of the crowd.</p>'
   +'<p class="small">It has one property the real thing lacks: it is the same on day one as on day one thousand, and it works on a plane. It lacks one the real thing has: it can never surprise you by revealing that everyone else also thought of Jāmbavān.</p></details>';

  h+='<details class="note"><summary>Sources, and what this game does not claim</summary>'
   +'<p class="small">The spine is the Vālmīki Rāmāyaṇa. Sarga numbers follow the widely circulated vulgate rather than the Baroda critical edition; where the two differ the difference here is one of numbering. A being carries a kāṇḍa when it is named as a participant in that kāṇḍa’s narrative — a passing mention in a genealogy or a simile does not count.</p>'
   +'<p class="small">The Uttara Kāṇḍa is included and marked. It is widely held by scholars to be a later addition, as is much of the Bāla Kāṇḍa; the criterion that asks for it is a hard one and only appears late in the week. The game reports the scholarly view and takes no position beyond it.</p>'
   +'<p class="small">Nothing the tellings disagree about is ever asked as a question. Vālmīki has Rāma kill Rāvaṇa; the Jain <i>Paumacariya</i> of Vimalasūri has Lakṣmaṇa do it — so “killed Rāvaṇa” is not a criterion and “bore arms at Laṅkā” is. The <i>Adhyātma Rāmāyaṇa</i> has a Māyā Sītā abducted in Sītā’s place and Kamban has Rāvaṇa lift the ground she stands on rather than touch her, so the abduction is never a criterion either. The Lakṣmaṇa-rekhā is not in Vālmīki and is not a drawn line in the Rāmcaritmānas; it enters through medieval retellings such as the Bengali Kṛttivāsī Rāmāyaṇa, and Setu never asserts it. Tārā is Suṣeṇa’s daughter in Vālmīki and an apsarā of the ocean-churning in later sources, so her parentage is left unstated and both are given in her gloss.</p>'
   +'<p class="small">The Agni-parīkṣā, Sītā’s exile in the Uttara Kāṇḍa and the killing of Śambūka are not used as puzzle material anywhere in this game.</p></details>';

  h+='<p class="small" style="margin-top:14px">Something wrong here? Corrections are welcome and land in the next version of this file — '
   +'<a href="mailto:hello@kreeda.games?subject=Setu%20correction">tell us what and where</a>.</p>';
  h+='</div>';
  $('revealHost').innerHTML=h;
}

/* ================================================================================
   §9  SHARING — nine squares, and NOT ONE BIT MORE
   The block grid encodes, per cell, exactly two things: solved or not, and cleanly
   or not. It encodes nothing about WHICH being was named. The criteria themselves
   are not secret — every player worldwide sees the identical six the moment they
   open the page — so revealing which cells you found tells a reader nothing they
   could not already see.
   Therefore Weight is NEVER encoded per cell. Telling a reader that your answer to
   a three-answer cell was a fame-1 being narrows their search to one. Weight appears
   only as one total on the score line, where it is attributable to no cell at all.
   ================================================================================ */
function shareGrid(){
  let out='';
  for(let i=0;i<3;i++){
    for(let j=0;j<3;j++){
      const c=i*3+j;
      out += G.placed[c]<0 ? '⬜' : (G.wrong[c]>0 ? '🟨' : '🟧');
    }
    if(i<2) out+='\n';
  }
  return out;
}
function shareText(){
  const st=siteStreak();
  let line=laidCount()+'/9 · weight '+weightTotal();
  if(!SET.type) line+=' · recall';
  if(MODE==='daily' && st>=2) line+=' · streak '+st+' 🔥';
  return 'Kreeda · Setu · '+shareDate(MODE==='practice'?dayKey():VIEW_KEY)+'\n'
       + shareGrid()+'\n'+line+'\nkreeda.games/setu/';
}
function doShare(){
  const text=shareText(), btn=$('shareBtn');
  try{
    if(navigator.share){ navigator.share({text:text}).catch(function(){}); }
    else if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(text).then(function(){ toast(btn,'Copied!'); })
        .catch(function(){ showModal('Your result','<p class="shareblk">'+esc(text)+'</p>'); });
    } else showModal('Your result','<p class="shareblk">'+esc(text)+'</p>');
  }catch(e){ showModal('Your result','<p class="shareblk">'+esc(text)+'</p>'); }
}
function toast(el,msg){
  if(!el) return;
  const orig=el.textContent; el.textContent=msg;
  clearTimeout(el._t); el._t=setTimeout(function(){ el.textContent=orig; },1500);
}

const bridgeCv=$('bridge'), bctx=bridgeCv.getContext('2d');
let bridgeAnim=0;
function drawBridge(){
  const w=bridgeCv.width, h=bridgeCv.height;
  const css=getComputedStyle(document.documentElement);
  bctx.clearRect(0,0,w,h);
  const g=bctx.createLinearGradient(0,0,0,h);
  g.addColorStop(0, css.getPropertyValue('--sea').trim()||'#12586c');
  g.addColorStop(1, css.getPropertyValue('--sea-deep').trim()||'#0b3a4a');
  bctx.fillStyle=g; bctx.fillRect(0,0,w,h);
  bctx.strokeStyle='rgba(255,255,255,.14)'; bctx.lineWidth=2;
  for(let y=28;y<h;y+=22){
    bctx.beginPath();
    for(let x=0;x<=w;x+=14) bctx.lineTo(x, y+Math.sin((x/70)+(y/9))*2.2);
    bctx.stroke();
  }
  const stoneC=css.getPropertyValue('--stone-set').trim()||'#ffe2a8';
  const dim=css.getPropertyValue('--foam').trim()||'rgba(255,255,255,.14)';
  for(let c=0;c<9;c++){
    const x=w*(c+0.5)/9, y=h*0.55;
    const laid=G.placed[c]>=0;
    const shown = bridgeAnim===0 ? laid : (laid && c<bridgeAnim);
    bctx.beginPath(); bctx.ellipse(x,y,w/26,h/5.2,0,0,Math.PI*2);
    bctx.fillStyle = shown ? stoneC : dim; bctx.fill();
    if(shown){ bctx.strokeStyle='rgba(178,122,32,.65)'; bctx.lineWidth=2; bctx.stroke(); }
  }
}
function animateBridge(){
  /* prefers-reduced-motion: no walk across the strait, just the finished causeway. */
  if(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches){ bridgeAnim=0; drawBridge(); return; }
  bridgeAnim=0;
  const step=function(){
    bridgeAnim++; drawBridge();
    if(bridgeAnim<=9) setTimeout(step,120); else { bridgeAnim=0; drawBridge(); }
  };
  step();
}

/* ================================================================================
   §4.6  AUDIT — dev only, not linked from anywhere.
   ?date=YYYY-MM-DD renders that day. ?audit=N dumps N days to the console.
   Run it before any data change ships; it is the only way to actually KNOW that
   difficulty is even, as opposed to intending that it be.
   ================================================================================ */
function audit(days){
  const out={days:days, fallbacks:[], min:99, max:0, sum:0, unsolvable:[], noFamous:[],
             critUse:{}, weights:[], perWeek:{}};
  let k=dayKey(), mins=[];
  for(let d=0; d<days; d++){
    const g=generate(k);
    let mn=99,mx=0,sm=0;
    for(let c=0;c<9;c++){ const n=g.counts[c]; if(n<mn)mn=n; if(n>mx)mx=n; sm+=n; }
    mins.push(mn);
    if(g.fallback) out.fallbacks.push(k);
    if(mn<3) out.unsolvable.push(k+' minCell='+mn);
    if(!perfectMatching(g.cands)) out.unsolvable.push(k+' NO PERFECT MATCHING');
    if(!everyCellHasAFamousAnswer(g.cands)) out.noFamous.push(k);
    out.min=Math.min(out.min,mn); out.max=Math.max(out.max,mx); out.sum+=sm;
    out.weights.push(g.heaviest);
    g.rows.concat(g.cols).forEach(function(c){ out.critUse[c.id]=(out.critUse[c.id]||0)+1; });
    const a=k.split('-'), t=new Date(+a[0],+a[1]-1,+a[2]); t.setDate(t.getDate()+1); k=dayKey(t);
  }
  out.meanCells=(out.sum/(days*9)).toFixed(2);
  out.minCellAcrossDays=Math.min.apply(null,mins);
  out.meanHeaviest=(out.weights.reduce(function(a,b){return a+b;},0)/days).toFixed(1);
  /* The shipped fallbacks are insurance, and insurance that has quietly expired is
     worse than none — so the audit re-checks every one of them against the live data. */
  out.badFallbacks=[];
  for(let i=0;i<FALLBACK.length;i++){
    const f=FALLBACK[i];
    const g=buildGrid(f[0].map(function(id){return CRIT_BY_ID[id];}), f[1].map(function(id){return CRIT_BY_ID[id];}));
    let mn=99; for(let c=0;c<9;c++) mn=Math.min(mn,g.counts[c]);
    if(mn<3 || !everyCellHasAFamousAnswer(g.cands) || !perfectMatching(g.cands))
      out.badFallbacks.push(i+': '+f[0].join('/')+' x '+f[1].join('/')+' minCell='+mn);
  }
  if(out.badFallbacks.length) console.error('SETU FALLBACK NO LONGER SOLVABLE: '+out.badFallbacks.join(' | '));
  const never=CRITERIA.filter(function(c){ return !out.critUse[c.id]; }).map(function(c){ return c.id; });
  const hot=CRITERIA.filter(function(c){ return (out.critUse[c.id]||0)/(days*6) > 0.05; }).map(function(c){ return c.id+':'+((out.critUse[c.id]/(days*6))*100).toFixed(1)+'%'; });
  out.neverUsed=never; out.over5pct=hot;
  console.log('SETU AUDIT', out);
  return out;
}
/* dev-only diagnostic: exhaustively counts how many row/col shapes survive each
   filter for a given tier pool. Not linked from anywhere; it exists so that "the
   generator falls back too often" is a measurable statement, not a feeling. */
function diagPool(tiers,maxDeep){
  const pool=CRITERIA.filter(function(c){ return tiers.indexOf(c.tier)>=0; });
  const stats={pool:pool.length, shapes:0, axis:0, min3:0, band:0, famous:0, match:0, bandLo:0, bandHi:0};
  const tri=[];
  for(let a=0;a<pool.length;a++) for(let b2=a+1;b2<pool.length;b2++) for(let c=b2+1;c<pool.length;c++) tri.push([pool[a],pool[b2],pool[c]]);
  for(let i=0;i<tri.length;i++) for(let j=0;j<tri.length;j++){
    const rows=tri[i], cols=tri[j];
    if(rows.some(function(r){ return cols.indexOf(r)>=0; })) continue;
    let deep=0; rows.concat(cols).forEach(function(c){ if(c.tier==='deep') deep++; });
    if(deep>maxDeep) continue;
    stats.shapes++;
    if(!axisRuleOK(rows,cols)) continue;
    stats.axis++;
    const g=buildGrid(rows,cols);
    let mn=99,sm=0; for(let c=0;c<9;c++){ if(g.counts[c]<mn)mn=g.counts[c]; sm+=g.counts[c]; }
    if(mn<3) continue; stats.min3++;
    if(sm<40){ stats.bandLo++; continue; }
    if(sm>110){ stats.bandHi++; continue; }
    stats.band++;
    if(!everyCellHasAFamousAnswer(g.cands)) continue; stats.famous++;
    if(!perfectMatching(g.cands)) continue; stats.match++;
  }
  return stats;
}
window.setuDiag=function(){
  return { mon:diagPool(['core'],0), wed:diagPool(['core','wide'],0),
           fri:diagPool(['core','wide','deep'],1), sun:diagPool(['core','wide','deep'],9) };
};
window.setuCriteria=CRITERIA;
window.setuTry=function(rows,cols){
  if(!axisRuleOK(rows,cols)) return null;
  let min=99,sum=0;
  for(let i=0;i<3;i++) for(let j=0;j<3;j++){
    const n=countAnd(rows[i].bits,cols[j].bits);
    if(n<3) return null;
    if(countAnd3(rows[i].bits,cols[j].bits,FAMOUS_BITS)===0) return null;
    if(n<min) min=n; sum+=n;
  }
  if(sum<40||sum>110) return null;
  const g=buildGrid(rows,cols);
  if(!perfectMatching(g.cands)) return null;
  return {min:min,sum:sum,heaviest:heaviestMatching(g.cands)};
};
/* Dev surface. Nothing in the game reads any of it; it exists so that "the generator
   never falls back", "no two beings share a key" and "the typeahead is not filtered
   to the open cell" are statements a harness can check against the shipped file
   rather than against a copy of the data that has drifted from it. */
window.setuPerfect=perfectMatching;
window.setuAudit=audit;                        // ?audit=365 calls this itself
window.setuNorm=norm;
window.setuResolve=resolveName;
window.setuGenerate=generate;
window.setuSelfTest=SELFTEST;
window.setuBeings=BEINGS;
window.setuState=function(){ return G; };
window.setuShareText=shareText;

window.setuEnd=endGrid;
window.setuRender=renderAll;

    document.removeEventListener('pointerdown',once); }, {once:true});
}

  : (MODE==='archive' ? 'Archive grid — no streak, no record kept.' : 'Nine stones make a bridge.');

})();
