  <g transform="translate(80, 530)">
    <rect width="220" height="52" rx="26" fill="#2bff88"/>
    <text x="45" y="32" fill="#07070d" font-family="-apple-system, system-ui, sans-serif" font-weight="800" font-size="18" letter-spacing="0.5">PLAY INSTANTLY ➔</text>
  </g>

  <text x="330" y="563" fill="#a6a6b8" font-family="-apple-system, system-ui, sans-serif" font-weight="600" font-size="18">https://kreeda.games/last-16/index.html</text>
