    <text x="18" y="24" fill="#a6a6b8" font-family="-apple-system, system-ui, sans-serif" font-weight="600" font-size="14">World Cup 2026 Arcade Football</text>
  </g>

  <!-- Game Title -->
  <text x="80" y="220" fill="url(#textGrad)" font-family="-apple-system, system-ui, sans-serif" font-weight="900" font-size="76" letter-spacing="-1" filter="url(#shadow)">Last 16</text>

  <!-- Tagline -->
  <text x="80" y="280" fill="#f4f4f8" font-family="-apple-system, system-ui, sans-serif" font-weight="700" font-size="28" letter-spacing="0">16 nations. 4 real stars each. Lift the trophy.</text>

  <!-- Feature Highlights Box -->
  <g transform="translate(80, 330)">
    <rect width="1040" height="150" rx="18" fill="rgba(18,18,28,0.7)" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
    
    <g transform="translate(30, 42)">
      <circle cx="10" cy="0" r="4" fill="#2bff88"/>
      <text x="24" y="5" fill="#f4f4f8" font-family="-apple-system, system-ui, sans-serif" font-weight="600" font-size="18">0.1s Instant Play — No Downloads, No Accounts, 100% Free</text>
    </g>

    <g transform="translate(30, 82)">
      <circle cx="10" cy="0" r="4" fill="#2bff88"/>
      <text x="24" y="5" fill="#a6a6b8" font-family="-apple-system, system-ui, sans-serif" font-weight="500" font-size="17">16 real national teams with authentic kits and 4 star players with unique PAC/SHO/PAS/DEF/PHY stats</text>
    </g>

    <g transform="translate(30, 122)">
      <circle cx="10" cy="0" r="4" fill="#2bff88"/>
      <text x="24" y="5" fill="#a6a6b8" font-family="-apple-system, system-ui, sans-serif" font-weight="500" font-size="17">Dynamic pitch radar canvas and flocking AI team positioning</text>
    </g>
