   An evening maidan: dusty ochre ground, a cut green square, floodlight white on the panels.
   Every colour lives here once. Light is the base; the two dark blocks below only REDEFINE
   these same names, so no rule downstream ever needs to know which theme it is painting in. */

  --ground:#c9a86a;  --ground-dark:#a8874c;  --square:#5f7f4a;  --crease:#f6f1e4;

  --hdbg:#4a3a1e;    --cellbg:#c9a86a;
  --ok:#2f6b34;      --no:#9a3b21;
}
/* The default "system" theme stamps nothing on <html>, so prefers-color-scheme is the only signal.
   Guarded with :not([data-theme="light"]) so an explicit light choice still wins over the media query. */

    --ground:#3a3222; --ground-dark:#241f14; --square:#2c3a26; --crease:#d8d2c2;
    --dusk-hi:#101a28; --dusk-lo:#6b4630;    --lamp:#efe0a8;
    --ink:#efe8d6;    --ink-dim:#a89a7c;     --rule:rgba(216,210,194,.30);
    --panel:#241f14;  --panel-2:#2e2718;     --shade:rgba(0,0,0,.66);
    --hdbg:#14100a;   --cellbg:#3a3222;
    --ok:#8ec98a;     --no:#e8907a;
  }
}
:root[data-theme="dark"]{

  --dusk-hi:#101a28; --dusk-lo:#6b4630;    --lamp:#efe0a8;
  --ink:#efe8d6;    --ink-dim:#a89a7c;     --rule:rgba(216,210,194,.30);
  --panel:#241f14;  --panel-2:#2e2718;     --shade:rgba(0,0,0,.66);

<script>
'use strict';
/* ============================================================================================
   MAIDAN — a daily cricket grid.  One file, no build, no network, no images.  Opens off a disk.

   The whole game rests on one idea, stated in CRICKET_GRID.md §3.1 and worth restating here so the
   next person to edit the data cannot miss it:

     EVERY CRITERION IS A MONOTONE FACT — an event that happened, or a threshold that has been
     crossed. Never a ranking, never a current-form statistic, never "most" or "leading" or "best".

   A monotone dataset can never become WRONG. It can only become INCOMPLETE. That asymmetry is the
   entire strategy for shipping cricket facts with no backend to refresh from: a wrong dataset
   rejects a correct answer AND accepts an incorrect one, and the player cannot tell which failure
   they are looking at; an incomplete one only ever rejects a correct answer, which is a single
   explicable failure mode that DATA_AS_OF below makes explicable in the interface.
   ============================================================================================ */

/* ---- Kreeda daily contract — see /DAILY.md. Copied, not imported: the game stays one file. ---- */
const SLUG='maidan';
function dayKey(d){ d=d||new Date(); const p=n=>String(n).padStart(2,'0');
  return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate()); }
function prevDayKey(k){ const a=k.split('-'), t=new Date(+a[0],+a[1]-1,+a[2]);
  t.setDate(t.getDate()-1); return dayKey(t); }
function daySeed(k){ let h=5381; for(let i=0;i<k.length;i++) h=(h*33 ^ k.charCodeAt(i))|0; return h>>>0; }
function mulberry32(a){ return function(){ a=(a+0x6D2B79F5)|0; let t=Math.imul(a^(a>>>15),1|a);
  t=(t+Math.imul(t^(t>>>7),61|t))^t; return ((t^(t>>>14))>>>0)/4294967296; }; }

const LS={ get:k=>{ try{ return localStorage.getItem(k)||''; }catch(e){ return ''; } },
           set:(k,v)=>{ try{ localStorage.setItem(k,v); }catch(e){} } };

/* a day-stamped value: returns 0 unless the stamp is today */
function loadToday(key){ const s=LS.get(key), i=s.indexOf('|');
  return (i<0 || s.slice(0,i)!==dayKey()) ? 0 : (+s.slice(i+1)||0); }
function saveToday(key,v){ LS.set(key, dayKey()+'|'+Math.round(v)); }

/* consecutive-days counter against one key. Same day = no change; yesterday = +1; older = reset to 1. */
function bumpStreak(key){
  const s=LS.get(key), i=s.indexOf('|'), last=i<0?'':s.slice(0,i), n=i<0?0:(+s.slice(i+1)||0);
  const today=dayKey(), count = last===today ? (n||1) : (last===prevDayKey(today) ? n+1 : 1);
  LS.set(key, today+'|'+count); return count;
}

/* call once when a DAILY run is completed — not on every game over, not in endless mode */
function dailyDone(){
  const today=dayKey(), k='kreeda.daily.'+today;
  const had=LS.get(k).split(',').filter(Boolean);
  if(!had.includes(SLUG)) LS.set(k, had.concat(SLUG).join(','));
  bumpStreak(SLUG+'.streak');
  return bumpStreak('kreeda.streak');            // site-wide, and the number worth showing
}

/* ============================ the freeze date ============================
   ONE constant, shipped in the file, displayed in the footer and in the reveal panel. A player whose
   correct answer is rejected can see immediately why, which converts an infuriating bug into a
   comprehensible limitation. Nothing asserted anywhere in PLAYERS happened after this date.
   Refresh cadence and checklist: CRICKET_GRID.md §3.3. */
const DATA_AS_OF='2025-12-31';
const DATA_AS_OF_HUMAN='31 December 2025';
const STALE_AFTER_DAYS=400;

/* ============================ name normalisation ============================
   RAMAYANA_GRID.md §3.1's architecture decision, unchanged: the runtime normaliser is deliberately
   small and conservative, and ambiguity is absorbed by a hand-curated `alt` list on each player.
   Every blanket transformation fires on EVERY name in the roster, so each one is a collision risk;
   every alias fires on exactly one player, so it is free. When in doubt, write an alias.

   Cricket brings its own spelling problem — Tendulkar/Sachin/SR Tendulkar, de Villiers/deVilliers/AB,
   Dhoni/MS Dhoni/Mahendra Singh Dhoni, Muralitharan/Muralidaran/Murali — and step 4 (letters only)
   quietly does most of the initials work by eating the periods and the spaces. */
const DEV_CONS={ 'क':'k','ख':'k','ग':'g','घ':'g','ङ':'n','च':'c','छ':'c','ज':'j','झ':'j','ञ':'n',
  'ट':'t','ठ':'t','ड':'d','ढ':'d','ण':'n','त':'t','थ':'t','द':'d','ध':'d','न':'n',
  'प':'p','फ':'p','ब':'b','भ':'b','म':'m','य':'y','र':'r','ल':'l','व':'v','ळ':'l',
  'श':'s','ष':'s','स':'s','ह':'h','क़':'k','ख़':'k','ग़':'g','ज़':'j','ड़':'d','ढ़':'d','फ़':'f' };
const DEV_MATRA={ 'ा':'a','ि':'i','ी':'i','ु':'u','ू':'u','ृ':'ri','ॄ':'ri','े':'e','ै':'ai','ो':'o','ौ':'au' };
const DEV_VOWEL={ 'अ':'a','आ':'a','इ':'i','ई':'i','उ':'u','ऊ':'u','ऋ':'ri','ए':'e','ऐ':'ai','ओ':'o','औ':'au' };
/* The key simplification (RAMAYANA_GRID.md §3.3): step 2 of norm() strips every diacritic anyway, so
   this transliterator only ever needs to emit plain ASCII. ष/श/स all emit `s`; ण/न → `n`. That turns
   correct ISO 15919 transliteration (hard) into a table lookup (easy). */
function devToAscii(s){
  let out='', pend='';
  const flush=()=>{ out+=pend; pend=''; };
  for(const ch of s){
    if(DEV_CONS[ch]!==undefined){ flush(); out+=DEV_CONS[ch]; pend='a'; }
    else if(DEV_MATRA[ch]!==undefined){ pend=DEV_MATRA[ch]; }
    else if(ch==='्'){ pend=''; }                       // virāma cancels the inherent vowel
    else if(DEV_VOWEL[ch]!==undefined){ flush(); out+=DEV_VOWEL[ch]; }
    else if(ch==='ं'||ch==='ँ'){ flush(); out+='m'; }   // anusvāra / candrabindu
    else if(ch==='ः'){ flush(); out+='h'; }                  // visarga
    else { flush(); }                                             // avagraha, daṇḍa, ZWJ, digits, spaces
  }
  flush(); return out;
}
function norm(s){
  if(!s) return '';
  // 1. Devanāgarī → plain ASCII, only if any Devanāgarī is present
  if(/[ऀ-ॿ]/.test(s)) s = devToAscii(s);
  // 2. decompose, then drop every combining mark. THIS ONE LINE folds the whole diacritic problem:
  //    every IAST character is a precomposed Latin letter plus a mark with a canonical NFD form, so
  //    Saṅgakkāra, Muralīdaran and Miṣbaḥ all fall out as plain ASCII with no table to maintain.
  s = s.normalize('NFD').replace(/[̀-ͯ]/g, '');
  // 3. case
  s = s.toLowerCase();
  // 4. letters only — drops spaces, hyphens, periods, apostrophes, digits. `M.S. Dhoni` → `msdhoni`.
  s = s.replace(/[^a-z]/g, '');
  // 5. Anglo long vowels (Sreesanth/Srisanth, Younus/Younis handled by aliases, not here)
  s = s.replace(/ee/g, 'i').replace(/oo/g, 'u');
  // 6. w → v   (Waugh/Vaugh, Warne/Varne — consistent, so harmless)
  s = s.replace(/w/g, 'v');
  // 7. x → ks  (Laxman)
  s = s.replace(/x/g, 'ks');
  // 8. aspirates and sibilants collapse. Order matters: ksh before sh.
  s = s.replace(/ksh/g, 'ks')
       .replace(/chh?/g, 'c')
       .replace(/sh/g, 's')
       .replace(/kh/g, 'k').replace(/gh/g, 'g').replace(/jh/g, 'j')
       .replace(/th/g, 't').replace(/dh/g, 'd')
       .replace(/ph/g, 'p').replace(/bh/g, 'b');
  // 9. honorifics, post-fold forms, looped
  var prev; do { prev = s;
    s = s.replace(/^(sri|jai|jay|lord|svami|maaraj)/, '')
         .replace(/(ji)$/, '');
  } while (s !== prev && s.length > 2);
  // 10. collapse any run of the same letter (Sangakkara/Sangakara, Chanderpaul/Chandarpaul)
  s = s.replace(/(.)\1+/g, '$1');
  // 11. drop a single trailing 'a' — schwa deletion. Sharma/Sharm, Rohit Sharma typed either way.
  s = s.replace(/a$/, '');
  return s;
}

/* A LIGHTER fold, for the typeahead only. norm() is built for resolution and is deliberately lossy:
   it drops a trailing 'a' and collapses doubled letters, so norm('sa') is 's' and a two-character
   prefix disappears. Prefix matching needs the letters as typed, minus case and diacritics — and
   nothing here ever touches validation, so its looseness cannot let a wrong answer through. */
function soft(s){ return (s||'').normalize('NFD').replace(/[\u0300-\u036F]/g,'').toLowerCase().replace(/[^a-z]/g,''); }

/* Damerau–Levenshtein, bounded. At ~2,000 keys a full scan is a fraction of a millisecond and an
   index would be more code and one more thing to get wrong. */
function dl(a,b,cap){
  const n=a.length, m=b.length;
  if(Math.abs(n-m)>cap) return cap+1;
  let prev2=null, prev=new Array(m+1), cur=new Array(m+1);
  for(let j=0;j<=m;j++) prev[j]=j;
  for(let i=1;i<=n;i++){
    cur[0]=i; let best=cur[0];
    for(let j=1;j<=m;j++){
      const c = a.charCodeAt(i-1)===b.charCodeAt(j-1) ? 0 : 1;
      let v = Math.min(prev[j]+1, cur[j-1]+1, prev[j-1]+c);
      if(i>1 && j>1 && a.charCodeAt(i-1)===b.charCodeAt(j-2) && a.charCodeAt(i-2)===b.charCodeAt(j-1))
        v = Math.min(v, prev2[j-2]+1);
      cur[j]=v; if(v<best) best=v;
    }
    if(best>cap) return cap+1;
    prev2=prev; prev=cur; cur=new Array(m+1);
  }
  return prev[m];
}
function fuzzCap(k){ return k.length<=4 ? 0 : (k.length<=7 ? 1 : 2); }

/* ============================================================================================
   THE CRITERION CATALOGUE
   ============================================================================================
   Six families. Every criterion is a predicate over a player, and every predicate is a TAG LOOKUP —
   never a computation, never a judgement call at runtime. `test` runs exactly once per criterion at
   boot to build the bitsets, and is never called during play.

   `single` marks a family whose underlying tag is single-valued. Only `era` is: a player debuted in
   exactly one decade. Two single-valued criteria facing each other across the grid guarantee an
   empty cell, so the generator rejects that SHAPE before it counts a single candidate (§2.2). They
   may sit together on the same axis — rows never intersect rows.

   Nation looks single-valued and is not: Wessels played for Australia and South Africa, and Morgan,
   Joyce and Rankin each for Ireland and England. Most nation pairs are of course empty, and the
   popcount check throws those out for free without needing a special rule. Do not add one.

   THE ONE RULE FOR ADDING A CRITERION: it must be phrasable in the past tense with no implicit
   "as of today". "Took 300 Test wickets" is monotone and legal; "is the leading wicket-taker" flips
   whenever somebody has a good week, and a criterion that flips turns the whole game into a liar.
   ============================================================================================ */

const CRITERIA=[
 /* --- nation (multi-valued) --- */

/* Weekday ramp (RAMAYANA_GRID.md §4.5). Monday should feel like an invitation; Sunday should feel
   like the reason you learned the names. Keyed off the local weekday of the dayKey, which is the same
   everywhere for a given dayKey, so it stays a pure function of the date. */
function tierPool(key){
  const a=key.split('-'), wd=new Date(+a[0],+a[1]-1,+a[2]).getDay();   // 0=Sun
  if(wd===1||wd===2) return {tiers:['core'],maxDeep:0};
  if(wd===3||wd===4) return {tiers:['core','wide'],maxDeep:0};
  if(wd===0)         return {tiers:['core','wide','deep'],maxDeep:6};
  return {tiers:['core','wide','deep'],maxDeep:1};                      // Fri, Sat
}

/* ============================================================================================
   BITSETS, LOOKUP AND THE BOOT SELF-TESTS
   ============================================================================================ */
const N=PLAYERS.length, W=Math.ceil(N/32);
PLAYERS.forEach((p,i)=>{ p.index=i; if(!p.sur){ const t=p.name.trim().split(/\s+/); p.sur=t[t.length-1]; } });

/* One Uint32Array per criterion. A cell's candidate count is then W ANDs and a popcount, which is
   why the generator can afford to reject grids aggressively — solvability checking is essentially
   free, and that is the whole reason a 3x3 daily fits in a static file with no server. */
const BITS=CRITERIA.map(c=>{
  const b=new Uint32Array(W);
  for(let i=0;i<N;i++) if(c.test(PLAYERS[i])) b[i>>5]|=(1<<(i&31));
  return b;
});
function popcount(x){ x=x-((x>>>1)&0x55555555); x=(x&0x33333333)+((x>>>2)&0x33333333);
  x=(x+(x>>>4))&0x0f0f0f0f; return (x*0x01010101)>>>24; }
function andBits(a,b){ const o=new Uint32Array(W); for(let w=0;w<W;w++) o[w]=a[w]&b[w]; return o; }
function countBits(b){ let n=0; for(let w=0;w<W;w++) n+=popcount(b[w]); return n; }
function bitMembers(b){ const o=[]; for(let w=0;w<W;w++){ let x=b[w]; while(x){ const t=x&-x;
  o.push((w<<5)+popcount(t-1)); x^=t; } } return o; }   // ascending index order — stable, not a Set
function testBit(b,i){ return (b[i>>5]>>>(i&31))&1; }

/* KEYS: every canonical name, every alias, and every UNAMBIGUOUS bare surname, through norm().
   Bare surnames must resolve because that is how cricket is spoken — but only where the roster has
   exactly one owner. Where two players share one, the surname is deliberately left OUT of KEYS so
   that typing it falls through to the disambiguation prompt in resolve(). Waugh must ask, never guess. */
const KEYS=new Map(), SURNAMES=new Map();
function addKey(k,i){
  if(!k||k.length<2) return;
  if(KEYS.has(k) && KEYS.get(k)!==i) COLLISIONS.push(k+' → '+PLAYERS[KEYS.get(k)].name+' / '+PLAYERS[i].name);
  else KEYS.set(k,i);
}
const COLLISIONS=[];
(function buildKeys(){
  for(let i=0;i<N;i++){
    const p=PLAYERS[i];
    addKey(norm(p.name),i);
    for(const a of (p.alt||[])) addKey(norm(a),i);
  }
  // surnames second, so a surname can never displace somebody else's full name
  for(let i=0;i<N;i++){
    const k=norm(PLAYERS[i].sur);
    if(!k||k.length<2) continue;
    if(!SURNAMES.has(k)) SURNAMES.set(k,[]);
    SURNAMES.get(k).push(i);
  }
  SURNAMES.forEach((owners,k)=>{ if(owners.length===1 && !KEYS.has(k)) KEYS.set(k,owners[0]); });
})();
/* The collision assertion. A collision means norm() has folded two distinct cricketers together,
   which silently makes one of them unanswerable — the exact class of failure the normaliser's
   conservatism exists to prevent. Costs nothing, catches everything. */
if(COLLISIONS.length) console.error('[maidan] alias collisions:', COLLISIONS);
(function selfTest(){
  const bad=[];
  for(let i=0;i<N;i++) if(KEYS.get(norm(PLAYERS[i].name))!==i) bad.push(PLAYERS[i].name);
  if(bad.length) console.error('[maidan] canonical names that do not round-trip:', bad);
  const ids=new Set(); PLAYERS.forEach(p=>{ if(ids.has(p.id)) console.error('[maidan] duplicate id',p.id); ids.add(p.id); });
})();
const KEYLIST=[...KEYS.keys()];   // fixed order, built once; never iterated during daily setup

/* ============================================================================================
   SOLVABILITY — two separate requirements, and the second is the one implementations get wrong
   ============================================================================================
   (a) every cell has at least THREE valid answers. A one-answer cell is a trivia question wearing a
       puzzle's clothes, and it is also the cell most likely to be wrong — one data error away from
       unanswerable, with no redundancy to absorb the mistake.
   (b) a system of distinct representatives must EXIST. Because each cricketer may be used once,
       per-cell non-emptiness does not imply the grid is solvable: three cells whose only candidates
       are the same three players, plus a fourth needing one of them, is an unsolvable grid in which
       every cell individually looks fine. So: a perfect bipartite matching of size 9, by Kuhn's
       augmenting paths. Do not skip it and do not assume min(n) >= 3 implies it. It does not. */
function perfectMatching(cands){
  const matchP=new Int32Array(N).fill(-1);           // player -> cell
  const seen=new Uint8Array(N);
  function tryCell(c){
    for(const p of cands[c]){
      if(seen[p]) continue;
      seen[p]=1;
      if(matchP[p]<0 || tryCell(matchP[p])){ matchP[p]=c; return true; }
    }
    return false;
  }
  for(let c=0;c<9;c++){ seen.fill(0); if(!tryCell(c)) return false; }
  return true;
}

/* Maximum-weight perfect matching over 9 cells and a bounded candidate pool, by the standard
   O(n^2 m) Hungarian with potentials. Restricting each cell to its twelve rarest candidates can only
   UNDERSTATE the optimum, never overstate it, so the "heaviest possible" figure shown to the player
   is always actually achievable. */
function heaviestMatching(cands){
  const idx=new Map(), cols=[];
  for(let c=0;c<9;c++){
    const sorted=cands[c].slice().sort((a,b)=>{
      const d=PLAYERS[a].fame-PLAYERS[b].fame; return d!==0?d:a-b;   // total comparator: tie-break on index
    }).slice(0,12);
    for(const p of sorted) if(!idx.has(p)){ idx.set(p,cols.length); cols.push(p); }
  }
  const m=cols.length; if(m<9) return 0;
  const INF=1e9, cost=[];
  for(let c=0;c<9;c++){
    const row=new Array(m).fill(INF);
    for(const p of cands[c]){ const j=idx.get(p); if(j!==undefined) row[j]=-(6-PLAYERS[p].fame); }
    cost.push(row);
  }
  const u=new Array(10).fill(0), v=new Array(m+1).fill(0), pcol=new Array(m+1).fill(0), way=new Array(m+1).fill(0);
  for(let i=1;i<=9;i++){
    pcol[0]=i; let j0=0;
    const minv=new Array(m+1).fill(INF), used=new Array(m+1).fill(false);
    do{
      used[j0]=true; const i0=pcol[j0]; let delta=INF, j1=0;
      for(let j=1;j<=m;j++) if(!used[j]){
        const cur=cost[i0-1][j-1]-u[i0]-v[j];
        if(cur<minv[j]){ minv[j]=cur; way[j]=j0; }
        if(minv[j]<delta){ delta=minv[j]; j1=j; }
      }
      if(delta>=INF/2) return 0;
      for(let j=0;j<=m;j++){ if(used[j]){ u[pcol[j]]+=delta; v[j]-=delta; } else minv[j]-=delta; }
      j0=j1;
    } while(pcol[j0]!==0);
    do{ const j1=way[j0]; pcol[j0]=pcol[j1]; j0=j1; } while(j0);
  }
  let total=0;
  for(let j=1;j<=m;j++) if(pcol[j]) total += -cost[pcol[j]-1][j-1];
  return total;
}

/* ============================================================================================
   GENERATING THE DAY'S GRID
   ============================================================================================
   EVERYTHING below draws from ONE mulberry32(daySeed(dayKey())) stream, in a fixed order. A stray
   Math.random() here desynchronises players worldwide and there is no way to detect it from inside
   the game. The criterion catalogue and the player table are ARRAYS with a fixed order; nothing in
   daily setup ever iterates a Set, a Map or Object.keys(). */
const FALLBACK=[
  {rows:['n-ind','n-aus','n-eng'],cols:['f-test','f-odi','r-captain']},
  {rows:['e-90s','e-00s','e-10s'],cols:['n-ind','f-test','r-captain']},
  {rows:['n-ind','n-pak','n-sl'], cols:['f-test','r-captain','r-pace']},
  {rows:['n-eng','n-aus','n-wi'], cols:['f-test','r-captain','m-test100m']},
  {rows:['f-test','f-odi','r-captain'],cols:['n-ind','n-eng','n-aus']},
  {rows:['n-ind','n-aus','n-eng'],cols:['e-90s','e-00s','e-10s']}
];
function critIndex(id){ for(let i=0;i<CRITERIA.length;i++) if(CRITERIA[i].id===id) return i; return -1; }

function axisRuleOK(rows,cols){
  // Two criteria drawn from the same SINGLE-VALUED family must never sit on opposite axes: one cell
  // would be empty by construction. Same axis is fine — rows never intersect rows.
  for(const r of rows) for(const c of cols){
    const R=CRITERIA[r], C=CRITERIA[c];
    if(R.single && C.single && R.family===C.family) return false;
  }
  return true;
}
function buildCells(rows,cols){
  const cells=[];
  for(let i=0;i<3;i++) for(let j=0;j<3;j++) cells.push(andBits(BITS[rows[i]],BITS[cols[j]]));
  return cells;
}
function gradeGrid(rows,cols){
  if(!axisRuleOK(rows,cols)) return null;
  const cells=buildCells(rows,cols), counts=cells.map(countBits);
  if(Math.min.apply(null,counts)<3) return null;
  const sum=counts.reduce((a,b)=>a+b,0);
  if(sum<45||sum>240) return null;                       // breadth band: neither collapsed nor a blur
  const cands=cells.map(bitMembers);
  // Every cell must contain at least one answer with fame >= 3. No cell is ever solvable only by a
  // specialist, and this does more for perceived fairness than anything else in the generator.
  for(const list of cands) if(!list.some(i=>PLAYERS[i].fame>=3)) return null;
  if(!perfectMatching(cands)) return null;
  return {rows,cols,cells,counts,cands,sum};
}
function makeGrid(key){
  const rng=mulberry32(daySeed(key));
  const ramp=tierPool(key);
  const pool=[];
  for(let i=0;i<CRITERIA.length;i++) if(ramp.tiers.indexOf(CRITERIA[i].tier)>=0) pool.push(i);
  const draw=(exclude)=>{
    // rejection sampling against the pool, in fixed index order. Never shuffles a Set.
    for(let guard=0;guard<400;guard++){
      const c=pool[Math.floor(rng()*pool.length)];
      if(exclude.indexOf(c)<0) return c;
    }
    return -1;
  };
  for(let attempt=0;attempt<200;attempt++){
    const picked=[];
    let ok=true;
    for(let k=0;k<6;k++){ const c=draw(picked); if(c<0){ ok=false; break; } picked.push(c); }
    if(!ok) continue;
    const rows=picked.slice(0,3), cols=picked.slice(3,6);
    let deep=0; for(const c of picked) if(CRITERIA[c].tier==='deep') deep++;
    if(deep>ramp.maxDeep) continue;
    const g=gradeGrid(rows,cols);
    if(g){ g.fallback=false; g.attempt=attempt; return g; }
  }
  /* The fallbacks exist so a data edit that accidentally narrows the roster can never produce a day
     with no puzzle. If the 200-day audit ever reports one being used, that is a bug to fix in the
     data — not a shrug. */
  const fb=FALLBACK[daySeed(key)%FALLBACK.length];
  const g=gradeGrid(fb.rows.map(critIndex),fb.cols.map(critIndex));
  if(g){ g.fallback=true; return g; }
  const g2={rows:fb.rows.map(critIndex),cols:fb.cols.map(critIndex)};
  g2.cells=buildCells(g2.rows,g2.cols); g2.counts=g2.cells.map(countBits);
  g2.cands=g2.cells.map(bitMembers); g2.sum=g2.counts.reduce((a,b)=>a+b,0); g2.fallback=true;
  return g2;
}

/* ============================================================================================
   STATE AND STORAGE
   ============================================================================================
   Flat pipe-delimited strings per /DAILY.md, every read and write in try/catch — localStorage throws
   outright in Safari private mode and on some file:// origins, and a game that cannot save must
   still play. Corrupt values fall back to defaults; nothing here is allowed to break boot. */
const params=new URLSearchParams(location.search);
const ARCHIVE=/^\d{4}-\d{2}-\d{2}$/.test(params.get('date')||'') ? params.get('date') : '';
const KEY=ARCHIVE||dayKey();
const LIVE=!ARCHIVE;                                    // archive days write nothing and share no streak

const S={ cells:new Array(9).fill(-1), guesses:0, done:false, dirty:new Array(9).fill(0), open:-1 };
let GRID=null, settings={snd:1,type:1,theme:'auto'};

function loadSettings(){
  try{
    const raw=LS.get(SLUG+'.settings');
    raw.split(';').forEach(kv=>{ const i=kv.indexOf('='); if(i<0) return;
      const k=kv.slice(0,i), v=kv.slice(i+1);
      if(k==='snd') settings.snd = v==='1'?1:0;
      else if(k==='type') settings.type = v==='1'?1:0;
      else if(k==='theme'&&['auto','light','dark'].indexOf(v)>=0) settings.theme=v; });
  }catch(e){}                                            // any garbage at all: keep the defaults
}
function saveSettings(){ LS.set(SLUG+'.settings','snd='+settings.snd+';type='+settings.type+';theme='+settings.theme); }
function loadState(){
  if(!LIVE) return;
  try{
    const raw=LS.get(SLUG+'.state'); if(!raw) return;
    const a=raw.split('|');
    if(a[0]!==KEY) return;                               // a day-stamped value from another day is worth zero
    const ids=(a[1]||'').split(',');
    for(let i=0;i<9;i++){
      const id=ids[i]; if(!id) continue;
      const j=PLAYERS.findIndex(p=>p.id===id);
      if(j>=0 && GRID && testBit(GRID.cells[i],j)) S.cells[i]=j;   // ignore anything the grid disagrees with
    }
    S.guesses=Math.max(0,Math.min(9,+a[2]||0));
    S.done=a[3]==='1';
    const d=a[4]||''; for(let i=0;i<9;i++) S.dirty[i] = d.charAt(i)==='1'?1:0;
  }catch(e){ S.cells=new Array(9).fill(-1); S.guesses=0; S.done=false; S.dirty=new Array(9).fill(0); }
}
function saveState(){
  if(!LIVE) return;
  const ids=S.cells.map(i=>i<0?'':PLAYERS[i].id).join(',');
  LS.set(SLUG+'.state', KEY+'|'+ids+'|'+S.guesses+'|'+(S.done?1:0)+'|'+S.dirty.join(''));
}
function filled(){ let n=0; for(const c of S.cells) if(c>=0) n++; return n; }
function weight(){ let w=0; for(const c of S.cells) if(c>=0) w+=6-PLAYERS[c].fame; return w; }

/* ============================================================================================
   AUDIO — WebAudio oscillators only, no files, because the game must work off a disk
   ============================================================================================ */
let AC=null;
function ac(){ try{ if(!AC) AC=new (window.AudioContext||window.webkitAudioContext)();
  if(AC.state==='suspended') AC.resume(); return AC; }catch(e){ return null; } }
function knock(){                                        // bat on ball: a noise burst over a low sine
  if(!settings.snd) return; const c=ac(); if(!c) return;
  const t=c.currentTime, len=0.09, buf=c.createBuffer(1,Math.ceil(c.sampleRate*len),c.sampleRate);
  const d=buf.getChannelData(0); for(let i=0;i<d.length;i++) d[i]=(Math.random()*2-1)*(1-i/d.length);
  const src=c.createBufferSource(); src.buffer=buf;
  const bp=c.createBiquadFilter(); bp.type='bandpass'; bp.frequency.value=1750; bp.Q.value=2.2;
  const g=c.createGain(); g.gain.setValueAtTime(0.22,t); g.gain.exponentialRampToValueAtTime(0.001,t+len);
  src.connect(bp).connect(g).connect(c.destination); src.start(t); src.stop(t+len);
  const o=c.createOscillator(), og=c.createGain(); o.type='sine'; o.frequency.value=126;
  og.gain.setValueAtTime(0.18,t); og.gain.exponentialRampToValueAtTime(0.001,t+0.13);
  o.connect(og).connect(c.destination); o.start(t); o.stop(t+0.14);
}
function flat(){                                         // wrong: one damped tone. No buzzer.
  if(!settings.snd) return; const c=ac(); if(!c) return;
  const t=c.currentTime, o=c.createOscillator(), g=c.createGain();
  o.type='triangle'; o.frequency.setValueAtTime(150,t); o.frequency.linearRampToValueAtTime(112,t+0.18);
  g.gain.setValueAtTime(0.14,t); g.gain.exponentialRampToValueAtTime(0.001,t+0.2);
  o.connect(g).connect(c.destination); o.start(t); o.stop(t+0.21);
}
function crowd(){                                        // 9/9: a swell of filtered noise, ~1.1s. No samples.
  if(!settings.snd) return; const c=ac(); if(!c) return;
  const t=c.currentTime, len=1.1, buf=c.createBuffer(1,Math.ceil(c.sampleRate*len),c.sampleRate);
  const d=buf.getChannelData(0); for(let i=0;i<d.length;i++) d[i]=(Math.random()*2-1);
  const src=c.createBufferSource(); src.buffer=buf;
  const lp=c.createBiquadFilter(); lp.type='lowpass';
  lp.frequency.setValueAtTime(400,t); lp.frequency.linearRampToValueAtTime(1500,t+0.45);
  lp.frequency.linearRampToValueAtTime(500,t+len);
  const g=c.createGain(); g.gain.setValueAtTime(0.001,t);
  g.gain.linearRampToValueAtTime(0.16,t+0.4); g.gain.linearRampToValueAtTime(0.001,t+len);
  src.connect(lp).connect(g).connect(c.destination); src.start(t); src.stop(t+len);
}

/* ============================================================================================
   RENDER
   ============================================================================================ */
const $=id=>document.getElementById(id);
function critOf(i,isRow){ return CRITERIA[isRow?GRID.rows[i]:GRID.cols[i]]; }
function cellLabel(k){
  const r=critOf(Math.floor(k/3),true), c=critOf(k%3,false);
  const who=S.cells[k]>=0 ? 'Filled with '+PLAYERS[S.cells[k]].name+'.' : 'Empty.';
  return 'Row: '+r.label+'. Column: '+c.label+'. '+who;
}
function buildGrid(){
  const g=$('grid'); g.innerHTML='';
  const corner=document.createElement('div'); corner.className='corner'; corner.setAttribute('role','presentation');
  /* The one piece of ornament in the game: a hand-drawn set of stumps and a crease. It depicts no
     crest, no flag and no person, which is exactly why it is drawn rather than shipped as a file. */
  corner.innerHTML='<svg viewBox="0 0 60 60" aria-hidden="true">'+
    '<line x1="10" y1="46" x2="50" y2="46" stroke="var(--crease)" stroke-width="2.5" stroke-linecap="round"/>'+
    '<line x1="24" y1="18" x2="24" y2="46" stroke="var(--lamp)" stroke-width="2.5" stroke-linecap="round"/>'+
    '<line x1="30" y1="18" x2="30" y2="46" stroke="var(--lamp)" stroke-width="2.5" stroke-linecap="round"/>'+
    '<line x1="36" y1="18" x2="36" y2="46" stroke="var(--lamp)" stroke-width="2.5" stroke-linecap="round"/>'+
    '<line x1="21" y1="16" x2="33" y2="16" stroke="var(--crease)" stroke-width="2" stroke-linecap="round"/>'+
    '<line x1="27" y1="16" x2="39" y2="16" stroke="var(--crease)" stroke-width="2" stroke-linecap="round"/></svg>';
  g.appendChild(corner);
  for(let j=0;j<3;j++){
    const h=document.createElement('div'); h.className='hd'; h.textContent=critOf(j,false).short;
    h.tabIndex=0; h.setAttribute('role','columnheader'); h.title=critOf(j,false).label;
    h.addEventListener('click',()=>say(critOf(j,false).label));
    h.addEventListener('keydown',e=>{ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); say(critOf(j,false).label); } });
    g.appendChild(h);
  }
  for(let i=0;i<3;i++){
    const h=document.createElement('div'); h.className='hd'; h.textContent=critOf(i,true).short;
    h.tabIndex=0; h.setAttribute('role','rowheader'); h.title=critOf(i,true).label;
    h.addEventListener('click',()=>say(critOf(i,true).label));
    h.addEventListener('keydown',e=>{ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); say(critOf(i,true).label); } });
    g.appendChild(h);
    for(let j=0;j<3;j++){
      const k=i*3+j;
      const cell=document.createElement('div');
      cell.className='cell'; cell.id='cell'+k; cell.tabIndex=0;
      cell.setAttribute('role','gridcell');
      cell.setAttribute('aria-rowindex',String(i+1)); cell.setAttribute('aria-colindex',String(j+1));
      cell.addEventListener('click',e=>{ if(e.target.classList.contains('hint')) return; openCell(k); });
      cell.addEventListener('keydown',e=>onCellKey(e,k));
      g.appendChild(cell);
    }
  }
  paint();
}
function onCellKey(e,k){
  const i=Math.floor(k/3), j=k%3;
  let t=-1;
  if(e.key==='ArrowRight') t=i*3+((j+1)%3);
  else if(e.key==='ArrowLeft') t=i*3+((j+2)%3);
  else if(e.key==='ArrowDown') t=((i+1)%3)*3+j;
  else if(e.key==='ArrowUp') t=((i+2)%3)*3+j;
  else if(e.key==='Enter'||e.key===' '){ e.preventDefault(); openCell(k); return; }
  if(t>=0){ e.preventDefault(); const el=$('cell'+t); if(el) el.focus(); }
}
function paint(){
  for(let k=0;k<9;k++){
    const el=$('cell'+k); if(!el) continue;
    const p=S.cells[k]>=0?PLAYERS[S.cells[k]]:null;
    el.classList.toggle('on',!!p);
    el.setAttribute('aria-label',cellLabel(k));
    if(p) el.innerHTML='<span class="nm"></span><span class="wt">'+(6-p.fame)+'</span>';
    else  el.innerHTML='<span class="plus">+</span><button class="hint" type="button" aria-label="How many cricketers fit this cell">&#9432;</button>';
    if(p) el.querySelector('.nm').textContent=p.name;
    else el.querySelector('.hint').addEventListener('click',e=>{
      e.stopPropagation();
      say(GRID.counts[k]+' cricketer'+(GRID.counts[k]===1?'':'s')+' in the roster fit that cell.');
    });
  }
  $('sCells').textContent=filled()+'/9';
  $('sGuess').textContent=String(9-S.guesses);
  $('sWeight').textContent=String(weight());
  $('bReveal').hidden=!S.done;
}
function say(t,cls){ const m=$('msg'); m.innerHTML=''; const s=document.createElement('span');
  if(cls) s.className=cls; s.textContent=t; m.appendChild(s); }

/* ============================================================================================
   THE SHEET, THE TYPEAHEAD AND RESOLUTION
   ============================================================================================ */
function openCell(k){
  if(S.done || S.cells[k]>=0) return;
  S.open=k;
  $('critRow').textContent=critOf(Math.floor(k/3),true).label;
  $('critCol').textContent=critOf(k%3,false).label;
  $('sheetMeta').textContent=(9-S.guesses)+' guess'+(9-S.guesses===1?'':'es')+' left · '+
    GRID.counts[k]+' cricketers fit this cell';
  $('guess').value=''; $('sheetMsg').textContent=''; $('disamb').hidden=true; $('ta').innerHTML='';
  $('sheet').hidden=false; $('scrim').classList.add('show');
  requestAnimationFrame(()=>{ $('sheet').classList.add('show'); $('guess').focus(); });
}
function closeSheet(){
  S.open=-1;
  $('sheet').classList.remove('show'); $('scrim').classList.remove('show');
  setTimeout(()=>{ if(S.open<0) $('sheet').hidden=true; },220);
}

/* THE TRAP IN THE TYPEAHEAD, stated where an editor will see it:
   the suggestion list is drawn from the ENTIRE roster and is NEVER filtered by what is valid for the
   open cell. Filtering it would hand over the answer. It looks like a kindness and it is a spoiler.
   If anybody ever writes PLAYERS.filter(validForCell) in here, the game is broken. */
function typeahead(){
  const box=$('ta'); box.innerHTML='';
  if(!settings.type) return;
  const q=soft($('guess').value);
  if(q.length<2) return;
  const pre=[], sub=[], seen=new Set();
  for(let i=0;i<N;i++){
    const p=PLAYERS[i], k=soft(p.name), sk=soft(p.sur);
    if(sk.indexOf(q)===0||k.indexOf(q)===0) pre.push(i);
    else if((p.alt||[]).some(a=>soft(a).indexOf(q)===0)) pre.push(i);
    else if(k.indexOf(q)>=0||sk.indexOf(q)>=0) sub.push(i);
  }
  const out=pre.concat(sub).filter(i=>{ if(seen.has(i)) return false; seen.add(i); return true; }).slice(0,6);
  for(const i of out){
    const li=document.createElement('li'), b=document.createElement('button');
    b.type='button';
    b.appendChild(document.createTextNode(PLAYERS[i].name));
    const sm=document.createElement('small');
    sm.textContent=PLAYERS[i].nations.map(n=>NATION_NAME[n]).join(' / ')+' · debut '+PLAYERS[i].debut;
    b.appendChild(sm);
    b.addEventListener('click',()=>{ $('guess').value=PLAYERS[i].name; box.innerHTML=''; commit(i); });
    li.appendChild(b); box.appendChild(li);
  }
}
const NATION_NAME={ind:'India',aus:'Australia',eng:'England',pak:'Pakistan',sa:'South Africa',
  wi:'West Indies',nz:'New Zealand',sl:'Sri Lanka',ban:'Bangladesh',zim:'Zimbabwe',ire:'Ireland',afg:'Afghanistan'};

/* Resolution. Returns {kind:'hit'|'none'|'ambiguous', index?, options?}.
   Two candidates within the fuzzy threshold must NEVER resolve silently: `Waugh` is Steve or Mark and
   picking one for the player would be worse than any other failure mode in the game. */
function resolve(text){
  const k=norm(text);
  if(k.length<2) return {kind:'none',tooShort:true};
  if(KEYS.has(k)) return {kind:'hit',index:KEYS.get(k)};
  // a bare surname that two or more cricketers in the roster share: ask, never guess
  if(SURNAMES.has(k) && SURNAMES.get(k).length>1) return {kind:'ambiguous',options:SURNAMES.get(k).slice(0,6)};
  const cap=fuzzCap(k), hits=[];
  for(const key of KEYLIST){
    if(Math.abs(key.length-k.length)>cap) continue;
    if(dl(k,key,cap)<=cap){ const i=KEYS.get(key); if(hits.indexOf(i)<0) hits.push(i); }
  }
  if(hits.length===1) return {kind:'hit',index:hits[0]};
  if(hits.length>1) return {kind:'ambiguous',options:hits.slice(0,6)};
  return {kind:'none'};
}

/* Five outcomes, and ONLY ONE of them costs a guess. A typo, an unknown name and a repeat are the
   three things a sincere player does most often; charging for any of them turns a puzzle into a
   punishment, and it is the single most common way this genre gets ruined. */
function submit(){
  if(S.open<0) return;
  const raw=$('guess').value.trim();
  const r=resolve(raw);
  $('disamb').hidden=true;
  if(r.kind==='none'){
    if(r.tooShort) return;                              // mid-typo: ignore silently, cost nothing
    sheetMsg('Maidan doesn’t know that name. The roster is '+N+' international cricketers, '+
             'men’s and women’s, frozen at '+DATA_AS_OF_HUMAN+'. No guess spent.');
    return;
  }
  if(r.kind==='ambiguous'){ showDisamb(r.options); return; }
  commit(r.index);
}
function showDisamb(options){
  const d=$('disamb'); d.innerHTML='';
  const p=document.createElement('p'); p.style.margin='0';
  p.textContent='Which one? (This costs no guess.)'; d.appendChild(p);
  const row=document.createElement('div'); row.className='row';
  for(const i of options){
    const b=document.createElement('button'); b.type='button'; b.textContent=PLAYERS[i].name;
    b.addEventListener('click',()=>{ d.hidden=true; commit(i); });
    row.appendChild(b);
  }
  d.appendChild(row); d.hidden=false;
  sheetMsg('');
}
function sheetMsg(t,cls){ const m=$('sheetMsg'); m.innerHTML='';
  const s=document.createElement('span'); if(cls) s.className=cls; s.textContent=t; m.appendChild(s); }

function commit(i){
  const k=S.open; if(k<0) return;
  const p=PLAYERS[i];
  const already=S.cells.indexOf(i);
  if(already>=0){
    sheetMsg(p.name+' is already placed — row '+(Math.floor(already/3)+1)+', column '+(already%3+1)+
             '. Each cricketer can only be used once. No guess spent.');
    return;
  }
  const r=critOf(Math.floor(k/3),true), c=critOf(k%3,false);
  const rOK=r.test(p), cOK=c.test(p);
  if(rOK&&cOK){
    S.cells[k]=i; $('guess').value='';
    knock();
    closeSheet(); paint();
    const el=$('cell'+k); if(el){ el.classList.add('lay'); setTimeout(()=>el.classList.remove('lay'),380); }
    say(p.name+' — '+r.label+' ✓ · '+c.label+' ✓','yes');
    saveState();
    if(filled()===9) endGrid(true);
    return;
  }
  /* Outcome (d) says WHICH HALF failed. It teaches, it makes a wrong guess feel like it bought
     something, and it cannot reveal an answer: it tells the player facts about the cricketer THEY
     named, not about any cricketer they didn't. */
  S.guesses++; S.dirty[k]=1; flat();
  const line=p.name+' — '+r.label+' '+(rOK?'✓':'✗')+' · '+c.label+' '+(cOK?'✓':'✗');
  sheetMsg(line,'nope'); say(line,'nope');
  paint(); saveState();
  if(S.guesses>=9){ closeSheet(); endGrid(false); }
}

/* ============================================================================================
   THE END OF A GRID, THE REVEAL PANEL AND SHARING
   ============================================================================================ */
let siteStreak=0, heaviest=0;
function endGrid(perfect){
  if(S.done) return;
  S.done=true; saveState(); paint();
  if(perfect) crowd();
  if(LIVE){
    /* dailyDone() is called when the grid ENDS, either way — 9/9 or out of guesses. A streak that
       required a perfect grid would break for everybody in the first week and then mean nothing.
       Showing up is the feat the streak pays for. */
    const w=weight();
    if(w>loadToday(SLUG+'.dbest')) saveToday(SLUG+'.dbest',w);
    siteStreak=dailyDone();
    $('sStreak').textContent=String(siteStreak);
  }
  track('grid_end',{filled:filled(),guesses:S.guesses,weight:weight(),heaviest:heaviest,
                    mode:LIVE?'daily':'archive',typeahead:settings.type});
  say(perfect ? 'Nine of nine. The ground is full.'
             : filled()+' of nine filled. Every answer is below.');
  setTimeout(showReveal, perfect?900:400);
}
function esc(t){ const d=document.createElement('div'); d.textContent=t; return d.innerHTML; }
function showReveal(){
  const R=$('revInner');
  const parts=[];
  parts.push('<h2 id="revTitle">'+filled()+' of nine</h2>');
  parts.push('<p><b>Weight '+weight()+'</b> of a possible '+heaviest+' · '+S.guesses+
             ' of nine guesses spent'+(settings.type?'':' · recall')+'.</p>');
  parts.push('<textarea class="sharebox" id="shareTxt" rows="7" readonly></textarea>');
  parts.push('<div class="tools"><button class="btn primary" type="button" id="bCopy">Copy result</button>'+
             '<button class="btn" type="button" id="bClose">Back to the grid</button></div>');
  parts.push('<p class="note">Every cricketer in the roster who fits each cell, with their career '+
             'span — first to last Test, one-day or T20 international. An open dash means they were '+
             'still playing at the freeze date. Yours is highlighted.</p>');
  for(let k=0;k<9;k++){
    const r=critOf(Math.floor(k/3),true), c=critOf(k%3,false);
    parts.push('<h3>'+esc(r.label)+' &nbsp;×&nbsp; '+esc(c.label)+
               ' <span style="font-weight:600;opacity:.7">('+GRID.counts[k]+')</span></h3>');
    const list=GRID.cands[k].slice().sort((a,b)=>{
      const d=PLAYERS[b].fame-PLAYERS[a].fame; return d!==0?d:a-b;   // total comparator, tie-break on index
    });
    parts.push('<ul class="ans">');
    for(const i of list){
      const p=PLAYERS[i], mine=S.cells[k]===i;
      parts.push('<li'+(mine?' class="mine"':'')+'><b>'+esc(p.name)+'</b> · '+
        esc(p.nations.map(n=>NATION_NAME[n]).join(' / '))+' · '+p.debut+'–'+(p.last||'')+
        ' <span class="w">weight '+(6-p.fame)+'</span>'+
        '<span class="g">'+esc(p.gloss)+'</span></li>');
    }
    parts.push('</ul>');
  }
  parts.push('<h3>About this dataset</h3>');
  parts.push('<p class="note"><b>Facts current to '+DATA_AS_OF_HUMAN+'.</b> Every criterion in Maidan '+
    'is a monotone fact — an event that happened, or a threshold that has been crossed. Never a '+
    'ranking, never "most" or "leading" or "best", because those flip whenever somebody has a good '+
    'week. That choice means this dataset can never become <i>wrong</i>; it can only become '+
    '<i>incomplete</i>. If a correct answer of yours was rejected, that is the reason, and it is a '+
    'gap rather than an error. Debut year means first Test, one-day or T20 international appearance, '+
    'applied uniformly.</p>');
  parts.push('<p class="note"><b>Weight is not rarity scoring.</b> Immaculate Grid’s rarity is a '+
    '<i>social</i> measurement — it tells you how few of the other players thought of your answer, '+
    'and knowing that requires a server counting everybody. Maidan has no server and never phones '+
    'home. Its Weight is an <i>editorial</i> measurement: a number assigned to each cricketer when '+
    'the dataset was written, reflecting roughly how well known they are. It is the same on day one '+
    'as on day one thousand, and it works on a plane. It can never surprise you by revealing that '+
    'everybody else also thought of Jayasuriya.</p>');
  parts.push('<p class="note">Statistics are facts and facts are not copyrightable. Maidan ships '+
    '<b>zero image files</b>: no team logos, no crests, no kit designs, no player photographs. '+
    'Franchise T20 teams are deliberately absent from the axes — international teams, formats and '+
    'long-established domestic competitions only. Compiled by hand from multiple public references, '+
    'never copied from any single commercial table.</p>');
  parts.push('<p class="note">Something wrong here? Corrections are welcome — this is a hand-built '+
    'table and it will have gaps. <a href="../">kreeda.games</a></p>');
  R.innerHTML=parts.join('');
  $('shareTxt').value=shareText();
  $('bCopy').addEventListener('click',doCopy);
  $('bClose').addEventListener('click',()=>{ $('reveal').classList.remove('show'); $('reveal').hidden=true; });
  $('reveal').hidden=false; $('reveal').classList.add('show'); $('reveal').scrollTop=0;
  $('revTitle').setAttribute('tabindex','-1'); $('revTitle').focus();
}

/* The share grid encodes, per cell, exactly two bits: solved or not, and cleanly or not. It encodes
   nothing about WHICH cricketer was named. The criteria are not secret — every player worldwide sees
   the identical six the moment they open the page — so revealing which cells somebody found tells a
   reader nothing they could not already see.
   THEREFORE: Weight is never encoded per cell. A per-cell weight glyph would leak — telling a reader
   that your answer to a three-answer cell was a weight-5 name narrows their search to one player.
   Weight appears only as a single total on the score line, where it is not attributable to any cell.
   This is the one way this format could be broken and it is exactly the kind of thing that looks
   like a nice idea in review. It isn't. */
function shareText(){
  const MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  const a=KEY.split('-'), head='Kreeda · Maidan · '+(+a[2])+' '+MON[+a[1]-1];
  let rows='';
  for(let i=0;i<3;i++){
    for(let j=0;j<3;j++){
      const k=i*3+j;
      rows += S.cells[k]<0 ? '⬜' : (S.dirty[k] ? '🟨' : '🟧');
    }
    rows+='\n';
  }
  let score=filled()+'/9 · weight '+weight();
  if(!settings.type) score+=' · recall';
  if(LIVE && siteStreak>=2) score+=' · streak '+siteStreak+' 🔥';
  if(!LIVE) score+=' · archive';
  return head+'\n'+rows+score+'\nkreeda.games/maidan/';
}
function doCopy(){
  const t=shareText(), b=$('bCopy');
  const ok=()=>{ b.textContent='Copied'; setTimeout(()=>b.textContent='Copy result',1400); };
  try{
    if(navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(t).then(ok,fallback); }
    else fallback();
  }catch(e){ fallback(); }
  function fallback(){
    const ta=$('shareTxt'); ta.focus(); ta.select();
    try{ document.execCommand('copy'); ok(); }catch(e){ b.textContent='Select and copy'; }
  }
}

/* The one call into analytics.js, and deliberately the dumbest possible wrapper: if that file was
   blocked, never loaded, or is doing nothing because we are on file://, this is a no-op and the game
   cannot tell. Nothing in here is load-bearing. */
function track(name,p){ try{ if(window.bgTrack) window.bgTrack(name,p); }catch(e){} }

/* ============================================================================================
   BOOT
   ============================================================================================ */
function applyTheme(){
  const el=document.documentElement;
  if(settings.theme==='auto') el.removeAttribute('data-theme'); else el.setAttribute('data-theme',settings.theme);
  $('bTheme').textContent='Theme: '+settings.theme;
}
function staleCheck(){
  try{
    const a=DATA_AS_OF.split('-'), frozen=new Date(+a[0],+a[1]-1,+a[2]);
    const days=Math.floor((Date.now()-frozen.getTime())/86400000);
    if(days>STALE_AFTER_DAYS && LS.get(SLUG+'.stalex')!=='1'){
      $('staleTxt').textContent='This dataset is from '+DATA_AS_OF_HUMAN+' and hasn’t been refreshed. '+
        'Careers and milestones since then are missing — a correct answer may be rejected for that reason.';
      $('stale').classList.add('show');
    }
  }catch(e){}
}
function boot(){
  loadSettings(); applyTheme();
  GRID=makeGrid(KEY);
  heaviest=heaviestMatching(GRID.cands);
  loadState();
  buildGrid();
  const MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  const a=KEY.split('-');
  $('datechip').textContent=(ARCHIVE?'Archive · ':'')+(+a[2])+' '+MON[+a[1]-1]+' '+a[0];
  if(ARCHIVE) $('datechip').classList.add('arch');
  $('asof').textContent='Facts current to '+DATA_AS_OF_HUMAN+'. '+N+' cricketers in the roster.';
  siteStreak=LIVE ? (LS.get('kreeda.streak').split('|')[0]===dayKey() ? (+LS.get('kreeda.streak').split('|')[1]||0) : 0) : 0;
  $('sStreak').textContent=String(siteStreak);
  $('bSound').setAttribute('aria-pressed',settings.snd?'true':'false');
  $('bSound').textContent='Sound '+(settings.snd?'on':'off');
  $('bType').setAttribute('aria-pressed',settings.type?'true':'false');
  $('bType').textContent='Typeahead '+(settings.type?'on':'off');
  staleCheck();
  if(S.done){ say(filled()+' of nine filled today. Tap “See every answer”.'); }
  else if(filled()>0) say('Picking up where you left off.');
  else say('Tap a square. Name a cricketer who fits both its row and its column.');
  paint();

  $('guess').addEventListener('input',typeahead);
  $('guess').addEventListener('keydown',e=>{ if(e.key==='Enter'){ e.preventDefault(); submit(); } });
  $('bSubmit').addEventListener('click',submit);
  $('bCancel').addEventListener('click',closeSheet);
  $('scrim').addEventListener('click',closeSheet);
  document.addEventListener('keydown',e=>{ if(e.key==='Escape'){ if(!$('reveal').hidden){
      $('reveal').classList.remove('show'); $('reveal').hidden=true; } else closeSheet(); } });
  $('bReveal').addEventListener('click',showReveal);
  $('staleX').addEventListener('click',()=>{ $('stale').classList.remove('show'); LS.set(SLUG+'.stalex','1'); });
  $('bSound').addEventListener('click',()=>{ settings.snd=settings.snd?0:1; saveSettings();
    $('bSound').setAttribute('aria-pressed',settings.snd?'true':'false');
    $('bSound').textContent='Sound '+(settings.snd?'on':'off'); if(settings.snd) knock(); });
  $('bType').addEventListener('click',()=>{ settings.type=settings.type?0:1; saveSettings();
    $('bType').setAttribute('aria-pressed',settings.type?'true':'false');
    $('bType').textContent='Typeahead '+(settings.type?'on':'off'); typeahead(); });
  $('bTheme').addEventListener('click',()=>{ settings.theme = settings.theme==='auto'?'light':
    (settings.theme==='light'?'dark':'auto'); saveSettings(); applyTheme(); });
  $('bHow').addEventListener('click',()=>say('Nine cells, nine guesses. Each cricketer can be used '+
    'only once. Unknown names, ambiguous names and repeats are free — only a real cricketer who does '+
    'not fit costs a guess. Weight rewards the less obvious answer.'));
  /* Keep the sheet above the on-screen keyboard. visualViewport is the only honest source for this;
     100vh lies on iOS the moment the keyboard opens. */
  if(window.visualViewport){
    const fit=()=>{ const vv=window.visualViewport;
      const lift=Math.max(0, window.innerHeight-(vv.height+vv.offsetTop));
      $('sheet').style.setProperty('bottom', (window.innerWidth<560? lift+'px' : ''));
    };
    window.visualViewport.addEventListener('resize',fit);
    window.visualViewport.addEventListener('scroll',fit);
  }
  track('grid_start',{mode:LIVE?'daily':'archive',fallback:GRID.fallback?1:0,heaviest:heaviest});
}

/* ============================================================================================
   AUDIT — dev only, not linked from anywhere. ?audit=N generates the next N days and reports.
   Run it before any data change ships: it is the only way to actually KNOW difficulty is even, as
   opposed to intending that it be.
   ============================================================================================ */
function audit(n){
  const out={days:n,fallbacks:[],minCell:1e9,maxCell:0,sumMin:1e9,sumMax:0,noMatch:[],lowCell:[],
             critUse:{},worst:null};
  let k=dayKey(), totalMin=0;
  for(let d=0;d<n;d++){
    const g=makeGrid(k);
    if(g.fallback) out.fallbacks.push(k);
    const mn=Math.min.apply(null,g.counts), mx=Math.max.apply(null,g.counts);
    if(mn<out.minCell){ out.minCell=mn; out.worst=k; }
    if(mx>out.maxCell) out.maxCell=mx;
    out.sumMin=Math.min(out.sumMin,g.sum); out.sumMax=Math.max(out.sumMax,g.sum);
    totalMin+=mn;
    if(mn<3) out.lowCell.push(k+':'+mn);
    if(!perfectMatching(g.cands)) out.noMatch.push(k);
    for(const c of g.rows.concat(g.cols)){ const id=CRITERIA[c].id; out.critUse[id]=(out.critUse[id]||0)+1; }
    const a=k.split('-'), t=new Date(+a[0],+a[1]-1,+a[2]); t.setDate(t.getDate()+1); k=dayKey(t);
  }
  out.meanMin=+(totalMin/n).toFixed(2);
  out.ok = out.fallbacks.length===0 && out.lowCell.length===0 && out.noMatch.length===0;
  console.log('[maidan audit]', JSON.stringify(out));
  window.__audit=out;
  return out;
}
try{ boot(); }catch(e){ console.error('[maidan] boot failed',e); }
if(params.get('audit')) audit(Math.max(1,Math.min(2000,+params.get('audit')||365)));
</script>
