<style>
/* ============================ tokens ============================
   Dusk violet: the hour when people actually talk. One committed dark look — this game is played
   with two heads over one phone, usually in the evening, and a theme flip mid-hand-off would read
   as a glitch. Every colour lives here once. Player A is always violet, player B always rose,
   everywhere — pick cells, chips, result columns — so ownership never needs a label twice. */
:root{
  --ground:#14101f;  --ground-2:#1b1530;
  --panel:#211a36;   --panel-2:#2a2246;  --rule:rgba(190,175,255,.16);
  --ink:#f0ecfa;     --ink-dim:#a89fc7;
  --a:#7c5cff;       --a-soft:rgba(124,92,255,.18);  --a-ink:#c9b8ff;
  --b:#ff6b9d;       --b-soft:rgba(255,107,157,.16); --b-ink:#ffb3cb;
  --ok:#57d9a3;      --ok-soft:rgba(87,217,163,.14);
  --no:#ff8c7a;      --no-soft:rgba(255,140,122,.12);
  --gold:#ffd166;
  --shade:rgba(8,5,16,.72);
}

*{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html,body{ margin:0; padding:0; }
body{
  /* explicit background is mandatory: a transparent body would borrow the host's theme */
  background:
    radial-gradient(120% 60% at 18% -10%, rgba(124,92,255,.20) 0%, transparent 55%),
    radial-gradient(120% 60% at 88% -6%, rgba(255,107,157,.14) 0%, transparent 50%),
    linear-gradient(180deg, var(--ground-2) 0%, var(--ground) 42%, #0e0b17 100%);
  background-attachment:fixed;
  color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  min-height:100vh;
  overflow-x:hidden;               /* guard only; nothing here should ever be wider than the column */
  -webkit-text-size-adjust:100%;
}
.wrap{ max-width:520px; margin:0 auto;
  padding: max(14px, env(safe-area-inset-top)) 16px calc(28px + env(safe-area-inset-bottom)); }

button{ font:inherit; color:inherit; cursor:pointer; }
button:focus-visible, input:focus-visible, summary:focus-visible{
  outline:3px solid var(--gold); outline-offset:2px; }

/* ============================ shared chrome ============================ */
.top{ display:flex; align-items:center; gap:10px; margin:2px 0 12px; min-height:44px; }
.wordmark{ display:flex; align-items:center; gap:9px; }
.wordmark svg{ width:34px; height:34px; flex:none; }
.wordmark b{ font-size:22px; font-weight:900; letter-spacing:1px; }
.wordmark small{ display:block; font-size:10px; font-weight:700; letter-spacing:2.6px;
  text-transform:uppercase; color:var(--ink-dim); }
.homebtn{ margin-left:auto; background:var(--panel); border:1px solid var(--rule); border-radius:11px;
  min-width:44px; min-height:44px; padding:8px 12px; font-size:13px; font-weight:800; color:var(--ink-dim); }
.soundbtn{ margin-left:auto; background:var(--panel); border:1px solid var(--rule); border-radius:11px;
  min-width:44px; min-height:44px; padding:8px 10px; font-size:17px; line-height:1; }
.soundbtn + .homebtn{ margin-left:0; }

.card{ background:var(--panel); border:1px solid var(--rule); border-radius:18px; padding:18px 16px; }
.btn{
  display:block; width:100%; min-height:52px; padding:14px 16px; margin-top:10px;
  background:var(--panel-2); border:1px solid var(--rule); border-radius:14px;
  font-size:16px; font-weight:800; letter-spacing:.2px; text-align:center;
  transition:transform .1s ease, background .15s ease;
}
.btn:active{ transform:scale(.985); }
.btn.primary{ background:linear-gradient(100deg, var(--a) 0%, #9b6bff 55%, var(--b) 130%);
  border-color:transparent; color:#fff; box-shadow:0 8px 24px rgba(124,92,255,.35); }
.btn.ghost{ background:transparent; border-color:var(--rule); color:var(--ink-dim); font-weight:700; }
.btn[disabled]{ opacity:.45; cursor:default; }
.btnrow{ display:flex; gap:10px; }
.btnrow .btn{ flex:1; }

.dim{ color:var(--ink-dim); }
.tiny{ font-size:12px; line-height:1.55; }

/* ============================ title ============================ */
.hero{ text-align:center; margin:22px 0 18px; }
.hero svg{ width:120px; height:74px; }
.hero h1{ font-size:44px; font-weight:900; letter-spacing:3px; margin:6px 0 4px;
  background:linear-gradient(95deg, var(--a), var(--b)); -webkit-background-clip:text;
  background-clip:text; color:transparent; }
.hero p{ margin:0; font-size:15px; color:var(--ink-dim); font-weight:600; line-height:1.45; }

.field{ margin-top:12px; }
.field label{ display:block; font-size:11px; font-weight:800; letter-spacing:1.4px;
  text-transform:uppercase; color:var(--ink-dim); margin:0 0 5px 2px; }
.field input{
  width:100%; font:inherit; font-size:16px; font-weight:700;   /* 16px or iOS zooms on focus */
  background:var(--panel-2); color:var(--ink); border:1px solid var(--rule); border-radius:12px;
  padding:12px 12px; min-height:48px;
}
.field.pa input{ border-left:4px solid var(--a); }
.field.pb input{ border-left:4px solid var(--b); }
.names2{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
.names2 .field{ margin-top:0; }

.packs{ display:flex; flex-wrap:wrap; gap:8px; margin-top:8px; }
.pack{ flex:1 1 30%; min-height:46px; padding:10px 8px; background:var(--panel-2);
  border:1px solid var(--rule); border-radius:12px; font-size:13.5px; font-weight:800; }
.pack[aria-pressed="true"]{ background:var(--a-soft); border-color:var(--a); color:#fff;
  box-shadow:inset 0 0 0 1px var(--a); }
.packblurb{ font-size:12.5px; color:var(--ink-dim); margin:8px 2px 0; min-height:1.4em; }

details.how{ margin-top:14px; border:1px solid var(--rule); border-radius:14px;
  background:var(--panel); padding:0 14px; }
details.how summary{ cursor:pointer; font-size:14px; font-weight:800; padding:13px 0;
  min-height:44px; list-style:none; display:flex; align-items:center; gap:8px; }
details.how summary::-webkit-details-marker{ display:none; }
details.how summary::before{ content:'▸'; color:var(--ink-dim); transition:transform .15s ease; }
details.how[open] summary::before{ transform:rotate(90deg); }
details.how ul{ margin:0 0 14px; padding-left:20px; font-size:13.5px; line-height:1.65;
  color:var(--ink-dim); }
details.how li b{ color:var(--ink); }

.foot{ margin-top:20px; text-align:center; font-size:11px; line-height:1.7; color:var(--ink-dim); }
.foot a{ color:var(--ink-dim); }

/* ============================ hand-off ============================ */
.handoff{ min-height:76vh; display:flex; flex-direction:column; align-items:center;
  justify-content:center; text-align:center; padding:20px 6px; }
.handoff .pass{ font-size:13px; font-weight:800; letter-spacing:2.4px; text-transform:uppercase;
  color:var(--ink-dim); }
.handoff h2{ font-size:36px; font-weight:900; margin:12px 0 6px; overflow-wrap:anywhere; }
.handoff h2.pa{ color:var(--a-ink); } .handoff h2.pb{ color:var(--b-ink); }
.handoff .sub{ font-size:15px; color:var(--ink-dim); margin:0 0 26px; line-height:1.5; }
.handoff .btn{ max-width:340px; }
.handoff .peek{ margin-top:22px; font-size:12.5px; color:var(--ink-dim); }
@media (prefers-reduced-motion:no-preference){
  .handoff h2{ animation:heartbeat 1.6s ease-in-out infinite; }
  @keyframes heartbeat{ 0%,100%{ transform:scale(1);} 50%{ transform:scale(1.03);} }
}

/* ============================ answering — one sheet ============================
   All ten questions on one page, both answers on every one. Beside each option sit two cells —
   Me and Them — and the whole interface is "tap one in each, all the way down". No modes, no
   repeated questions, and the page is its own recap: anything can be changed until lock-in. */
.prog{ position:sticky; top:max(8px, env(safe-area-inset-top)); z-index:5; display:flex; align-items:center;
  gap:12px; background:var(--panel-2); border:1px solid var(--rule); border-radius:999px; padding:9px 14px;
  margin-bottom:12px; box-shadow:0 6px 18px rgba(0,0,0,.35); }
.prog .n{ font-size:13px; font-weight:800; white-space:nowrap; color:var(--ink-dim); }
.prog .n b{ font-size:16px; color:var(--ink); }
.bar{ flex:1; height:7px; border-radius:99px; background:var(--panel); overflow:hidden; }
.bar i{ display:block; height:100%; border-radius:99px; width:0%;
  background:linear-gradient(90deg, var(--a), var(--b)); transition:width .3s ease; }

.turn{ display:flex; align-items:center; gap:10px; background:var(--panel-2); border:1px solid var(--rule);
  border-radius:13px; padding:10px 12px; margin-bottom:12px; font-size:13px; line-height:1.4; }
.turn .eye{ font-size:20px; flex:none; }
.turn b.pa{ color:var(--a-ink); } .turn b.pb{ color:var(--b-ink); }

/* the legend: what the two columns mean, said once at the top in the cells' own colours */
.explain{ background:var(--panel); border:1px solid var(--rule); border-radius:16px; padding:12px 14px; }
.explain .row{ display:flex; align-items:center; gap:10px; margin-top:8px; font-size:13.5px; line-height:1.35; }
.explain .row:first-child{ margin-top:0; }
.explain .row b.pa{ color:var(--a-ink); } .explain .row b.pb{ color:var(--b-ink); }
.explain .cell{ width:40px; height:36px; border-radius:10px; }
.explain .cell svg{ width:18px; height:18px; }
.explain p{ margin:10px 0 0; font-size:12.5px; color:var(--ink-dim); line-height:1.5; }

.qcard{ background:var(--panel); border:1px solid var(--rule); border-radius:18px; padding:14px 14px 10px;
  margin-top:10px; scroll-margin-top:calc(72px + env(safe-area-inset-top)); }
.qcard .qhead{ display:flex; gap:9px; align-items:flex-start; margin-bottom:10px; }
.qcard .qn{ flex:none; width:24px; height:24px; border-radius:99px; background:var(--panel-2); margin-top:2px;
  font-size:11.5px; font-weight:900; display:flex; align-items:center; justify-content:center;
  color:var(--ink-dim); transition:background .2s ease, color .2s ease; }
.qcard.done .qn{ background:var(--ok-soft); color:var(--ok); box-shadow:inset 0 0 0 1.5px var(--ok); }
.qtext{ flex:1; font-size:19px; font-weight:900; line-height:1.3; margin:0; }

/* a finished question swishes off to the left and settles back as one compact row — the question,
   the two picks as chips, and a "tap to change" hint — while the next one slides in from the right */
.qcard .picks{ display:none; flex-wrap:wrap; gap:6px; align-items:center; margin:0 0 2px 33px; }
.pk{ font-size:12px; font-weight:800; border-radius:999px; padding:4px 9px; line-height:1.3;
  max-width:100%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.pk.me{ background:var(--a-soft); color:var(--a-ink); box-shadow:inset 0 0 0 1px rgba(124,92,255,.5); }
.pk.them{ background:var(--b-soft); color:var(--b-ink); box-shadow:inset 0 0 0 1px rgba(255,107,157,.5); }
.qcard .picks .chg{ margin-left:auto; font-size:10.5px; font-weight:800; color:var(--ink-dim);
  letter-spacing:.6px; text-transform:uppercase; }
.qcard.collapsed{ padding:11px 14px 10px; cursor:pointer; }
.qcard.collapsed .qhead{ margin-bottom:6px; }
.qcard.collapsed .qtext{ font-size:15px; }
.qcard.collapsed .colhead, .qcard.collapsed .orow{ display:none; }
.qcard.collapsed .picks{ display:flex; }
@media (prefers-reduced-motion:no-preference){
  .qcard.flash{ animation:flash .9s ease; }
  @keyframes flash{ 0%,100%{ box-shadow:none; } 30%{ box-shadow:0 0 0 3px var(--gold); } }
  .qcard.arrive{ animation:arrive .38s cubic-bezier(.2,.8,.3,1); }
  @keyframes arrive{ from{ opacity:0; transform:translateX(56px); } }
  .qcard.settle{ animation:settle .3s ease; }
  @keyframes settle{ from{ opacity:0; transform:translateY(-6px); } }
  /* declared last so it wins over a still-running arrive/settle on the same card */
  .qcard.leaving{ animation:leave .3s cubic-bezier(.5,0,.85,.4) forwards; }
  @keyframes leave{ to{ opacity:0; transform:translateX(-64px) scale(.96); } }
}
.colhead{ display:flex; align-items:flex-end; gap:6px; margin-bottom:4px; padding-right:2px; }
.colhead .sp{ flex:1; }
.colhead .ch{ width:54px; flex:none; text-align:center; font-size:11px; font-weight:900;
  letter-spacing:.8px; text-transform:uppercase; line-height:1.15; overflow:hidden;
  text-overflow:ellipsis; white-space:nowrap; }
.colhead .ch small{ display:block; font-size:9.5px; font-weight:700; letter-spacing:0;
  text-transform:none; color:var(--ink-dim); margin-bottom:2px; }
.colhead .ch.me{ color:var(--a-ink); } .colhead .ch.them{ color:var(--b-ink); }

.orow{ display:flex; align-items:center; gap:6px; padding:5px 2px 5px 0; border-top:1px solid var(--rule);
  border-radius:10px; transition:background .2s ease; }
.orow:first-of-type{ border-top:0; }
.orow.both{ background:var(--ok-soft); }
.orow .otext{ flex:1; min-width:0; font-size:15.5px; font-weight:700; line-height:1.3; padding:6px 4px 6px 6px;
  overflow-wrap:anywhere; cursor:pointer; }
.cell{ width:54px; height:48px; flex:none; border-radius:13px; background:transparent;
  border:2px solid transparent; display:flex; align-items:center; justify-content:center;
  padding:0; transition:transform .12s ease, background .15s ease, border-color .15s ease; }
.cell svg{ width:22px; height:22px; opacity:0; transform:scale(.6); transition:opacity .15s, transform .15s; }
.cell.me{ border-color:rgba(124,92,255,.5); }
.cell.them{ border-color:rgba(255,107,157,.5); }
.cell.me.on{ background:var(--a); border-color:var(--a); }
.cell.them.on{ background:var(--b); border-color:var(--b); }
.cell.on svg{ opacity:1; transform:none; }
.cell:active{ transform:scale(.92); }
@media (prefers-reduced-motion:no-preference){
  .cell.nudge{ animation:nudge .45s ease; }
  @keyframes nudge{ 0%,100%{ transform:none; } 30%{ transform:scale(1.12); } 60%{ transform:scale(.96); } }
}

/* lock-in rides the bottom of the viewport; it counts down until the sheet is complete */
.lockbar{ position:sticky; bottom:0; z-index:5; padding:14px 0 calc(6px + env(safe-area-inset-bottom));
  margin-top:6px; background:linear-gradient(180deg, transparent 0%, var(--ground) 38%); }
.lockbar .btn{ margin-top:0; }

/* ============================ results — one page ============================
   Numbers first. Three rings say how well each of you knows the other and how alike you are, a
   big one says it in a single figure; the words come after, and there are fewer of them. */
.results h2{ font-size:15px; font-weight:800; letter-spacing:1.6px; text-transform:uppercase;
  color:var(--ink-dim); text-align:center; margin:4px 0 2px; }
.names{ text-align:center; font-size:14px; font-weight:800; margin:0 0 12px; overflow-wrap:anywhere; }
.names .na{ color:var(--a-ink); } .names .nb{ color:var(--b-ink); }
.names .x{ color:var(--ink-dim); font-weight:600; padding:0 6px; }

.info{ text-align:center; padding:16px 10px 16px; }
.ring{ position:relative; display:inline-flex; flex-direction:column; align-items:center; min-width:0; }
.ring svg{ width:92px; height:92px; transform:rotate(-90deg); }
.ring .tr{ fill:none; stroke:var(--panel-2); stroke-width:10; }
.ring .fl{ fill:none; stroke-width:10; stroke-linecap:round;
  transition:stroke-dashoffset 1.2s cubic-bezier(.2,.7,.2,1); }
.ring.ra .fl{ stroke:var(--a); } .ring.rb .fl{ stroke:var(--b); } .ring.rs .fl{ stroke:var(--ok); }
.ring.big .fl{ stroke:url(#ringGrad); }
.ring .rv{ position:absolute; top:0; left:0; width:100%; height:92px; display:flex; align-items:center;
  justify-content:center; font-weight:900; font-size:22px; line-height:1; }
.ring .rv i{ font-style:normal; font-size:.55em; opacity:.7; margin-left:1px; }
.ring.ra .rv{ color:var(--a-ink); } .ring.rb .rv{ color:var(--b-ink); } .ring.rs .rv{ color:var(--ok); }
.ring .rl{ margin-top:5px; font-size:11px; font-weight:800; color:var(--ink-dim); line-height:1.25;
  overflow-wrap:anywhere; }
.ring .sr{ position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); }
.ring.big{ display:flex; margin:0 auto; }
.ring.big svg{ width:156px; height:156px; }
.ring.big .rv{ height:156px; font-size:44px; }
.ring.big .rl{ font-size:13px; color:var(--ink); margin-top:2px; }
.rings3{ display:flex; justify-content:space-between; gap:6px; margin-top:14px; }
.rings3 .ring{ flex:1; }
.verdict{ margin-top:16px; }
.verdict b{ display:block; font-size:26px; font-weight:900; line-height:1.15;
  background:linear-gradient(95deg, var(--a-ink), var(--b)); -webkit-background-clip:text;
  background-clip:text; color:transparent; }
.verdict span{ display:block; margin-top:4px; font-size:13px; color:var(--ink-dim); line-height:1.45; }

/* at a glance: three one-liners with an icon each, in place of three paragraphs */
.glance{ margin-top:12px; padding:12px 14px; }
.gl{ display:flex; gap:10px; align-items:flex-start; padding:9px 0; border-top:1px solid var(--rule);
  font-size:13.5px; line-height:1.45; }
.gl:first-child{ border-top:0; padding-top:0; } .gl:last-child{ padding-bottom:0; }
.gl .gi{ flex:none; width:26px; text-align:center; font-size:18px; line-height:1.15; }
.gl b{ font-weight:900; }
.gl .lb{ font-weight:900; letter-spacing:.8px; text-transform:uppercase; font-size:10.5px; margin-right:5px; }
.gl.best .lb{ color:var(--ok); } .gl.miss .lb{ color:var(--no); } .gl.asym .lb{ color:var(--gold); }
.scorecard{ margin-top:12px; padding:14px 14px 12px; }

/* scoreboard: three rows of ten squares — the share grid, rendered. Square i is question i. */
.srow{ display:flex; align-items:center; gap:8px; margin-top:8px; }
.srow .sl{ width:92px; flex:none; font-size:10.5px; font-weight:800; color:var(--ink-dim);
  text-transform:uppercase; letter-spacing:.4px; line-height:1.2; overflow-wrap:anywhere; }
.srow .sq{ flex:1; display:flex; gap:4px; }
.srow .sq button{ flex:1; height:22px; border-radius:5px; background:var(--panel-2); border:0; padding:0;
  transition:background .2s ease, transform .2s ease; }
.srow.s-sim button.on{ background:var(--ok); } .srow.s-a button.on{ background:var(--a); } .srow.s-b button.on{ background:var(--b); }
.srow .sn{ width:40px; flex:none; text-align:right; font-size:15px; font-weight:900; }
.srow.s-sim .sn{ color:var(--ok); } .srow.s-a .sn{ color:var(--a-ink); } .srow.s-b .sn{ color:var(--b-ink); }
@media (prefers-reduced-motion:no-preference){
  .srow .sq button.on{ animation:pop .35s ease backwards; }
  @keyframes pop{ from{ transform:scale(.4); opacity:.3; } to{ transform:none; opacity:1; } }
}
.sqhint{ font-size:11px; color:var(--ink-dim); text-align:center; margin:10px 0 0; }

.sect{ margin:22px 0 8px; }
.sect h3{ margin:0; font-size:14px; font-weight:900; letter-spacing:1.4px; text-transform:uppercase; }
.sect span{ display:block; font-size:12px; color:var(--ink-dim); margin-top:2px; }

.qres{ background:var(--panel); border:1px solid var(--rule); border-radius:14px; padding:12px 12px 10px;
  margin-top:9px; scroll-margin-top:12px; }
.qres .qh{ display:flex; gap:8px; align-items:flex-start; margin-bottom:9px; }
.qres .qn{ flex:none; width:22px; height:22px; border-radius:99px; background:var(--panel-2);
  font-size:11px; font-weight:900; display:flex; align-items:center; justify-content:center; color:var(--ink-dim); }
.qres .qq{ flex:1; font-size:14.5px; font-weight:800; line-height:1.3; }
.qres .badge{ flex:none; font-size:10px; font-weight:900; letter-spacing:.8px; text-transform:uppercase;
  border-radius:999px; padding:4px 8px; line-height:1.2; }
.badge.same{ color:var(--ok); background:var(--ok-soft); }
.badge.sweep{ color:var(--gold); background:rgba(255,209,102,.14); }
.qres .cols{ display:grid; grid-template-columns:1fr 1fr; gap:8px; }

<body>
<div class="wrap" id="app"></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<div class="scrim" id="scrim">
  <div class="confirmbox" role="alertdialog" aria-modal="true" aria-labelledby="cfTitle" aria-describedby="cfBody">
    <h3 id="cfTitle">Leave this game?</h3>
    <p id="cfBody">The round in progress will be discarded. Answers are never saved anywhere.</p>

<!-- analytics.js before the game script: track() below fires synchronously and would otherwise
     race the tag load and vanish — same lesson valence learned the hard way. -->
<script src="../analytics.js"></script>
<script>
'use strict';
/* ============================================================================================
   SYNC — an empathic-accuracy duel. Two players, one phone. Every question is answered twice by
   each player — once for yourself, once predicting the other — but on ONE card: two columns of
   cells, tap one in each. Nothing is revealed until both have locked in; then the entire game is
   laid out on a single page — three scores and all ten questions side by side.

   Privacy is a design constraint, not a feature flag: answers live in one in-memory session
   object (S) and NOTHING else. localStorage holds only names, a sound preference and a play
   counter. Analytics gets counts, never content. A page refresh mid-game loses the round by design — that is cheaper
   than answers ever touching disk.
   ============================================================================================ */

function track(name,p){ try{ if(window.bgTrack) window.bgTrack(name,p); }catch(e){} }
const LS={ get:k=>{ try{ return localStorage.getItem(k)||''; }catch(e){ return ''; } },
           set:(k,v)=>{ try{ localStorage.setItem(k,v); }catch(e){} } };

/* Seeded PRNG so a session's draw is deterministic given its seed — reshuffles can never
   disagree with themselves mid-session — while each new session still gets a fresh seed. */
function mulberry32(a){ return function(){ a=(a+0x6D2B79F5)|0; let t=Math.imul(a^(a>>>15),1|a);
  t=(t+Math.imul(t^(t>>>7),61|t))^t; return ((t^(t>>>14))>>>0)/4294967296; }; }

function esc(s){ return String(s).replace(/[&<>"']/g,
  c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

/* ============================================================================================
   QUESTION BANK — 64 original questions.
   Tags: n = New pair · c = Couple · f = Friends · a = Family · w = Coworkers.
   Every question is answerable about A PERSON, not about the world: there is no correct option,
   only a true one. Options are kept short enough to sit beside two pick cells on one row.
   A question may serve several packs; a session draws 10 from its pack without repeats.
   ============================================================================================ */
const BANK=[
 {q:"You're upset. What do you want first?", o:["Solutions","Company","Space","Distraction"], t:"ncfaw"},

 {q:"A big decision is looming. You…", o:["Make a list","Poll everyone you know","Sleep on it","Go with the gut"], t:"ncfaw"},
 {q:"Four-hour drive. You hope the car is…", o:["Full of conversation","Full of loud music","Comfortably silent","A rolling nap pod"], t:"ncfaw"},
 {q:"Being ten minutes early feels…", o:["Correct","Like wasted time","Physically impossible","Like winning"], t:"ncfaw"},
 {q:"The karaoke mic is headed your way. You…", o:["Grab it","Duet only","Need one more drink","Vanish"], t:"ncfaw"},
 {q:"Scary movie tonight?", o:["Front row","Through my fingers","Comedies only","I'll be in the kitchen"], t:"ncfaw"},
 {q:"The correct number of morning alarms:", o:["One","Two, spaced","Five, escalating","None — I just wake up"], t:"ncfaw"},
 {q:"You win arguments mostly by…", o:["Facts","Persistence","Patience","Deciding it's not worth it"], t:"ncfaw"},
 {q:"A weekend of camping sounds…", o:["Perfect — deep woods","Fine — cabin with wifi","Better as a nice hotel","Like a punishment"], t:"ncfaw"},
 {q:"Your camera roll is mostly…", o:["People","Screenshots","Food and places","Pets and skies"], t:"ncfaw"},
 {q:"Plans get cancelled last minute. You feel…", o:["Genuinely crushed","Mildly annoyed","Neutral","Secretly thrilled"], t:"ncfaw"},
 {q:"Cold pizza for breakfast:", o:["Elite","Acceptable","Only reheated","Horrifying"], t:"ncfaw"},
 {q:"You'd rather be known for…", o:["Making something","Knowing everything","Being kind","Not being known"], t:"ncfaw"},
 {q:"A free afternoon appears from nowhere. You…", o:["Nap, obviously","Call someone","Start a project","Wander outside"], t:"ncfaw"},
 {q:"New restaurant. You order…", o:["My usual kind of thing","The weirdest item","Whatever they recommend","What you're having"], t:"ncfaw"},
 {q:"Compliments make you…", o:["Glow all day","Deflect with a joke","A little suspicious","Ask for specifics"], t:"ncfaw"},
 {q:"Losing a board game, you are…", o:["Fine. Totally fine","Quietly plotting revenge","Openly salty","Already over it"], t:"ncfaw"},
 {q:"Ideal pet, no practical limits:", o:["Dog","Cat","Something scaly or feathered","Plants count"], t:"ncfaw"},
 {q:"A full day of rain means…", o:["Cozy heaven","Ruined plans","Perfect sleep","Nothing changes"], t:"ncfaw"},
 {q:"One slice left and you both want it:", o:["Split it","Rock paper scissors","Take it — I insist","Fastest hand wins"], t:"ncfaw"},
 {q:"Airport arrival time:", o:["Three hours early","Two, comfortably","Sprinting to the gate","Depends who's flying"], t:"ncfaw"},
 {q:"Your junk drawer situation:", o:["No junk drawer exists","One, curated","Several","Every drawer qualifies"], t:"ncfaw"},
 {q:"Singing along in the car:", o:["Full concert","Backup vocals only","Quiet humming","Silence, please"], t:"ncfaw"},
 {q:"The restaurant brings the wrong order. You…", o:["Send it back nicely","Eat it anyway","Make someone else ask","Depends how hungry"], t:"ncfaw"},
 {q:"Your birthday, ideally:", o:["Big party","Small dinner","Just the closest people","Pretend it isn't happening"], t:"ncfaw"},
 {q:"Your group chat role:", o:["The planner","The meme supply","The lurker","Replies a week later"], t:"ncfw"},
 {q:"Road-trip snack philosophy:", o:["Packed from home","Gas-station chaos","One enormous drink","Stops are for quitters"], t:"ncfa"},
 {q:"A 2 a.m. \"you up?\" text from a friend:", o:["Already replying","Calling them now","Morning-me will handle it","Depends which friend"], t:"ncf"},
 {q:"Best kind of date night:", o:["Fancy night out","Couch and takeaway","Something outdoors","Something new and weird"], t:"nc"},
 {q:"Care lands best on you as…", o:["Kind words","Undivided time","Help with the boring stuff","A really good hug"], t:"ncfa"},
 {q:"After an argument, you first need…", o:["To talk it out now","An hour alone","A hug before words","To pretend, then talk"], t:"ca"},

 {q:"The thermostat war — you are team…", o:["Warmer, always","Colder, always","Whatever, wear socks","Window open year-round"], t:"ca"},
 {q:"Someone taking food off your plate is…", o:["Romance","Fine if they ask","Taxable","Theft"], t:"ncf"},
 {q:"Dream future home:", o:["City apartment","Suburbs and a garden","Somewhere remote","Never the same place twice"], t:"nc"},
 {q:"When plans involve meeting new people, you feel…", o:["Energized","Fine after ten minutes","Tired in advance","Depends on the people"], t:"ncfw"},
 {q:"Chores work best…", o:["Split strictly 50/50","Whoever notices first","Assigned lanes forever","Outsourced someday"], t:"ca"},
 {q:"Family photo time. You are…", o:["The organizer","First to smile","Blinking in every shot","Mysteriously missing"], t:"a"},
 {q:"Holiday traditions are…", o:["Sacred","Nice but flexible","For replacing with new ones","Exhausting"], t:"ac"},
 {q:"At a family gathering you're usually…", o:["In the kitchen","With the kids or pets","Deep in one conversation","Near the exit"], t:"a"},
 {q:"The old family stories get retold. You…", o:["Tell them louder","Correct the details","Laugh every single time","Have heard ENOUGH"], t:"a"},
 {q:"Hand-me-downs are…", o:["Treasures","Fine if useful","Clutter","Emotional landmines"], t:"a"},
 {q:"A meeting that could've been an email. You…", o:["Say so, politely","Suffer in silence","Multitask discreetly","Secretly enjoy it"], t:"w"},
 {q:"Your desk, right now:", o:["Spotless","Organized chaos","Actual chaos","What desk"], t:"w"},
 {q:"Praise at work lands best…", o:["Publicly","Privately","In writing","As a raise"], t:"w"},
 {q:"Monday morning, you are…", o:["Weirdly energized","Fine by ten","Coffee-dependent","In mourning for Sunday"], t:"w"},
 {q:"Lunch on a busy day is…", o:["A sacred break","Eaten at the desk","Whenever it happens","…did I eat?"], t:"w"},
 {q:"A colleague repeats your idea as theirs. You…", o:["Reclaim it in the room","Talk to them after","Escalate it","Let it go — and remember"], t:"w"},
 {q:"Deadline in one hour, work half done. You…", o:["Head down, silence","Ask for help","Negotiate more time","Ship it rough"], t:"nw"},
 {q:"At the office party you're…", o:["On the dance floor","Guarding the snacks","One drink, then home","Not attending"], t:"wf"},
 {q:"First impressions of you are usually…", o:["Spot on","Too serious","Too silly","Completely wrong"], t:"nfw"},
 {q:"Your childhood bedroom was…", o:["Museum-neat","Postered floor to ceiling","Organized chaos","A declared disaster zone"], t:"nfa"},
 {q:"Small talk is…", o:["Fun, actually","A skill I perform","Mildly painful","A door to real talk"], t:"nwf"},
 {q:"Menu item you can't pronounce:", o:["Point and hope","Ask how to say it","Order the safe thing","That's the dare — order it"], t:"nfc"},
 {q:"Your most likely secret talent:", o:["Useless trivia","Something crafty","A party trick","Finding lost things"], t:"nfa"},
 {q:"Lost in a new city together:", o:["Best part of the trip","Fun for an hour","Map out immediately","I simply don't get lost"], t:"ncf"},
 {q:"You win the lottery. It stays secret for…", o:["Seconds","One day","Until the paperwork clears","Forever"], t:"ncfaw"}
];

const PACKS=[
  {id:'n', name:'New pair',  blurb:'Just met, or never played together'},
  {id:'c', name:'Couple',    blurb:'Partners — date nights, chores, thermostat wars'},
  {id:'f', name:'Friends',   blurb:'Old or new'},
  {id:'a', name:'Family',    blurb:'Siblings, parents, cousins'},
  {id:'w', name:'Coworkers', blurb:'Team, office, shift'}
];
const ROUNDS=10;

/* ============================ state ============================
   S is the whole game and it lives only in memory. self/pred are option indexes, -1 = unanswered.
   phase is a plain string state machine; every transition goes through show() which wipes the DOM,
   so a previous player's inputs cannot survive into a hand-off even for one frame. */
let S=null;
function newSession(pack){
  const rnd=mulberry32((Date.now() ^ (Math.random()*0xffffffff))>>>0);
  const pool=BANK.filter(x=>x.t.indexOf(pack)>=0);
  /* Fisher–Yates on a copy, take the first ROUNDS — no repeats possible within a session */
  const deck=pool.slice();
  for(let i=deck.length-1;i>0;i--){ const j=Math.floor(rnd()*(i+1)); const t=deck[i]; deck[i]=deck[j]; deck[j]=t; }
  S={ pack:pack, qs:deck.slice(0,ROUNDS),
      self:[[],[]], pred:[[],[]],           // [playerIdx][questionIdx]
      names:names.slice(), done:[false,false] };
  for(let p=0;p<2;p++) for(let i=0;i<ROUNDS;i++){ S.self[p][i]=-1; S.pred[p][i]=-1; }
}
function answered(p,qi){ return S.self[p][qi]>=0 && S.pred[p][qi]>=0; }
function answeredCount(p){ let n=0; for(let i=0;i<ROUNDS;i++) if(answered(p,i)) n++; return n; }
/* the next card still needing an answer, searching forward from `from` and wrapping — so a
   player who jumped back to fix one answer lands on whatever they skipped, not on the recap */
function nextUnanswered(p,from){
  for(let k=1;k<=ROUNDS;k++){ const i=(from+k)%ROUNDS; if(!answered(p,i)) return i; }
  return -1;
}

let names=['Player 1','Player 2'];
try{ const n=JSON.parse(LS.get('sync.names')||'[]');
  if(Array.isArray(n)&&n.length===2) names=[String(n[0]).slice(0,12)||'Player 1',
                                            String(n[1]).slice(0,12)||'Player 2']; }catch(e){}

/* ============================ rendering core ============================
   One container, innerHTML replaced wholesale per screen. GEN is a render generation counter:
   every handler captures the generation it was bound in and no-ops if a render has happened
   since — this is the double-tap guard. A fast second tap on a hand-off button finds either a
   disabled button or a stale generation; it can never advance the state machine twice. */
const app=document.getElementById('app');
let GEN=0;
function show(html){
  GEN++; app.innerHTML=html;
  /* an instant scroll also aborts any smooth scroll the previous screen left in flight — without
     it, a new screen can paint mid-way down the page */
  try{ window.scrollTo({top:0,left:0,behavior:'instant'}); }catch(e){ window.scrollTo(0,0); }
}
function on(id,fn){
  const g=GEN, el=document.getElementById(id);
  if(!el) return;
  el.addEventListener('click',function(e){
    if(g!==GEN || el.disabled) return;
    el.disabled=true;                       // released only if the handler chooses to re-render
    try{ fn(e); }finally{ if(g===GEN) el.disabled=false; }
  });
}

const MOTIF='<svg viewBox="0 0 120 74" aria-hidden="true"><g fill="none" stroke-linecap="round">'
 +'<path d="M14 37 q6-22 12-22 t12 22 12 22 12-22 8-14" stroke="#7c5cff" stroke-width="7" opacity=".9"/>'
 +'<path d="M46 37 q6 22 12 22 t12-22 12-22 12 22 8 14" stroke="#ff6b9d" stroke-width="7" opacity=".9"/>'
 +'</g></svg>';
const MARK='<svg viewBox="0 0 40 40" aria-hidden="true"><g fill="none" stroke-linecap="round" stroke-width="5">'
 +'<path d="M6 20 q4-11 8-11 t8 11" stroke="#7c5cff"/><path d="M18 20 q4 11 8 11 t8-11" stroke="#ff6b9d"/></g></svg>';
const TICK='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5" fill="none" stroke="#fff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/></svg>';

function header(showHome){
  return '<header class="top"><span class="wordmark">'+MARK+'<span><b>Sync</b>'
   +'<small>Kreeda · Together</small></span></span>'
   +(showHome
      ? '<button class="soundbtn" type="button" id="bSound" aria-pressed="'+SND.on+'" aria-label="Sound">'+(SND.on?'🔊':'🔇')+'</button>'
        +'<button class="homebtn" type="button" id="bHome" aria-label="Leave game and return to start">Home</button>'
      : '')
   +'</header>';
}
function bindHome(){
  on('bHome',()=>{ openConfirm(()=>{ S=null; title(); }); });
  const sb=document.getElementById('bSound');
  if(sb) sb.addEventListener('click',()=>setSound(!SND.on));
}

/* ============================ sound ============================
   Two synthesized cues, no audio files: a soft tick on every pick and a swish when a finished
   question leaves the page. The context is created on the first tap (a user gesture, which iOS
   requires), and the on/off preference is the only thing besides names and a play count that
   touches storage. */
const SND={ ctx:null, noise:null, on:LS.get('sync.sound')!=='0' };
function audio(){
  if(!SND.on) return null;
  if(!SND.ctx){ try{ SND.ctx=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ return null; } }
  if(SND.ctx.state==='suspended'){ try{ SND.ctx.resume(); }catch(e){} }
  return SND.ctx;
}
function tick(){
  const ac=audio(); if(!ac) return;
  try{
    const t=ac.currentTime, o=ac.createOscillator(), g=ac.createGain();
    o.type='sine'; o.frequency.setValueAtTime(880,t); o.frequency.exponentialRampToValueAtTime(1320,t+0.03);
    g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(0.09,t+0.008);
    g.gain.exponentialRampToValueAtTime(0.0001,t+0.07);
    o.connect(g).connect(ac.destination); o.start(t); o.stop(t+0.08);
  }catch(e){}
}
function swish(){
  const ac=audio(); if(!ac) return;
  try{
    const dur=0.3, t=ac.currentTime;
    if(!SND.noise){ const n=Math.floor(ac.sampleRate*0.5), b=ac.createBuffer(1,n,ac.sampleRate), d=b.getChannelData(0);
      for(let i=0;i<n;i++) d[i]=Math.random()*2-1; SND.noise=b; }
    const src=ac.createBufferSource(); src.buffer=SND.noise;
    const f=ac.createBiquadFilter(); f.type='bandpass'; f.Q.value=1.4;      // filtered noise, swept up then down
    f.frequency.setValueAtTime(500,t); f.frequency.exponentialRampToValueAtTime(3400,t+dur*0.45);
    f.frequency.exponentialRampToValueAtTime(700,t+dur);
    const g=ac.createGain(); g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(0.32,t+0.06);
    g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    src.connect(f).connect(g).connect(ac.destination); src.start(t); src.stop(t+dur+0.02);
  }catch(e){}
}
function setSound(on){
  SND.on=on; LS.set('sync.sound',on?'1':'0');
  const b=document.getElementById('bSound');
  if(b){ b.textContent=on?'🔊':'🔇'; b.setAttribute('aria-pressed',String(on)); }
  if(on) tick();
}

/* confirm modal — the only way out of a live session other than finishing it */
const scrim=document.getElementById('scrim');
let confirmCb=null;
document.getElementById('cfYes').addEventListener('click',()=>{ scrim.classList.remove('show');
  const cb=confirmCb; confirmCb=null; if(cb) cb(); });
document.getElementById('cfNo').addEventListener('click',()=>{ scrim.classList.remove('show'); confirmCb=null; });
function openConfirm(cb){ confirmCb=cb; scrim.classList.add('show'); }

let toastT=null;
function toast(msg){
  const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show');
  clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove('show'),2200);
}

/* ============================ title ============================
   pack is session-only, deliberately not persisted: storage holds names and a play count and
   nothing else — see the privacy note at the top. */
let pack='n';

function title(){
  show(
   '<div class="hero">'+MOTIF+'<h1>SYNC</h1>'
   +'<p>How well do you actually know each other?<br>Two players. One phone. Ten questions, one page.</p></div>'
   +'<div class="card">'
   +'<div class="names2">'
   +'<div class="field pa"><label for="inA">Player 1</label>'
   +'<input id="inA" type="text" maxlength="12" autocomplete="off" value="'+esc(names[0])+'"></div>'
   +'<div class="field pb"><label for="inB">Player 2</label>'
   +'<input id="inB" type="text" maxlength="12" autocomplete="off" value="'+esc(names[1])+'"></div>'
   +'</div>'
   +'<div class="field"><label id="packLbl">Pack</label>'
   +'<div class="packs" role="group" aria-labelledby="packLbl">'
   +PACKS.map(p=>'<button class="pack" type="button" data-pack="'+p.id+'" aria-pressed="'
     +(p.id===pack)+'">'+p.name+'</button>').join('')
   +'</div><p class="packblurb" id="packBlurb"></p></div>'
   +'<button class="btn primary" type="button" id="bStart"></button>'
   +'</div>'
   +'<details class="how"><summary>How it works</summary><ul>'
   +'<li>All ten questions sit on one page. Every question has <b>two columns</b>: <b>Me</b> — your own answer — and <b>them</b> — your guess at what they’ll pick. Tap one in each.</li>'
   +'<li>Player 1 fills the page, locks in, and passes the phone. Player 2 does the same. Nothing shows until both are done.</li>'
   +'<li>Then everything lands on <b>one page</b>: three rings — how well each of you knows the other, and how alike you are — and all ten questions side by side.</li>'
   +'</ul></details>'
   +'<footer class="foot">For fun and conversation — a game, not a psychological assessment.<br>'
   +'Answers stay on this phone and are never uploaded.<br><a href="../">Kreeda</a></footer>'
  );
  const inA=document.getElementById('inA'), inB=document.getElementById('inB');
  const startBtn=document.getElementById('bStart'), blurb=document.getElementById('packBlurb');
  const refresh=()=>{
    const a=inA.value.trim().slice(0,12)||'Player 1';
    startBtn.textContent='Start · '+a+' goes first';
    blurb.textContent=PACKS.find(p=>p.id===pack).blurb;
  };
  refresh();
  inA.addEventListener('input',refresh);
  document.querySelectorAll('.pack').forEach(el=>{
    el.addEventListener('click',()=>{
      pack=el.getAttribute('data-pack');
      document.querySelectorAll('.pack').forEach(x=>x.setAttribute('aria-pressed',
        String(x.getAttribute('data-pack')===pack)));
      refresh();
    });
  });
  on('bStart',()=>{
    const a=inA.value.trim().slice(0,12)||'Player 1';
    const b=inB.value.trim().slice(0,12)||'Player 2';
    names=[a,b]; LS.set('sync.names',JSON.stringify(names));
    newSession(pack);
    track('game_start',{pack:pack});
    /* Player 1 is already holding the phone — no interstitial; the sheet carries the
       "look away" banner instead */
    sheet(0);
  });
}

/* ============================ hand-off ============================
   Only the phone's change of hands gets an interstitial. It renders through show(), which has
   already destroyed the previous screen — so by the time this paints there is nothing underneath
   to peek at, however fast the tap. */
function handoff(p){
  const nm=S.names[p], cls=p===0?'pa':'pb';
  show(
   '<div class="handoff">'
   +'<div class="pass">Pass the phone to</div>'
   +'<h2 class="'+cls+'">'+esc(nm)+'</h2>'
   +'<p class="sub">'+esc(S.names[p===0?1:0])+' is done and locked in.<br>Your turn — same ten questions, one page.</p>'
   +'<button class="btn primary" type="button" id="bReady">I’m '+esc(nm)+' — show me</button>'
   +'<p class="peek">👀 tilt the phone away while you answer</p>'
   +'</div>'
  );
  on('bReady',()=>sheet(p));
}

/* ============================ answering — one sheet ============================
   Every question on one page, two columns of cells beside each option: Me (violet) and Them
   (rose). Tap one in each, all the way down. Finishing a question slides the next one up;
   anything can be changed until lock-in, so the sheet is its own recap. Player 1 is already
   holding the phone after Start, so there is no interstitial before this — only before Player 2. */
function picksHTML(p,qi,other){
  const q=S.qs[qi];
  return '<span class="pk me">Me: '+esc(q.o[S.self[p][qi]])+'</span>'
   +'<span class="pk them">'+esc(other)+': '+esc(q.o[S.pred[p][qi]])+'</span>'
   +'<span class="chg">tap to change</span>';
}
function block(p,qi,other){
  const q=S.qs[qi], mySelf=S.self[p][qi], myPred=S.pred[p][qi], done=answered(p,qi);
  return '<div class="qcard'+(done?' done collapsed" role="button" tabindex="0':'')+'" id="blk'+qi+'">'
   +'<div class="qhead"><span class="qn">'+(qi+1)+'</span><p class="qtext">'+esc(q.q)+'</p></div>'
   +'<div class="picks">'+(done?picksHTML(p,qi,other):'')+'</div>'
   +'<div class="colhead"><span class="sp"></span>'
   +'<span class="ch me"><small>my answer</small>Me</span>'
   +'<span class="ch them"><small>my guess</small>'+esc(other)+'</span></div>'
   +q.o.map((opt,i)=>'<div class="orow'+(mySelf===i&&myPred===i?' both':'')+'" data-i="'+i+'">'
      +'<span class="otext">'+esc(opt)+'</span>'
      +'<button class="cell me'+(mySelf===i?' on':'')+'" type="button" data-q="'+qi+'" data-col="me" data-i="'+i+'" '
      +'aria-pressed="'+(mySelf===i)+'" aria-label="Me: '+esc(opt)+'">'+TICK+'</button>'
      +'<button class="cell them'+(myPred===i?' on':'')+'" type="button" data-q="'+qi+'" data-col="them" data-i="'+i+'" '
      +'aria-pressed="'+(myPred===i)+'" aria-label="My guess for '+esc(other)+': '+esc(opt)+'">'+TICK+'</button>'
      +'</div>').join('')
   +'</div>';
}

function sheet(p){
  const me=S.names[p], other=S.names[p===0?1:0];
  const pcls=p===0?'pa':'pb';
  show(
   header(true)
   +'<div class="turn"><span class="eye">👀</span><span><b class="'+pcls+'">'+esc(me)+'’s turn.</b> '
     +esc(other)+', look away — nothing shows until you’ve both locked in.</span></div>'
   +'<div class="prog"><span class="n"><b id="pn">0</b> of '+ROUNDS+' done</span>'
   +'<div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="'+ROUNDS+'" aria-valuenow="0" id="pbar"><i></i></div></div>'
   +'<div id="sheet">'
   +'<div class="explain">'
   +'<div class="row"><span class="cell me on" aria-hidden="true">'+TICK+'</span>'
   +'<span><b class="pa">Me</b> — the answer that’s true for you.</span></div>'
   +'<div class="row"><span class="cell them on" aria-hidden="true">'+TICK+'</span>'
   +'<span><b class="pb">'+esc(other)+'</b> — your guess at what '+esc(other)+' will pick for themselves.</span></div>'
   +'<p>Two taps per question, all ten on this page. Change anything until you lock in.</p>'
   +'</div>'
   +S.qs.map((q,qi)=>block(p,qi,other)).join('')
   +'</div>'
   +'<div class="lockbar"><button class="btn" type="button" id="bLock"></button></div>'
  );
  bindHome();
  const g=GEN, lockBtn=document.getElementById('bLock');
  const reduced=!!(window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches);
  const scrollTo=el=>el.scrollIntoView({behavior:reduced?'auto':'smooth', block:'start'});
  const refresh=()=>{
    const n=answeredCount(p), all=n===ROUNDS;
    document.getElementById('pn').textContent=n;
    const bar=document.getElementById('pbar');
    bar.setAttribute('aria-valuenow',n); bar.firstChild.style.width=(n/ROUNDS*100)+'%';
    lockBtn.className='btn'+(all?' primary':'');
    lockBtn.innerHTML=all
      ? (p===0?'Lock in &amp; pass to '+esc(other):'Lock in &amp; reveal together')
      : (ROUNDS-n)+' more to go';
  };
  refresh();

  /* A finished question leaves: a swish, a slide off to the left, then it settles back as one
     compact row (question + two chips) and the next unanswered one slides in from the right —
     but only if that one is further down; a player fixing an earlier answer is left where they
     are. Nothing scrolls when the sheet completes: the lock bar is sticky and already on screen,
     and a smooth scroll left in flight would outlive the screen swap when Lock in is tapped
     quickly. */
  const collapse=qi=>{
    const blk=document.getElementById('blk'+qi);
    blk.querySelector('.picks').innerHTML=picksHTML(p,qi,other);
    blk.classList.add('collapsed'); blk.setAttribute('role','button'); blk.setAttribute('tabindex','0');
  };
  const expand=blk=>{
    blk.classList.remove('collapsed','settle'); blk.removeAttribute('role'); blk.removeAttribute('tabindex');
    blk.classList.remove('arrive'); void blk.offsetWidth; blk.classList.add('arrive');
    scrollTo(blk);
  };
  const depart=qi=>{
    const blk=document.getElementById('blk'+qi);
    if(!blk||!answered(p,qi)||blk.classList.contains('collapsed')||blk.classList.contains('leaving')) return;
    const settle=()=>{
      if(g!==GEN) return;
      blk.classList.remove('leaving'); collapse(qi); blk.classList.add('settle');
      const next=nextUnanswered(p,qi);
      if(next>qi){ const nb=document.getElementById('blk'+next);
        nb.classList.remove('arrive'); void nb.offsetWidth; nb.classList.add('arrive'); scrollTo(nb); }
    };
    if(reduced){ settle(); return; }
    swish();
    blk.classList.remove('arrive','settle');     // a card re-opened for a change may still be arriving
    blk.classList.add('leaving');
    let fired=false; const once=()=>{ if(fired) return; fired=true; settle(); };
    blk.addEventListener('animationend',ev=>{ if(ev.animationName==='leave') once(); });
    setTimeout(once,450);                        // belt and braces: never leave a card invisible
  };

  /* one listener on the sheet rather than 80 on the cells; it dies with the sheet's innerHTML */
  const sheetEl=document.getElementById('sheet');
  sheetEl.addEventListener('click',e=>{
    if(g!==GEN) return;
    const cell=e.target.closest('.cell[data-q]');
    if(cell){
      const qi=+cell.getAttribute('data-q'), i=+cell.getAttribute('data-i'), col=cell.getAttribute('data-col');
      const blk=document.getElementById('blk'+qi);
      (col==='me'?S.self:S.pred)[p][qi]=i;
      blk.querySelectorAll('.cell.'+col).forEach(c=>{ const onNow=+c.getAttribute('data-i')===i;
        c.classList.toggle('on',onNow); c.setAttribute('aria-pressed',String(onNow)); });
      blk.querySelectorAll('.orow').forEach(r=>{ const k=+r.getAttribute('data-i');
        r.classList.toggle('both', S.self[p][qi]===k && S.pred[p][qi]===k); });
      blk.classList.toggle('done',answered(p,qi));
      refresh();
      tick();
      /* both columns set: a beat so the second tick is seen landing, then the question departs */
      if(answered(p,qi)) setTimeout(()=>{ if(g===GEN) depart(qi); },240);
      return;
    }
    /* a finished row opens back up for changes */
    const done=e.target.closest('.qcard.collapsed');
    if(done){ expand(done); return; }
    /* tapping the words themselves isn't a pick — wiggle the empty cells on that row as a nudge */
    const txt=e.target.closest('.otext');
    if(txt) txt.parentNode.querySelectorAll('.cell:not(.on)').forEach(c=>{
      c.classList.remove('nudge'); void c.offsetWidth; c.classList.add('nudge'); });
  });
  sheetEl.addEventListener('keydown',e=>{
    if(g!==GEN) return;
    if((e.key==='Enter'||e.key===' ') && e.target.classList && e.target.classList.contains('collapsed')){
      e.preventDefault(); expand(e.target); }
  });
  on('bLock',()=>{
    const first=nextUnanswered(p,ROUNDS-1);        // wraps, so this is the first blank from the top
    if(first>=0){
      const blk=document.getElementById('blk'+first);
      scrollTo(blk);
      blk.classList.remove('flash'); void blk.offsetWidth; blk.classList.add('flash');
      toast((ROUNDS-answeredCount(p))+' still need both columns');
      return;
    }
    S.done[p]=true;
    if(S.done[0]&&S.done[1]) results();
    else handoff(p===0?1:0);
  });
}

/* ============================ scoring ============================ */
function scoreQ(i){
  return { same: S.self[0][i]===S.self[1][i],
           aHit: S.pred[0][i]===S.self[1][i],     // A predicted B correctly
           bHit: S.pred[1][i]===S.self[0][i] };   // B predicted A correctly
}
function totals(){
  let sim=0, ia=0, ib=0;
  for(let i=0;i<ROUNDS;i++){ const s=scoreQ(i); if(s.same)sim++; if(s.aHit)ia++; if(s.bHit)ib++; }
  return {sim:sim, ia:ia, ib:ib};
}

/* ============================ verdicts ============================ */
function pairTitle(t){
  const d=Math.abs(t.ia-t.ib);
  if(t.sim>=8&&t.ia>=8&&t.ib>=8) return ['Open books',
    'High similarity, high insight both ways. Very little is hiding here.'];
  if(t.ia>=7&&t.ib>=7&&t.sim<=4) return ['Fluent translators',
    'You answer differently — and you both know exactly how. That’s real attention.'];
  if(d>=3) return ['One-way mirror',
    'One of you sees through the glass; the other sees a reflection. Worth talking about.'];
  if(t.sim>=7&&t.ia<=4&&t.ib<=4) return ['Twins by accident',
    'You keep giving the same answers without predicting them. Alike, and still surprising.'];
  if(t.sim<=3&&t.ia<=3&&t.ib<=3) return ['Beautiful strangers',
    'Low overlap, low prediction — which means everything is still left to discover.'];
  if(t.ia+t.ib>=13) return ['Mind readers',
    'The predictions landed on both sides. You’ve clearly been paying attention.'];
  if(t.sim>=6) return ['Same wavelength',
    'More overlap than not, and the misses are the interesting part.'];
  return ['Still unfolding',
    'Some hits, some misses, plenty of material. This pairing has chapters left.'];
}

/* a question quoted mid-sentence loses its trailing colon or ellipsis: "Your desk, right now:"
   reads as “Your desk, right now” once it's the object of a sentence */
function qname(q){ return '<b>“'+esc(q.q.replace(/[:…]+\s*$/,''))+'”</b>'; }

function bestAndMiss(){
  let best=null, bScore=-1, miss=null, mScore=4;
  const pts=[];
  for(let i=0;i<ROUNDS;i++){ const s=scoreQ(i); pts.push((s.same?1:0)+(s.aHit?1:0)+(s.bHit?1:0)); }
  for(let i=0;i<ROUNDS;i++){ if(pts[i]>bScore){ bScore=pts[i]; best=i; } }
  /* the miss is picked from the OTHER questions, so a flat scoreline can't name the same question
     as both the best moment and the biggest miss; if everything scored alike there is no miss */
  for(let i=0;i<ROUNDS;i++){ if(i!==best && pts[i]<mScore){ mScore=pts[i]; miss=i; } }
  const flat = miss===null || mScore===bScore;
  const A=esc(S.names[0]), B=esc(S.names[1]);
  let bHtml=null, mHtml=null;
  if(bScore===3){
    const q=S.qs[best];
    bHtml=qname(q)+' — both said “'+esc(q.o[S.self[0][best]])+'”, and both called it.';
  }else if(bScore===2){
    const q=S.qs[best], s=scoreQ(best);
    bHtml=s.same
      ? qname(q)+' — both said “'+esc(q.o[S.self[0][best]])+'”.'
      : qname(q)+' — both guesses landed.';
  }else if(bScore>=0){
    bHtml='No clean sweep — next game’s material.';
  }
  if(flat){
    mHtml = bScore===3 ? 'Not a single miss. Spooky.' : null;
  }else if(mScore===0){
    const q=S.qs[miss];
    mHtml=qname(q)+' — “'+esc(q.o[S.self[0][miss]])+'” vs “'+esc(q.o[S.self[1][miss]])
     +'”, both guesses off. Ask about it.';
  }else if(mScore<3){
    const q=S.qs[miss], s=scoreQ(miss);
    mHtml=qname(q)
     +(!s.aHit&&!s.bHit?' — both guesses off.':
       !s.aHit?' — '+A+'’s guess was off.':
       !s.bHit?' — '+B+'’s guess was off.':' — different answers, worth a story.');
  }else{
    mHtml='Not a single miss. Spooky.';
  }
  return {best:bHtml, miss:mHtml};
}

/* ============================ results — one page ============================
   Reachable only once both done flags are true. Guarded again here anyway — a state machine
   bug should fail loudly to the hand-off, not quietly leak answers.
   Everything is on this one screen: the verdict, a scoreboard of ten squares per score (square
   i is question i — tap it to jump), the callouts, and all ten questions with both players'
   answers and guesses side by side. */
let completeSent=false;
function results(){
  if(!S){ title(); return; }
  if(!(S.done[0]&&S.done[1])){ handoff(S.done[0]?1:0); return; }
  const t=totals(), A=esc(S.names[0]), B=esc(S.names[1]);
  const pt=pairTitle(t), bm=bestAndMiss();
  const d=Math.abs(t.ia-t.ib);
  const asym = d>=2
    ? (t.ia>t.ib ? A+' reads '+B+' better than the other way round — for now.'
                 : B+' reads '+A+' better than the other way round — for now.')
    : null;
  const packName=PACKS.find(p=>p.id===S.pack).name;
  const today=new Date().toLocaleDateString(undefined,{year:'numeric',month:'short',day:'numeric'});
  /* the headline figures: each player's insight as a percentage, the pair's average, and
     similarity — one number each, no reading required */
  const pctA=t.ia*100/ROUNDS, pctB=t.ib*100/ROUNDS, pctSim=t.sim*100/ROUNDS,
        know=Math.round((pctA+pctB)/2);

  if(!completeSent){
    completeSent=true;
    track('game_complete',{pack:S.pack, similarity:t.sim, insight_a:t.ia, insight_b:t.ib});
    const plays=(+LS.get('sync.plays')||0)+1; LS.set('sync.plays',String(plays));
  }

  const dl=n=>'style="animation-delay:'+n+'ms"';
  const squares=(fn,cls)=>{
    let h='';
    for(let i=0;i<ROUNDS;i++){ const hit=fn(scoreQ(i));
      h+='<button type="button" class="'+(hit?'on':'')+'" data-q="'+i+'" style="animation-delay:'+(i*55)+'ms" '
        +'aria-label="Question '+(i+1)+': '+(hit?'yes':'no')+'"></button>'; }
    return '<div class="sq">'+h+'</div>';
  };
  const mark=(hit,label)=>'<span class="m '+(hit?'hit':'miss')+'" aria-label="'+label+'">'+(hit?'✓':'✗')+'</span>';
  /* a ring is an SVG circle whose dash offset is animated from "empty" to the score after first
     paint; the number inside counts up alongside it. The screen-reader text carries the value. */
  const ring=(pct,cls,label,big)=>{
    const r=big?70:40, s=2*r+12, c=s/2, C=2*Math.PI*r, v=Math.round(pct);
    return '<div class="ring '+cls+(big?' big':'')+'"><svg viewBox="0 0 '+s+' '+s+'" aria-hidden="true">'
     +'<circle class="tr" cx="'+c+'" cy="'+c+'" r="'+r+'"/>'
     +'<circle class="fl" cx="'+c+'" cy="'+c+'" r="'+r+'" style="stroke-dasharray:'+C.toFixed(1)+';stroke-dashoffset:'+C.toFixed(1)+'" '
     +'data-off="'+(C*(1-v/100)).toFixed(1)+'"/></svg>'
     +'<div class="rv" aria-hidden="true"><b data-n="'+v+'">0</b><i>%</i></div>'
     +'<div class="rl" aria-hidden="true">'+label+'</div>'
     +'<span class="sr">'+label+': '+v+'%</span></div>';
  };

  show(
   header(false)
   +'<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>'
   +'<linearGradient id="ringGrad" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7c5cff"/><stop offset="1" stop-color="#ff6b9d"/></linearGradient>'
   +'</defs></svg>'
   +'<div class="results">'
   +'<h2>The verdict</h2>'
   +'<p class="names"><span class="na">'+A+'</span><span class="x">×</span>'
   +'<span class="nb">'+B+'</span><span class="x">·</span><span class="dim">'+packName+' pack</span></p>'
   +'<div class="card info">'
   +ring(know,'rk','know each other',true)
   +'<div class="rings3">'
   +ring(pctA,'ra',A+' knows '+B)
   +ring(pctB,'rb',B+' knows '+A)
   +ring(pctSim,'rs','Alike')
   +'</div>'
   +'<div class="verdict" '+dl(600)+'><b>'+pt[0]+'</b><span>'+pt[1]+'</span></div>'
   +'</div>'
   +'<div class="card glance" '+dl(750)+'>'
   +(asym?'<div class="gl asym"><span class="gi">⚖️</span><span>'+asym+'</span></div>':'')
   +(bm.best?'<div class="gl best"><span class="gi">✨</span><span><span class="lb">Best</span>'+bm.best+'</span></div>':'')
   +(bm.miss?'<div class="gl miss"><span class="gi">🌀</span><span><span class="lb">Miss</span>'+bm.miss+'</span></div>':'')
   +'</div>'
   +'<div class="card scorecard" '+dl(850)+'>'
   +'<div class="srow s-sim"><span class="sl">Alike</span>'+squares(s=>s.same)+'<span class="sn">'+t.sim+'/'+ROUNDS+'</span></div>'
   +'<div class="srow s-a"><span class="sl">'+A+' → '+B+'</span>'+squares(s=>s.aHit)+'<span class="sn">'+t.ia+'/'+ROUNDS+'</span></div>'
   +'<div class="srow s-b"><span class="sl">'+B+' → '+A+'</span>'+squares(s=>s.bHit)+'<span class="sn">'+t.ib+'/'+ROUNDS+'</span></div>'
   +'<p class="sqhint">One square per question — tap any to jump to it.</p>'
   +'</div>'
   +'<div class="sect"><h3>All ten, side by side</h3><span>who said what — and who guessed right</span></div>'
   +S.qs.map((q,i)=>{
      const s=scoreQ(i), pts=(s.same?1:0)+(s.aHit?1:0)+(s.bHit?1:0);
      return '<div class="qres" id="q'+i+'" '+dl(950+i*70)+'>'
       +'<div class="qh"><span class="qn">'+(i+1)+'</span><span class="qq">'+esc(q.q)+'</span>'
       +(pts===3?'<span class="badge sweep">Clean sweep</span>':s.same?'<span class="badge same">Same</span>':'')+'</div>'
       +'<div class="cols">'
       +'<div class="col ca"><div class="who">'+A+'</div><div class="said">'+esc(q.o[S.self[0][i]])+'</div>'
       +'<div class="guess">'+mark(s.aHit,s.aHit?'correct guess':'wrong guess')+'<span>guessed <b>'+esc(q.o[S.pred[0][i]])+'</b> for '+B+'</span></div></div>'
       +'<div class="col cb"><div class="who">'+B+'</div><div class="said">'+esc(q.o[S.self[1][i]])+'</div>'
       +'<div class="guess">'+mark(s.bHit,s.bHit?'correct guess':'wrong guess')+'<span>guessed <b>'+esc(q.o[S.pred[1][i]])+'</b> for '+A+'</span></div></div>'
       +'</div></div>';
    }).join('')
   +'<p class="datefoot">'+esc(today)+' · kreeda.games/sync</p>'
   +'<button class="btn primary" type="button" id="bAgain">Play again</button>'
   +'<a class="btn wa" id="bWa" href="#" target="_blank" rel="noopener">'+WA_ICON+'Share on WhatsApp</a>'
   +'<p class="sharehint">Send it to the other player — you’ll both have a copy.</p>'
   +'<div class="btnrow"><button class="btn" type="button" id="bCopy">Copy result</button>'
   +(navigator.share?'<button class="btn" type="button" id="bShare">Share…</button>':'')+'</div>'
   +'<button class="btn ghost" type="button" id="bChange">Change players</button>'
   +'<div id="shareSlot"></div>'
   +'</div>'
   +'<footer class="foot">Mismatches aren’t wrong answers — they’re the conversation.<br>'
   +'<a href="../">Kreeda</a></footer>'
  );
  const g=GEN;
  /* rings fill and numbers count up after first paint; reduced motion gets the final state at once */
  const reduced=!!(window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches);
  requestAnimationFrame(()=>requestAnimationFrame(()=>{
    if(g!==GEN) return;
    document.querySelectorAll('.ring .fl').forEach(el=>{ el.style.strokeDashoffset=el.getAttribute('data-off'); });
    const nums=Array.prototype.slice.call(document.querySelectorAll('.ring .rv b'));
    if(reduced){ nums.forEach(b=>{ b.textContent=b.getAttribute('data-n'); }); return; }
    const t0=performance.now(), D=1100;
    /* clock off performance.now(), not the frame timestamp: a tab that was hidden when the
       results rendered gets odd frame times when it comes back, and this must land on the
       final figure regardless */
    (function step(){
      if(g!==GEN) return;
      const k=Math.min(1,(performance.now()-t0)/D), e=1-Math.pow(1-k,3);
      nums.forEach(b=>{ b.textContent=Math.round(+b.getAttribute('data-n')*e); });
      if(k<1) requestAnimationFrame(step);
    })();
  }));
  document.querySelectorAll('.srow .sq button').forEach(el=>{
    el.addEventListener('click',()=>{ if(g!==GEN) return;
      const q=document.getElementById('q'+el.getAttribute('data-q'));
      if(q) q.scrollIntoView({behavior:'smooth',block:'start'}); });
  });
  on('bAgain',()=>{ completeSent=false; newSession(S.pack);
    track('game_start',{pack:S.pack}); sheet(0); });
  on('bChange',()=>{ completeSent=false; S=null; title(); });
  /* the share text is the whole page in words — sharing is the players' own explicit act, so
     unlike analytics it may carry the answers */
  const text=shareText(t,pt,bm,asym,packName,today);
  const wa=document.getElementById('bWa');
  wa.href=waLink(text);
  wa.addEventListener('click',()=>track('share',{via:'whatsapp'}));
  on('bShare',()=>{ track('share',{via:'system'});
    try{ navigator.share({title:'Sync — '+S.names[0]+' × '+S.names[1], text:text}).catch(()=>{}); }catch(e){} });
  on('bCopy',()=>{
    let done=false;
    try{
      if(navigator.clipboard&&navigator.clipboard.writeText){
        navigator.clipboard.writeText(text).then(()=>toast('Copied!'),()=>showShareBox(text));
        done=true;
      }
    }catch(e){}
    if(!done) showShareBox(text);   // clipboard is unavailable on file:// — show it to copy by hand
  });
}
/* ============================ share ============================
   The results page in words, for WhatsApp (its *bold* and _italic_ marks) and the clipboard:
   the verdict, the four figures with their ten-square strips, the three callouts, and all ten
   questions with both answers and both guesses. */
const WA_ICON='<svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2zm0 18.2a8.2 8.2 0 0 1-4.2-1.2l-.3-.2-3 .8.8-2.9-.2-.3A8.2 8.2 0 1 1 12 20.2zm4.5-6.1c-.2-.1-1.5-.7-1.7-.8s-.4-.1-.6.1-.6.8-.8 1c-.1.2-.3.2-.5.1a6.7 6.7 0 0 1-3.3-2.9c-.3-.4.3-.4.8-1.4.1-.2 0-.3 0-.4l-.8-1.8c-.2-.5-.4-.4-.6-.4h-.5a1 1 0 0 0-.7.3 3 3 0 0 0-.9 2.2 5.2 5.2 0 0 0 1.1 2.7 11.8 11.8 0 0 0 4.5 4c1.7.7 2.3.8 3.1.6a2.7 2.7 0 0 0 1.8-1.2 2.2 2.2 0 0 0 .1-1.2c0-.2-.2-.2-.5-.4z"/></svg>';
function waLink(text){ return 'https://wa.me/?text='+encodeURIComponent(text); }
/* the callouts are built as HTML with escaped names; the share text wants them plain */
function plain(html){ return String(html).replace(/<[^>]+>/g,'').replace(/&amp;/g,'&').replace(/&lt;/g,'<')
  .replace(/&gt;/g,'>').replace(/&quot;/g,'"').replace(/&#39;/g,"'"); }
function shareText(t,pt,bm,asym,packName,today){
  const A=S.names[0], B=S.names[1];
  const pct=n=>Math.round(n*100/ROUNDS), know=Math.round((t.ia+t.ib)*50/ROUNDS);
  const row=(fn,y)=>{ let s=''; for(let i=0;i<ROUNDS;i++) s+=fn(scoreQ(i))?y:'⚫'; return s; };
  const lines=[
    '*Sync* · '+A+' × '+B+' · '+packName+' pack',
    '_'+pt[0]+'_ — '+pt[1],
    '',
    '🔮 Know each other: *'+know+'%*',
    '🟣 '+A+' knows '+B+': '+pct(t.ia)+'%  '+row(s=>s.aHit,'🟣'),
    '🔴 '+B+' knows '+A+': '+pct(t.ib)+'%  '+row(s=>s.bHit,'🔴'),
    '🟢 Alike: '+pct(t.sim)+'%  '+row(s=>s.same,'🟢'),
    ''
  ];
  if(asym) lines.push('⚖️ '+plain(asym));
  if(bm.best) lines.push('✨ Best: '+plain(bm.best));
  if(bm.miss) lines.push('🌀 Miss: '+plain(bm.miss));
  lines.push('','*All ten*');
  S.qs.forEach((q,i)=>{
    const s=scoreQ(i);
    lines.push((i+1)+'. '+q.q.replace(/[:…]+\s*$/,''));
    lines.push('   '+A+': '+q.o[S.self[0][i]]+' · guessed '+q.o[S.pred[0][i]]+' for '+B+' '+(s.aHit?'✅':'❌'));
    lines.push('   '+B+': '+q.o[S.self[1][i]]+' · guessed '+q.o[S.pred[1][i]]+' for '+A+' '+(s.bHit?'✅':'❌'));
  });
  lines.push('', today+' · kreeda.games/sync');
  return lines.join('\n');
}
function showShareBox(text){
  const slot=document.getElementById('shareSlot');
  if(!slot) return;
  slot.innerHTML='<textarea class="sharebox" rows="6" readonly aria-label="Result text to copy manually"></textarea>';
  const ta=slot.querySelector('textarea'); ta.value=text;
  ta.focus(); try{ ta.select(); }catch(e){}
  toast('Copy it from the box below');
}

/* ============================ boot self-test ============================
   Cheap invariants that would otherwise only fail in a player's hands: every pack must be able
   to deal a full session, and every option index used anywhere must exist. Runs once, logs only. */
(function audit(){
  try{
    PACKS.forEach(p=>{
      const n=BANK.filter(x=>x.t.indexOf(p.id)>=0).length;
      if(n<ROUNDS) console.warn('sync: pack "'+p.id+'" has only '+n+' questions');
    });
    BANK.forEach((x,i)=>{
      if(!(x.o.length>=2&&x.o.length<=4)) console.warn('sync: question '+i+' has '+x.o.length+' options');
    });
  }catch(e){}
})();

title();
</script>
