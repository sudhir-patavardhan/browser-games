   Dusk violet: the hour when people actually talk. One committed dark look — this game is played
   with two heads over one phone, usually in the evening, and a theme flip mid-hand-off would read

<script>
'use strict';
/* ============================================================================================
   SYNC — an empathic-accuracy duel. Two players, one phone. Every question is answered twice by
   each player: once for yourself, once predicting the other. Nothing is revealed until both have
   locked in — the entire game is the gap between prediction and reveal.

   Privacy is a design constraint, not a feature flag: answers live in one in-memory session
   object (S) and NOTHING else. localStorage holds only names and a play counter. Analytics gets
   counts, never content. A page refresh mid-game loses the round by design — that is cheaper
   than answers ever touching disk.
   ============================================================================================ */

function track(name,p){ try{ if(window.bgTrack) window.bgTrack(name,p); }catch(e){} }
const LS={ get:k=>{ try{ return localStorage.getItem(k)||''; }catch(e){ return ''; } },
           set:(k,v)=>{ try{ localStorage.setItem(k,v); }catch(e){} } };

/* Seeded PRNG so a session's draw is deterministic given its seed — reshuffles can never
   disagree with themselves mid-session — while each new session still gets a fresh seed. */
function mulberry32(a){ return function(){ a=(a+0x6D2B79F5)|0; let t=Math.imul(a^(a>>>15),1|a);
  t=(t+Math.imul(t^(t>>>7),61|t))^t; return ((t^(t>>>14))>>>0)/4294967296; }; }

function esc(s){ return String(s).replace(/[&<>"']/g,
  c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

/* ============================================================================================
   QUESTION BANK — 64 original questions.
   Tags: n = New pair · c = Couple · f = Friends · a = Family · w = Coworkers.
   Every question is answerable about A PERSON, not about the world: there is no correct option,
   only a true one. Options are kept short enough to survive two names and a tick on one reveal
   row. A question may serve several packs; a session draws 10 from its pack without repeats.
   ============================================================================================ */
const BANK=[
 {q:"You're upset. What do you want first?", o:["Solutions","Company","Space","Distraction"], t:"ncfaw"},
 {q:"Ideal Saturday morning:", o:["Sleep in, no shame","Out the door by nine","Slow coffee, no plans","Errands crushed early"], t:"ncfaw"},

 {q:"A surprise party thrown for you would be…", o:["The dream","Sweet, but stressful","My actual nightmare"], t:"ncfaw"},
 {q:"Phone battery hits 4%. Inside, you feel…", o:["Genuine panic","Mild unease","Nothing","Strangely free"], t:"ncfaw"},
 {q:"Someone starts crying in front of you. First instinct?", o:["Hug them","Just listen","Start fixing","Quietly panic"], t:"ncfaw"},
 {q:"A month's pay lands unexpectedly. Most of it goes to…", o:["Savings, instantly","A trip","Something shiny","Debts and bills"], t:"ncfaw"},
 {q:"Your texting style, honestly:", o:["Replies in seconds","Twice-a-day batches","Read now, reply Thursday","I'd rather just call"], t:"ncfaw"},

 {q:"Four-hour drive. You hope the car is…", o:["Full of conversation","Full of loud music","Comfortably silent","A rolling nap pod"], t:"ncfaw"},
 {q:"Being ten minutes early feels…", o:["Correct","Like wasted time","Physically impossible","Like winning"], t:"ncfaw"},
 {q:"The karaoke mic is headed your way. You…", o:["Grab it","Duet only","Need one more drink","Vanish"], t:"ncfaw"},
 {q:"Scary movie tonight?", o:["Front row","Through my fingers","Comedies only","I'll be in the kitchen"], t:"ncfaw"},
 {q:"The correct number of morning alarms:", o:["One","Two, spaced","Five, escalating","None — I just wake up"], t:"ncfaw"},
 {q:"You win arguments mostly by…", o:["Facts","Persistence","Patience","Deciding it's not worth it"], t:"ncfaw"},
 {q:"A weekend of camping sounds…", o:["Perfect — deep woods","Fine — cabin with wifi","Better as a nice hotel","Like a punishment"], t:"ncfaw"},
 {q:"Your camera roll is mostly…", o:["People","Screenshots","Food and places","Pets and skies"], t:"ncfaw"},
 {q:"Plans get cancelled last minute. You feel…", o:["Genuinely crushed","Mildly annoyed","Neutral","Secretly thrilled"], t:"ncfaw"},

 {q:"You'd rather be known for…", o:["Making something","Knowing everything","Being kind","Not being known"], t:"ncfaw"},

 {q:"New restaurant. You order…", o:["My usual kind of thing","The weirdest item","Whatever they recommend","What you're having"], t:"ncfaw"},
 {q:"Compliments make you…", o:["Glow all day","Deflect with a joke","A little suspicious","Ask for specifics"], t:"ncfaw"},
 {q:"Losing a board game, you are…", o:["Fine. Totally fine","Quietly plotting revenge","Openly salty","Already over it"], t:"ncfaw"},
 {q:"Ideal pet, no practical limits:", o:["Dog","Cat","Something scaly or feathered","Plants count"], t:"ncfaw"},
 {q:"A full day of rain means…", o:["Cozy heaven","Ruined plans","Perfect sleep","Nothing changes"], t:"ncfaw"},

const PACKS=[
  {id:'n', name:'New pair',  blurb:'Just met, or never played'},
  {id:'c', name:'Couple',    blurb:'Partners'},
  {id:'f', name:'Friends',   blurb:'Old or new'},
  {id:'a', name:'Family',    blurb:'Siblings, parents, cousins'},
  {id:'w', name:'Coworkers', blurb:'Team, office, shift'}
];
const ROUNDS=10;

/* ============================ state ============================
   S is the whole game and it lives only in memory. self/pred are option indexes, -1 = unanswered.
   phase is a plain string state machine; every transition goes through show() which wipes the DOM,
   so a previous player's inputs cannot survive into a hand-off even for one frame. */
let S=null;
function newSession(pack){
  const rnd=mulberry32((Date.now() ^ (Math.random()*0xffffffff))>>>0);
  const pool=BANK.filter(x=>x.t.indexOf(pack)>=0);
  /* Fisher–Yates on a copy, take the first ROUNDS — no repeats possible within a session */
  const deck=pool.slice();
  for(let i=deck.length-1;i>0;i--){ const j=Math.floor(rnd()*(i+1)); const t=deck[i]; deck[i]=deck[j]; deck[j]=t; }
  S={ pack:pack, qs:deck.slice(0,ROUNDS),
      self:[[],[]], pred:[[],[]],           // [playerIdx][questionIdx]
      names:names.slice(), done:[false,false] };
  for(let p=0;p<2;p++) for(let i=0;i<ROUNDS;i++){ S.self[p][i]=-1; S.pred[p][i]=-1; }
}

let names=['Player 1','Player 2'];
try{ const n=JSON.parse(LS.get('sync.names')||'[]');
  if(Array.isArray(n)&&n.length===2) names=[String(n[0]).slice(0,12)||'Player 1',
                                            String(n[1]).slice(0,12)||'Player 2']; }catch(e){}

let firstHandoff=true;   // the "tilt the phone away" hint shows once per page load

/* ============================ rendering core ============================
   One container, innerHTML replaced wholesale per screen. GEN is a render generation counter:
   every handler captures the generation it was bound in and no-ops if a render has happened
   since — this is the double-tap guard. A fast second tap on a hand-off button finds either a
   disabled button or a stale generation; it can never advance the state machine twice. */
const app=document.getElementById('app');
let GEN=0;
function show(html){ GEN++; app.innerHTML=html; window.scrollTo(0,0); }
function on(id,fn){
  const g=GEN, el=document.getElementById(id);
  if(!el) return;
  el.addEventListener('click',function(e){
    if(g!==GEN || el.disabled) return;
    el.disabled=true;                       // released only if the handler chooses to re-render
    try{ fn(e); }finally{ if(g===GEN) el.disabled=false; }
  });
}

 +'<path d="M14 37 q6-22 12-22 t12 22 12 22 12-22 8-14" stroke="#7c5cff" stroke-width="7" opacity=".9"/>'
 +'<path d="M46 37 q6 22 12 22 t12-22 12-22 12 22 8 14" stroke="#ff6b9d" stroke-width="7" opacity=".9"/>'
 +'</g></svg>';

/* ============================ title ============================
   pack is session-only, deliberately not persisted: storage holds names and a play count and
   nothing else — see the privacy note at the top. */
let pack='n';

/* ============================ hand-off ============================
   The interstitial renders through show(), which has already destroyed the previous screen —
   so by the time this paints there is nothing underneath to peek at, however fast the tap. */
function handoff(p){
  const nm=S.names[p], cls=p===0?'pa':'pb';
  show(
   '<div class="handoff">'
   +'<div class="pass">Pass the phone to</div>'
   +'<h2 class="'+cls+'">'+esc(nm)+'</h2>'
   +'<p class="sub">'+(S.done[0]||S.done[1]
      ? esc(S.names[p===0?1:0])+' is done. Your turn — same ten questions.'
      : 'Answer privately. Nothing is shown to '+esc(S.names[p===0?1:0])+' until the reveal.')+'</p>'
   +'<button class="btn primary" type="button" id="bReady">I’m '+esc(nm)+' — show me</button>'
   +(firstHandoff?'<p class="peek">👀 tilt the phone away while you answer</p>':'')
   +'</div>'
  );
  firstHandoff=false;
  on('bReady',()=>question(p,0,'self'));
}

/* ============================ answering ============================
   Two clearly separated steps per question: SELF first, then PREDICT. A tap on an option briefly
   shows the pick, then advances; Back walks the same rail in reverse (your own answers only —
   the other player's are never reachable from here). */
function question(p,qi,mode){
  const other=S.names[p===0?1:0];
  const step=qi*2+(mode==='pred'?1:0), total=ROUNDS*2;
  const q=S.qs[qi];
  const cur=(mode==='self'?S.self:S.pred)[p][qi];
  show(
   header(true)
   +'<div class="progress"><span class="n">'+(qi+1)+' of '+ROUNDS+'</span>'
   +'<div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="'+total+'" aria-valuenow="'+step+'">'
   +'<i style="width:'+Math.round(step/total*100)+'%"></i></div></div>'
   +'<div class="stepin '+(mode==='pred'?'pred':'')+'">'
   +'<span class="modechip '+(mode==='self'?'self':'pred')+'">'
   +(mode==='self'?'You':'Predict · '+esc(other))+'</span>'
   +'<p class="qtext">'+esc(q.q)+'</p>'
   +'<p class="qsub">'+(mode==='self'
      ? 'Answer for <b>yourself</b>.'
      : 'What will <b>'+esc(other)+'</b> pick for themselves?')+'</p>'
   +q.o.map((opt,i)=>'<button class="opt'+(i===cur?' picked':'')+'" type="button" data-i="'+i+'">'
      +esc(opt)+'</button>').join('')
   +'</div>'
   +'<div class="backrow">'+(step>0
      ?'<button class="btn ghost" type="button" id="bBack">← Back</button>':'')+'</div>'
  );
  bindHome();
  const g=GEN;
  document.querySelectorAll('.opt').forEach(el=>{
    el.addEventListener('click',()=>{
      if(g!==GEN) return;                                  // stale screen: ignore
      const i=+el.getAttribute('data-i');
      (mode==='self'?S.self:S.pred)[p][qi]=i;
      el.classList.add('picked');
      /* tiny beat so the pick registers visually before the slide; guarded by GEN so a double
         tap can't queue two advances */
      setTimeout(()=>{ if(g!==GEN) return; advance(p,qi,mode); },130);
    });
  });
  on('bBack',()=>{
    if(mode==='pred') question(p,qi,'self');
    else question(p,qi-1,'pred');
  });
}
function advance(p,qi,mode){
  if(mode==='self') question(p,qi,'pred');
  else if(qi+1<ROUNDS) question(p,qi+1,'self');
  else lockin(p);
}

/* explicit lock-in before the phone changes hands — the last chance to go back */
function lockin(p){
  const other=p===0?1:0;
  show(
   header(true)
   +'<div class="lock">'
   +'<div class="bignum">'+ROUNDS+'/'+ROUNDS+'</div>'
   +'<h2>All answered, '+esc(S.names[p])+'</h2>'
   +'<p>Lock in to hide your answers and pass the phone.<br>You can’t change them after this.</p>'
   +'<button class="btn primary" type="button" id="bLock">Lock in &amp; pass to '
   +esc(S.names[other])+'</button>'
   +'<button class="btn ghost" type="button" id="bRevise">← Go back and revise</button>'
   +'</div>'
  );
  bindHome();
  on('bLock',()=>{
    S.done[p]=true;
    if(S.done[0]&&S.done[1]) revealIntro();
    else handoff(other);
  });
  on('bRevise',()=>question(p,ROUNDS-1,'pred'));
}

/* ============================ scoring ============================ */
function scoreQ(i){
  return { same: S.self[0][i]===S.self[1][i],
           aHit: S.pred[0][i]===S.self[1][i],     // A predicted B correctly
           bHit: S.pred[1][i]===S.self[0][i] };   // B predicted A correctly
}
function totals(){
  let sim=0, ia=0, ib=0;
  for(let i=0;i<ROUNDS;i++){ const s=scoreQ(i); if(s.same)sim++; if(s.aHit)ia++; if(s.bHit)ib++; }
  return {sim:sim, ia:ia, ib:ib};
}

/* ============================ reveal ============================
   The reveal is a hard gate: it is only reachable from lockin() once both done flags are true.
   Guarded again here anyway — a state machine bug should fail loudly to the hand-off, not
   quietly leak answers. */
function revealIntro(){
  if(!S){ title(); return; }
  if(!(S.done[0]&&S.done[1])){ handoff(S.done[0]?1:0); return; }
  show(
   header(true)
   +'<div class="handoff">'
   +'<div class="pass">Both locked in</div>'
   +'<h2>Sit together</h2>'
   +'<p class="sub">'+esc(S.names[0])+' and '+esc(S.names[1])+' — shoulder to shoulder.<br>'
   +'Ten questions, revealed one at a time.</p>'
   +'<button class="btn primary" type="button" id="bGo">Start the reveal</button>'
   +'</div>'
  );
  bindHome();
  on('bGo',()=>reveal(0));
}

function reveal(i){
  if(!(S&&S.done[0]&&S.done[1])) return;
  const q=S.qs[i], s=scoreQ(i);
  /* running tallies count only questions revealed so far — the totals stay a surprise */
  let sim=0, ia=0, ib=0;
  for(let k=0;k<=i;k++){ const t=scoreQ(k); if(t.same)sim++; if(t.aHit)ia++; if(t.bHit)ib++; }
  const A=esc(S.names[0]), B=esc(S.names[1]);
  const d=n=>'style="animation-delay:'+n+'ms"';
  show(
   header(true)
   +'<div class="progress"><span class="n">Reveal '+(i+1)+' of '+ROUNDS+'</span>'
   +'<div class="bar"><i style="width:'+Math.round((i+1)/ROUNDS*100)+'%"></i></div></div>'
   +'<div class="tallies">'
   +'<div class="tally t-sim"><b>'+sim+'</b><span>Same</span></div>'
   +'<div class="tally t-a"><b>'+ia+'</b><span>'+A+' got right</span></div>'
   +'<div class="tally t-b"><b>'+ib+'</b><span>'+B+' got right</span></div>'
   +'</div>'
   +'<div aria-live="polite">'
   +'<p class="rq">'+esc(q.q)+'</p>'
   +'<div class="rrow'+(s.same?' same':'')+'" '+d(60)+'><span class="who pa">'+A+'</span>'
   +'<span class="what">'+esc(q.o[S.self[0][i]])+'</span>'
   +'<span class="mark '+(s.same?'hit':'miss')+'" aria-label="'+(s.same?'same answer':'different answers')+'">'
   +(s.same?'=':'≠')+'</span></div>'
   +'<div class="rrow'+(s.same?' same':'')+'" '+d(280)+'><span class="who pb">'+B+'</span>'
   +'<span class="what">'+esc(q.o[S.self[1][i]])+'</span>'
   +'<span class="mark '+(s.same?'hit':'miss')+'" aria-hidden="true">'+(s.same?'=':'≠')+'</span></div>'
   +'<div class="rrow" '+d(620)+'><span class="who pa">'+A+' guessed</span>'
   +'<span class="what">'+esc(q.o[S.pred[0][i]])+'<small>for '+B+'</small></span>'
   +'<span class="mark '+(s.aHit?'hit':'miss')+'" aria-label="'+(s.aHit?'correct prediction':'wrong prediction')+'">'
   +(s.aHit?'✓':'✗')+'</span></div>'
   +'<div class="rrow" '+d(900)+'><span class="who pb">'+B+' guessed</span>'
   +'<span class="what">'+esc(q.o[S.pred[1][i]])+'<small>for '+A+'</small></span>'
   +'<span class="mark '+(s.bHit?'hit':'miss')+'" aria-label="'+(s.bHit?'correct prediction':'wrong prediction')+'">'
   +(s.bHit?'✓':'✗')+'</span></div>'
   +'</div>'
   +'<button class="btn primary" type="button" id="bNext" style="margin-top:18px">'
   +(i+1<ROUNDS?'Next question':'See the verdict')+'</button>'
  );
  bindHome();
  on('bNext',()=>{ if(i+1<ROUNDS) reveal(i+1); else results(); });
}

/* ============================ verdicts ============================ */
function pairTitle(t){
  const d=Math.abs(t.ia-t.ib);
  if(t.sim>=8&&t.ia>=8&&t.ib>=8) return ['Open books',
    'High similarity, high insight both ways. Very little is hiding here.'];
  if(t.ia>=7&&t.ib>=7&&t.sim<=4) return ['Fluent translators',
    'You answer differently — and you both know exactly how. That’s real attention.'];
  if(d>=3) return ['One-way mirror',
    'One of you sees through the glass; the other sees a reflection. Worth talking about.'];
  if(t.sim>=7&&t.ia<=4&&t.ib<=4) return ['Twins by accident',
    'You keep giving the same answers without predicting them. Alike, and still surprising.'];
  if(t.sim<=3&&t.ia<=3&&t.ib<=3) return ['Beautiful strangers',
    'Low overlap, low prediction — which means everything is still left to discover.'];
  if(t.ia+t.ib>=13) return ['Mind readers',
    'The predictions landed on both sides. You’ve clearly been paying attention.'];
  if(t.sim>=6) return ['Same wavelength',
    'More overlap than not, and the misses are the interesting part.'];
  return ['Still unfolding',
    'Some hits, some misses, plenty of material. This pairing has chapters left.'];
}

function bestAndMiss(){
  let best=null, bScore=-1, miss=null, mScore=4;
  for(let i=0;i<ROUNDS;i++){
    const s=scoreQ(i), pts=(s.same?1:0)+(s.aHit?1:0)+(s.bHit?1:0);
    if(pts>bScore){ bScore=pts; best=i; }
    if(pts<mScore){ mScore=pts; miss=i; }
  }
  const A=esc(S.names[0]), B=esc(S.names[1]);
  let bHtml=null, mHtml=null;
  if(bScore===3){
    const q=S.qs[best];
    bHtml='You both knew: <b>'+esc(q.q)+'</b> — “'+esc(q.o[S.self[0][best]])
     +'”, called correctly from both sides.';
  }else if(bScore===2){
    const q=S.qs[best], s=scoreQ(best);
    bHtml=s.same
      ? 'Same answer, no rehearsal: <b>'+esc(q.q)+'</b> — both said “'+esc(q.o[S.self[0][best]])+'”.'
      : 'Read each other right on: <b>'+esc(q.q)+'</b> — both predictions landed.';
  }else if(bScore>=0){
    bHtml='No clean sweep this round — that’s next game’s material.';
  }
  if(mScore===0){
    const q=S.qs[miss];
    mHtml='Total scramble on: <b>'+esc(q.q)+'</b>. '+A+' said “'+esc(q.o[S.self[0][miss]])
     +'”, '+B+' said “'+esc(q.o[S.self[1][miss]])+'” — and neither prediction landed. Ask about it.';
  }else if(mScore<3){
    const q=S.qs[miss], s=scoreQ(miss);
    mHtml='Closest to a miss: <b>'+esc(q.q)+'</b>'
     +(!s.aHit&&!s.bHit?' — both predictions were off.':
       !s.aHit?' — '+A+'’s prediction was off.':
       !s.bHit?' — '+B+'’s prediction was off.':' — different answers, worth a story.');
  }else{
    mHtml='Not a single miss anywhere. Genuinely spooky.';
  }
  return {best:bHtml, miss:mHtml};
}

/* ============================ results ============================ */
let completeSent=false;
function results(){
  if(!(S&&S.done[0]&&S.done[1])) return;
  const t=totals(), A=esc(S.names[0]), B=esc(S.names[1]);
  const pt=pairTitle(t), bm=bestAndMiss();
  const d=Math.abs(t.ia-t.ib);
  const asym = d>=2
    ? (t.ia>t.ib ? A+' reads '+B+' better than '+B+' reads '+A+' — for now.'
                 : B+' reads '+A+' better than '+A+' reads '+B+' — for now.')
    : null;
  const packName=PACKS.find(p=>p.id===S.pack).name;
  const today=new Date().toLocaleDateString(undefined,{year:'numeric',month:'short',day:'numeric'});

  if(!completeSent){
    completeSent=true;
    track('game_complete',{pack:S.pack, similarity:t.sim, insight_a:t.ia, insight_b:t.ib});
    const plays=(+LS.get('sync.plays')||0)+1; LS.set('sync.plays',String(plays));
  }

  show(
   header(false)
   +'<div class="results" aria-live="polite">'
   +'<h2>The verdict</h2>'
   +'<div class="pairtitle">'+pt[0]+'</div>'
   +'<p class="pairsub">'+pt[1]+'</p>'
   +'<div class="card">'
   +'<p class="names"><span class="na">'+A+'</span><span class="x">×</span>'
   +'<span class="nb">'+B+'</span><span class="x">·</span><span class="dim">'+packName+' pack</span></p>'
   +'<div class="meter m-sim"><div class="mhead"><span>Similarity</span><b>'+t.sim+'/'+ROUNDS+'</b></div>'
   +'<div class="mtrack"><i data-w="'+(t.sim*10)+'"></i></div></div>'
   +'<div class="meter m-a"><div class="mhead"><span>'+A+'’s insight</span><b>'+t.ia+'/'+ROUNDS+'</b></div>'
   +'<div class="mtrack"><i data-w="'+(t.ia*10)+'"></i></div></div>'
   +'<div class="meter m-b"><div class="mhead"><span>'+B+'’s insight</span><b>'+t.ib+'/'+ROUNDS+'</b></div>'
   +'<div class="mtrack"><i data-w="'+(t.ib*10)+'"></i></div></div>'
   +(asym?'<div class="callout asym"><span class="lbl">The asymmetry</span>'+asym+'</div>':'')
   +(bm.best?'<div class="callout best"><span class="lbl">Best moment</span>'+bm.best+'</div>':'')
   +(bm.miss?'<div class="callout miss"><span class="lbl">Biggest miss</span>'+bm.miss+'</div>':'')
   +'<p class="datefoot">'+esc(today)+' · kreeda.games/sync</p>'
   +'</div>'
   +'<button class="btn primary" type="button" id="bAgain">Play again</button>'
   +'<button class="btn" type="button" id="bCopy">Copy result</button>'
   +'<button class="btn ghost" type="button" id="bChange">Change players</button>'
   +'<div id="shareSlot"></div>'
   +'</div>'
   +'<footer class="foot">Mismatches aren’t wrong answers — they’re the conversation.<br>'
   +'<a href="../">Kreeda</a></footer>'
  );
  /* meters animate from zero after first paint; width transition is CSS, reduced-motion kills it */
  requestAnimationFrame(()=>requestAnimationFrame(()=>{
    document.querySelectorAll('.mtrack i').forEach(el=>{ el.style.width=el.getAttribute('data-w')+'%'; });
  }));

  on('bAgain',()=>{ completeSent=false; newSession(S.pack);
    track('game_start',{pack:S.pack}); handoff(0); });
  on('bChange',()=>{ completeSent=false; S=null; title(); });
  on('bCopy',()=>{
    const text=shareText(t,pt[0],packName);
    let done=false;
    try{
      if(navigator.clipboard&&navigator.clipboard.writeText){
        navigator.clipboard.writeText(text).then(()=>toast('Copied!'),()=>showShareBox(text));
        done=true;
      }
    }catch(e){}
    if(!done) showShareBox(text);   // clipboard is unavailable on file:// — show it to copy by hand
  });
}
function shareText(t,title,packName){
  const row=(fn,y,n)=>{ let s=''; for(let i=0;i<ROUNDS;i++) s+=fn(scoreQ(i))?y:n; return s; };
  return 'Sync · '+S.names[0]+' × '+S.names[1]+' · '+packName+' pack\n'
   +'“'+title+'”\n'
   +'Same answers  '+row(s=>s.same,'🟢','⚫')+'  '+t.sim+'/'+ROUNDS+'\n'
   +S.names[0]+'’s insight '+row(s=>s.aHit,'🟣','⚫')+'  '+t.ia+'/'+ROUNDS+'\n'
   +S.names[1]+'’s insight '+row(s=>s.bHit,'🔴','⚫')+'  '+t.ib+'/'+ROUNDS+'\n'
   +'kreeda.games/sync';
}
function showShareBox(text){
  const slot=document.getElementById('shareSlot');
  if(!slot) return;
  slot.innerHTML='<textarea class="sharebox" rows="6" readonly aria-label="Result text to copy manually"></textarea>';
  const ta=slot.querySelector('textarea'); ta.value=text;
  ta.focus(); try{ ta.select(); }catch(e){}
  toast('Copy it from the box below');
}

/* ============================ boot self-test ============================
   Cheap invariants that would otherwise only fail in a player's hands: every pack must be able
   to deal a full session, and every option index used anywhere must exist. Runs once, logs only. */
(function audit(){
  try{
    PACKS.forEach(p=>{
      const n=BANK.filter(x=>x.t.indexOf(p.id)>=0).length;
      if(n<ROUNDS) console.warn('sync: pack "'+p.id+'" has only '+n+' questions');
    });
    BANK.forEach((x,i)=>{
      if(!(x.o.length>=2&&x.o.length<=4)) console.warn('sync: question '+i+' has '+x.o.length+' options');
    });
  }catch(e){}
})();

title();
</script>
</body>
</html>
